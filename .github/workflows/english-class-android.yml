name: English class app (Android APK)

on:
  push:
    paths:
      - "language-school/**"
      - "language-school-app/**"
      - ".github/workflows/english-class-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language-school-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: language-school-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android project
        run: npm run build && npx cap sync android

      - name: Build debug APK
        working-directory: language-school-app/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: english-class-apk
          path: language-school-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
