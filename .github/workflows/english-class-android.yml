name: English class app (Android APK)

on:
  push:
    paths:
      - "language-school/**"
      - "language-school-app/**"
      - ".github/workflows/english-class-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: language-school-app
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the lesson version is the time of the last commit touching the lessons
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: language-school-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android project
        run: npm run build && npx cap sync android

      - name: Build debug APK
        working-directory: language-school-app/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: english-class-apk
          path: language-school-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Installed apps download lessons.json from this release to update their lessons.
      # Only builds of the default branch and the app's working branch publish.
      - name: Publish lesson update and APK to the lessons-latest release
        if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/claude/keen-volta-6ibcuu'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-ota/english-class.apk
          if ! gh release view lessons-latest >/dev/null 2>&1; then
            gh release create lessons-latest --prerelease --target "$GITHUB_SHA" \
              --title "English class app: latest lessons" \
              --notes "Updated automatically by CI. Installed apps download lessons.json from here. english-class.apk is the latest Android build."
          fi
          gh release upload lessons-latest dist-ota/lessons.json dist-ota/english-class.apk --clobber
