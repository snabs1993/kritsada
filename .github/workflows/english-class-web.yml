name: English class app (website)

# Publishes the lessons as a website on GitHub Pages (https://snabs1993.github.io/kritsada/)
# for the iPad and any browser. Same lesson file as the phone app; see language-school-web/build.mjs.
on:
  push:
    branches: [claude/keen-volta-6ibcuu]
    paths:
      - "language-school/index.html"
      - "language-school-web/**"
      - "language-school-app/assets/icon-only.png"
      - ".github/workflows/english-class-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node language-school-web/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
