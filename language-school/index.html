 {id:"a2a",lv:"A2",title:"The Lost Wallet",th:"กระเป๋าสตางค์ที่หายไป",
  paras:["Last Friday, Mai took the train home after work. The train was crowded, so she stood near the door. When she got off at her station, she noticed a brown wallet on the platform. Inside, there was some money, a bank card and an ID card with the name Somchai Wong.","Mai didn't know what to do at first. Then she decided to take the wallet to the station office. The officer thanked her and called the owner.","Twenty minutes later, an old man arrived, looking worried. When he saw his wallet, he smiled and shook Mai's hand. \"My wife's photo is in there,\" he said. \"It is more important to me than the money.\" Mai felt happy all evening."],
  gloss:[["crowded","แออัด คนแน่น"],["noticed","สังเกตเห็น"],["wallet","กระเป๋าสตางค์"],["platform","ชานชาลา"],["decided","ตัดสินใจ"],["officer","เจ้าหน้าที่"],["owner","เจ้าของ"],["worried","กังวล"]],
  qs:[{q:"Where did Mai find the wallet?",o:["on a train seat","on the platform","near a ticket machine"],a:1},{q:"What did Mai do with the wallet?",o:["She kept the money.","She took it to the station office.","She posted it to the owner."],a:1},{q:"Why was the man so happy?",o:["His wife's photo was in the wallet.","He needed the money for rent.","Mai gave him a reward."],a:0}]},
 {id:"a2b",lv:"A2",title:"My First Job Interview",th:"สัมภาษณ์งานครั้งแรก",
  paras:["When I was twenty-two, I had my first job interview at a travel company. I was very nervous, so I prepared for a whole week. I read about the company, practised answering questions with my sister, and bought a new shirt.","On the day of the interview, I left home early because I didn't want to be late. Unfortunately, there was an accident on the road and my bus stopped for thirty minutes. I arrived five minutes late and apologised. The manager said it was no problem.","She asked me why I wanted to work in travel. I told her about my trips around Thailand and how much I enjoyed helping tourists. Two days later, she called me and offered me the job."],
  gloss:[["nervous","ประหม่า กังวล"],["prepared","เตรียมตัว"],["practised","ฝึกซ้อม"],["Unfortunately","โชคไม่ดี น่าเสียดาย"],["accident","อุบัติเหตุ"],["apologised","ขอโทษ"],["tourists","นักท่องเที่ยว"],["offered","เสนอให้"]],
  qs:[{q:"How did the writer prepare for the interview?",o:["by reading about the company and practising","by visiting the office","by calling the manager"],a:0},{q:"Why was the writer late?",o:["The writer woke up late.","There was an accident on the road.","The writer took the wrong bus."],a:1},{q:"What happened two days later?",o:["The writer had a second interview.","The writer was offered the job.","The writer started work."],a:1}]},
 {id:"b1a",lv:"B1",title:"The Village That Saved Its Forest",th:"หมู่บ้านที่รักษาป่าไว้ได้",
  paras:["Twenty years ago, the hills around the village of Ban Pa Kha were almost bare. Farmers had cut down most of the trees to grow corn, and every rainy season, floods washed soil into the river. The water became muddy, and the fish that villagers depended on began to disappear.","Worried about the future, a group of older villagers suggested an unusual plan. Instead of clearing more land, the village would protect the remaining forest and plant new trees on the slopes. At first, many farmers were against the idea, because they feared losing their income. To solve this, the village started growing coffee in the shade of the young trees, which turned out to be more profitable than corn.","Today, the hills are green again. The floods are smaller, the river is clear, and the village's coffee is sold in cafés in Bangkok. Visitors now come to learn how the community manages its land, and young people who once moved to the city for work are returning home."],
  gloss:[["bare","โล่ง เตียน"],["floods","น้ำท่วม"],["soil","ดิน"],["depended on","พึ่งพา"],["remaining","ที่เหลืออยู่"],["slopes","ไหล่เขา ทางลาด"],["shade","ร่มเงา"],["profitable","ทำกำไรได้"]],
  qs:[{q:"What problem did the village face twenty years ago?",o:["a shortage of coffee","floods and a muddy river","too many tourists"],a:1},{q:"Why were some farmers against the plan at first?",o:["They did not like coffee.","They were afraid of losing income.","They wanted to move to the city."],a:1},{q:"What is one result of the plan?",o:["Young people are returning to the village.","The village grows more corn.","The river is used for transport."],a:0}]},
 {id:"b1b",lv:"B1",title:"Learning a Language as an Adult",th:"เรียนภาษาตอนเป็นผู้ใหญ่",
  paras:["Many adults believe they are too old to learn a new language. Research suggests that this is only partly true. Children do have an advantage with pronunciation: those who start young usually develop an accent that sounds more natural. However, adults often learn grammar and vocabulary faster, because they can use their experience, their knowledge of their first language and more effective study strategies.","What matters most, according to many teachers, is regular practice. Studying for fifteen minutes every day is usually more effective than studying for two hours once a week, because the brain remembers information better when it is reviewed at spaced intervals. Adults also benefit from using the language for real purposes, such as watching films, reading about their hobbies or talking with colleagues.","Finally, attitude plays a large role. Learners who are not afraid of making mistakes tend to speak more, and the more they speak, the faster they improve. Mistakes are not a sign of failure but a normal part of the learning process."],
  gloss:[["advantage","ข้อได้เปรียบ"],["pronunciation","การออกเสียง"],["accent","สำเนียง"],["effective","มีประสิทธิภาพ"],["strategies","กลยุทธ์ วิธีการ"],["intervals","ช่วงเว้นระยะ"],["purposes","จุดประสงค์"],["attitude","ทัศนคติ"]],
  qs:[{q:"According to the text, what advantage do children have?",o:["They learn grammar faster.","Their pronunciation sounds more natural.","They have more free time."],a:1},{q:"Why is studying a little every day effective?",o:["The brain remembers better with spaced review.","Teachers give more homework.","It is cheaper."],a:0},{q:"What does the writer say about mistakes?",o:["They should be avoided.","They are a normal part of learning.","They show that a learner is too old."],a:1}]}

let DI=null;          // dictation session

let ST=null;          // story being read

let storyTok=0;
function dailyRec(){const k=dayKey(); if(!S.daily||S.daily.d!==k) S.daily={d:k,review:0,step:0,dict:0,prac:0}; return S.daily}
function bump(f,n){const d=dailyRec(); d[f]=(d[f]||0)+(n||1)}
function stat(k){if(!S.stats||typeof S.stats!=="object") S.stats={}; return S.stats[k]||(S.stats[k]={})}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function registerWords(){
  if(!registerWords.done){
    registerWords.done=true;
    DECKS.forEach(d=>d.words.forEach(w=>{if(!WORDS[w[0]]) WORDS[w[0]]={en:w[0],th:w[1],pos:w[2],ex:w[3],exTh:w[4],unit:"deck-"+d.id}}));
    STORIES.forEach(s=>s.gloss.forEach(g=>{
      const k=g[0].toLowerCase(); if(WORDS[k]) return;
      const m=s.paras.join(" ").match(new RegExp("[^.!?]*\\b"+escRe(g[0])+"\\b[^.!?]*[.!?]","i"));
      WORDS[k]={en:k,th:g[1],pos:"",ex:m?m[0].replace(/^[\s"]+/,"").trim():"",exTh:"",unit:"story-"+s.id};
    }));
  }
  (Array.isArray(S.custom)?S.custom:[]).forEach(w=>{if(w&&w.en&&!WORDS[w.en]) WORDS[w.en]={en:w.en,th:w.th||"",pos:"",ex:w.ex||"",exTh:"",unit:"custom"}});
}
function pBack(id,label){return '<button class="back" data-act="pgo"'+(id?' data-id="'+id+'"':'')+'>← '+(label||"ฝึกฝน")+'</button>'}

/* mistakes notebook */
function addMistake(src,it){
  if(!it||!src) return;
  const item={t:it.t,q:it.q,o:it.o,a:it.a,w:it.w||it.why||"",hint:it.hint};
  if(item.t==="mc"&&!Array.isArray(item.o)) return;
  const id=(src+"|"+(item.q||"")+"|"+(item.t==="order"?item.a:"")).slice(0,240);
  S.mistakes=(Array.isArray(S.mistakes)?S.mistakes:[]).filter(m=>m.id!==id).concat([{id,src,it:item,at:Date.now()}]).slice(-150);
}
function mistSrc(r){
  if(r.kind==="placement") return "สอบวัดระดับ";
  if((r.kind==="practice"||r.kind==="quiz")&&L) return "บทที่ "+COURSE[L.idx].n+" · "+(r.kind==="quiz"?"สอบท้ายบท":"ฝึกทำ");
  if(r.kind==="gq"&&PRUN_META) return "ไวยากรณ์ · "+PRUN_META.title;
  return "";
}
function mistAnswer(it){return it.t==="mc"?it.o[it.a]:it.t==="fill"?String(it.a).split("|")[0]:it.a}
// exam questions that can be practised without audio or a passage: TOEIC Part 2, Part 5 and Part 6
function examMistake(sec,p,q){
  if(p.kind==="respond") return {t:"mc",q:"คำถามที่ได้ยิน: \""+q.q+"\" เลือกคำตอบที่เหมาะสม",o:q.o,a:q.a,w:q.why};
  if(p.kind==="mc") return {t:"mc",q:q.q,o:q.o,a:q.a,w:q.why};
  if(p.kind==="textfill"){
    const idx=p.items.indexOf(q)+1;
    const txt=p.text.join(" ").replace(/\{(\d)\}/g,(m,i)=>+i===idx?"___":"(…)");
    const sents=txt.split(/(?<=[.!?])\s+/), j=sents.findIndex(x=>x.indexOf("___")>=0);
    return {t:"mc",q:(j>0?sents[j-1]+" ":"")+(sents[j]||"___"),o:q.o,a:q.a,w:q.why};
  }
  return null;
}

/* daily goals and phrase of the day */
function dailyItems(){
  const d=dailyRec(), due=dueWords().length;

async function playStory(s){
  const tok=++storyTok; ST.playing=0;
  for(let i=0;i<s.paras.length;i++){
    if(tok!==storyTok||route.name!=="practice") return;
    ST.playing=i; document.querySelectorAll(".story p").forEach((p,j)=>p.classList.toggle("playing",j===i));
    for(const b of s.paras[i].split(/(?<=[.!?]"?)\s+/)){if(tok!==storyTok) return; await Speech.say(b)}
  }
  if(tok===storyTok){ST.playing=-1; if(route.name==="practice") render()}
}

function gramSrc(id){const u=COURSE.find(x=>x.id===id); if(u) return {id,title:u.grammar.title,g:u.grammar,quiz:u.practice}; const x=GRAM_X.find(v=>v.id===id); return x?{id,title:x.g.title,g:x.g,quiz:x.quiz}:null}
function viewGram(id){
  const src=gramSrc(id); if(!src) return viewGrammarList();

  if(PRUN&&PRUN_META&&PRUN_META.id===id){
    if(PRUN.done){const c=PRUN.results.filter(Boolean).length; h+='<div class="card" style="margin-top:12px;max-width:680px"><h2 class="h2">ถูก '+c+'/'+PRUN.items.length+'</h2><p class="lede">'+(c===PRUN.items.length?"เข้าใจเรื่องนี้ดีมาก":"ข้อที่ผิดถูกจดลงสมุดคำผิดแล้ว อ่านคำอธิบายด้านบนอีกรอบแล้วลองใหม่")+'</p><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="gqstart" data-id="'+id+'">ทำอีกครั้ง</button></div></div>'}

  const fresh=BADGES.filter(b=>S.badges.indexOf(b.id)<0&&b.ok());
  if(!fresh.length) return;
  S.badges=S.badges.concat(fresh.map(b=>b.id)); save();
  toast("ได้รับเหรียญ: "+fresh.map(b=>b.t).join(", "));
}
function xpLevel(){const lv=Math.floor(S.xp/300)+1; return {lv,into:S.xp%300}}
function badgesHTML(){
  const got=Array.isArray(S.badges)?S.badges:[];
  return '<section class="section"><div class="section-head"><h2 class="h3">เหรียญความสำเร็จ</h2><span class="muted">ได้แล้ว '+got.length+'/'+BADGES.length+'</span></div><div class="badges">'

function calendarHTML(){
  const set=new Set(S.days), weeks=12, today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today.getTime()-((weeks-1)*7+today.getDay())*DAY);
  let cells="", n=0;
  for(let w=0;w<weeks;w++){
    for(let d=0;d<7;d++){
      const day=new Date(start.getTime()+(w*7+d)*DAY), k=dayKey(day), future=day>today, on=set.has(k);
      if(on) n++;
      cells+='<i class="cd'+(on?' on':'')+(future?' fut':'')+'" style="grid-column:'+(w+1)+';grid-row:'+(d+1)+'" title="'+esc(day.toLocaleDateString("th-TH",{day:"numeric",month:"short"}))+(on?" · เข้าเรียน":"")+'"></i>';
    }
  }
  const days=["อา","จ","อ","พ","พฤ","ศ","ส"];
  return '<section class="section"><div class="section-head"><h2 class="h3">ปฏิทินการเรียน 12 สัปดาห์</h2><span class="muted">เข้าเรียน '+n+' วัน · ต่อเนื่องสูงสุด '+maxStreak()+' วัน</span></div>'
   +'<div class="cal-wrap"><div class="cal-days">'+days.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="cal" role="img" aria-label="เข้าเรียน '+n+' วันใน 12 สัปดาห์ล่าสุด">'+cells+'</div></div>'
   +'<p class="cal-legend"><span><i class="cd on"></i>เข้าเรียน</span><span><i class="cd"></i>ไม่ได้เข้าเรียน</span></p></section>';
}

/* ---------- games ---------- */
let MG=null, SB=null;
function gamePool(){
  let keys=Object.keys(S.words).filter(k=>WORDS[k]&&WORDS[k].th);
  if(keys.length<6) keys=keys.concat(COURSE.slice(0,2).reduce((a,u)=>a.concat(u.vocab.map(v=>v.en)),[]));
  return shuffle(Array.from(new Set(keys)));
}
function matchNew(){
  const pick=gamePool().slice(0,6);
  MG={words:pick,left:shuffle(pick),right:shuffle(pick),sel:null,done:[],miss:0,start:Date.now(),end:null,bad:null};
}

   +'<div class="xbar" style="position:static"><span>จับคู่แล้ว <b>'+MG.done.length+'</b>/6</span><span class="xtimer" id="mtimer">'+(MG.end?mmss((MG.end-MG.start)/1000+MG.miss*3):mmss((Date.now()-MG.start)/1000+MG.miss*3))+'</span><span class="muted">'+(best?'สถิติดีที่สุด '+mmss(best):'')+'</span></div>';

  }

    return '<button class="mg'+(done?' done':'')+(sel?' sel':'')+(bad?' bad':'')+'" data-act="mgpick" data-s="'+side+'" data-k="'+esc(k)+'"'+(done?' disabled':'')+(side==="en"?' lang="en"':'')+'>'+esc(side==="en"?WORDS[k].en:WORDS[k].th)+'</button>'}).join("")+'</div>';

function spellNew(){

const GACT={
  mgnew:()=>{matchNew(); render()},
  mgpick:t=>{
    if(!MG||MG.end) return;
    const side=t.dataset.s, k=t.dataset.k;
    if(!MG.sel||MG.sel[0]===side){MG.sel=[side,k]; MG.bad=null; if(side==="en") Speech.say(WORDS[k].en); render(); return}
    if(MG.sel[1]===k){MG.done.push(k); MG.sel=null; MG.bad=null;
      if(MG.done.length===MG.words.length){MG.end=Date.now(); const t2=Math.round((MG.end-MG.start)/1000+MG.miss*3), g=stat("games"); if(!g.match||t2<g.match) g.match=t2; bump("prac"); S.xp+=10; markDay(); save()}}
    else {MG.miss++; MG.bad=[MG.sel[0]+":"+MG.sel[1],side+":"+k]; MG.sel=null}
    render();
  },
  sbnew:()=>{spellNew(); render(); if(SB.list.length) Speech.say(WORDS[SB.list[0]].en)},
  sbplay:t=>{if(SB&&SB.i<SB.list.length){Speech.stop(); Speech.say(WORDS[SB.list[SB.i]].en,{slow:!!t.dataset.slow})}},
  sbhint:()=>{if(SB){SB.hint=true; render()}},
  sbcheck:()=>{
    if(!SB||SB.res) return; const v=($("#sb-in")||{}).value||""; if(!v.trim()){toast("พิมพ์คำที่ได้ยินก่อน");return}
    const w=WORDS[SB.list[SB.i]]; SB.typed=v; SB.res=v.trim().toLowerCase()===w.en.toLowerCase()?"ok":"no"; if(SB.res==="ok") SB.correct++; render();
  },
  sbnext:()=>{
    if(!SB) return; SB.i++; SB.res=null; SB.typed=""; SB.hint=false;
    if(SB.i>=SB.list.length){const g=stat("games"); g.spell=Math.max(g.spell||0,SB.correct); bump("prac"); S.xp+=SB.correct; markDay(); save(); render(); return}
    render(); Speech.say(WORDS[SB.list[SB.i]].en); const f=$("#sb-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus();
  },
  scrstart:()=>{PRUN_META={id:"scr",title:"เรียงประโยค"}; PRUN=newRunner(scrambleItems(),"scr"); render()}
};

function go(name,id){
  Speech.stop();
  if(NB&&prActive) NB.stopListening();
  if(NB&&name==="teacher") name="home";
  xTok++; if(X) X.playing=null;
  if(name==="practice"){storyTok++; if(!id||String(id).indexOf("gram.")!==0&&id!=="mistakes"){PRUN=null;PRUN_META=null} if(!id||String(id).indexOf("story.")!==0) ST=null}
  if(name==="examrun"){const sec=secById(id); if(!sec) return go("exam"); X=XS[id]||(XS[id]=newAttempt(sec))}
  if(name==="lesson"){
    const i=COURSE.findIndex(u=>u.id===id);
    if(i<0) return go("course");
    if(!unlocked(i)){toast("ต้องผ่านบทก่อนหน้าก่อน หรือทำแบบทดสอบวัดระดับ");return}
    const r=rec(id);
    L={id,idx:i,step:r.done?0:Math.min(r.reached,5),vi:0,showTh:false,comp:{},practice:null,quiz:null,quizDone:null};
    if(L.step===0){addWords(COURSE[i]);save()}
  }
  if(name==="placement") P={runner:null,result:null};
  if(name==="review") R=null;
  resetAsk=false;
  route={name,id:id||null};
  try{history.replaceState(null,"","#"+(name==="lesson"?"lesson-"+id:name==="examrun"?"exam-"+id:name==="practice"&&id?"practice-"+id:name))}catch(e){}
  render(); window.scrollTo(0,0);
}

function render(){
  const V={home:viewHome,course:viewCourse,lesson:viewLesson,review:viewReview,teacher:viewTeacher,report:viewReport,placement:viewPlacement,exam:viewExamHub,examrun:viewExamRun,practice:viewPractice}[route.name]||viewHome;
  registerWords();
  $("#app").innerHTML=V();
  document.querySelectorAll(".nav button").forEach(b=>{
    const cur=b.dataset.to===route.name||(b.dataset.to==="course"&&(route.name==="lesson"||route.name==="placement"))||(b.dataset.to==="exam"&&route.name==="examrun");
    if(cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  updateChrome();
  document.querySelectorAll("[data-chat]").forEach(mountChat);
  checkBadges();
  const tb=$(".topbar"); if(tb) document.documentElement.style.setProperty("--topbar-h",tb.offsetHeight+"px");
}
function updateChrome(){

}

function buildQuiz(u){
  const vs=shuffle(u.vocab), items=[];
  const others=(w,f)=>shuffle(u.vocab.filter(x=>x!==w)).slice(0,2).map(f);
  vs.slice(0,3).forEach(w=>items.push({t:"mc",q:"“"+w.en+"” แปลว่าอะไร",o:[w.th].concat(others(w,x=>x.th)),a:0}));
  vs.slice(3,5).forEach(w=>items.push({t:"mc",q:"“"+w.th+"” ภาษาอังกฤษคือ",o:[w.en].concat(others(w,x=>x.en)),a:0}));
  return shuffle(items.concat(u.quiz));
}

/* ---------- exercise runner ---------- */
function newRunner(items,kind){
  const r={kind,items:items.map(x=>Object.assign({},x)),i:0,results:[],answered:false,ok:null,given:"",done:false};
  r.items.forEach(it=>{
    if(it.t==="mc"){const idx=shuffle(it.o.map((_,k)=>k)); it.o=idx.map(k=>it.o[k]); it.a=idx.indexOf(it.a)}
  });
  prepItem(r); return r;
}
function prepItem(r){
  const it=r.items[r.i]; if(!it) return;
  if(it.t==="order"){
    const words=it.a.split(" ").map((w,k)=>({w,k}));
    let pool=shuffle(words); let tries=0;
    while(words.length>1&&pool.map(x=>x.w).join(" ")===it.a&&tries++<8) pool=shuffle(words);
    r.pool=pool; r.built=[];
  }
}
function runnerHTML(r){
  const it=r.items[r.i];
  let h='<div class="runner"><div class="rn-top"><span class="mono">ข้อ '+(r.i+1)+'/'+r.items.length+'</span><div class="dots" aria-hidden="true">'
    +r.items.map((_,k)=>'<i class="'+(k<r.i||(k===r.i&&r.answered)?(r.results[k]?"ok":"no"):k===r.i?"cur":"")+'"></i>').join("")+'</div></div>';
  if(it.t==="mc"){
    h+='<p class="q"'+(/[ก-๙]/.test(it.q)?'':' lang="en"')+'>'+esc(it.q).replace(/___/g,'<span class="blank">'+(r.answered?esc(it.o[it.a]):"&nbsp;")+'</span>')+'</p><div class="opts">'
     +it.o.map((o,k)=>{let c="opt"; if(r.answered){if(k===it.a) c+=" is-right"; else if(k===r.given) c+=" is-wrong"} return '<button class="'+c+'" data-act="r-opt" data-o="'+k+'"'+(r.answered?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>';
  } else if(it.t==="fill"){
    const ans=capBlank(it,it.a.split("|")[0]);
    const q=esc(it.q).replace(/___/g,'<span class="blank">'+(r.answered?esc(r.ok?capBlank(it,r.given):ans):"&nbsp;")+'</span>');
    h+='<p class="q"><span lang="en">'+q+'</span><span class="hint">พิมพ์คำที่หายไป</span></p>'
     +'<form class="fill" data-form="fill"><label class="sr" for="fill-in">คำตอบ</label><input id="fill-in" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" value="'+esc(r.given||"")+'"'+(r.answered?" disabled":"")+'>'
     +(r.answered?"":'<button class="btn btn-primary" type="submit">ตรวจคำตอบ</button>')+'</form>';
  } else {
    h+='<p class="q">เรียงคำให้เป็นประโยคที่ถูกต้อง<span class="hint">'+esc(it.hint||"")+'</span></p>'
     +'<div class="built" lang="en">'+r.built.map(t=>'<button class="tl" data-act="r-unt" data-k="'+t.k+'"'+(r.answered?" disabled":"")+'>'+esc(t.w)+'</button>').join("")+'</div>'
     +'<div class="pool" lang="en">'+r.pool.map(t=>'<button class="tl" data-act="r-tile" data-k="'+t.k+'">'+esc(t.w)+'</button>').join("")+'</div>'
     +(r.answered?"":'<button class="btn btn-primary" data-act="r-order"'+(r.pool.length?" disabled":"")+'>ตรวจคำตอบ</button>');
  }
  if(r.answered){
    const right=it.t==="mc"?it.o[it.a]:it.t==="fill"?capBlank(it,it.a.split("|")[0]):it.a;
    h+='<div class="feedback '+(r.ok?"ok":"no")+'" role="status"><b>'+(r.ok?"ถูกต้อง!":"ยังไม่ถูก")+'</b>'
      +(r.ok?"":'<span>คำตอบที่ถูก: <b lang="en">'+esc(right)+'</b></span>')
      +(it.w?'<span class="pen">'+esc(it.w)+'</span>':'')+'</div>'
      +'<div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="r-next" id="r-next">'+(r.i===r.items.length-1?"ดูผล":"ข้อต่อไป")+'</button></div>';
  }
  return h+'</div>';
}
function capBlank(it,s){s=String(s||"");return it.q.trim().indexOf("___")===0?s.charAt(0).toUpperCase()+s.slice(1):s}
function curRunner(){
  if(route.name==="practice") return PRUN;
  if(route.name==="placement") return P&&P.runner;
  if(route.name==="lesson"&&L){const k=STEPS[L.step][0]; return k==="practice"?L.practice:k==="quiz"?L.quiz:null}
  return null;
}
function answer(r,ok,given){
  r.answered=true; r.ok=ok; r.given=given; r.results[r.i]=ok;
  const it=r.items[r.i];
  if(!ok&&r.kind!=="mist"){addMistake(mistSrc(r),it); save()}
  if(ok&&r.kind==="mist"&&it._mid){S.mistakes=(S.mistakes||[]).filter(m=>m.id!==it._mid); const ms=stat("mist"); ms.cleared=(ms.cleared||0)+1; save()}
  if(it.t==="order") Speech.say(it.a);
  render();
  const nb=$("#r-next"); if(nb) nb.focus({preventScroll:true});
}
function runnerNext(r){
  r.i++; r.answered=false; r.ok=null; r.given="";
  if(r.i>=r.items.length){r.done=true; runnerDone(r)} else prepItem(r);
  render();
  if(!r.done){const f=$("#fill-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus()}
}
function runnerDone(r){
  const c=r.results.filter(Boolean).length, tot=r.items.length;
  if(r.kind==="practice"){const rr=rec(L.id); rr.practice=Math.round(c/tot*100); S.xp+=c*2; markDay(); save()}
  if(r.kind==="quiz"){
    const u=COURSE[L.idx], rr=rec(u.id), pct=Math.round(c/tot*100);
    const stars=pct===100?3:pct>=85?2:pct>=70?1:0;
    const first=!rr.done&&pct>=70;
    rr.best=Math.max(rr.best||0,pct); rr.stars=Math.max(rr.stars||0,stars);
    if(pct>=70){rr.done=true; rr.reached=5; if(!rr.doneAt) rr.doneAt=Date.now()}
    S.xp+=c*5+(first?50:0); markDay(); save();
    L.quizDone={pct,correct:c,total:tot,stars};
    if(first) toast("ผ่านบทที่ "+u.n+" แล้ว +50 คะแนน");
  }
  if(r.kind==="scr"){const g=stat("games"); g.scr=Math.max(g.scr||0,c); S.xp+=c*2; bump("prac"); markDay(); save()}
  if(r.kind==="gq"||r.kind==="mist"){
    if(r.kind==="gq"&&PRUN_META){const gs=stat("gram"); gs[PRUN_META.id]=Math.max(gs[PRUN_META.id]||0,Math.round(c/tot*100))}
    S.xp+=c*2; bump("prac"); markDay(); save();
  }
  if(r.kind==="placement"){
    const g=[0,4,8].map(s=>r.results.slice(s,s+4).filter(Boolean).length);
    const level=g[0]>=3&&g[1]>=3?3:g[0]>=3?2:1;
    S.placement={done:true,level,score:c,at:Date.now()}; markDay(); save();
    P.result={level,score:c,g};
  }
}

async function checkWriting(id){
  const u=COURSE.find(x=>x.id===id), w=W[id]||(W[id]={text:""});
  const text=(w.text||"").trim();
  if(text.length<5){toast("เขียนคำตอบก่อนส่งให้ครูตรวจ");return}
  w.busy=true; w.err=""; render();
  const prompt="You are an English teacher checking a short writing homework from a Thai adult learner.\nLevel: "+LEVELS[u.lv-1].code+"\nUnit grammar focus: "+u.grammar.title+"\nTask (Thai): "+u.writing.th+"\nStudent's text:\n\"\"\"\n"+text.slice(0,2000)+"\n\"\"\"\nReply with only a JSON object: {\"score\": integer 0-10, \"corrected\": \"the full corrected text in English\", \"notes\": [\"up to 4 short feedback points in Thai, each like: ✗ wrong → ✓ right เหตุผลสั้นๆ\"], \"praise\": \"one short encouraging sentence in Thai\"}";
  try{
    const res=await AI.fn.json(prompt,{modelTier:"default"});
    const score=Math.max(0,Math.min(10,Math.round(Number(res&&res.score)||0)));
    w.res={score,corrected:String(res&&res.corrected||""),notes:Array.isArray(res&&res.notes)?res.notes.slice(0,4).map(String):[],praise:String(res&&res.praise||"")};
    const r=rec(id); r.writing=Math.max(r.writing||0,score); S.xp+=score; markDay(); save();
  }catch(e){w.err=e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}
  w.busy=false;
  if(route.name==="lesson"&&L&&L.id===id) render();
}

const ACT={
  go:t=>go(t.dataset.to),
  open:t=>go("lesson",t.dataset.id),
  say:t=>{Speech.stop();Speech.say(t.dataset.text,{slow:!!t.dataset.slow})},
  slow:()=>{S.settings.slow=!S.settings.slow;save();render()},
  step:t=>{
    const s=+t.dataset.s, r=rec(L.id); if(s>(r.done?5:r.reached)) return;
    Speech.stop(); L.step=s;
    if(STEPS[s][0]==="quiz"&&L.quizDone&&!r.done){L.quizDone=null;L.quiz=null}
    render(); window.scrollTo(0,0);
  },
  "next-step":()=>{
    const r=rec(L.id); Speech.stop();
    if(L.step<5){L.step++; if(L.step>r.reached){r.reached=L.step; S.xp+=5} bump("step"); markDay(); save()}
    render(); window.scrollTo(0,0);
  },
  "v-go":t=>{const u=COURSE[L.idx],i=+t.dataset.i; if(i<0||i>=u.vocab.length) return; L.vi=i; render(); Speech.say(u.vocab[i].en)},
  "toggle-th":()=>{L.showTh=!L.showTh;render()},
  "play-dlg":()=>playDialogue(COURSE[L.idx]),
  comp:t=>{const qi=+t.dataset.q; if(L.comp[qi]!=null) return; L.comp[qi]=+t.dataset.o; render()},
  "redo-practice":()=>{L.practice=newRunner(COURSE[L.idx].practice,"practice");render()},
  "quiz-retry":()=>{L.quiz=null;L.quizDone=null;render();window.scrollTo(0,0)},
  "show-model":t=>{const w=W[t.dataset.id]||(W[t.dataset.id]={text:""}); w.model=!w.model; render()},
  "write-check":t=>checkWriting(t.dataset.id),
  "r-opt":t=>{const r=curRunner(); if(!r||r.answered) return; const k=+t.dataset.o; answer(r,k===r.items[r.i].a,k)},
  "r-tile":t=>{const r=curRunner(); if(!r||r.answered) return; const k=+t.dataset.k, j=r.pool.findIndex(x=>x.k===k); if(j<0) return; r.built.push(r.pool.splice(j,1)[0]); render()},
  "r-unt":t=>{const r=curRunner(); if(!r||r.answered) return; const k=+t.dataset.k, j=r.built.findIndex(x=>x.k===k); if(j<0) return; r.pool.push(r.built.splice(j,1)[0]); render()},
  "r-order":()=>{const r=curRunner(); if(!r||r.answered||r.pool.length) return; const s=r.built.map(x=>x.w).join(" "); answer(r,norm(s)===norm(r.items[r.i].a),s)},
  "r-next":()=>{const r=curRunner(); if(r&&r.answered) runnerNext(r)},
  "start-placement":()=>{P.runner=newRunner(PLACEMENT,"placement");render()},
  "rv-start":()=>{const q=shuffle(dueWords());R={queue:q,revealed:false,count:0};render()},
  "rv-extra":()=>{const q=shuffle(Object.keys(S.words).filter(k=>WORDS[k])).slice(0,10);R={queue:q,revealed:false,count:0,extra:true};render()},
  "rv-reveal":()=>{R.revealed=true;render();Speech.say(WORDS[R.queue[0]].en)},
  "rv-grade":t=>{
    const g=+t.dataset.g, k=R.queue.shift(), s=S.words[k], now=Date.now();
    if(g===0){s.b=0;s.due=now;R.queue.push(k)}
    else if(g===1){s.b=Math.max(1,s.b);s.due=now+DAY}
    else{s.b=Math.min(s.b+1,6);s.due=now+INT[s.b]*DAY}
    R.count++; R.revealed=false; S.xp+=1; bump("review"); markDay(); save();
    if(!R.queue.length){R=null;toast("ทบทวนเสร็จแล้ว เก่งมาก")}
    render();
  },
  "rv-end":()=>{R=null;render()},
  pron:t=>pronounce(t.dataset.text),
  "ota-check":()=>otaCheck(true),
  "ota-apply":()=>{S.updatedAt=Date.now();NB.save(JSON.stringify(S)).catch(()=>{}).then(()=>NB.applyUpdate())},
  tmode:t=>{teacherMode=t.dataset.m;render()},
  suggest:t=>{const el=$("[data-chat]"); if(el&&el._fill) el._fill(t.dataset.text)},
  "chat-clear":()=>{const k="teacher:"+teacherMode,st=CHATS[k]; if(st&&st.ctl) st.ctl.abort(); delete CHATS[k]; render()},
  "reset-ask":()=>{resetAsk=true;render()},
  "reset-no":()=>{resetAsk=false;render()},
  "reset-yes":()=>{S=fresh();S.updatedAt=Date.now();save();resetAsk=false;L=null;R=null;toast("ล้างความคืบหน้าแล้ว");go("home")}
};
Object.assign(ACT,XACT,PACT,GACT);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t||t.disabled) return;
  const f=ACT[t.dataset.act]; if(f){e.preventDefault(); f(t,e)}
});
document.addEventListener("submit",e=>{
  if(e.target.matches('[data-form="addword"]')){
    e.preventDefault();
    const en=$("#aw-en").value.trim(), th=$("#aw-th").value.trim(), ex=$("#aw-ex").value.trim();
    if(!en||!th){toast("ใส่คำภาษาอังกฤษและความหมายก่อน");return}
    if(WORDS[en]&&S.words[en]){toast("คำนี้อยู่ในคลังแล้ว");return}
    if(!WORDS[en]){S.custom=(Array.isArray(S.custom)?S.custom:[]).concat([{en,th,ex}]); registerWords()}
    S.words[en]={b:0,due:Date.now()}; save(); toast("เพิ่ม \""+en+"\" แล้ว"); render(); return;
  }
  if(e.target.matches('[data-form="fill"]')){
    e.preventDefault(); const r=curRunner(); if(!r||r.answered) return;
    const val=$("#fill-in").value.trim(); if(!val){toast("พิมพ์คำตอบก่อน");return}
    const ok=r.items[r.i].a.split("|").some(a=>norm(a)===norm(val));
    answer(r,ok,val);
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.w){(W[t.dataset.w]||(W[t.dataset.w]={})).text=t.value}
  if(t.id==="cert-name"){S.name=t.value.slice(0,40);clearTimeout(t._tm);t._tm=setTimeout(()=>{save()},600)}
  if(t.dataset&&t.dataset.xk&&X&&!X.submitted){X.ans[t.dataset.xk]=t.value; const c=$("#xcount"); if(c) c.textContent=answeredCount()}
  if(t.dataset&&t.dataset.xw){
    const k=t.dataset.xw; XD[k]=t.value; saveDrafts();
    const wc=document.getElementById("wc-"+k), task=X&&X.sec.tasks&&X.sec.tasks.find(x=>X.sec.id+"-w"+x.n===k);
    if(wc) wc.textContent=wcText(wordCount(t.value),task?task.min:0)+(/-s2$/.test(k)?" · พูด 2 นาทีประมาณ 200–250 คำ":"");
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing) return;
  if(e.target.id==="dict-in"){e.preventDefault(); ACT.dcheck()}
  if(e.target.id==="sb-in"){e.preventDefault(); ACT.sbcheck()}
});
setInterval(()=>{if(route.name==="practice"&&route.id==="game.match"&&MG&&!MG.end){const el=$("#mtimer"); if(el) el.textContent=mmss((Date.now()-MG.start)/1000+MG.miss*3)}},1000);
document.addEventListener("change",e=>{if(e.target.id==="cert-name") render()});

/* ---------- boot ---------- */
(function boot(){
  let h=""; try{h=(location.hash||"").slice(1)}catch(e){}
  if(h.indexOf("lesson-")===0){const id=h.slice(7), i=COURSE.findIndex(u=>u.id===id); if(i>=0&&unlocked(i)){go("lesson",id);return}}
  if(h.indexOf("exam-")===0&&secById(h.slice(5))){go("examrun",h.slice(5));return}
  if(h.indexOf("practice-")===0){go("practice",h.slice(9));return}
  if(["home","course","review","teacher","report","placement","exam","practice"].includes(h)){go(h);return}
  render();
})();
initCloud();
initNative();
})();
</script>
