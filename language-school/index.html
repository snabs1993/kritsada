const GACT={
  mgnew:()=>{matchNew(); render()},
  mgpick:t=>{
    if(!MG||MG.end) return;
    const side=t.dataset.s, k=t.dataset.k;
    if(!MG.sel||MG.sel[0]===side){MG.sel=[side,k]; MG.bad=null; if(side==="en") Speech.say(WORDS[k].en); render(); return}
    if(MG.sel[1]===k){MG.done.push(k); MG.sel=null; MG.bad=null;
      if(MG.done.length===MG.words.length){MG.end=Date.now(); const t2=Math.round((MG.end-MG.start)/1000+MG.miss*3), g=stat("games"); if(!g.match||t2<g.match) g.match=t2; bump("prac"); S.xp+=10; markDay(); save()}}
    else {MG.miss++; MG.bad=[MG.sel[0]+":"+MG.sel[1],side+":"+k]; MG.sel=null}
    render();
  },
  sbnew:()=>{spellNew(); render(); if(SB.list.length) Speech.say(WORDS[SB.list[0]].en)},
  sbplay:t=>{if(SB&&SB.i<SB.list.length){Speech.stop(); Speech.say(WORDS[SB.list[SB.i]].en,{slow:!!t.dataset.slow})}},
  sbhint:()=>{if(SB){SB.hint=true; render()}},
  sbcheck:()=>{
    if(!SB||SB.res) return; const v=($("#sb-in")||{}).value||""; if(!v.trim()){toast("พิมพ์คำที่ได้ยินก่อน");return}
    const w=WORDS[SB.list[SB.i]]; SB.typed=v; SB.res=v.trim().toLowerCase()===w.en.toLowerCase()?"ok":"no"; if(SB.res==="ok") SB.correct++; render();
  },
  sbnext:()=>{
    if(!SB) return; SB.i++; SB.res=null; SB.typed=""; SB.hint=false;
    if(SB.i>=SB.list.length){const g=stat("games"); g.spell=Math.max(g.spell||0,SB.correct); bump("prac"); S.xp+=SB.correct; markDay(); save(); render(); return}
    render(); Speech.say(WORDS[SB.list[SB.i]].en); const f=$("#sb-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus();
  },
  scrstart:()=>{PRUN_META={id:"scr",title:"เรียงประโยค"}; PRUN=newRunner(scrambleItems(),"scr"); render()}
};

STORIES.push(
 {id:"c1a",lv:"C1",title:"The Attention Economy",th:"เศรษฐกิจแห่งความสนใจ",
  paras:["Every time you open a social media app, you enter a competition you may not even notice. Companies are not only competing for your money; they are competing for your attention, which has become one of the most valuable resources in the modern economy. The more time you spend on a platform, the more advertisements it can show you, and the more data it can collect about your habits.","To keep users scrolling, designers rely on techniques borrowed from psychology. Endless feeds remove natural stopping points, while notifications arrive at unpredictable moments, creating a sense of anticipation similar to that of a slot machine. Critics argue that these features are deliberately addictive, and that they make it increasingly difficult for people to concentrate on demanding tasks.","Not everyone agrees with this gloomy picture. Some researchers point out that people have always complained about new technologies, from novels to television. Nevertheless, a growing number of users are taking action, switching off notifications, setting daily limits or deleting apps altogether. Whether these small steps can outweigh the power of billion-dollar companies remains to be seen."],
  gloss:[["attention","ความสนใจ"],["valuable","มีค่า"],["techniques","เทคนิค วิธีการ"],["unpredictable","คาดเดาไม่ได้"],["anticipation","การรอคอยด้วยความตื่นเต้น"],["deliberately","โดยจงใจ"],["addictive","ทำให้เสพติด"],["outweigh","มีน้ำหนักมากกว่า"]],
  qs:[{q:"According to the article, why do companies want users' attention?",o:["to show more ads and collect data","to improve users' health","to reduce their costs"],a:0},{q:"What do critics say about notifications and endless feeds?",o:["They are deliberately addictive.","They help people concentrate.","They are too expensive to build."],a:0},{q:"How are some users responding?",o:["They are buying new phones.","They are switching off notifications or deleting apps.","They are complaining to the government."],a:1}]},
 {id:"c1b",lv:"C1",title:"Why We Procrastinate",th:"ทำไมเราชอบผัดวันประกันพรุ่ง",
  paras:["Most of us have delayed an important task while doing something far less useful, such as tidying a drawer or checking the news for the fifth time. This habit, known as procrastination, is often blamed on laziness or poor time management. However, psychologists now believe that the real cause is emotional rather than practical.","According to this view, we avoid tasks that make us feel anxious, bored or insecure. Putting them off provides immediate relief, which is why the habit is so hard to break. The problem is that the relief is temporary: the task remains, the deadline gets closer, and the stress eventually becomes worse than it would have been if we had simply started.","The good news is that procrastination can be reduced. Experts recommend breaking a large task into small, specific steps, so that the first one feels easy to begin. Others suggest being kind to yourself after a failure rather than criticising yourself, since guilt tends to make people avoid the task even longer. As one researcher puts it, the key is not to wait until you feel motivated, but to start and let the motivation follow."],
  gloss:[["delayed","เลื่อนออกไป"],["procrastination","การผัดวันประกันพรุ่ง"],["emotional","เกี่ยวกับอารมณ์"],["anxious","กังวล"],["relief","ความโล่งใจ"],["temporary","ชั่วคราว"],["guilt","ความรู้สึกผิด"],["motivated","มีแรงจูงใจ"]],
  qs:[{q:"What do psychologists now believe causes procrastination?",o:["laziness","emotions","poor planning"],a:1},{q:"Why is procrastination hard to stop?",o:["Delaying gives immediate relief.","Tasks are always boring.","Deadlines are too far away."],a:0},{q:"What do experts recommend?",o:["waiting until you feel motivated","criticising yourself after a failure","breaking tasks into small steps"],a:2}]}
);

async function checkEmail(id){
  const m=EMAILS.find(x=>x.id===id), text=(EMD[id]||"").trim(), r=EMR[id]||(EMR[id]={});
  if(wordCount(text)<15){toast("เขียนอีเมลอย่างน้อย 15 คำก่อนส่งให้ครูตรวจ");return}
  r.busy=true; r.err=""; render();
  const prompt="You are an English teacher checking a work email written by a Thai adult learner.\nEmail type: "+m.en+"\nTask (Thai): "+m.task+"\nStudent's email:\n\"\"\"\n"+text.slice(0,3000)+"\n\"\"\"\nCheck grammar, vocabulary, tone (formal or friendly as the task needs), structure (subject, greeting, purpose, closing) and whether every part of the task is covered.\nReply with only a JSON object: {\"score\": integer 0-10, \"corrected\": \"the full improved email in English, keeping the student's ideas\", \"notes\": [\"up to 5 short feedback points in Thai, each like: ✗ wrong → ✓ right เหตุผลสั้นๆ\"], \"praise\": \"one short encouraging sentence in Thai\"}";
  try{
    const res=await AI.fn.json(prompt,{modelTier:"default"});
    const score=Math.max(0,Math.min(10,Math.round(Number(res&&res.score)||0)));
    r.res={score,corrected:String(res&&res.corrected||""),notes:Array.isArray(res&&res.notes)?res.notes.slice(0,5).map(String):[],praise:String(res&&res.praise||"")};
    const d=emailDone(); d[id]=Math.max(d[id]||0,score); S.xp+=score; bump("prac"); markDay(); save();
  }catch(e){r.err=e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}
  r.busy=false;
  if(route.name==="practice"&&route.id==="email."+id) render();
}

let DQ={q:"",ai:null,busy:false,err:""};
function dictMatches(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const th=/[฀-๿]/.test(q), out=[];
  Object.keys(WORDS).forEach(k=>{
    const w=WORDS[k]; if(!w||!w.en) return;
    const en=w.en.toLowerCase();
    let s=-1;
    if(th){if((w.th||"").indexOf(q)>=0) s=(w.th.indexOf(q)===0?1:2)}
    else if(en===q) s=0; else if(en.indexOf(q)===0) s=1; else if(en.indexOf(q)>=0) s=2;
    if(s>=0) out.push([s,en.length,k]);
  });
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,30).map(x=>x[2]);
}
function wordSrc(w){
  const u=w.unit||"";
  if(u==="custom") return "คำของฉัน";
  if(u.indexOf("deck-")===0){const d=DECKS.find(x=>"deck-"+x.id===u); return d?d.title:""}
  if(u.indexOf("story-")===0) return "บทอ่าน";
  const c=COURSE.find(x=>x.id===u); return c?"บทที่ "+c.n+" · "+LEVELS[c.lv-1].code:"";
}

/* ---------- speed game: meanings in 60 seconds ---------- */
let SPG=null;
function speedQ(){
  let pool=gamePool().filter(k=>WORDS[k]&&WORDS[k].th);
  if(pool.length<12) pool=pool.concat(shuffle(Object.keys(WORDS).filter(k=>WORDS[k].th&&WORDS[k].unit&&/^u\d/.test(WORDS[k].unit))).slice(0,40));
  pool=Array.from(new Set(pool));
  const k=pool[Math.floor(Math.random()*pool.length)], ths=new Set([WORDS[k].th]), opts=[k];
  for(const o of shuffle(pool)){if(opts.length>=4) break; if(!ths.has(WORDS[o].th)){ths.add(WORDS[o].th); opts.push(o)}}
  const sh=shuffle(opts); return {k,opts:sh,a:sh.indexOf(k)};
}
function speedLeft(){return SPG?Math.max(0,60-(Date.now()-SPG.start)/1000):60}
function speedFinish(){
  if(!SPG||SPG.end) return; SPG.end=Date.now();
  const g=stat("games"); SPG.best=g.speed||0; if(SPG.score>(g.speed||0)) g.speed=SPG.score;
  S.xp+=SPG.score; bump("prac"); markDay(); save();
}

function trackXp(){
  if(typeof S._xpSeen!=="number"){S._xpSeen=S.xp; return}
  const d=S.xp-S._xpSeen;
  if(d>0){
    if(!S.xpDay||typeof S.xpDay!=="object") S.xpDay={};
    const k=dayKey(); S.xpDay[k]=(S.xpDay[k]||0)+d;
    const ks=Object.keys(S.xpDay).sort(); while(ks.length>60) delete S.xpDay[ks.shift()];
  }
  S._xpSeen=S.xp;

  const xd=S.xpDay&&typeof S.xpDay==="object"?S.xpDay:{}, days=[], today=new Date(); today.setHours(12,0,0,0);
  for(let i=13;i>=0;i--){const d=new Date(today.getTime()-i*DAY); days.push({d,k:dayKey(d),v:xd[dayKey(d)]||0})}
  const tot=days.reduce((a,x)=>a+x.v,0), max=Math.max.apply(null,days.map(x=>x.v)), act=days.filter(x=>x.v>0).length;
  let h='<section class="section"><div class="section-head"><h2 class="h3">คะแนนที่ได้ 14 วันล่าสุด</h2><span class="muted">รวม '+tot.toLocaleString()+' คะแนน'+(act?' · เฉลี่ย '+Math.round(tot/act)+' ต่อวันที่เรียน':'')+'</span></div>';
  if(!tot) return h+'<div class="card"><p class="muted">ยังไม่มีข้อมูล เรียน ฝึก หรือเล่นเกมเพื่อเก็บคะแนน แล้วกราฟจะขึ้นที่นี่</p></div></section>';
  const maxI=days.findIndex(x=>x.v===max);
  h+='<div class="card"><div class="xpc" role="img" aria-label="กราฟคะแนนรายวัน 14 วัน สูงสุด '+max+' คะแนน">'
   +days.map((x,i)=>{const lab=i===maxI||(i===13&&x.v>0); const t=x.d.toLocaleDateString("th-TH",{day:"numeric",month:"short"})+": "+x.v+" คะแนน";
     return '<div class="xpc-col" title="'+esc(t)+'">'+(lab?'<span class="xpc-v" style="bottom:calc('+(x.v/max*100)+'% + 3px)">'+x.v+'</span>':'')+'<i style="height:'+(x.v?Math.max(3,x.v/max*100):0)+'%"></i></div>'}).join("")
   +'</div><div class="xpc-x">'+days.map((x,i)=>'<span>'+(i%2===1?(i===13?'<b>'+x.d.getDate()+'</b>':x.d.getDate()):'')+'</span>').join("")+'</div></div></section>';
  return h;
}

/* ---------- listening to numbers, times and spelling ---------- */
const NUM_MODES=[["price","ราคา"],["time","เวลา"],["year","ปี ค.ศ."],["phone","เบอร์โทร"],["big","ตัวเลขหลักพัน"],["spell","สะกดชื่อ"]];
const SPELL_NAMES=["Pierce","Grant","Wilson","Thompson","Harris","Clarke","Walker","Wright","Hughes","Morgan","Bennett","Fraser","Quinn","Joyce","Vaughan","Rhodes","Kelly","Jarvis","Gibson","Lawrence","Fitzgerald","Carver","Holmes","Baxter"];
function w2(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?"-"+ONES[n%10]:"")}
function w3(n){const h=Math.floor(n/100), r=n%100; return (h?ONES[h]+" hundred":"")+(h&&r?" and ":"")+(r||!h?w2(r):"")}
function numWords(n){const th=Math.floor(n/1000), r=n%1000; return th?w3(th)+" thousand"+(r?(r<100?" and ":", ")+w3(r):""):w3(r)}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function numGen(mode){
  if(mode==="price"){
    const d=rnd(1,299), c=[0,25,49,50,75,95,99,rnd(1,98)][rnd(0,7)], cur=Math.random()<.5?["dollar","cent","$"]:["pound","pence","£"];
    const say=numWords(d)+" "+cur[0]+(d===1?"":"s")+(c?" "+(cur[0]==="dollar"?"and "+w2(c)+" cent"+(c===1?"":"s"):w2(c)):"");
    return {say,ans:(d+c/100).toFixed(2),show:cur[2]+d+(c?"."+String(c).padStart(2,"0"):""),hint:"พิมพ์เป็นตัวเลข เช่น 12.50"};
  }
  if(mode==="time"){
    const h=rnd(1,12), m=[0,5,10,15,20,25,30,35,40,45,50,55,rnd(1,59)][rnd(0,12)], nh=h%12+1;
    const dig=ONES[h]+" "+(m===0?"o'clock":m<10?"oh "+ONES[m]:w2(m));
    let say=dig;
    if(Math.random()<.5&&m%5===0){
      if(m===0) say=ONES[h]+" o'clock"; else if(m===15) say="quarter past "+ONES[h]; else if(m===30) say="half past "+ONES[h]; else if(m===45) say="quarter to "+ONES[nh];
      else if(m<30) say=w2(m)+" past "+ONES[h]; else say=w2(60-m)+" to "+ONES[nh];
    }
    return {say,ans:h+":"+String(m).padStart(2,"0"),show:h+":"+String(m).padStart(2,"0"),hint:"พิมพ์แบบ 7:15"};
  }
  if(mode==="year"){
    const y=rnd(1950,2029), yy=y%100;
    const say=y<2000?"nineteen "+(yy<10?"oh "+ONES[yy]:w2(yy)):y<2010?"two thousand"+(yy?" and "+ONES[yy]:""):"twenty "+w2(yy);
    return {say,ans:String(y),show:String(y),hint:"พิมพ์เป็นตัวเลข 4 หลัก"};
  }
  if(mode==="phone"){
    let d="0"+[6,8,9][rnd(0,2)]; while(d.length<10) d+=rnd(0,9);
    const word=c=>c==="0"?"oh":ONES[+c], grp=[d.slice(0,3),d.slice(3,6),d.slice(6)];
    return {say:grp.map(g=>g.split("").map(word).join(" ")).join(", "),ans:d,show:grp.join("-"),hint:"พิมพ์ตัวเลข 10 หลัก"};
  }
  if(mode==="big"){
    const n=Math.random()<.5?rnd(1000,9999):rnd(10000,99999);
    return {say:numWords(n),ans:String(n),show:n.toLocaleString("en-US"),hint:"พิมพ์เป็นตัวเลข"};
  }
  const nm=SPELL_NAMES[rnd(0,SPELL_NAMES.length-1)];
  return {say:nm.toUpperCase().split("").join(", "),ans:nm.toLowerCase(),show:nm,hint:"พิมพ์ชื่อที่สะกด"};
}
function numNorm(mode,s){
  s=String(s||"").trim().toLowerCase();
  if(mode==="price"){const v=parseFloat(s.replace(/[^0-9.]/g,"")); return isNaN(v)?"":v.toFixed(2)}
  if(mode==="time"){const m=/(\d{1,2})\D*(\d{2})?/.exec(s); if(!m) return ""; return (+m[1])+":"+(m[2]||"00")}
  if(mode==="spell") return s.replace(/[^a-z]/g,"");
  return s.replace(/\D/g,"");
}
let NUM=null;
function numNew(mode){NUM={mode,i:0,n:10,item:numGen(mode),typed:"",res:null,correct:0}}
function viewNumbers(){
  if(!NUM) numNew(stat("nums").mode||"price");
  const st=stat("nums");
  let h=pBack()+'<h1 class="h2" style="margin-top:8px">ฟังตัวเลขและการสะกด</h1><p class="lede">ราคา เวลา ปี เบอร์โทร และการสะกดชื่อ เป็นจุดที่คนไทยพลาดบ่อยทั้งในชีวิตจริงและข้อสอบ IELTS Listening Part 1 และ TOEIC ฟังแล้วพิมพ์คำตอบ ชุดละ 10 ข้อ</p>'
   +'<div class="tabs" role="group" aria-label="ประเภท">'+NUM_MODES.map(m=>'<button data-act="numode" data-m="'+m[0]+'" aria-pressed="'+(NUM.mode===m[0])+'">'+m[1]+(st[m[0]]!=null?' <small>'+st[m[0]]+'/10</small>':'')+'</button>').join("")+'</div>';
  if(NUM.i>=NUM.n) return h+'<div class="card" style="margin-top:16px;max-width:620px"><h2 class="h2">ถูก '+NUM.correct+'/'+NUM.n+'</h2><p class="lede">'+(NUM.correct>=9?"หูไวมาก ลองประเภทอื่นต่อได้เลย":NUM.correct>=6?"ดีแล้ว ฝึกอีกรอบจะแม่นขึ้น":"ลองกดฟังช้าๆ แล้วจดทีละส่วน")+'</p><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="numode" data-m="'+NUM.mode+'">เล่นอีกรอบ</button></div></div>';
  const it=NUM.item, r=NUM.res;
  h+='<div class="card dict" style="margin-top:16px"><div class="row" style="justify-content:space-between"><span class="mono">ข้อ '+(NUM.i+1)+'/'+NUM.n+' · ถูก '+NUM.correct+'</span><div class="row"><button class="btn btn-sm btn-primary" data-act="nuplay">'+ICON.say+'ฟัง</button><button class="btn btn-sm" data-act="nuplay" data-slow="1">ฟังช้าๆ</button></div></div>'
   +'<label class="sr" for="num-in">คำตอบ</label><input id="num-in" class="dict-in" lang="en" inputmode="'+(NUM.mode==="spell"?"text":"decimal")+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(it.hint)+'" value="'+esc(r?NUM.typed:"")+'"'+(r?" disabled":"")+'>';
  if(!r) h+='<div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="nucheck">ตรวจ</button><span class="muted" style="font-size:14px">กด Enter เพื่อตรวจได้</span></div>';
  else h+='<div class="feedback '+(r==="ok"?"ok":"no")+'"><b>'+(r==="ok"?"ถูกต้อง!":"ยังไม่ถูก")+'</b><span>คำตอบ: <b lang="en">'+esc(it.show)+'</b> · ได้ยินว่า "<span lang="en">'+esc(it.say)+'</span>"</span></div><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="nunext">'+(NUM.i+1<NUM.n?"ข้อต่อไป":"ดูผล")+'</button></div>';
  return h+'</div>';
}

function pbItems(s){

}
async function pbPlayAll(id){
  const s=PHRASEBOOK.find(x=>x.id===id), tok=++pbTok; Speech.stop();
  for(let i=0;i<s.items.length;i++){
    if(tok!==pbTok||route.name!=="practice"||route.id!=="pb."+id) break;
    document.querySelectorAll(".pb-item").forEach(x=>x.classList.remove("playing")); const el=$("#pb-"+i); if(el) el.classList.add("playing");

function runnerDoneX(r,c,tot){
  const pct=Math.round(c/tot*100);

}

function go(name,id){
  Speech.stop();
  if(NB&&prActive) NB.stopListening();
  if(NB&&name==="teacher") name="home";
  xTok++; if(X) X.playing=null;
  if(name==="practice"){storyTok++; if(!id||String(id).indexOf("gram.")!==0&&id!=="mistakes"){PRUN=null;PRUN_META=null} if(!id||String(id).indexOf("story.")!==0) ST=null}
  if(name==="examrun"){const sec=secById(id); if(!sec) return go("exam"); X=XS[id]||(XS[id]=newAttempt(sec))}
  if(name==="lesson"){
    const i=COURSE.findIndex(u=>u.id===id);
    if(i<0) return go("course");
    if(!unlocked(i)){toast("ต้องผ่านบทก่อนหน้าก่อน หรือทำแบบทดสอบวัดระดับ");return}
    const r=rec(id);
    L={id,idx:i,step:r.done?0:Math.min(r.reached,5),vi:0,showTh:false,comp:{},practice:null,quiz:null,quizDone:null};
    if(L.step===0){addWords(COURSE[i]);save()}
  }
  if(name==="placement") P={runner:null,result:null};
  if(name==="review") R=null;
  resetAsk=false;
  route={name,id:id||null};
  try{history.replaceState(null,"","#"+(name==="lesson"?"lesson-"+id:name==="examrun"?"exam-"+id:name==="practice"&&id?"practice-"+id:name))}catch(e){}
  render(); window.scrollTo(0,0);
}

  return shuffle(items.concat(u.quiz));

/* ---------- exercise runner ---------- */
function newRunner(items,kind){
  const r={kind,items:items.map(x=>Object.assign({},x)),i:0,results:[],answered:false,ok:null,given:"",done:false};
  r.items.forEach(it=>{
    if(it.t==="mc"){const idx=shuffle(it.o.map((_,k)=>k)); it.o=idx.map(k=>it.o[k]); it.a=idx.indexOf(it.a)}
  });
  prepItem(r); return r;
}
function prepItem(r){
  const it=r.items[r.i]; if(!it) return;
  if(it.t==="order"){
    const words=it.a.split(" ").map((w,k)=>({w,k}));
    let pool=shuffle(words); let tries=0;
    while(words.length>1&&pool.map(x=>x.w).join(" ")===it.a&&tries++<8) pool=shuffle(words);
    r.pool=pool; r.built=[];
  }
}
function runnerHTML(r){
  const it=r.items[r.i];
  let h='<div class="runner"><div class="rn-top"><span class="mono">ข้อ '+(r.i+1)+'/'+r.items.length+'</span><div class="dots" aria-hidden="true">'
    +r.items.map((_,k)=>'<i class="'+(k<r.i||(k===r.i&&r.answered)?(r.results[k]?"ok":"no"):k===r.i?"cur":"")+'"></i>').join("")+'</div></div>';
  if(it.t==="mc"){
    h+='<p class="q"'+(/[ก-๙]/.test(it.q)?'':' lang="en"')+'>'+esc(it.q).replace(/___/g,'<span class="blank">'+(r.answered?esc(it.o[it.a]):"&nbsp;")+'</span>')+'</p><div class="opts">'
     +it.o.map((o,k)=>{let c="opt"; if(r.answered){if(k===it.a) c+=" is-right"; else if(k===r.given) c+=" is-wrong"} return '<button class="'+c+'" data-act="r-opt" data-o="'+k+'"'+(r.answered?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>';
  } else if(it.t==="fill"){
    const ans=capBlank(it,it.a.split("|")[0]);
    const q=esc(it.q).replace(/___/g,'<span class="blank">'+(r.answered?esc(r.ok?capBlank(it,r.given):ans):"&nbsp;")+'</span>');
    h+='<p class="q"><span lang="en">'+q+'</span><span class="hint">พิมพ์คำที่หายไป</span></p>'
     +'<form class="fill" data-form="fill"><label class="sr" for="fill-in">คำตอบ</label><input id="fill-in" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" value="'+esc(r.given||"")+'"'+(r.answered?" disabled":"")+'>'
     +(r.answered?"":'<button class="btn btn-primary" type="submit">ตรวจคำตอบ</button>')+'</form>';
  } else {
    h+='<p class="q">เรียงคำให้เป็นประโยคที่ถูกต้อง<span class="hint">'+esc(it.hint||"")+'</span></p>'
     +'<div class="built" lang="en">'+r.built.map(t=>'<button class="tl" data-act="r-unt" data-k="'+t.k+'"'+(r.answered?" disabled":"")+'>'+esc(t.w)+'</button>').join("")+'</div>'
     +'<div class="pool" lang="en">'+r.pool.map(t=>'<button class="tl" data-act="r-tile" data-k="'+t.k+'">'+esc(t.w)+'</button>').join("")+'</div>'
     +(r.answered?"":'<button class="btn btn-primary" data-act="r-order"'+(r.pool.length?" disabled":"")+'>ตรวจคำตอบ</button>');
  }
  if(r.answered){
    const right=it.t==="mc"?it.o[it.a]:it.t==="fill"?capBlank(it,it.a.split("|")[0]):it.a;
    h+='<div class="feedback '+(r.ok?"ok":"no")+'" role="status"><b>'+(r.ok?"ถูกต้อง!":"ยังไม่ถูก")+'</b>'
      +(r.ok?"":'<span>คำตอบที่ถูก: <b lang="en">'+esc(right)+'</b></span>')
      +(it.w?'<span class="pen">'+esc(it.w)+'</span>':'')+'</div>'
      +'<div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="r-next" id="r-next">'+(r.i===r.items.length-1?"ดูผล":"ข้อต่อไป")+'</button></div>';
  }
  return h+'</div>';
}
function capBlank(it,s){s=String(s||"");return it.q.trim().indexOf("___")===0?s.charAt(0).toUpperCase()+s.slice(1):s}
function curRunner(){
  if(route.name==="practice") return PRUN;
  if(route.name==="placement") return P&&P.runner;
  if(route.name==="lesson"&&L){const k=STEPS[L.step][0]; return k==="practice"?L.practice:k==="quiz"?L.quiz:null}
  return null;
}
function answer(r,ok,given){
  r.answered=true; r.ok=ok; r.given=given; r.results[r.i]=ok;
  const it=r.items[r.i];
  if(!ok&&r.kind!=="mist"){addMistake(mistSrc(r),it); save()}
  if(ok&&r.kind==="mist"&&it._mid){S.mistakes=(S.mistakes||[]).filter(m=>m.id!==it._mid); const ms=stat("mist"); ms.cleared=(ms.cleared||0)+1; save()}
  if(it.t==="order") Speech.say(it.a);
  render();
  const nb=$("#r-next"); if(nb) nb.focus({preventScroll:true});
}
function runnerNext(r){
  r.i++; r.answered=false; r.ok=null; r.given="";
  if(r.i>=r.items.length){r.done=true; runnerDone(r)} else prepItem(r);
  render();
  if(!r.done){const f=$("#fill-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus()}
}
function runnerDone(r){
  const c=r.results.filter(Boolean).length, tot=r.items.length;
  if(r.kind==="practice"){const rr=rec(L.id); rr.practice=Math.round(c/tot*100); S.xp+=c*2; markDay(); save()}
  if(r.kind==="quiz"){
    const u=COURSE[L.idx], rr=rec(u.id), pct=Math.round(c/tot*100);
    const stars=pct===100?3:pct>=85?2:pct>=70?1:0;
    const first=!rr.done&&pct>=70;
    rr.best=Math.max(rr.best||0,pct); rr.stars=Math.max(rr.stars||0,stars);
    if(pct>=70){rr.done=true; rr.reached=5; if(!rr.doneAt) rr.doneAt=Date.now()}
    S.xp+=c*5+(first?50:0); markDay(); save();
    L.quizDone={pct,correct:c,total:tot,stars};
    if(first) toast("ผ่านบทที่ "+u.n+" แล้ว +50 คะแนน");
  }
  if(r.kind==="scr"){const g=stat("games"); g.scr=Math.max(g.scr||0,c); S.xp+=c*2; bump("prac"); markDay(); save()}
  if(r.kind==="gq"||r.kind==="mist"){
    if(r.kind==="gq"&&PRUN_META){const gs=stat("gram"); gs[PRUN_META.id]=Math.max(gs[PRUN_META.id]||0,Math.round(c/tot*100))}
    S.xp+=c*2; bump("prac"); markDay(); save();
  }
  if(r.kind==="lvt"||r.kind==="pb") runnerDoneX(r,c,tot);
  if(r.kind==="placement"){
    const g=[0,4,8].map(s=>r.results.slice(s,s+4).filter(Boolean).length);
    const level=g[0]>=3&&g[1]>=3?3:g[0]>=3?2:1;
    S.placement={done:true,level,score:c,at:Date.now()}; markDay(); save();
    P.result={level,score:c,g};
  }
}

/* ---------- actions ---------- */
async function playDialogue(u){
  Speech.stop();
  const d=u.dialogue;
  for(let i=0;i<d.lines.length;i++){
    if(route.name!=="lesson"||STEPS[L.step][0]!=="dialogue") return;
    document.querySelectorAll(".dlg li").forEach(x=>x.classList.remove("playing"));
    const li=$("#dl-"+i); if(li) li.classList.add("playing");
    await Speech.say(d.lines[i][1],{voice:d.lines[i][0]==="A"?0:1,pitch:d.lines[i][0]==="A"?1:1.15});
  }
  document.querySelectorAll(".dlg li").forEach(x=>x.classList.remove("playing"));
}
async function checkWriting(id){
  const u=COURSE.find(x=>x.id===id), w=W[id]||(W[id]={text:""});
  const text=(w.text||"").trim();
  if(text.length<5){toast("เขียนคำตอบก่อนส่งให้ครูตรวจ");return}
  w.busy=true; w.err=""; render();
  const prompt="You are an English teacher checking a short writing homework from a Thai adult learner.\nLevel: "+LEVELS[u.lv-1].code+"\nUnit grammar focus: "+u.grammar.title+"\nTask (Thai): "+u.writing.th+"\nStudent's text:\n\"\"\"\n"+text.slice(0,2000)+"\n\"\"\"\nReply with only a JSON object: {\"score\": integer 0-10, \"corrected\": \"the full corrected text in English\", \"notes\": [\"up to 4 short feedback points in Thai, each like: ✗ wrong → ✓ right เหตุผลสั้นๆ\"], \"praise\": \"one short encouraging sentence in Thai\"}";
  try{
    const res=await AI.fn.json(prompt,{modelTier:"default"});
    const score=Math.max(0,Math.min(10,Math.round(Number(res&&res.score)||0)));
    w.res={score,corrected:String(res&&res.corrected||""),notes:Array.isArray(res&&res.notes)?res.notes.slice(0,4).map(String):[],praise:String(res&&res.praise||"")};
    const r=rec(id); r.writing=Math.max(r.writing||0,score); S.xp+=score; markDay(); save();
  }catch(e){w.err=e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}
  w.busy=false;
  if(route.name==="lesson"&&L&&L.id===id) render();
}

const ACT={
  go:t=>go(t.dataset.to),
  open:t=>go("lesson",t.dataset.id),
  say:t=>{Speech.stop();Speech.say(t.dataset.text,{slow:!!t.dataset.slow})},
  slow:()=>{S.settings.slow=!S.settings.slow;save();render()},
  step:t=>{
    const s=+t.dataset.s, r=rec(L.id); if(s>(r.done?5:r.reached)) return;
    Speech.stop(); L.step=s;
    if(STEPS[s][0]==="quiz"&&L.quizDone&&!r.done){L.quizDone=null;L.quiz=null}
    render(); window.scrollTo(0,0);
  },
  "next-step":()=>{
    const r=rec(L.id); Speech.stop();
    if(L.step<5){L.step++; if(L.step>r.reached){r.reached=L.step; S.xp+=5} bump("step"); markDay(); save()}
    render(); window.scrollTo(0,0);
  },
  "v-go":t=>{const u=COURSE[L.idx],i=+t.dataset.i; if(i<0||i>=u.vocab.length) return; L.vi=i; render(); Speech.say(u.vocab[i].en)},
  "toggle-th":()=>{L.showTh=!L.showTh;render()},
  "play-dlg":()=>playDialogue(COURSE[L.idx]),
  comp:t=>{const qi=+t.dataset.q; if(L.comp[qi]!=null) return; L.comp[qi]=+t.dataset.o; render()},
  "redo-practice":()=>{L.practice=newRunner(COURSE[L.idx].practice,"practice");render()},
  "quiz-retry":()=>{L.quiz=null;L.quizDone=null;render();window.scrollTo(0,0)},
  "show-model":t=>{const w=W[t.dataset.id]||(W[t.dataset.id]={text:""}); w.model=!w.model; render()},
  "write-check":t=>checkWriting(t.dataset.id),
  "r-opt":t=>{const r=curRunner(); if(!r||r.answered) return; const k=+t.dataset.o; answer(r,k===r.items[r.i].a,k)},
  "r-tile":t=>{const r=curRunner(); if(!r||r.answered) return; const k=+t.dataset.k, j=r.pool.findIndex(x=>x.k===k); if(j<0) return; r.built.push(r.pool.splice(j,1)[0]); render()},
  "r-unt":t=>{const r=curRunner(); if(!r||r.answered) return; const k=+t.dataset.k, j=r.built.findIndex(x=>x.k===k); if(j<0) return; r.pool.push(r.built.splice(j,1)[0]); render()},
  "r-order":()=>{const r=curRunner(); if(!r||r.answered||r.pool.length) return; const s=r.built.map(x=>x.w).join(" "); answer(r,norm(s)===norm(r.items[r.i].a),s)},
  "r-next":()=>{const r=curRunner(); if(r&&r.answered) runnerNext(r)},
  "start-placement":()=>{P.runner=newRunner(PLACEMENT,"placement");render()},
  "rv-start":()=>{const q=shuffle(dueWords());R={queue:q,revealed:false,count:0};render()},
  "rv-extra":()=>{const q=shuffle(Object.keys(S.words).filter(k=>WORDS[k])).slice(0,10);R={queue:q,revealed:false,count:0,extra:true};render()},
  "rv-reveal":()=>{R.revealed=true;render();Speech.say(WORDS[R.queue[0]].en)},
  "rv-grade":t=>{
    const g=+t.dataset.g, k=R.queue.shift(), s=S.words[k], now=Date.now();
    if(g===0){s.b=0;s.due=now;R.queue.push(k)}
    else if(g===1){s.b=Math.max(1,s.b);s.due=now+DAY}
    else{s.b=Math.min(s.b+1,6);s.due=now+INT[s.b]*DAY}
    R.count++; R.revealed=false; S.xp+=1; bump("review"); markDay(); save();
    if(!R.queue.length){R=null;toast("ทบทวนเสร็จแล้ว เก่งมาก")}
    render();
  },
  "rv-end":()=>{R=null;render()},
  pron:t=>pronounce(t.dataset.text),
  "ota-check":()=>otaCheck(true),
  "ota-apply":()=>{S.updatedAt=Date.now();NB.save(JSON.stringify(S)).catch(()=>{}).then(()=>NB.applyUpdate())},
  tmode:t=>{teacherMode=t.dataset.m;render()},
  suggest:t=>{const el=$("[data-chat]"); if(el&&el._fill) el._fill(t.dataset.text)},
  "chat-clear":()=>{const k="teacher:"+teacherMode,st=CHATS[k]; if(st&&st.ctl) st.ctl.abort(); delete CHATS[k]; render()},
  "reset-ask":()=>{resetAsk=true;render()},
  "reset-no":()=>{resetAsk=false;render()},
  "reset-yes":()=>{S=fresh();S.updatedAt=Date.now();save();resetAsk=false;L=null;R=null;toast("ล้างความคืบหน้าแล้ว");go("home")}
};
Object.assign(ACT,XACT,PACT,GACT,RACT,SACT);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t||t.disabled) return;
  const f=ACT[t.dataset.act]; if(f){e.preventDefault(); f(t,e)}
});
document.addEventListener("submit",e=>{
  if(e.target.matches('[data-form="addword"]')){
    e.preventDefault();
    const en=$("#aw-en").value.trim(), th=$("#aw-th").value.trim(), ex=$("#aw-ex").value.trim();
    if(!en||!th){toast("ใส่คำภาษาอังกฤษและความหมายก่อน");return}
    if(WORDS[en]&&S.words[en]){toast("คำนี้อยู่ในคลังแล้ว");return}
    if(!WORDS[en]){S.custom=(Array.isArray(S.custom)?S.custom:[]).concat([{en,th,ex}]); registerWords()}
    S.words[en]={b:0,due:Date.now()}; save(); toast("เพิ่ม \""+en+"\" แล้ว"); render(); return;
  }
  if(e.target.matches('[data-form="fill"]')){
    e.preventDefault(); const r=curRunner(); if(!r||r.answered) return;
    const val=$("#fill-in").value.trim(); if(!val){toast("พิมพ์คำตอบก่อน");return}
    const ok=r.items[r.i].a.split("|").some(a=>norm(a)===norm(val));
    answer(r,ok,val);
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.w){(W[t.dataset.w]||(W[t.dataset.w]={})).text=t.value}
  if(t.dataset&&t.dataset.em){EMD[t.dataset.em]=t.value; clearTimeout(t._tm); t._tm=setTimeout(saveEmailDrafts,500); const c=$("#emwc"); if(c) c.textContent=wordCount(t.value)+" คำ · อีเมลที่ดีมักยาว 60–120 คำ"}
  if(t.id==="dq"){DQ.q=t.value; const r=$("#dq-res"); if(r) r.innerHTML=dictResultsHTML()}
  if(t.id==="cert-name"){S.name=t.value.slice(0,40);clearTimeout(t._tm);t._tm=setTimeout(()=>{save()},600)}
  if(t.dataset&&t.dataset.xk&&X&&!X.submitted){X.ans[t.dataset.xk]=t.value; const c=$("#xcount"); if(c) c.textContent=answeredCount()}
  if(t.dataset&&t.dataset.xw){
    const k=t.dataset.xw; XD[k]=t.value; saveDrafts();
    const wc=document.getElementById("wc-"+k), task=X&&X.sec.tasks&&X.sec.tasks.find(x=>X.sec.id+"-w"+x.n===k);
    if(wc) wc.textContent=wcText(wordCount(t.value),task?task.min:0)+(/-s2$/.test(k)?" · พูด 2 นาทีประมาณ 200–250 คำ":"");
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing) return;
  if(e.target.id==="dict-in"){e.preventDefault(); ACT.dcheck()}
  if(e.target.id==="sb-in"){e.preventDefault(); ACT.sbcheck()}
  if(e.target.id==="num-in"){e.preventDefault(); ACT.nucheck()}
  if(e.target.id==="vb2"){e.preventDefault(); const f=$("#vb3"); if(f) f.focus()}
  if(e.target.id==="vb3"){e.preventDefault(); ACT.vbcheck()}
});
setInterval(()=>{if(route.name!=="practice"||route.id!=="game.speed"||!SPG||SPG.end) return; const l=speedLeft(); if(l<=0){speedFinish(); render(); return} const el=$("#sptimer"); if(el) el.textContent=mmss(l)},250);
setInterval(()=>{if(route.name==="practice"&&route.id==="game.match"&&MG&&!MG.end){const el=$("#mtimer"); if(el) el.textContent=mmss((Date.now()-MG.start)/1000+MG.miss*3)}},1000);
document.addEventListener("change",e=>{if(e.target.id==="cert-name") render()});

/* ---------- boot ---------- */
(function boot(){
  let h=""; try{h=(location.hash||"").slice(1)}catch(e){}
  if(h.indexOf("lesson-")===0){const id=h.slice(7), i=COURSE.findIndex(u=>u.id===id); if(i>=0&&unlocked(i)){go("lesson",id);return}}
  if(h.indexOf("exam-")===0&&secById(h.slice(5))){go("examrun",h.slice(5));return}
  if(h.indexOf("practice-")===0){go("practice",h.slice(9));return}
  if(["home","course","review","teacher","report","placement","exam","practice"].includes(h)){go(h);return}
  render();
})();
initCloud();
initNative();
})();
</script>
