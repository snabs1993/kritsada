<title>ห้องเรียนอังกฤษส่วนตัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Itim&display=swap">
<style>
:root{
  --paper:#F5F7FC; --surface:#FFFFFF; --ink:#18203A; --ink-2:#465071; --ink-3:#737D9C;
  --line:#E2E7F2; --margin:rgba(201,52,52,.32);
  --accent:#2D47C9; --accent-ink:#FFFFFF; --accent-soft:#E8EDFF;
  --mark:#FFE36A; --star:#E0A800;
  --red:#C93434; --red-soft:#FDEDED; --green:#1B7F52; --green-soft:#E2F4EB;
  --shadow:0 1px 2px rgba(24,32,58,.05),0 6px 20px rgba(24,32,58,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --f-pen:"Itim","IBM Plex Sans Thai Looped",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1320; --surface:#171C2B; --ink:#E8EBF5; --ink-2:#B4BBD0; --ink-3:#8790AB;
    --line:#272E42; --margin:rgba(255,133,131,.28);
    --accent:#93A6FF; --accent-ink:#0D1233; --accent-soft:#222B50;
    --mark:rgba(229,201,74,.38); --star:#F2C94C;
    --red:#FF8987; --red-soft:#3A1F25; --green:#63D49E; --green-soft:#15302A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1320; --surface:#171C2B; --ink:#E8EBF5; --ink-2:#B4BBD0; --ink-3:#8790AB;
  --line:#272E42; --margin:rgba(255,133,131,.28);
  --accent:#93A6FF; --accent-ink:#0D1233; --accent-soft:#222B50;
  --mark:rgba(229,201,74,.38); --star:#F2C94C;
  --red:#FF8987; --red-soft:#3A1F25; --green:#63D49E; --green-soft:#15302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
a{color:var(--accent)}
[lang="en"]{font-feature-settings:"kern"}
mark{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 2px}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.muted{color:var(--ink-3)}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.pen{font-family:var(--f-pen);color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px/1 var(--f-display);letter-spacing:-.02em}
.brand-name{font:700 17px/1.1 var(--f-display)}
.brand-sub{display:block;white-space:nowrap;font:500 11px/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 10px;white-space:nowrap;border-radius:10px;border:0;background:none;color:var(--ink-2);font-weight:500;font-size:15px;cursor:pointer}
@media (min-width:1101px) and (max-width:1360px){.nav svg{display:none}.brand-sub{display:none}}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.streak{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.streak svg{width:16px;height:16px;color:var(--red)}
@media (max-width:1100px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}
  .nav button{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px}
  .streak{margin-left:auto}
  .brand-sub{display:none}
  main{padding-bottom:84px}
}
main .wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
@media (min-width:780px){main .wrap{padding-inline:28px;padding-block:32px 64px}}

/* type & basics */
.h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
.h2{font-size:clamp(22px,3.4vw,28px);font-weight:700}
.h3{font-size:19px;font-weight:600}
.lede{color:var(--ink-2);max-width:62ch;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.say{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;flex:none;vertical-align:middle}
.say:hover{background:var(--accent-soft)}
.say svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.now{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.lock{color:var(--ink-3)}
.stars{color:var(--star);letter-spacing:1px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* exercise-book surface: red margin line */
.notebook{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px 24px 48px;background-image:linear-gradient(to right,transparent 30px,var(--margin) 30px,var(--margin) 31.5px,transparent 31.5px)}
@media (max-width:520px){.notebook{padding:20px 16px 20px 36px;background-image:linear-gradient(to right,transparent 20px,var(--margin) 20px,var(--margin) 21.5px,transparent 21.5px)}}

/* home */
.home-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:24px;align-items:start}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}}
.class-card .h2{margin-top:6px}
.class-card .th-sub{color:var(--ink-2);font-size:17px;margin-top:2px}
.mini-steps{list-style:none;padding:0;margin:18px 0 20px;display:flex;flex-wrap:wrap;gap:6px}
.mini-steps li{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.mini-steps li.done{color:var(--green);border-color:transparent;background:var(--green-soft)}
.mini-steps li.cur{color:var(--accent);border-color:var(--accent)}
.side-stack{display:flex;flex-direction:column;gap:14px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .big{font:700 30px/1 var(--f-display);color:var(--accent);min-width:48px;font-variant-numeric:tabular-nums}
.tile b{display:block;font-size:16px}
.tile small{color:var(--ink-3);font-size:14px;line-height:1.5;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px}
.stats b{display:block;font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-3)}
.section{margin-top:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* course list */
.level{margin-top:36px}
.level:first-child{margin-top:8px}
.level-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.level-code{font:700 44px/1 var(--f-display);color:var(--accent);letter-spacing:-.02em}
.level-head .bar{flex:1;min-width:120px;max-width:240px;margin-bottom:8px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.lrow:hover:not([disabled]){border-color:var(--accent)}
.lrow[disabled]{cursor:not-allowed;opacity:.62}
.lnum{font:600 13px var(--f-mono);color:var(--ink-3)}
.ltitle b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.3}
.ltitle small{display:block;color:var(--ink-3);font-size:14px}
.lstat{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
@media (max-width:520px){.lrow{grid-template-columns:34px 1fr;}.lstat{grid-column:2;align-items:flex-start;flex-direction:row;gap:8px}}

/* lesson */
.lesson-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.lesson-head .h2{margin-top:4px}
.lesson-head .th-sub{color:var(--ink-2)}
.back{background:none;border:0;padding:0;color:var(--ink-3);cursor:pointer;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.back:hover{color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--surface)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.stepper{display:flex;gap:6px;overflow-x:auto;margin:20px 0 24px;padding-bottom:4px;scrollbar-width:thin}
.step{flex:1 0 auto;min-width:92px;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:pointer;text-align:left;font-size:14px}
.step .n{font:500 11px var(--f-mono);letter-spacing:.04em}
.step.is-done{color:var(--ink-2)}
.step.is-done .n::after{content:" ✓";color:var(--green)}
.step.is-current{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.step[disabled]{cursor:not-allowed;opacity:.55}
.stage-foot{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* vocab */
.vocab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.vocab{grid-template-columns:1fr}}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);animation:rise .25s ease}
@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
.flash-top{display:flex;justify-content:space-between;color:var(--ink-3)}
.flash-word{font:700 clamp(34px,7vw,52px)/1.1 var(--f-display);letter-spacing:-.01em;margin:14px 0 10px;overflow-wrap:anywhere}
.flash-th{font-size:22px;font-weight:500;color:var(--ink-2);margin-top:14px}
.flash-ex{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:flex;gap:12px;align-items:flex-start}
.flash-ex p[lang="en"]{font-size:17px}
.flash-ex p+p{color:var(--ink-3);font-size:15px}
.flash-nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.wordlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.wordlist button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.wordlist button:hover{background:var(--surface);border-color:var(--line)}
.wordlist button[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.wordlist .w{font-weight:600}
.wordlist .t{color:var(--ink-3);text-align:right}

/* grammar */
.gram p{max-width:66ch;margin-top:10px}
.gram h3{margin-top:26px;margin-bottom:10px}
.tbl-wrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;letter-spacing:.05em;color:var(--ink-3);font-weight:600;background:var(--paper)}
td[lang="en"]{font-weight:500}
.ex-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.ex-list li{display:flex;gap:12px;align-items:flex-start}
.ex-list .th{color:var(--ink-3);font-size:14.5px}
.mistakes{margin-top:26px;border-top:1px dashed var(--line);padding-top:6px}
.mistakes h3{font-family:var(--f-pen);color:var(--red);font-weight:400;font-size:22px}
.mist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mist:last-child{border-bottom:0}
.mist .x{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.mist s{color:var(--red);text-decoration-thickness:2px}
.mist .ok{color:var(--green);font-weight:600}
.mist .why{grid-column:1/-1;font-family:var(--f-pen);color:var(--red);font-size:17px;line-height:1.5}

/* dialogue */
.dlg-cast{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dlg{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.dlg li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start}
.dlg .who{font:600 14px var(--f-display);color:var(--ink-3);padding-top:4px}
.dlg li.B .who{color:var(--accent)}
.dlg .line[lang="en"]{font-size:17px}
.dlg .tr{color:var(--ink-3);font-size:14.5px}
.dlg li.playing .line{background:linear-gradient(transparent 55%,var(--mark) 55%)}
@media (max-width:520px){.dlg li{grid-template-columns:1fr auto}.dlg .who{grid-column:1/-1;padding:0}}

/* exercises */
.runner{max-width:680px}
.rn-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;color:var(--ink-3)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:18px;height:6px;border-radius:9px;background:var(--line)}
.dots i.cur{background:var(--accent)}
.dots i.ok{background:var(--green)}
.dots i.no{background:var(--red)}
.q{font-size:20px;font-weight:500;line-height:1.55;margin-bottom:16px}
.q .hint{display:block;font-size:14.5px;color:var(--ink-3);font-weight:400}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink-2);text-align:center;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.is-right{border-color:var(--green);background:var(--green-soft)}
.opt.is-wrong{border-color:var(--red);background:var(--red-soft)}
.fill{display:flex;gap:10px;flex-wrap:wrap}
.fill input{flex:1;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.built{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:12px;align-items:center}
.built:empty::before{content:"แตะคำด้านล่างเพื่อเรียงประโยค";color:var(--ink-3);font-size:14px;padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tl{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;color:var(--ink)}
.tl:hover{border-color:var(--accent)}
.built .tl{background:var(--accent-soft);border-color:transparent}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.no{background:var(--red-soft);color:var(--red)}
.feedback .pen{font-size:17px}
.feedback b{font-weight:600}
.comp{margin-top:28px}
.comp .q{font-size:17px;margin:18px 0 10px}

/* results */
.result{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score-ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;text-align:center;border:6px solid var(--accent)}
.score-ring.pass{border-color:var(--green)}
.score-ring.fail{border-color:var(--red)}
.score-ring b{display:block;font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score-ring span{font-size:12.5px;color:var(--ink-3)}
.result .stars{font-size:26px}
@media (max-width:520px){.result{grid-template-columns:1fr;justify-items:start}}
textarea.ta{width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:16px;line-height:1.6}
.grade{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.grade .corr{font-size:17px;background:var(--green-soft);padding:12px 14px;border-radius:12px}
.grade ul{margin:0;padding-left:20px}
.grade li{font-family:var(--f-pen);color:var(--red);font-size:17px}

/* chat */
.chat{border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.chat-log{height:min(460px,58vh);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.t{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.u{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-top-right-radius:4px}

 dialogue:{cast:{A:"Jane",B:"Beam"},lines:[

 grammar:{title:"Present Perfect: have / has + V3",
  intro:["ใช้เล่าประสบการณ์ที่ <mark>ไม่ระบุเวลา</mark> ว่าเกิดเมื่อไร: I have been to Singapore. / Have you ever tried…?",
   "ถ้าบอกเวลาในอดีตชัดเจน (yesterday, in 2020, last week) ต้องเปลี่ยนไปใช้ past simple",
   "been to = เคยไปแล้วกลับมา ส่วน gone to = ไปแล้วยังไม่กลับ"],
  head:["ประธาน","รูปประโยค","ตัวอย่าง"],
  rows:[["I / you / we / they","have + V3","I have tried sushi."],["he / she / it","has + V3","She has been to Japan."],["คำถาม","Have / Has + ประธาน + ever + V3?","Have you ever flown?"]],
  ex:[["I've been to Singapore twice.","ฉันเคยไปสิงคโปร์สองครั้ง"],["No, I haven't. I've never eaten it.","ไม่เคย ไม่เคยกินเลย"],["Have you finished your homework yet?","ทำการบ้านเสร็จหรือยัง"]],
  mist:[["I have went there.","I have been there.","ใช้ V3 ไม่ใช่ V2"],["I have seen it yesterday.","I saw it yesterday.","มีเวลาชัดเจนใช้อดีต"],["Have you ever eat durian?","Have you ever eaten durian?","ต้องเป็น V3"]]},
 dialogue:{cast:{A:"Jane",B:"Mint"},lines:[

  ["B","It smells strong, but it tastes great. You should try it!","กลิ่นแรงแต่รสชาติดีมาก ครูควรลองนะคะ"]],

 grammar:{title:"ขอร้องและเสนออย่างสุภาพ",
  intro:["ระดับความสุภาพ: <b>Can you…?</b> (กันเอง) → <b>Could you…?</b> (สุภาพ) → <mark>Would you mind + V-ing?</mark> (สุภาพมาก)",
   "ตอบ Would you mind…? ถ้ายินดีทำให้ ต้องตอบว่า <b>No, not at all.</b> (แปลตรงตัวคือ “ไม่รังเกียจเลย”)",
   "เสนอความช่วยเหลือใช้ Shall I…? หรือ Would you like me to…?"],

  rows:[["กันเอง","Can you + V?","Can you help me?"],["สุภาพ","Could you + V?","Could you send the report?"],["สุภาพมาก","Would you mind + V-ing?","Would you mind waiting?"],["เสนอช่วย","Shall I + V?","Shall I book a room?"]],
  ex:[["Could you send the report by Friday?","ช่วยส่งรายงานภายในวันศุกร์ได้ไหม"],["Would you mind booking a meeting room?","รบกวนจองห้องประชุมให้หน่อยได้ไหม"],["Would you like me to add the charts?","ให้ฉันใส่กราฟเพิ่มไหม"]],
  mist:[["Could you to send it?","Could you send it?","หลัง could ไม่มี to"],["Would you mind to open the door?","Would you mind opening the door?","mind ตามด้วย V-ing"],["Please you help me.","Could you help me, please?","please ไม่วางหน้าประธาน"]]},
 dialogue:{cast:{A:"Manager",B:"Nok"},lines:[

{id:"u12",lv:3,en:"Health and advice",th:"สุขภาพและการให้คำแนะนำ",

  intro:["ให้คำแนะนำใช้ <mark>should + กริยารูปธรรมดา</mark> และห้ามใช้ shouldn't + กริยา (ไม่มี to ตามหลัง)",

   "ถามอาการ: What's the matter? / What's wrong? และบอกว่าไม่สบายใช้ I don't feel well."],
  head:["","รูปประโยค","ตัวอย่าง"],
  rows:[["แนะนำให้ทำ","should + V","You should rest."],["แนะนำไม่ให้ทำ","shouldn't + V","You shouldn't drink cold water."],["บอกอาการ","have a + อาการ","I have a sore throat."]],
  ex:[["What's the matter? — I have a headache.","เป็นอะไรไป — ปวดหัว"],["You should drink a lot of water.","คุณควรดื่มน้ำเยอะๆ"],["I'll see a doctor if I don't feel better.","ถ้าไม่ดีขึ้นจะไปหาหมอ"]],
  mist:[["You should to rest.","You should rest.","หลัง should ไม่มี to"],["I am headache.","I have a headache.","อาการใช้ have"],["I feel not good.","I don't feel well.","ปฏิเสธใช้ don't"]]},

  v("eventually","ในที่สุด","adv.","Eventually, we found the hotel.","ในที่สุดเราก็หาโรงแรมเจอ"),
  v("realise","ตระหนัก รู้ตัว","v.","I realised I had left my keys at home.","ฉันรู้ตัวว่าลืมกุญแจไว้ที่บ้าน"),
  v("manage to","ทำ…ได้สำเร็จ","phr.","We managed to catch the last train.","เราขึ้นรถไฟเที่ยวสุดท้ายได้ทัน"),
  v("unexpected","ไม่คาดคิด","adj.","We had an unexpected visitor.","เรามีแขกที่ไม่ได้คาดคิดมาเยี่ยม"),
  v("witness","พยาน ผู้เห็นเหตุการณ์","n.","A witness called the police.","พยานคนหนึ่งโทรแจ้งตำรวจ"),
  v("apparently","ดูเหมือนว่า ได้ยินมาว่า","adv.","Apparently, the shop closed last year.","ได้ยินมาว่าร้านปิดไปตั้งแต่ปีที่แล้ว")
 ],
 grammar:{title:"Narrative tenses: past simple, past continuous, past perfect",
  intro:["เวลาเล่าเรื่องในอดีต ภาษาอังกฤษใช้ 3 tense ทำงานร่วมกัน:",
   "<mark>past continuous</mark> (was/were + V-ing) เป็นฉากหลังที่กำลังดำเนินอยู่ ส่วน <mark>past simple</mark> เป็นเหตุการณ์ที่แทรกเข้ามา: I was walking home when it started to rain.",
   "<mark>past perfect</mark> (had + V3) ใช้กับเหตุการณ์ที่เกิดก่อนอีกเหตุการณ์หนึ่งในอดีต: When I arrived, the train had left."],
  head:["Tense","รูป","หน้าที่ในเรื่องเล่า"],
  rows:[["Past continuous","was/were + V-ing","ฉากหลัง: I was driving to work…"],["Past simple","V2","เหตุการณ์หลัก: …when my car stopped."],["Past perfect","had + V3","เกิดก่อน: I had forgotten to fill the tank."]],
  ex:[["I was cooking dinner when the phone rang.","ฉันกำลังทำอาหารเย็นอยู่ตอนที่โทรศัพท์ดัง"],["By the time we arrived, the film had already started.","พอเราไปถึง หนังก็เริ่มไปแล้ว"],["While she was waiting for the bus, she met an old friend.","ระหว่างที่รอรถเมล์ เธอเจอเพื่อนเก่า"]],
  mist:[["When I arrived, the train already left.","When I arrived, the train had already left.","เกิดก่อนอีกเหตุการณ์ในอดีตใช้ had + V3"],["I was knowing the answer.","I knew the answer.","know เป็นกริยาแสดงสภาพ ไม่ใช้รูป -ing"],["While I walked home, it was starting to rain.","While I was walking home, it started to rain.","ฉากหลังใช้ continuous เหตุการณ์แทรกใช้ past simple"]]},
 dialogue:{cast:{A:"Jane",B:"Beam"},lines:[
  ["A","You look tired. Is everything OK?","ดูเหนื่อยนะ ทุกอย่างโอเคไหม"],
  ["B","I had a crazy morning. I was driving to work when my car suddenly stopped in the middle of the road.","เช้านี้วุ่นมากครับ ผมกำลังขับรถไปทำงาน แล้วรถก็ดับกลางถนน"],
  ["A","Oh no! What happened?","ตายแล้ว เกิดอะไรขึ้น"],
  ["B","I had forgotten to fill up the tank. I had been so busy all week that I didn't notice.","ผมลืมเติมน้ำมัน ทั้งสัปดาห์ยุ่งมากจนไม่ทันสังเกต"],
  ["A","So how did you get to work?","แล้วมาทำงานได้ยังไง"],
  ["B","A kind man who was walking past helped me push the car to a petrol station. Eventually, I arrived an hour late.","มีผู้ชายใจดีที่เดินผ่านมาช่วยเข็นรถไปปั๊ม สุดท้ายผมมาสายหนึ่งชั่วโมง"]],
  q:[mc("Why did Beam's car stop?",["It had run out of fuel.","It had a flat tyre.","Another car hit it."],0),mc("Who helped Beam?",["a mechanic","a man who was walking past","a police officer"],1)]},
 practice:[
  mc("I ___ TV when the lights went out.",["watched","was watching","had watched"],1,"ฉากหลังที่กำลังดำเนินอยู่ใช้ past continuous"),
  mc("When we got to the cinema, the film ___.",["already started","had already started","was already starting"],1,"หนังเริ่มก่อนที่เราจะไปถึง ใช้ had + V3"),
  fill("While she ___ for the bus, it started to rain. (wait)","was waiting","ฉากหลังใช้ was + V-ing"),
  mc("She ___ the answer, so she put up her hand.",["knew","was knowing","had been knowing"],0,"know ไม่ใช้รูป -ing"),
  fill("By the time I arrived, everyone ___ home. (go)","had gone","เกิดก่อนที่ฉันจะไปถึง"),
  ord("I was walking home when I saw an accident","ฉันกำลังเดินกลับบ้านตอนที่เห็นอุบัติเหตุ")],
 quiz:[mc("They ___ dinner when I called them.",["had","were having","have had"],1),fill("He realised he ___ his keys at the office. (leave)","had left"),mc("___ I was studying, my brother was playing games.",["When","While","By the time"],1)],
 role:{th:"เล่าเรื่องที่เคยเกิดขึ้นกับคุณ เช่น เหตุการณ์ไม่คาดคิดหรือวันที่วุ่นวาย ครูจะถามรายละเอียด ใช้ past continuous และ past perfect",opener:"I love a good story! Can you tell me about something unexpected that happened to you?",
  shadow:["I was walking to work when it started to rain.","By the time I got there, the shop had closed.","Suddenly, I realised I had left my phone at home.","Eventually, everything turned out fine."]},
 writing:{th:"เล่าเหตุการณ์ไม่คาดคิดที่เคยเกิดขึ้น 4–5 ประโยค ใช้ past continuous และ past perfect",model:"Last month I was waiting for a train at Siam station when I heard someone call my name. It was my old teacher, whom I hadn't seen for ten years. She had moved to Japan after I graduated, and she had just come back to Thailand. We talked until my train had left, but I didn't mind at all."}},

{id:"u14",lv:4,en:"In the news",th:"ข่าวและการเล่าต่อ",
 vocab:[
  v("announce","ประกาศ","v.","The company announced a new product.","บริษัทประกาศเปิดตัวสินค้าใหม่"),
  v("claim","อ้างว่า","v.","He claims that he saw a ghost.","เขาอ้างว่าเห็นผี"),
  v("according to","ตามที่…กล่าว","prep.","According to the report, prices will rise.","ตามรายงาน ราคาจะสูงขึ้น"),
  v("headline","พาดหัวข่าว","n.","Did you read today's headlines?","อ่านพาดหัวข่าววันนี้หรือยัง"),
  v("reporter","นักข่าว","n.","A reporter interviewed the mayor.","นักข่าวสัมภาษณ์นายกเทศมนตรี"),
  v("official","เจ้าหน้าที่ทางการ","n.","Officials said the road would reopen soon.","เจ้าหน้าที่กล่าวว่าถนนจะเปิดใช้เร็วๆ นี้"),
  v("confirm","ยืนยัน","v.","Can you confirm your booking?","ช่วยยืนยันการจองได้ไหม"),
  v("deny","ปฏิเสธ (ข้อกล่าวหา)","v.","He denied taking the money.","เขาปฏิเสธว่าไม่ได้เอาเงินไป")
 ],
 grammar:{title:"Reported speech: said, told, asked",
  intro:["เวลาเล่าต่อคำพูดของคนอื่น มัก <mark>ถอยเวลาไปหนึ่งขั้น</mark>: am/is → was, will → would, can → could, have done → had done",
   "<mark>say</mark> ไม่ต้องมีคนตามหลัง (She said that…) ส่วน <mark>tell</mark> ต้องมีคนตามหลัง (She told me that…)",
   "คำถามใช้ asked + if/whether หรือคำขึ้นต้น wh- แล้ว <mark>เรียงประโยคแบบบอกเล่า</mark>: She asked where I lived."],
  head:["คำพูดตรง","คำพูดอ้อม"],
  rows:[["\"I am tired.\"","She said (that) she was tired."],["\"I will call you.\"","He said he would call me."],["\"I have finished.\"","She said she had finished."],["\"Are you ready?\"","He asked if I was ready."],["\"Where do you live?\"","She asked where I lived."]],
  ex:[["The minister said that prices would fall next year.","รัฐมนตรีกล่าวว่าราคาจะลดลงปีหน้า"],["She told me she was leaving the company.","เธอบอกฉันว่าจะลาออกจากบริษัท"],["He asked me whether I had seen the news.","เขาถามฉันว่าเห็นข่าวหรือยัง"]],
  mist:[["She said me that she was busy.","She told me that she was busy.","มีคนตามหลังใช้ tell"],["He asked where did I live.","He asked where I lived.","คำถามอ้อมเรียงแบบประโยคบอกเล่า"],["She said she will come.","She said she would come.","ถอยเวลา will → would"]]},
 dialogue:{cast:{A:"Mint",B:"Tom"},lines:[
  ["A","Did you see the news this morning?","เห็นข่าวเมื่อเช้าไหม"],
  ["B","No, what happened?","ยังเลย เกิดอะไรขึ้น"],
  ["A","The government announced that the new train line would open next month.","รัฐบาลประกาศว่ารถไฟสายใหม่จะเปิดเดือนหน้า"],
  ["B","Really? Last year they said it would be ready much earlier.","จริงเหรอ ปีที่แล้วเขาบอกว่าจะเสร็จเร็วกว่านี้มาก"],
  ["A","I know. A reporter asked the minister why it had taken so long, and he said there had been problems with the budget.","ใช่ นักข่าวถามรัฐมนตรีว่าทำไมใช้เวลานาน เขาบอกว่ามีปัญหาเรื่องงบประมาณ"],
  ["B","Well, according to my brother, who works for the railway, they are still testing the trains.","แต่พี่ชายฉันที่ทำงานการรถไฟบอกว่ายังทดสอบรถกันอยู่เลย"]],
  q:[mc("What did the government announce?",["A new train line would open next month.","Train tickets would be cheaper.","A station had closed."],0),mc("According to the minister, why was there a delay?",["bad weather","problems with the budget","a shortage of trains"],1)]},
 practice:[
  mc("She ___ me that she was tired.",["said","told","asked"],1,"มีคน (me) ตามหลังใช้ told"),
  mc("\"I will help you.\" → He said he ___ help me.",["will","would","can"],1,"ถอยเวลา will → would"),
  fill("\"I am busy.\" → She said she ___ busy.","was","ถอยเวลา am → was"),
  mc("\"Do you like coffee?\" → He asked me ___ I liked coffee.",["that","if","what"],1,"คำถาม Yes/No ใช้ if หรือ whether"),
  mc("\"Where is the station?\" → She asked where ___.",["is the station","the station was","was the station"],1,"คำถามอ้อมเรียงแบบบอกเล่า"),
  ord("He said that he had lost his wallet","เขาบอกว่าทำกระเป๋าสตางค์หาย")],
 quiz:[fill("\"I have finished.\" → He said he ___ finished.","had"),mc("They ___ that the flight had been cancelled.",["told","said","asked"],1),mc("The officer asked us where ___ from.",["were we","we were","are we"],1)],
 role:{th:"ครูจะชวนคุยเรื่องข่าว ลองเล่าต่อข่าวหรือเรื่องที่ได้ยินมา โดยใช้ said, told และ asked",opener:"Did you hear any interesting news this week? Tell me what happened!",
  shadow:["She said that she would be late.","He told me he had lost his job.","According to the news, prices will rise.","They asked if we were ready."]},
 writing:{th:"เล่าต่อบทสนทนาหรือข่าวที่ได้ยินมา 4–5 ประโยค ใช้ reported speech",model:"Yesterday my manager told me that our team had done a great job this year. She said that the company would give everyone a bonus. My colleague asked whether we could also have an extra day off, and she said she would think about it."}},

{id:"u15",lv:4,en:"Regrets and wishes",th:"ความเสียดายและความปรารถนา",
 vocab:[
  v("regret","เสียใจ เสียดาย","v.","I regret not studying harder.","ฉันเสียดายที่ไม่ได้ตั้งใจเรียนกว่านี้"),
  v("opportunity","โอกาส","n.","This is a great opportunity for you.","นี่เป็นโอกาสที่ดีมากสำหรับคุณ"),
  v("decision","การตัดสินใจ","n.","It was a difficult decision.","มันเป็นการตัดสินใจที่ยาก"),
  v("afford","มีเงินพอจ่าย","v.","I can't afford a new car.","ฉันไม่มีเงินพอซื้อรถใหม่"),
  v("career","อาชีพการงาน","n.","She has had a successful career.","เธอประสบความสำเร็จในหน้าที่การงาน"),
  v("apply","สมัคร","v.","I applied for three jobs last week.","สัปดาห์ที่แล้วฉันสมัครงานไปสามที่"),
  v("lucky","โชคดี","adj.","You're lucky to have such good friends.","คุณโชคดีที่มีเพื่อนดีๆ แบบนี้"),
  v("wish","อยากให้ ปรารถนา","v.","I wish I could speak French.","ฉันอยากพูดภาษาฝรั่งเศสได้")
 ],
 grammar:{title:"Third conditional and wish",
  intro:["<mark>Third conditional</mark> ใช้สมมติสิ่งที่ไม่ได้เกิดขึ้นในอดีต: If + had + V3, would have + V3 เช่น If I had studied harder, I would have passed.",
   "<mark>wish + past simple</mark> ใช้กับสิ่งที่อยากให้ต่างไปจากตอนนี้: I wish I lived near the sea.",
   "<mark>wish + past perfect</mark> ใช้เสียดายสิ่งที่ผ่านไปแล้ว: I wish I had gone to the party."],
  head:["รูปแบบ","ใช้เมื่อ","ตัวอย่าง"],
  rows:[["If + had V3, would have V3","สมมติอดีตที่ไม่ได้เกิด","If I had left earlier, I wouldn't have missed the bus."],["wish + past","อยากให้ตอนนี้ต่างไป","I wish I had more time."],["wish + past perfect","เสียดายเรื่องที่ผ่านไปแล้ว","I wish I had studied harder."]],
  ex:[["If we had booked earlier, we would have got a cheaper ticket.","ถ้าเราจองเร็วกว่านี้ คงได้ตั๋วถูกกว่านี้"],["I wish I could speak Japanese.","ฉันอยากพูดภาษาญี่ปุ่นได้"],["She wishes she hadn't said that.","เธอเสียดายที่พูดแบบนั้นออกไป"]],
  mist:[["If I would have known, ...","If I had known, ...","ห้ามใช้ would ในส่วน if"],["I wish I have a car.","I wish I had a car.","wish ตามด้วยรูปอดีต"],["If I had seen you, I would say hello.","If I had seen you, I would have said hello.","สมมติอดีตต้องใช้ would have + V3"]]},
 dialogue:{cast:{A:"Jane",B:"Ploy"},lines:[
  ["A","You look a bit down. What's wrong?","ดูหงอยๆ นะ เป็นอะไรหรือเปล่า"],
  ["B","I just found out that my friend got the job I wanted. I wish I had applied earlier.","เพิ่งรู้ว่าเพื่อนได้งานที่ฉันอยากได้ เสียดายที่ไม่ได้สมัครให้เร็วกว่านี้"],
  ["A","Why didn't you?","ทำไมไม่สมัครล่ะ"],
  ["B","I wasn't sure I was good enough. If I had sent my application on time, I might have got an interview.","ไม่แน่ใจว่าตัวเองเก่งพอ ถ้าส่งใบสมัครทันเวลา อาจจะได้สัมภาษณ์ก็ได้"],
  ["A","I understand, but there will be other opportunities. Next time, don't wait!","เข้าใจนะ แต่ยังมีโอกาสอื่นอีก คราวหน้าอย่ารอนะ"],
  ["B","You're right. I just wish I were more confident.","จริงค่ะ แค่อยากมั่นใจในตัวเองมากกว่านี้"]],
  q:[mc("What does Ploy regret?",["not applying for a job earlier","leaving her old job","arguing with her friend"],0),mc("Why didn't she apply?",["She was too busy.","She wasn't sure she was good enough.","She didn't see the advertisement."],1)]},
 practice:[
  mc("If I ___ harder, I would have passed the exam.",["studied","had studied","would study"],1,"third conditional: If + had + V3"),
  mc("I wish I ___ more free time.",["have","had","will have"],1,"อยากให้ตอนนี้ต่างไป wish + past"),
  fill("If she had left earlier, she ___ the train. (not miss)","wouldn't have missed|would not have missed","would have + V3 รูปปฏิเสธ"),
  mc("I wish I ___ to the party last night. Everyone says it was great.",["went","had gone","would go"],1,"เสียดายเรื่องที่ผ่านไปแล้ว wish + had V3"),
  mc("If we had known about the traffic, we ___ the train.",["would take","would have taken","had taken"],1),
  ord("I wish I had brought my umbrella","เสียดายจังที่ไม่ได้เอาร่มมา")],
 quiz:[fill("I wish I ___ speak French. (can)","could"),mc("If he had asked me, I ___ him.",["would help","would have helped","had helped"],1),mc("She wishes she ___ so much yesterday.",["didn't eat","hadn't eaten","doesn't eat"],1)],
 role:{th:"คุยกับครูเรื่องสิ่งที่เคยเสียดาย และสิ่งที่อยากให้เป็น ใช้ I wish… และ If I had…",opener:"Everyone has a few regrets. Is there anything you wish you had done differently?",
  shadow:["I wish I had studied English earlier.","If I had known, I would have told you.","I wish I could travel more.","If we had left earlier, we wouldn't have been late."]},
 writing:{th:"เขียนเรื่องที่เสียดาย และสิ่งที่อยากให้เป็น 4–5 ประโยค",model:"When I was at university, I had a chance to study in Australia for a year, but I didn't go because I was afraid. If I had gone, my English would have improved much faster. I wish I had been braver. Now I wish I had more time to travel, so I'm saving money for a trip next year."}},

{id:"u16",lv:4,en:"Solving mysteries",th:"การคาดเดาและสรุปเหตุผล",
 vocab:[
  v("clue","เบาะแส","n.","The police found an important clue.","ตำรวจพบเบาะแสสำคัญ"),
  v("suspect","ผู้ต้องสงสัย","n.","The suspect was seen near the bank.","มีคนเห็นผู้ต้องสงสัยใกล้ธนาคาร"),
  v("mystery","ปริศนา เรื่องลึกลับ","n.","It's still a mystery who sent the letter.","ยังเป็นปริศนาว่าใครส่งจดหมายมา"),
  v("obviously","เห็นได้ชัด","adv.","Obviously, he was not happy.","เห็นได้ชัดว่าเขาไม่พอใจ"),
  v("possibly","อาจจะ เป็นไปได้","adv.","It will possibly rain tomorrow.","พรุ่งนี้ฝนอาจจะตก"),
  v("definitely","แน่นอน","adv.","I'll definitely come to your party.","ฉันไปงานเลี้ยงของคุณแน่นอน"),
  v("explanation","คำอธิบาย","n.","There must be a simple explanation.","ต้องมีคำอธิบายง่ายๆ แน่ๆ"),
  v("footprint","รอยเท้า","n.","There were footprints in the snow.","มีรอยเท้าอยู่บนหิมะ")
 ],
 grammar:{title:"Modals of deduction: must, might, can't",
  intro:["ใช้เดาอย่างมีเหตุผลจากหลักฐานที่เห็น: <mark>must</mark> = มั่นใจเกือบ 100% ว่าใช่, <mark>might / may / could</mark> = อาจจะ, <mark>can't</mark> = มั่นใจว่าไม่ใช่",
   "เดาเรื่องในอดีตใช้ modal + <mark>have + V3</mark>: She must have forgotten. / He can't have seen us.",
   "ระวัง: mustn't แปลว่า \"ห้าม\" ไม่ได้แปลว่า \"คงไม่ใช่\""],

const KEY="eng-class-v1";
function fresh(){return {v:1,updatedAt:0,name:"",xp:0,days:[],placement:{done:false,level:1,score:0},lessons:{},words:{},exams:[],mistakes:[],custom:[],stats:{},settings:{slow:false}}}
function migrate(s){
  const f=fresh(); if(!s||typeof s!=="object") return f;
  return Object.assign(f,s,{placement:Object.assign(f.placement,s.placement||{}),settings:Object.assign(f.settings,s.settings||{}),
    lessons:s.lessons&&typeof s.lessons==="object"?s.lessons:{},words:s.words&&typeof s.words==="object"?s.words:{},days:Array.isArray(s.days)?s.days:[],exams:Array.isArray(s.exams)?s.exams:[]});

const cloud={ref:null,timer:null,writing:false,again:false,on:false};
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cloud.ref){clearTimeout(cloud.timer);cloud.timer=setTimeout(flushCloud,1200)}

async function flushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){cloud.again=true;return}
  cloud.writing=true;
  try{await cloud.ref.set(JSON.parse(JSON.stringify(S)))}
  catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){cloud.ref=null;cloud.on=false}}
  finally{cloud.writing=false;if(cloud.again){cloud.again=false;flushCloud()}}
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    cloud.ref=ref; cloud.on=true;
    if(snap.exists){
      const d=snap.data()||{};
      if((d.updatedAt||0)>(S.updatedAt||0)){
        S=migrate(JSON.parse(JSON.stringify(d)));
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(route.name!=="lesson") render(); else updateChrome();
      } else if((S.updatedAt||0)>(d.updatedAt||0)) flushCloud();

  }catch(e){}
}

function rec(id){return S.lessons[id]||(S.lessons[id]={reached:0,done:false,best:0,stars:0})}
function isDone(i){const r=S.lessons[COURSE[i].id];return !!(r&&r.done)}
function firstOfLevel(lv){return COURSE.findIndex(u=>u.lv===lv)}
function unlocked(i){return i===0||isDone(i-1)||(S.placement.done&&i<=firstOfLevel(S.placement.level))}
function nextIdx(){for(let i=0;i<COURSE.length;i++) if(unlocked(i)&&!isDone(i)) return i; return COURSE.length-1}
function markDay(){const k=dayKey(); if(!S.days.includes(k)){S.days.push(k); if(S.days.length>400) S.days=S.days.slice(-400)}}
function streak(){
  const set=new Set(S.days); let d=new Date(); if(!set.has(dayKey(d))) d=new Date(Date.now()-DAY);
  let n=0; while(set.has(dayKey(d))){n++; d=new Date(d.getTime()-DAY)} return n;
}

const Speech={
  ok:!!NB||"speechSynthesis" in window, voices:[],
  init(){if(NB||!this.ok) return; const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang))}catch(e){}}; load(); try{speechSynthesis.addEventListener("voiceschanged",load)}catch(e){}},
  pick(i){const pref=this.voices.filter(x=>/en[-_](US|GB)/i.test(x.lang)); const l=pref.length?pref:this.voices; return l.length?l[i%l.length]:null},
  stop(){if(NB){NB.stopSpeak();return} if(this.ok) try{speechSynthesis.cancel()}catch(e){}},
  say(text,o){
    o=o||{};
    if(NB) return NB.speak(text,{rate:o.slow||S.settings.slow?0.7:0.95,pitch:o.pitch||1}).catch(()=>{});
    return new Promise(res=>{
      if(!this.ok){toast("เบราว์เซอร์นี้ยังอ่านออกเสียงไม่ได้");return res()}
      try{
        const u=new SpeechSynthesisUtterance(text); u.lang="en-US";
        const vc=this.pick(o.voice||0); if(vc) u.voice=vc;
        u.rate=o.slow||S.settings.slow?0.72:0.95; u.pitch=o.pitch||1;
        let done=false; const fin=()=>{if(!done){done=true;res()}};
        u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(2500,text.length*140));
        speechSynthesis.speak(u);
      }catch(e){res()}
    });
  }
};

const CHATS={};
function mountChat(el){
  const key=el.dataset.chat; const cfg=chatCfg(key);

    el.appendChild(d); return;
  }
  const box=document.createElement("div"); box.className="chat";
  const log=document.createElement("div"); log.className="chat-log"; log.setAttribute("aria-live","polite");
  const note=document.createElement("div"); note.className="chat-note"; note.hidden=!st.note; note.textContent=st.note;
  const form=document.createElement("form"); form.className="chat-form";
  form.innerHTML='<label class="sr" for="in-'+esc(key)+'">ข้อความถึงครู</label><textarea id="in-'+esc(key)+'" rows="1" placeholder="'+esc(cfg.placeholder)+'"></textarea><button class="btn btn-primary" type="submit">ส่ง</button>';
  box.append(log,note,form); el.appendChild(box);
  const ta=form.querySelector("textarea"), btn=form.querySelector("button");
  ta.value=st.draft;
  const bubble=(role,text,live)=>{
    const m=document.createElement("div"); m.className="msg "+(role==="user"?"u":"t");
    if(role!=="user"){
      const who=document.createElement("div"); who.className="who"; who.innerHTML="<span>Teacher Jane</span>"; m.appendChild(who);
    }
    const body=document.createElement("div"); m.appendChild(body);
    fillBubble(m,body,role,text,cfg.speak&&!live);
    log.appendChild(m); return {m,body};
  };
  bubble("assistant",cfg.opener);
  st.turns.forEach(t=>bubble(t.role,t.content));
  if(st.busy){const b=bubble("assistant","กำลังคิด…",true);b.m.classList.add("thinking");st.liveEl=b}
  log.scrollTop=log.scrollHeight;
  const setBusy=b=>{st.busy=b;btn.textContent=b?"หยุด":"ส่ง";btn.type=b?"button":"submit"};
  setBusy(st.busy);
  btn.addEventListener("click",e=>{if(st.busy){e.preventDefault();st.ctl&&st.ctl.abort()}});
  ta.addEventListener("input",()=>{st.draft=ta.value;ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,140)+"px"});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}});
  el._fill=t=>{ta.value=t;st.draft=t;ta.focus()};
  form.addEventListener("submit",async e=>{
    e.preventDefault(); if(st.busy) return;
    const text=ta.value.trim(); if(!text) return;
    ta.value=""; st.draft=""; st.note=""; note.hidden=true;
    st.turns.push({role:"user",content:text}); bubble("user",text);
    const live=bubble("assistant","กำลังคิด…",true); live.m.classList.add("thinking");
    log.scrollTop=log.scrollHeight;
    const ctl=new AbortController(); st.ctl=ctl; setBusy(true);
    const turns=[{role:"user",content:cfg.rules},{role:"assistant",content:cfg.opener}].concat(st.turns.slice(-16));
    if(turns[2]&&turns[2].role==="assistant") turns.splice(2,1);
    try{
      const r=await AI.fn(turns,{cache:false,signal:ctl.signal,modelTier:"default",onText:({text})=>{live.m.classList.remove("thinking");fillBubble(live.m,live.body,"assistant",text,false);log.scrollTop=log.scrollHeight}});
      st.turns.push({role:"assistant",content:r.text});
      fillBubble(live.m,live.body,"assistant",r.text,cfg.speak);
      markDay(); bump("prac"); S.xp+=2; save(); updateChrome();
    }catch(err){
      live.m.classList.remove("thinking");
      if(err&&err.text){st.turns.push({role:"assistant",content:err.text});fillBubble(live.m,live.body,"assistant",err.text,false)} else live.m.remove();
      if(!err||err.code!=="cancelled"){st.note=aiError(err);note.textContent=st.note;note.hidden=false}
    }finally{
      setBusy(false);st.ctl=null;log.scrollTop=log.scrollHeight;
      if(!log.isConnected&&document.querySelector('[data-chat="'+key+'"]')) render();
    }
  });
}
function fillBubble(m,body,role,text,withSay){
  body.textContent="";
  if(role==="user"){body.textContent=text;return}
  const i=text.search(/\n\s*-{3,}\s*\n?/);
  const main=i>=0?text.slice(0,i).trim():text;
  const fb=i>=0?text.slice(i).replace(/^\s*-{3,}\s*/,"").trim():"";
  const p=document.createElement("span"); p.textContent=main; body.appendChild(p);
  if(fb){const f=document.createElement("span"); f.className="fb"; f.textContent=fb; body.appendChild(f)}
  const who=m.querySelector(".who");
  if(who){const old=who.querySelector(".say"); if(old) old.remove();
    if(withSay&&main&&/[a-z]/i.test(main)){who.insertAdjacentHTML("beforeend",sayBtn(main,"ฟังครูพูด"))}}
}

/* ---------- pronunciation practice (native app only) ---------- */
const PR={}; let prActive=null;
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","there's":"there is","where's":"where is","here's":"here is","i'll":"i will","you'll":"you will","we'll":"we will","i've":"i have","you've":"you have","we've":"we have","i'd":"i would","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","haven't":"have not","hasn't":"has not","can't":"cannot","won't":"will not","shouldn't":"should not","let's":"let us"};
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function pronWords(s){
  const out=[];
  String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g," ").replace(/[^a-z0-9' ]/g," ").split(/\s+/).forEach(w=>{
    w=w.replace(/^'+|'+$/g,""); if(!w) return;
    if(CONTR[w]) return out.push.apply(out,CONTR[w].split(" "));
    if(/^\d+$/.test(w)){
      if(w.length>2||w[0]==="0") w.split("").forEach(d=>out.push(d==="0"?"oh":ONES[+d]));
      else {const n=+w; if(n<20) out.push(ONES[n]); else {out.push(TENS[Math.floor(n/10)]); if(n%10) out.push(ONES[n%10])}}
      return;
    }
    if(w==="zero"||w==="o") return out.push("oh");
    out.push(w.replace(/'s$/,""));
  });
  return out;
}
function align(t,h){
  const n=t.length,m=h.length,d=[];
  for(let i=0;i<=n;i++) d.push(new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) d[i][j]=t[i]===h[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){if(t[i]===h[j]){ok[i]=true;i++;j++} else if(d[i+1][j]>=d[i][j+1]) i++; else j++}
  return ok;
}
function gradePron(text,heard){
  const toks=text.split(/\s+/).filter(Boolean), groups=toks.map(pronWords), flat=[].concat.apply([],groups);
  const ok=align(flat,pronWords(heard)); let k=0;
  const tokens=toks.map((w,i)=>{const n=groups[i].length, good=ok.slice(k,k+n).every(Boolean); k+=n; return {w,ok:good}});
  const score=flat.length?Math.round(ok.filter(Boolean).length/flat.length*100):0;
  return {state:"done",heard,score,tokens};
}
function micBtn(text){
  if(!NB) return "";
  const on=prActive===text;
  return '<button class="mic'+(on?" on":"")+'" data-act="pron" data-text="'+esc(text)+'" aria-label="'+(on?"หยุดฟัง":"พูดประโยคนี้ให้แอปฟัง")+'" aria-pressed="'+on+'">'+ICON.mic+'</button>';
}
function pronResult(text){
  const r=PR[text]; if(!NB||!r) return "";
  if(r.state==="listening") return '<div class="pron live" role="status"><span class="muted">กำลังฟัง… พูดได้เลย แตะไมค์อีกครั้งเมื่อพูดจบ</span><p class="heard" lang="en">'+esc(r.heard||"")+'</p></div>';
  if(r.state==="error") return '<div class="pron" role="status"><span class="pen">'+esc(r.msg)+'</span></div>';
  const msg=!r.heard?"ไม่ได้ยินเสียง ลองพูดใกล้ไมค์ขึ้นอีกนิด":r.score>=90?"ชัดเจนมาก!":r.score>=70?"ดีแล้ว ลองเน้นคำสีแดงอีกนิด":"ฟังต้นฉบับอีกครั้ง แล้วพูดช้าๆ ชัดๆ";
  return '<div class="pron" role="status"><p class="pron-words" lang="en">'+r.tokens.map(t=>'<span class="'+(t.ok?"ok":"miss")+'">'+esc(t.w)+'</span>').join(" ")+'</p>'
    +'<p><b>'+r.score+'%</b> <span class="pen">'+esc(msg)+'</span></p>'
    +'<p class="muted" style="font-size:14px">แอปได้ยินว่า: <span lang="en">'+esc(r.heard||"–")+'</span></p></div>';
}
async function pronounce(text){
  if(!NB) return;
  if(prActive){const same=prActive===text; await NB.stopListening(); if(same) return}
  Speech.stop();
  let ok=false;
  try{ok=(await NB.sttAvailable())&&(await NB.sttPermission())}catch(e){}
  if(!ok){PR[text]={state:"error",msg:"ใช้ไมโครโฟนไม่ได้ เปิดสิทธิ์ไมโครโฟนและการรู้จำเสียงพูดให้แอปนี้ในการตั้งค่าของเครื่อง"};render();return}
  const target=pronWords(text);
  prActive=text; PR[text]={state:"listening",heard:""}; render();
  let heard="";
  try{
    heard=await NB.listen({maxMs:4000+target.length*600,hints:[text],
      onPartial:t=>{const r=PR[text]; if(r&&r.state==="listening"){r.heard=t; const el=document.querySelector(".pron.live .heard"); if(el) el.textContent=t}},
      done:t=>align(target,pronWords(t)).every(Boolean)});
  }catch(e){if(prActive===text) prActive=null;PR[text]={state:"error",msg:"ฟังเสียงไม่สำเร็จ ลองกดไมค์อีกครั้ง"};render();return}
  if(prActive===text) prActive=null;
  PR[text]=gradePron(text,heard);
  if(PR[text].score>=70){S.xp+=2;S.pron=(S.pron||0)+1;markDay();save()}
  render();
}

async function otaCheck(manual){

async function initNative(){
  if(!NB) return;
  if(NB.bootOk) NB.bootOk();
  setTimeout(()=>otaCheck(false),2500);
  NB.onBack(()=>{
    if(route.name==="home") NB.exit();

      }
    } else if(S.updatedAt) NB.save(JSON.stringify(S)).catch(()=>{});
  }catch(e){}
}

   passage:{title:"Vertical Farming: Growing Food in the City",paras:[
    ["A","For most of history, farms have spread outwards across the land. Vertical farming turns this idea on its side: crops are grown in stacked layers inside buildings, often in the middle of cities. Instead of soil, many vertical farms use hydroponics, a method in which plant roots sit in water that contains carefully measured nutrients. Light comes not from the sun but from LED lamps that can be tuned to the colours plants use most efficiently."],
    ["B","Supporters argue that the approach solves several problems at once. Because the environment is fully controlled, crops can be harvested all year round, regardless of droughts, floods or cold winters. Pests are far less common indoors, so growers rarely need chemical pesticides. Water use is also dramatically lower than in open fields, since the water that plants do not absorb is collected and recycled rather than draining away into the ground."],
    ["C","Location is another advantage. A vertical farm built close to a city's supermarkets can deliver lettuce that was picked the same morning. Shorter journeys mean fresher food, and they also reduce the fuel burned by lorries carrying produce over long distances. Some farms have been set up in unusual places, such as disused warehouses, old factories and even underground tunnels."],
    ["D","However, the technology has clear limits. The most serious is energy. Replacing sunlight with electric lighting is expensive, and in places where electricity comes mainly from coal or gas, the environmental benefit of saving water and transport may be cancelled out. For this reason, most vertical farms concentrate on leafy greens and herbs, which grow quickly, are light, and sell at a high price. Staple crops such as wheat and rice take too long to grow and are worth too little to make indoor production economic."],
    ["E","The business side has also proved difficult. Several well-funded companies expanded rapidly, only to close when energy prices rose and investors lost patience. Critics say that the industry promised too much, too early. Supporters reply that every new agricultural technology has gone through similar difficulties, and that falling prices for LEDs and renewable electricity will gradually improve the economics."],
    ["F","What seems likely is that vertical farming will complement, rather than replace, traditional agriculture. For crops that travel badly and spoil quickly, growing them indoors near the people who eat them makes sense. For the grain that feeds most of the world, fields under the open sky will remain essential for the foreseeable future."]]},

 {kind:"passage",title:"Reading Passage 2",
  dir:"You should spend about 20 minutes on Questions 14–26, which are based on Reading Passage 2 below.",
  dirTh:"บทความที่ 2 มีคำถามแบบเลือกหัวข้อย่อหน้า (Matching Headings) และเติมสรุป",
  passage:{title:"Why Teenagers Sleep Late",paras:[
   ["A","Parents around the world complain that teenagers stay up late at night and are almost impossible to wake in the morning. For many years this behaviour was blamed on laziness or on too much time spent with screens. Research over the last three decades, however, suggests that the explanation is largely biological."],
   ["B","Every person has an internal body clock, known as the circadian rhythm, which controls when we feel alert and when we feel sleepy. One of its most important signals is melatonin, a hormone released by the brain as evening approaches. In adults and young children, melatonin levels rise at around nine or ten o'clock at night. In adolescents, the release of melatonin is delayed by up to two hours, which means that teenagers genuinely do not feel tired until much later."],
   ["C","This shift would not matter if teenagers could simply sleep later in the morning. Sleep scientists recommend that people aged thirteen to eighteen get between eight and ten hours of sleep a night. Yet in many countries, secondary school begins before eight o'clock, and students must get up by six or half past six. As a result, surveys regularly find that most teenagers sleep fewer than seven hours on school nights."],
   ["D","The effects of this shortage are wide-ranging. Tired students find it harder to concentrate and remember new information, and their marks tend to suffer. Lack of sleep has also been linked to low mood, weaker immune systems and a higher risk of road accidents among young drivers. Some researchers argue that chronic sleep loss is one of the most widespread and least recognised health problems among young people."],
   ["E","In response, some school districts have experimented with later start times. When schools in one American city moved the start of the day from 7.50 to 8.45, students slept on average 34 minutes longer each night. Attendance improved, fewer students fell asleep in class, and exam results rose modestly. Similar trials in the United Kingdom and Brazil produced comparable findings."],
   ["F","Changing school timetables is not always easy, however. Later starts can mean later finishing times, which affect after-school sports and part-time jobs, and bus schedules may need to be redesigned. Parents who work early shifts may also find it difficult to arrange transport. Despite these obstacles, a growing number of education authorities now believe that the benefits outweigh the costs."]]},

  passage:{title:"Will Robots Take Our Jobs?",paras:[
   ["A","Few topics generate as much anxiety as the idea that machines will soon do our jobs. Newspaper headlines regularly warn that millions of positions will vanish as artificial intelligence and robots become more capable. Such fears are understandable, but in my view they rest on a misunderstanding of how technology has changed work in the past."],
   ["B","The history of the last two centuries shows a clear pattern. When the first mechanical looms appeared in English textile mills, weavers protested that they would all be unemployed. Some did lose their livelihoods, and the transition was painful for individual families. Yet over the following decades, cheaper cloth increased demand, and far more people ended up working in the textile industry than before. Similar stories can be told about the tractor, the telephone switchboard and the personal computer."],
   ["C","The reason is that technology rarely replaces an entire job; instead, it takes over particular tasks. Bank cash machines, for example, did not eliminate bank tellers. Because each branch needed fewer tellers, banks opened more branches, and tellers moved away from counting money towards advising customers. The number of tellers in the United States actually rose for several decades after cash machines were introduced."],
   ["D","Nevertheless, it would be foolish to assume that the future will simply repeat the past. Today's artificial intelligence can perform tasks that were once thought to require human judgement, such as translating documents, writing computer code and analysing medical scans. The speed of change is also greater: earlier technologies spread over generations, whereas new software can be adopted by millions of businesses within a few years."],
   ["E","For this reason, I believe governments should focus less on predicting which jobs will disappear and more on helping workers adapt. Adult education is the most important tool. Too many training programmes are designed for young people at the start of their careers, while workers in their forties and fifties receive little support. Short, flexible courses, partly funded by employers, would allow people to learn new skills without giving up their income."],
   ["F","Individuals, too, can prepare. The skills that machines find hardest to copy are those involving creativity, complex communication and care for other people. Nurses, teachers and skilled tradespeople are unlikely to be replaced soon. Rather than fearing technology, workers should look for ways to use it to become more productive in their current roles."]]},

  passage:{title:"The Return of the Night Train",paras:[
   ["A","For much of the twentieth century, overnight trains were a normal way to travel across Europe. Passengers could board in Paris in the evening and wake up in Vienna or Rome the next morning. By the early 2000s, however, many of these services had disappeared. Low-cost airlines offered cheaper and faster journeys, and railway companies found sleeper trains expensive to operate, since each carriage carries far fewer passengers than an ordinary one."],
   ["B","In the last decade, the trend has reversed. Austria's national railway began taking over routes that other companies had abandoned, and new private operators have launched services between cities such as Amsterdam, Berlin and Prague. Several governments have supported these services with subsidies, arguing that they reduce carbon emissions."],
   ["C","The environmental case is strong. According to one estimate, a journey by night train produces less than a tenth of the carbon dioxide of the same trip by plane. For travellers who are worried about climate change, this is a powerful reason to choose the train, even if the journey takes longer."],
   ["D","Convenience also plays a part. Although a flight may take only two hours, passengers must travel to an airport outside the city, arrive well before departure and pass through security checks. A night train, by contrast, leaves from the city centre and arrives in the city centre, and the time on board is spent sleeping rather than waiting. Many business travellers also value saving the cost of a hotel room."],

 writing:{title:"Writing",th:"การเขียน",time:60*60,est:"60 นาที",kind:"writing",

   {n:1,min:150,mins:20,prompt:"The graph below shows the average number of hours per week that people in one country spent on three leisure activities between 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
    chart:{type:"line",title:"Average hours per week spent on leisure activities",unit:"hours",max:20,step:5,years:["2000","2005","2010","2015","2020"],series:[{name:"Watching TV",v:[15,14,12,10,8]},{name:"Using the internet",v:[2,5,9,13,17]},{name:"Reading",v:[5,4.5,4,3.5,3]}]},
    model:"The line graph illustrates how many hours per week people in one country spent watching television, using the internet and reading between 2000 and 2020.\n\nOverall, watching television and reading both became less popular over the period, while internet use rose dramatically and overtook television to become the most time-consuming activity.\n\nIn 2000, people spent 15 hours a week watching TV, far more than the time spent reading (5 hours) or online (just 2 hours). Over the next two decades, television viewing fell steadily, dropping to 10 hours in 2015 and 8 hours by 2020.\n\nBy contrast, internet use grew rapidly, reaching 9 hours in 2010. The two lines crossed shortly after 2010, and by the end of the period people were spending 17 hours a week online, more than double the figure for television. Reading showed a slow but continuous decline, falling from 5 hours to only 3 hours in 2020."},
   {n:2,min:250,mins:40,prompt:"In many countries, children now spend more time using electronic devices than playing outdoors. What are the causes of this? What can be done to encourage children to spend more time outside?",
    model:"It is increasingly common for children to spend their free time looking at screens rather than playing outside. In my view, this trend has several causes, but there are also practical steps that parents, schools and governments can take to reverse it.\n\nThe most obvious cause is the attraction of the devices themselves. Games and video apps are designed to be highly engaging, with constant rewards that make it difficult for children to stop. Another reason is that many parents are busy and find that a tablet keeps their children quiet and safe at home. In addition, cities have become more crowded, and in many neighbourhoods there are few parks or safe places where children can play without supervision. Parents who worry about traffic or strangers may therefore prefer to keep their children indoors.\n\nThere are, however, several ways to encourage outdoor activity. Firstly, parents can set clear limits on screen time and act as role models by going outside with their children, for example by cycling or visiting parks at weekends. Secondly, schools can include more outdoor lessons and sports in the timetable, and organise clubs such as gardening or hiking. Finally, local governments should invest in safe, attractive public spaces. When a neighbourhood has a well-maintained playground close to home, children are far more likely to use it.\n\nIn conclusion, children spend so much time on devices because the technology is appealing, parents are busy and safe outdoor spaces are limited. By combining sensible family rules, active schools and better public facilities, society can help children enjoy the benefits of playing outside."}]},

function normAns(s){return String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[£$,]/g,"").replace(/:/g,".").replace(/\.$/,"").replace(/\s+/g," ").trim().replace(/^(a|an|the) /,"")}
function isRight(q,v){

}

function gradeExam(){
  stopAudio();
  const sec=X.sec; let c=0;
  const parts=sec.parts.map(p=>{let pc=0; p.qs.forEach(q=>{if(isRight(q,X.ans[q.key])){c++;pc++}}); return {title:p.title,c:pc,t:p.qs.length}});
  X.submitted=true; X.confirm=false; X.endAt=Date.now();
  const rec={id:sec.base,set:sec.set,c,t:sec.total,mode:X.mode};
  if(sec.exam==="toeic") rec.score=toeicScaled(c,sec.total); else rec.band=ieltsBand(sec.key,c,sec.total);
  X.result=Object.assign({parts},rec);
  sec.parts.forEach(p=>p.qs.forEach(q=>{if(!isRight(q,X.ans[q.key])){const it=examMistake(sec,p,q); if(it) addMistake(EXAM_NAMES[sec.base]+" ชุด "+sec.set,it)}}));
  S.xp+=c*2; examRecord(rec);
  render(); window.scrollTo(0,0);
}

/* audio */
async function playScript(k){
  const lines=AUD[k]; if(!lines||!X) return;
  Speech.stop(); const tok=++xTok;
  X.playing=k; X.plays[k]=(X.plays[k]||0)+1; refreshPlay();
  for(const l of lines){
    const bits=String(l[1]).split(/(?<!\b(?:Mr|Ms|Mrs|Dr))(?<=[.!?])\s+(?=[A-Z"])/);
    for(const b of bits){ if(tok!==xTok) return; await Speech.say(b,{voice:VOICE[l[0]][0],pitch:VOICE[l[0]][1]}); }
    if(tok!==xTok) return;
    await new Promise(r=>setTimeout(r,400));
  }
  if(tok===xTok&&X){X.playing=null; refreshPlay()}
}
function stopAudio(){xTok++; Speech.stop(); if(X&&X.playing){X.playing=null; refreshPlay()}}

function lineSVG(ch){
  const W=660,H=320,pl=40,pr=190,pt=20,pb=38,iw=W-pl-pr,ih=H-pt-pb,cols=["var(--s1)","var(--s2)","var(--s3)"];
  const X=i=>pl+i*iw/(ch.years.length-1), Y=v=>pt+ih-v/ch.max*ih;
  let g="";
  for(let v=0;v<=ch.max;v+=ch.step){g+='<line x1="'+pl+'" x2="'+(pl+iw)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="grid"/><text x="'+(pl-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="tick">'+v+'</text>'}
  ch.years.forEach((yr,i)=>{g+='<text x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle" class="tick">'+yr+'</text>'});
  g+='<line x1="'+pl+'" x2="'+(pl+iw)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" class="base"/>';
  ch.series.forEach((s,si)=>{
    g+='<polyline fill="none" stroke="'+cols[si]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+s.v.map((v,i)=>X(i)+","+Y(v)).join(" ")+'"/>';
    s.v.forEach((v,i)=>{g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4.5" fill="'+cols[si]+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(s.name)+', '+ch.years[i]+': '+v+' '+ch.unit+'</title></circle>'});
    const last=s.v[s.v.length-1];
    g+='<text x="'+(pl+iw+10)+'" y="'+(Y(last)+4)+'" class="val">'+esc(s.name)+' · '+last+'</text>';
  });
  const summary=ch.series.map(s=>s.name+" "+s.v.join(", ")).join("; ");
  return '<figure class="xchart"><figcaption><b lang="en">'+esc(ch.title)+'</b><span class="legend">'+ch.series.map((s,i)=>'<span lang="en"><i style="background:'+cols[i]+'"></i>'+esc(s.name)+'</span>').join("")+'</span></figcaption>'
   +'<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.title+" ("+ch.unit+") for "+ch.years.join(", ")+": "+summary)+'"><text x="'+pl+'" y="12" class="tick">'+esc(ch.unit)+'</text>'+g+'</svg></div></figure>';
}
function chartSVG(ch){
  const W=640,H=320,pl=46,pr=14,pt=26,pb=38,max=70,iw=W-pl-pr,ih=H-pt-pb,bw=36,gap=2;
  const cols=["var(--s1)","var(--s2)","var(--s3)"], gw=iw/ch.years.length;
  const bar=(x,y,w,h,r)=>{r=Math.min(r,h,w/2); return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'};
  let g="";
  for(let v=0;v<=max;v+=10){const y=pt+ih-v/max*ih; g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" class="tick">'+v+'%</text>'}
  ch.years.forEach((yr,yi)=>{
    const cx=pl+gw*yi+gw/2, tot=ch.series.length*bw+(ch.series.length-1)*gap, x0=cx-tot/2;
    ch.series.forEach((s,si)=>{const v=s.v[yi],h=v/max*ih,x=x0+si*(bw+gap),y=pt+ih-h;
      g+='<path d="'+bar(x,y,bw,h,4)+'" fill="'+cols[si]+'"><title>'+esc(s.name)+', '+yr+': '+v+'%</title></path><text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" class="val">'+v+'</text>'});
    g+='<text x="'+cx+'" y="'+(H-14)+'" text-anchor="middle" class="tick">'+yr+'</text>';
  });
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'" class="base"/>';
  const summary=ch.series.map(s=>s.name+" "+s.v.join("%, ")+"%").join("; ");
  return '<figure class="xchart"><figcaption><b lang="en">'+esc(ch.title)+'</b><span class="legend">'+ch.series.map((s,i)=>'<span lang="en"><i style="background:'+cols[i]+'"></i>'+esc(s.name)+'</span>').join("")+'</span></figcaption>'
   +'<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.title+" for "+ch.years.join(", ")+": "+summary)+'">'+g+'</svg></div></figure>';
}
function cleanGrade(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.criteria)) return null;
  const b=v=>Math.max(0,Math.min(9,halfBand(Number(v)||0)));
  return {overall:b(d.overall),criteria:d.criteria.slice(0,4).map(c=>({name:String(c.name||""),band:b(c.band),comment:String(c.comment||"")})),
    corrections:Array.isArray(d.corrections)?d.corrections.slice(0,6).map(c=>({wrong:String(c.wrong||""),right:String(c.right||""),why:String(c.why||"")})):[],
    improved:String(d.improved||""),better:Array.isArray(d.better)?d.better.slice(0,3).map(x=>({question:String(x.question||""),answer:String(x.answer||"")})):[],
    tips:Array.isArray(d.tips)?d.tips.slice(0,3).map(String):[]};
}

async function gradeWriting(n){
  const sec=X.sec, t=sec.tasks[n-1], key=sec.id+"-w"+n, text=(XD[key]||"").trim();
  if(wordCount(text)<40){toast("เขียนอย่างน้อย 40 คำก่อนส่งให้ครูประเมิน");return}
  XR[key]={busy:true}; render();
  const data=taskData(t);
  const prompt="You are an experienced IELTS Writing examiner. Assess this IELTS Academic Writing Task "+n+" response against the public IELTS Writing band descriptors. Be realistic and strict; do not inflate scores. Responses under "+t.min+" words must be penalised.\n\nTask: "+t.prompt+data+"\n\nWord count: "+wordCount(text)
   +"\n\nCandidate response:\n\"\"\"\n"+text.slice(0,6000)+"\n\"\"\"\n\nReply with only a JSON object in this shape:\n{\"overall\": 6.5, \"criteria\": [{\"name\": \""+(n===1?"Task Achievement":"Task Response")+"\", \"band\": 6, \"comment\": \"1-2 sentences in Thai\"}, {\"name\": \"Coherence and Cohesion\", \"band\": 6.5, \"comment\": \"...\"}, {\"name\": \"Lexical Resource\", \"band\": 6.5, \"comment\": \"...\"}, {\"name\": \"Grammatical Range and Accuracy\", \"band\": 6, \"comment\": \"...\"}], \"corrections\": [{\"wrong\": \"exact phrase from the response\", \"right\": \"corrected phrase\", \"why\": \"short reason in Thai\"}], \"improved\": \"the weakest paragraph of the response rewritten at band 7-8 level\", \"tips\": [\"up to 3 short tips in Thai\"]}\nBands go from 0 to 9 in steps of 0.5; overall is the average of the four criteria. Give the 3-6 most important corrections.";
  try{
    const d=cleanGrade(await AI.fn.json(prompt,{modelTier:"default"}));
    if(!d) throw {code:"invalid_json"};
    XR[key]={data:d}; examRecord({id:"ielts-writing",set:sec.set,task:n,band:d.overall,mode:"ai"}); S.xp+=10;
  }catch(e){XR[key]={err:e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}}
  if(route.name==="examrun") render();
}

async function gradeSpeaking(){
  const sec=X.sec, sid=sec.id+"-", lines=[]; let words=0;
  sec.sp.forEach(p=>{
    if(p.card){const a=(XD[sid+"s2"]||"").trim(); words+=wordCount(a); lines.push("PART 2 cue card: "+p.card.topic+" (You should say: "+p.card.points.join("; ")+"; "+p.card.end+")\nCandidate: "+(a||"(no answer)"))}
    else p.qs.forEach((q,i)=>{const a=(XD[sid+"s"+p.part+"-"+i]||"").trim(); words+=wordCount(a); lines.push("PART "+p.part+" Examiner: "+q+"\nCandidate: "+(a||"(no answer)"))});
  });
  if(words<40){toast("ตอบให้ได้อย่างน้อย 40 คำก่อนส่งให้ครูประเมิน");return}
  XR[sid+"speak"]={busy:true}; render();
  const prompt="You are an experienced IELTS Speaking examiner. The candidate could not use a microphone, so they spoke each answer aloud and then typed what they said. Assess three criteria from the public IELTS Speaking band descriptors: Fluency and Coherence (judge length, development and linking of answers), Lexical Resource, and Grammatical Range and Accuracy. Pronunciation cannot be assessed, so leave it out. Be realistic: short or undeveloped answers score low.\n\n"+lines.join("\n\n").slice(0,8000)
   +"\n\nReply with only a JSON object in this shape:\n{\"overall\": 6, \"criteria\": [{\"name\": \"Fluency and Coherence\", \"band\": 6, \"comment\": \"1-2 sentences in Thai\"}, {\"name\": \"Lexical Resource\", \"band\": 6, \"comment\": \"...\"}, {\"name\": \"Grammatical Range and Accuracy\", \"band\": 5.5, \"comment\": \"...\"}], \"corrections\": [{\"wrong\": \"exact phrase the candidate used\", \"right\": \"corrected phrase\", \"why\": \"short reason in Thai\"}], \"better\": [{\"question\": \"the examiner question\", \"answer\": \"a natural band 7-8 spoken answer, 2-4 sentences\"}], \"tips\": [\"up to 3 short tips in Thai\"]}\nBands go from 0 to 9 in steps of 0.5; overall is the average of the three criteria. Give up to 5 corrections and better answers for the 2 weakest responses.";
  try{
    const d=cleanGrade(await AI.fn.json(prompt,{modelTier:"default"}));
    if(!d) throw {code:"invalid_json"};
    XR[sid+"speak"]={data:d}; examRecord({id:"ielts-speaking",set:sec.set,band:d.overall,mode:"ai"}); S.xp+=10;
  }catch(e){XR[sid+"speak"]={err:e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}}
  if(route.name==="examrun") render();
}

/* actions */
function newAttempt(sec){return {sec,started:false,mode:"practice",ans:{},plays:{},playing:null,submitted:false,confirm:false,show:{}}}
const XACT={
  xopen:t=>go("examrun",t.dataset.id),
  xset:t=>{HUBSET[t.dataset.e]=+t.dataset.n; try{localStorage.setItem("exam-hubset",JSON.stringify(HUBSET))}catch(e){} render()},
  xstart:t=>{X.started=true; X.mode=t.dataset.mode; X.startAt=Date.now(); render(); window.scrollTo(0,0)},
  xa:t=>{
    if(!X||X.submitted) return;
    X.ans[t.dataset.k]=t.dataset.v;
    t.parentNode.querySelectorAll(".xo").forEach(b=>b.setAttribute("aria-pressed",b===t?"true":"false"));
    const c=$("#xcount"); if(c) c.textContent=answeredCount();
    if(X.confirm){const s=$("#xsubmit"); if(s) s.outerHTML=submitArea()}
  },
  xplay:t=>{
    const k=t.dataset.k;
    if(X.playing===k){stopAudio();return}
    if(X.mode==="exam"&&!X.submitted&&(X.plays[k]||0)>=1){toast("โหมดสอบจริงฟังได้ครั้งเดียว");return}
    playScript(k);
  },
  xsubmit:()=>{
    if(!X||X.submitted) return;
    if(X.sec.total-answeredCount()>0&&!X.confirm){X.confirm=true; const s=$("#xsubmit"); if(s) s.outerHTML=submitArea(); return}
    gradeExam();
  },
  xcancel:()=>{X.confirm=false; const s=$("#xsubmit"); if(s) s.outerHTML=submitArea()},
  xretry:()=>{stopAudio(); const sec=X.sec; X=XS[sec.id]=newAttempt(sec); render(); window.scrollTo(0,0)},
  xmodel:t=>{X.show[t.dataset.k]=!X.show[t.dataset.k]; render()},
  "xgrade-w":t=>gradeWriting(+t.dataset.n),
  "xgrade-s":()=>gradeSpeaking(),
  xprep:()=>{X.prepAt=Date.now(); X.prepDone=false; const pe=$("#xprep"); if(pe) pe.textContent="เวลาเตรียมตัวเหลือ 1:00"}
};
