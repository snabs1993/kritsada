  v("suspect","ผู้ต้องสงสัย","n.","The suspect was seen near the bank.","มีคนเห็นผู้ต้องสงสัยใกล้ธนาคาร"),
  v("mystery","ปริศนา เรื่องลึกลับ","n.","It's still a mystery who sent the letter.","ยังเป็นปริศนาว่าใครส่งจดหมายมา"),
  v("obviously","เห็นได้ชัด","adv.","Obviously, he was not happy.","เห็นได้ชัดว่าเขาไม่พอใจ"),
  v("possibly","อาจจะ เป็นไปได้","adv.","It could possibly rain tomorrow.","พรุ่งนี้ฝนอาจจะตก"),
  v("definitely","แน่นอน","adv.","I'll definitely come to your party.","ฉันไปงานเลี้ยงของคุณแน่นอน"),
  v("explanation","คำอธิบาย","n.","There must be a simple explanation.","ต้องมีคำอธิบายง่ายๆ แน่ๆ"),
  v("footprint","รอยเท้า","n.","There were footprints in the snow.","มีรอยเท้าอยู่บนหิมะ")
 ],
 grammar:{title:"Modals of deduction: must, might, can't",
  intro:["ใช้เดาอย่างมีเหตุผลจากหลักฐานที่เห็น: <mark>must</mark> = มั่นใจเกือบ 100% ว่าใช่, <mark>might / may / could</mark> = อาจจะ, <mark>can't</mark> = มั่นใจว่าไม่ใช่",
   "เดาเรื่องในอดีตใช้ modal + <mark>have + V3</mark>: She must have forgotten. / He can't have seen us.",
   "ระวัง: mustn't แปลว่า \"ห้าม\" ไม่ได้แปลว่า \"คงไม่ใช่\""],
  head:["คำ","ความมั่นใจ","ตัวอย่าง (ปัจจุบัน / อดีต)"],
  rows:[["must","มั่นใจว่าใช่","He must be tired. / He must have left."],["might / may / could","อาจจะ","She might be at home. / She might have missed the bus."],["can't","มั่นใจว่าไม่ใช่","It can't be true. / He can't have seen us."]],
  ex:[["The lights are off. They must be asleep.","ไฟปิดหมดแล้ว พวกเขาคงหลับแล้ว"],["She isn't answering. She might have left her phone at home.","เธอไม่รับสาย อาจจะลืมโทรศัพท์ไว้ที่บ้าน"],["He can't have finished already. He only started ten minutes ago.","เขาไม่น่าจะทำเสร็จแล้ว เพิ่งเริ่มไปสิบนาทีเอง"]],
  mist:[["He must to be tired.","He must be tired.","หลัง modal ไม่มี to"],["She mustn't be at home.","She can't be at home.","เดาว่าไม่ใช่ใช้ can't (mustn't = ห้าม)"],["He must forgot.","He must have forgotten.","เดาเรื่องในอดีตใช้ must have + V3"]]},
 dialogue:{cast:{A:"Tom",B:"Mint"},lines:[
  ["A","That's strange. My laptop isn't on my desk.","แปลกจัง แล็ปท็อปไม่อยู่บนโต๊ะ"],
  ["B","You must have left it in the meeting room. You were there all morning.","คุณคงลืมไว้ในห้องประชุมแน่ๆ อยู่ที่นั่นทั้งเช้าเลยนี่"],
  ["A","No, I can't have left it there. I remember bringing it back.","ไม่น่าใช่ ผมจำได้ว่าถือกลับมาแล้ว"],
  ["B","Then someone might have borrowed it. Have you asked Nok?","งั้นอาจมีคนยืมไป ถามนกหรือยัง"],
  ["A","Not yet. Oh, wait, look. There's a note: took your laptop to IT for the update, back at three, Nok.","ยังเลย อ้าว ดูสิ มีโน้ต: เอาแล็ปท็อปไปให้ไอทีอัปเดต จะเอามาคืนตอนบ่ายสาม นก"],
  ["B","Well, that explains it!","งั้นก็เข้าใจแล้ว"]],
  q:[mc("Where did Mint first think the laptop was?",["in the meeting room","on Nok's desk","in the IT department"],0),mc("Where was the laptop really?",["in the meeting room","with the IT department","in Tom's bag"],1)]},
 practice:[
  mc("He's been working for twelve hours. He ___ be exhausted.",["must","can't","might not"],0,"มีหลักฐานชัด มั่นใจว่าเหนื่อย"),
  mc("That ___ be Anna. She's on holiday in Japan.",["must","can't","might"],1,"มั่นใจว่าไม่ใช่"),
  mc("I'm not sure where Tom is. He ___ be in the canteen.",["must","might","can't"],1,"ไม่แน่ใจ ใช้ might"),
  fill("The ground is wet. It must ___ rained last night.","have","เดาเรื่องในอดีต must have + V3"),
  mc("She passed the exam easily. She ___ studied hard.",["must have","can't have","mustn't"],0),
  ord("You must have left it at home","คุณคงลืมไว้ที่บ้านแน่ๆ")],
 quiz:[mc("He didn't answer my call. He ___ asleep.",["might be","can't be","must to be"],0),fill("They can't ___ us. It was too dark. (see)","have seen"),mc("This watch ___ very expensive. It's made of gold.",["can't be","must be","mustn't be"],1)],
 role:{th:"ครูเล่าปริศนาเล็กๆ ให้ฟัง ลองช่วยเดาว่าเกิดอะไรขึ้น ใช้ must, might และ can't",opener:"Here's a little mystery: I came home yesterday and my front door was open, but nothing was missing. What do you think happened?",
  shadow:["He must be at work by now.","She might have missed the bus.","It can't be true.","They must have forgotten about the meeting."]},
 writing:{th:"เขียนคาดเดาเหตุการณ์ปริศนา 4–5 ประโยค ใช้ must, might, can't (have)",model:"My neighbour's car has been in front of his house all week, and his lights haven't been on. He must be away on holiday. He can't have gone by car, so he might have taken a flight. Or perhaps he is staying with his daughter, who lives in Chiang Mai."}},
{id:"u17",lv:5,en:"Turning points",th:"จุดเปลี่ยนและการสมมติขั้นสูง",
 vocab:[
  v("hypothetical","สมมติ","adj.","Let's consider a hypothetical situation.","ลองพิจารณาสถานการณ์สมมติ"),
  v("outcome","ผลลัพธ์","n.","Nobody could predict the outcome.","ไม่มีใครคาดเดาผลลัพธ์ได้"),
  v("circumstances","สถานการณ์ สภาพแวดล้อม","n.","Under the circumstances, you did well.","ในสถานการณ์แบบนั้น คุณทำได้ดีแล้ว"),
  v("inevitable","หลีกเลี่ยงไม่ได้","adj.","Change is inevitable.","การเปลี่ยนแปลงเป็นสิ่งที่หลีกเลี่ยงไม่ได้"),
  v("pursue","มุ่งไล่ตาม","v.","She decided to pursue a career in law.","เธอตัดสินใจเดินตามเส้นทางอาชีพกฎหมาย"),
  v("hindsight","การมองย้อนกลับไป","n.","In hindsight, I should have waited.","มองย้อนกลับไป ฉันน่าจะรอก่อน"),
  v("dilemma","สถานการณ์กลืนไม่เข้าคายไม่ออก","n.","I'm facing a real dilemma.","ฉันกำลังเจอสถานการณ์กลืนไม่เข้าคายไม่ออก"),
  v("turning point","จุดเปลี่ยน","n.","Moving abroad was a turning point in my life.","การย้ายไปต่างประเทศเป็นจุดเปลี่ยนในชีวิตฉัน")
 ],
 grammar:{title:"Mixed conditionals",
  intro:["ใช้เมื่อ <mark>เงื่อนไขกับผลอยู่คนละช่วงเวลา</mark> ต่างจาก conditional ปกติที่อยู่ช่วงเวลาเดียวกัน",
   "<b>อดีต → ปัจจุบัน</b>: If + had V3, would + V เช่น If I had taken that job, I would be living in Singapore now.",
   "<b>ปัจจุบัน → อดีต</b>: If + past simple, would have + V3 เช่น If I spoke Japanese, I would have understood the film."],
  head:["ทิศทาง","รูป","ตัวอย่าง"],
  rows:[["อดีต → ปัจจุบัน","If + had V3, would + V","If I had studied medicine, I would be a doctor now."],["ปัจจุบัน → อดีต","If + past, would have + V3","If she weren't so shy, she would have spoken at the meeting."],["เทียบ: third conditional","If + had V3, would have V3","If I had studied, I would have passed."]],
  ex:[["If I hadn't missed the flight, I would be in Tokyo right now.","ถ้าไม่ตกเครื่อง ตอนนี้คงอยู่โตเกียวแล้ว"],["If he were more organised, he wouldn't have forgotten the meeting.","ถ้าเขาเป็นคนมีระเบียบกว่านี้ คงไม่ลืมประชุม"],["In hindsight, if we had invested earlier, we would be much richer today.","มองย้อนกลับไป ถ้าลงทุนเร็วกว่านี้ ตอนนี้คงรวยกว่านี้มาก"]],
  mist:[["If I had taken the job, I would have lived in Singapore now.","If I had taken the job, I would be living in Singapore now.","ผลในปัจจุบัน (now) ใช้ would + V"],["If I would have known, ...","If I had known, ...","ห้ามใช้ would ในส่วน if"],["If I didn't lose my phone yesterday, ...","If I hadn't lost my phone yesterday, ...","เงื่อนไขในอดีตใช้ had + V3"]]},
 dialogue:{cast:{A:"Jane",B:"Tom"},lines:[
  ["A","I heard you almost moved to Australia a few years ago.","ได้ยินว่าเมื่อหลายปีก่อนคุณเกือบย้ายไปออสเตรเลีย"],
  ["B","That's right. I got a job offer in Sydney, but I turned it down because my father was ill.","ใช่ครับ ผมได้ข้อเสนองานที่ซิดนีย์ แต่ปฏิเสธไปเพราะพ่อป่วย"],
  ["A","Do you ever think about what might have happened?","เคยคิดไหมว่าถ้าไปจะเป็นยังไง"],
  ["B","Sometimes. If I had accepted the offer, I would probably be living by the beach now.","บางครั้งครับ ถ้าตอนนั้นตอบรับ ตอนนี้คงได้อยู่ริมทะเล"],
  ["A","But you wouldn't have met your wife!","แต่คุณก็คงไม่ได้เจอภรรยา"],
  ["B","True. In hindsight, it was definitely the right decision.","จริงครับ มองย้อนกลับไป มันเป็นการตัดสินใจที่ถูกแน่นอน"]],
  q:[mc("Why did Tom turn down the job?",["The salary was too low.","His father was ill.","He didn't like Sydney."],1),mc("How does Tom feel about his decision now?",["He regrets it deeply.","He thinks it was right.","He is still unsure."],1)]},
 practice:[
  mc("If I had taken that job, I ___ in London now.",["will live","would be living","had lived"],1,"เงื่อนไขอดีต ผลตอนนี้ (now) ใช้ would + V"),
  mc("If she ___ such a shy person, she would have spoken at yesterday's meeting.",["isn't","weren't","won't be"],1,"นิสัยที่ยังเป็นอยู่ (ปัจจุบัน) ส่งผลต่อเรื่องเมื่อวาน"),
  fill("If I ___ breakfast, I wouldn't be so hungry now. (have)","had had","เงื่อนไขในอดีต had + V3 (had had)"),
  mc("If we had left earlier, we ___ there right now.",["would be","would have been","will be"],0,"right now = ตอนนี้ ผลอยู่ในปัจจุบัน ใช้ would + V"),
  mc("If he spoke better English, he ___ the job last year.",["would get","would have got","will get"],1,"ความสามารถปัจจุบัน ส่งผลต่อเรื่องปีที่แล้ว"),
  Object.assign({alts:["I would be travelling now if I had saved more money"]},ord("If I had saved more money I would be travelling now","ถ้าเก็บเงินได้มากกว่านี้ ตอนนี้คงได้เที่ยวอยู่"))],
 quiz:[fill("If I ___ my passport, I would be on the plane now. (not lose)","hadn't lost|had not lost"),mc("If she were taller, she ___ the basketball team last year.",["would join","would have joined","had joined"],1),mc("In ___, I should have asked for help.",["hindsight","dilemma","outcome"],0)],
 role:{th:"คุยกับครูเรื่องจุดเปลี่ยนในชีวิต และจินตนาการว่าถ้าตัดสินใจต่างไป ตอนนี้ชีวิตจะเป็นอย่างไร ใช้ mixed conditionals",opener:"Let's talk about turning points. Was there a moment in your life when a different decision would have changed everything?",
  shadow:["If I had chosen a different major, I would be working in another field now.","If I were more patient, I wouldn't have argued with him.","In hindsight, it was the right decision.","That was a real turning point in my life."]},
 writing:{th:"เขียนเรื่องจุดเปลี่ยนในชีวิต 5–6 ประโยค ใช้ mixed conditionals อย่างน้อย 2 ประโยค",model:"The biggest turning point in my life was when I decided to study engineering instead of art. If I had followed my heart, I would probably be working as a designer now. However, if I weren't so practical, I wouldn't have chosen such a stable career. In hindsight, I think it was the right choice, although I still paint at weekends."}},

{id:"u18",lv:5,en:"News and formal reports",th:"ภาษาทางการในข่าวและรายงาน",
 vocab:[
  v("allegedly","ว่ากันว่า ถูกกล่าวหาว่า","adv.","He allegedly stole the money.","ว่ากันว่าเขาขโมยเงินไป"),
  v("widely","อย่างกว้างขวาง","adv.","It is widely believed that exercise improves mood.","เชื่อกันอย่างกว้างขวางว่าการออกกำลังกายช่วยให้อารมณ์ดี"),
  v("rumour","ข่าวลือ","n.","There's a rumour that the boss is leaving.","มีข่าวลือว่าหัวหน้าจะลาออก"),
  v("controversial","เป็นที่ถกเถียง","adj.","The new law is very controversial.","กฎหมายใหม่เป็นที่ถกเถียงอย่างมาก"),
  v("assume","สันนิษฐาน ทึกทัก","v.","I assumed you already knew.","ฉันนึกว่าคุณรู้อยู่แล้ว"),
  v("consider","พิจารณา ถือว่า","v.","She is considered one of the best doctors.","เธอถือเป็นหนึ่งในหมอที่เก่งที่สุด"),
  v("reportedly","มีรายงานว่า","adv.","The company is reportedly for sale.","มีรายงานว่าบริษัทกำลังจะถูกขาย"),
  v("spokesperson","โฆษก","n.","A spokesperson confirmed the news.","โฆษกยืนยันข่าวนี้")
 ],
 grammar:{title:"Passive reporting: It is said that… / X is said to…",
  intro:["ภาษาข่าวและงานเขียนวิชาการมักเลี่ยงการบอกว่าใครพูด จึงใช้ passive reporting",
   "<mark>It + is/was + said/believed/thought/reported + that…</mark> เช่น It is said that the castle is haunted.",
   "<mark>Subject + is said/believed + to V</mark> สำหรับปัจจุบัน หรือ <mark>to have + V3</mark> สำหรับอดีต เช่น He is believed to have left the country."],
  head:["รูปแบบ","ตัวอย่าง"],
  rows:[["It is said that + ประโยค","It is said that he is very rich."],["S + is said to + V (ปัจจุบัน)","He is said to be very rich."],["S + is said to have + V3 (อดีต)","He is said to have made his money in property."]],
  ex:[["It is estimated that ten million people visit the city every year.","คาดว่ามีคนมาเที่ยวเมืองนี้ปีละสิบล้านคน"],["The company is reported to be planning job cuts.","มีรายงานว่าบริษัทกำลังวางแผนลดพนักงาน"],["The painting is thought to have been stolen in 1990.","เชื่อกันว่าภาพวาดถูกขโมยไปเมื่อปี 1990"]],
  mist:[["He is said that he is rich.","He is said to be rich.","ขึ้นต้นด้วยคน ต้องตามด้วย to V (หรือใช้ It is said that…)"],["She is believed to leave yesterday.","She is believed to have left yesterday.","เหตุการณ์ในอดีตใช้ to have + V3"],["It is saying that the museum is closed.","It is said that the museum is closed.","ภาษารายงานข่าวใช้ passive: It is said that… (ห้ามใช้ is saying)"]]},
 dialogue:{cast:{A:"Mint",B:"Ploy"},lines:[
  ["A","Have you read about the new airport project?","อ่านข่าวโครงการสนามบินใหม่หรือยัง"],
  ["B","Yes. It's reported to be the most expensive project in the country's history.","อ่านแล้ว มีรายงานว่าเป็นโครงการที่แพงที่สุดในประวัติศาสตร์ประเทศ"],
  ["A","And it's controversial, too. Some people are worried about the environment.","แถมยังเป็นที่ถกเถียงด้วย บางคนกังวลเรื่องสิ่งแวดล้อม"],
  ["B","Apparently, thousands of trees are expected to be cut down.","ได้ยินว่าต้นไม้หลายพันต้นจะถูกตัด"],
  ["A","A spokesperson said they would plant new forests elsewhere, but not everyone believes that.","โฆษกบอกว่าจะปลูกป่าใหม่ที่อื่น แต่ไม่ใช่ทุกคนจะเชื่อ"],
  ["B","Well, the project is expected to create around twenty thousand jobs, so many people support it.","แต่เชื่อกันว่าโครงการจะสร้างงานราวสองหมื่นตำแหน่ง คนจำนวนมากเลยสนับสนุน"]],
  q:[mc("What is said about the airport project's cost?",["It is the most expensive in the country's history.","It is cheaper than expected.","It has not been decided."],0),mc("Why do many people support the project?",["It will protect forests.","It is expected to create jobs.","It will reduce traffic."],1)]},
 practice:[
  mc("It ___ that the new law will reduce crime.",["is believed","believes","is believing"],0),
  mc("The singer is said ___ two million records last year.",["to sell","to have sold","selling"],1,"เหตุการณ์ในอดีต to have + V3"),
  fill("The bridge is thought ___ the oldest in Europe. (be)","to be"),
  mc("___ is reported that the talks have failed.",["There","It","He"],1),
  mc("The thief is believed ___ the country.",["to leave","to have left","has left"],1),
  ord("It is said that the house is haunted","ว่ากันว่าบ้านหลังนี้มีผีสิง")],
 quiz:[fill("The company is expected ___ its profits this year. (double)","to double"),mc("It ___ that over 500 people attended.",["is estimated","estimates","is estimating"],0),mc("He is thought ___ his job last month.",["to lose","to have lost","lost"],1)],
 role:{th:"ครูรับบทนักข่าวสัมภาษณ์คุณเรื่องข่าวในเมือง ลองเล่าข่าวแบบทางการด้วย It is said that… และ is believed to…",opener:"Good evening. We're here to discuss the rumours about the new shopping mall in your area. What have you heard about it?",
  shadow:["It is said that the mall will open next year.","The project is believed to cost billions.","He is reported to have resigned.","It is widely thought that prices will rise."]},
 writing:{th:"เขียนรายงานข่าวสั้นๆ 5 ประโยค ใช้ passive reporting อย่างน้อย 3 ครั้ง",model:"A rare white elephant has reportedly been seen in a national park in the north. It is believed to have walked across the border from Laos. According to rangers, the elephant is thought to be around ten years old. It is estimated that hundreds of tourists have already visited the area. Officials are expected to announce new rules to protect the animal."}},

{id:"u19",lv:5,en:"Getting your point across",th:"การเน้นย้ำใจความ",
 vocab:[
  v("genuinely","อย่างแท้จริง","adv.","I'm genuinely sorry.","ฉันขอโทษจากใจจริง"),
  v("absolutely","อย่างที่สุด แน่นอน","adv.","You're absolutely right.","คุณพูดถูกที่สุด"),
  v("particularly","โดยเฉพาะ","adv.","I particularly enjoyed the music.","ฉันชอบดนตรีเป็นพิเศษ"),
  v("essential","จำเป็นอย่างยิ่ง","adj.","Water is essential for life.","น้ำจำเป็นต่อชีวิต"),
  v("frankly","พูดตรงๆ","adv.","Frankly, I don't like the idea.","พูดตรงๆ ฉันไม่ชอบไอเดียนี้"),
  v("deserve","สมควรได้รับ","v.","You deserve a break.","คุณสมควรได้พัก"),
  v("impress","ทำให้ประทับใจ","v.","Her English really impressed me.","ภาษาอังกฤษของเธอทำให้ฉันประทับใจมาก"),
  v("priority","สิ่งสำคัญอันดับแรก","n.","Safety is our top priority.","ความปลอดภัยคือสิ่งสำคัญอันดับแรก")
 ],
 grammar:{title:"Cleft sentences and emphatic do",
  intro:["ใช้เน้นส่วนที่สำคัญที่สุดของประโยค คล้ายภาษาไทย \"สิ่งที่…คือ…\"",
   "<mark>What + ประธาน + กริยา + is/was…</mark>: What I need is a holiday. และ <mark>It is/was + ส่วนที่เน้น + who/that…</mark>: It was Nok who found the mistake.",
   "ใส่ <mark>do/does/did + V</mark> ในประโยคบอกเล่า เพื่อยืนยันว่าจริง: I did lock the door!"],
  head:["รูปแบบ","ตัวอย่าง"],
  rows:[["What … is/was …","What I love about Thailand is the food."],["It is/was … who/that …","It was the manager who made the decision."],["do/does/did + V","I do understand how you feel."],["All … is/was …","All I want is a quiet weekend."]],
  ex:[["What impressed me most was her confidence.","สิ่งที่ทำให้ฉันประทับใจที่สุดคือความมั่นใจของเธอ"],["It was in Chiang Mai that we first met.","ที่เชียงใหม่นี่แหละที่เราเจอกันครั้งแรก"],["I did send the email. Please check your spam folder.","ฉันส่งอีเมลไปแล้วจริงๆ ลองดูในโฟลเดอร์สแปม"]],
  mist:[["What I need it is more time.","What I need is more time.","ไม่ต้องมี it ซ้ำ"],["It was Tom which called you.","It was Tom who called you.","คนใช้ who หรือ that"],["I did sent the email.","I did send the email.","หลัง did ใช้กริยารูปธรรมดา"]]},
 dialogue:{cast:{A:"Manager",B:"Nok"},lines:[
  ["A","Nok, the client said the report arrived late.","นก ลูกค้าบอกว่าได้รับรายงานช้า"],
  ["B","I did send it on Friday. What happened was that the file was too large, so it went to their spam folder.","ฉันส่งไปวันศุกร์จริงๆ ค่ะ ที่เกิดขึ้นคือไฟล์ใหญ่เกิน เลยไปอยู่ในสแปมของเขา"],
  ["A","I see. It was their system that caused the problem, then.","เข้าใจแล้ว ปัญหาเกิดจากระบบของเขานี่เอง"],
  ["B","Exactly. What I'd suggest is that we send large files through a shared link next time.","ใช่ค่ะ สิ่งที่ฉันอยากเสนอคือ คราวหน้าส่งไฟล์ใหญ่ผ่านลิงก์แชร์"],
  ["A","Good idea. What matters most is that the client is happy.","ดีเลย สิ่งที่สำคัญที่สุดคือลูกค้าพอใจ"],
  ["B","Absolutely. I'll call them this afternoon to apologise for the confusion.","แน่นอนค่ะ บ่ายนี้จะโทรไปขอโทษเรื่องความสับสน"]],
  q:[mc("Why did the client think the report was late?",["Nok forgot to send it.","It went to the spam folder.","The manager lost it."],1),mc("What does Nok suggest?",["sending large files through a shared link","sending reports earlier","finding a different client"],0)]},

  mc("It was my sister ___ taught me to swim.",["which","who","what"],1,"คนใช้ who"),
  mc("I ___ call you yesterday, but you didn't answer.",["did","do","done"],0,"เน้นว่าโทรจริง did + V"),
  fill("___ I like most about my job is the people.","what"),
  mc("What surprised me ___ how cheap it was.",["is","was","were"],1),
  ord("What I really want is a quiet weekend","สิ่งที่ฉันต้องการจริงๆ คือวันหยุดเงียบๆ")],
 quiz:[mc("It was in 2019 ___ I started my business.",["what","that","which"],1),fill("I ___ understand your problem. I'm just very busy.","do"),mc("All I want ___ a cup of coffee.",["are","is","be"],1)],
 role:{th:"ครูชวนคุยเรื่องสิ่งที่สำคัญในชีวิตและงาน ลองตอบแบบเน้นย้ำด้วย What I… is… และ It is… that…",opener:"What would you say matters most to you in a job: the money, the people or the work itself?",
  shadow:["What I love most about my job is the people.","It was my teacher who inspired me.","I do believe that hard work pays off.","All I need is a little more time."]},
 writing:{th:"เขียนเรื่องสิ่งที่สำคัญที่สุดในชีวิตคุณ 5 ประโยค ใช้ cleft sentences อย่างน้อย 3 ครั้ง",model:"What matters most to me is my family. It was my parents who taught me to work hard and stay honest. What I admire about them is that they never complain, even when life is difficult. I do try to spend every Sunday with them. All I want for the future is for them to stay healthy and happy."}},

{id:"u20",lv:5,en:"Building an argument",th:"การโต้แย้งและเขียนเชิงวิชาการ",
 vocab:[
  v("nevertheless","อย่างไรก็ตาม","adv.","It was risky. Nevertheless, we tried.","มันเสี่ยง อย่างไรก็ตามเราก็ลอง"),
  v("whereas","ในขณะที่ (เปรียบเทียบ)","conj.","I like tea, whereas my wife prefers coffee.","ฉันชอบชา ในขณะที่ภรรยาชอบกาแฟ"),
  v("consequently","ดังนั้น ผลก็คือ","adv.","Sales fell. Consequently, the shop closed.","ยอดขายตก ผลก็คือร้านปิด"),
  v("furthermore","ยิ่งไปกว่านั้น","adv.","Furthermore, it is good for the environment.","ยิ่งไปกว่านั้น ยังดีต่อสิ่งแวดล้อม"),
  v("argue","โต้แย้ง ให้เหตุผล","v.","Some people argue that tests are unfair.","บางคนแย้งว่าการสอบไม่ยุติธรรม"),
  v("perspective","มุมมอง","n.","From my perspective, it's a good idea.","ในมุมมองของฉัน นี่เป็นความคิดที่ดี"),
  v("overall","โดยรวม","adv.","Overall, the trip was a success.","โดยรวมแล้วทริปนี้ประสบความสำเร็จ"),
  v("drawback","ข้อเสีย","n.","The main drawback is the cost.","ข้อเสียหลักคือค่าใช้จ่าย")
 ],
 grammar:{title:"Linking words for arguments",
  intro:["งานเขียนและการพูดระดับสูงต้องเชื่อมความคิดให้ชัด แบ่งคำเชื่อมตามหน้าที่",
   "<mark>ขัดแย้ง</mark>: however และ nevertheless ขึ้นประโยคใหม่, although + ประโยค, despite + คำนามหรือ V-ing, whereas เปรียบเทียบสองสิ่ง",
   "<mark>เหตุและผล</mark>: because of และ due to + คำนาม, therefore, consequently, as a result · <mark>เพิ่มเติม</mark>: furthermore, moreover, in addition"],
  head:["หน้าที่","คำเชื่อม","ตัวอย่าง"],
  rows:[["ขัดแย้ง","however, nevertheless","The plan is expensive. However, it will save time."],["ขัดแย้งในประโยค","although, whereas, despite","Although it rained, we went out. / Despite the rain, we went out."],["ผลลัพธ์","therefore, consequently, as a result","Sales fell. Consequently, the shop closed."],["เพิ่มเติม","furthermore, moreover, in addition","Cycling is cheap. Furthermore, it is healthy."]],
  ex:[["Cities offer more jobs, whereas rural areas offer a better quality of life.","เมืองมีงานมากกว่า ในขณะที่ชนบทให้คุณภาพชีวิตที่ดีกว่า"],["Despite its drawbacks, online learning is here to stay.","แม้จะมีข้อเสีย การเรียนออนไลน์ก็จะอยู่ต่อไป"],["Overall, the advantages outweigh the disadvantages.","โดยรวมแล้ว ข้อดีมากกว่าข้อเสีย"]],
  mist:[["Despite it was raining, ...","Although it was raining, ... / Despite the rain, ...","despite ตามด้วยคำนามหรือ V-ing"],["However the plan is good.","However, the plan is good.","however ขึ้นต้นประโยคต้องมีจุลภาค"],["Because of it was late, ...","Because it was late, ...","because of ตามด้วยคำนาม"]]},
 dialogue:{cast:{A:"Jane",B:"Beam"},lines:[
  ["A","Let's practise for your IELTS speaking test. Do you think people should work from home?","มาซ้อมพูด IELTS กัน คุณคิดว่าคนควรทำงานที่บ้านไหม"],
  ["B","Well, from my perspective, working from home has clear benefits. Furthermore, it saves a lot of time on commuting.","ในมุมมองของผม การทำงานที่บ้านมีข้อดีชัดเจน ยิ่งไปกว่านั้นยังประหยัดเวลาเดินทาง"],
  ["A","Good. But are there any drawbacks?","ดีมาก แล้วมีข้อเสียไหม"],
  ["B","Yes. Some people feel lonely, whereas in an office you can talk to colleagues easily. Consequently, teamwork can suffer.","มีครับ บางคนรู้สึกเหงา ในขณะที่ในออฟฟิศคุยกับเพื่อนร่วมงานได้ง่าย ผลก็คือการทำงานเป็นทีมอาจแย่ลง"],
  ["A","So what's your overall view?","แล้วสรุปความเห็นโดยรวมล่ะ"],
  ["B","Overall, I'd argue that a mix of both is best. Nevertheless, it depends on the type of job.","โดยรวมผมว่าแบบผสมดีที่สุด อย่างไรก็ตามก็ขึ้นอยู่กับประเภทงาน"]],
  q:[mc("Which benefit of working from home does Beam mention?",["It saves commuting time.","It improves teamwork.","It is less lonely."],0),mc("What is Beam's overall view?",["Everyone should work from home.","A mix of home and office is best.","Offices are always better."],1)]},

  mc("The plan is expensive. ___, it will save time in the long run.",["Although","However","Despite"],1,"ขึ้นประโยคใหม่ใช้ However,"),
  mc("Some students prefer online classes, ___ others prefer face-to-face lessons.",["whereas","despite","therefore"],0),
  fill("The factory closed. ___, many people lost their jobs. (ผลลัพธ์ ขึ้นต้นด้วย C)","consequently"),
  mc("___ it was raining, they played football.",["Despite","Although","Because of"],1,"although + ประโยค"),
  ord("Overall the advantages outweigh the disadvantages","โดยรวมแล้วข้อดีมากกว่าข้อเสีย")],
 quiz:[mc("Cycling is cheap. ___, it is good for your health.",["Furthermore","Whereas","Despite"],0),fill("___ its drawbacks, the plan was accepted. (แม้จะมี)","despite|in spite of"),mc("The flight was delayed ___ bad weather.",["because","due to","therefore"],1)],
 role:{th:"ฝึกโต้แย้งแบบสอบ IELTS Speaking Part 3 ครูจะถามความเห็นในประเด็นต่างๆ ตอบให้มีเหตุผลและใช้คำเชื่อม",opener:"Some people say that social media does more harm than good. What's your view?",
  shadow:["From my perspective, the benefits are clear.","Furthermore, it saves a great deal of time.","Nevertheless, there are some drawbacks.","Overall, I would argue that a balance is best."]},
 writing:{th:"เขียนย่อหน้าแสดงความคิดเห็น 5–6 ประโยค เรื่องการทำงานที่บ้าน ใช้คำเชื่อมอย่างน้อย 4 คำ",model:"Working from home has become common in recent years. From my perspective, it offers several benefits. Firstly, employees save time and money on commuting. Furthermore, many people find that they can concentrate better at home. Nevertheless, there are some drawbacks, such as loneliness and weaker teamwork. Overall, I would argue that a combination of home and office work is the most effective approach."}},
{id:"u21",lv:6,en:"Subtle persuasion",th:"การโน้มน้าวอย่างแนบเนียน",
 vocab:[
  v("compelling","หนักแน่น น่าคล้อยตาม","adj.","She made a compelling case for the new strategy.","เธอให้เหตุผลสนับสนุนกลยุทธ์ใหม่ได้อย่างหนักแน่นน่าคล้อยตาม"),
  v("undermine","บั่นทอน ทำให้อ่อนแอลง","v.","Constant delays undermine the client's trust.","ความล่าช้าซ้ำแล้วซ้ำเล่าบั่นทอนความไว้วางใจของลูกค้า"),
  v("leverage","ใช้ประโยชน์จากสิ่งที่มีให้เต็มที่","v.","We should leverage our local expertise.","เราควรใช้ความเชี่ยวชาญในท้องถิ่นของเราให้เป็นประโยชน์เต็มที่"),
  v("concede","ยอมรับ (อย่างไม่ค่อยเต็มใจ)","v.","He conceded that the plan had some weaknesses.","เขายอมรับว่าแผนนี้มีจุดอ่อนอยู่บ้าง"),
  v("rhetoric","วาทศิลป์ คำพูดสวยหรู","n.","The speech was full of empty rhetoric.","สุนทรพจน์นั้นเต็มไปด้วยคำพูดสวยหรูที่ไม่มีเนื้อหา"),
  v("stakeholder","ผู้มีส่วนได้ส่วนเสีย","n.","We need to consult all the stakeholders first.","เราต้องปรึกษาผู้มีส่วนได้ส่วนเสียทุกฝ่ายก่อน"),
  v("unprecedented","ไม่เคยเกิดขึ้นมาก่อน","adj.","The company saw unprecedented growth last year.","ปีที่แล้วบริษัทเติบโตแบบที่ไม่เคยเป็นมาก่อน"),
  v("sway","โน้มน้าว ทำให้เปลี่ยนใจ","v.","Her presentation swayed the board.","การนำเสนอของเธอทำให้บอร์ดเปลี่ยนใจ")
 ],
 grammar:{title:"Inversion for emphasis",
  intro:["เมื่อขึ้นต้นประโยคด้วยคำที่มีความหมายปฏิเสธหรือจำกัด เช่น Never, Seldom, Rarely, Not only, Only when, Hardly, No sooner ต้อง<mark>สลับกริยาช่วยไว้หน้าประธาน</mark> เหมือนประโยคคำถาม ทั้งที่ไม่ได้ถาม ใช้ในสุนทรพจน์ งานเขียนทางการ และการนำเสนอ เพื่อให้ประโยคมีน้ำหนักและน่าจดจำ",
   "ถ้าประโยคเดิมไม่มีกริยาช่วย ต้อง<mark>เติม do / does / did</mark> แล้วกริยาหลักกลับเป็นรูปธรรมดา เช่น She rarely complains → Rarely <b>does she complain</b>. คนไทยมักลืมข้อนี้ เพราะภาษาไทยไม่มีการสลับประธานกับกริยาเลย",
   "<b>Hardly … when</b> และ <b>No sooner … than</b> ใช้กับ past perfect (had + V3) บอกว่าเรื่องที่สองเกิดตามมาทันที ห้ามสลับคู่กัน ส่วน <b>Only when / Only after / Not until</b> ให้สลับที่<mark>ประโยคหลัก</mark> ไม่ใช่ประโยคที่อยู่หลัง when"],
  head:["คำขึ้นต้น","โครงสร้าง","ตัวอย่าง"],
  rows:[["Never / Rarely / Seldom","+ aux + S + V","Seldom do we see such commitment."],["Not only","+ aux + S + V, but … also …","Not only did she win the contract, but she also cut costs."],["Only when / Only after","+ ประโยค/คำนาม, aux + S + V","Only when the data arrived did we understand the problem."],["Hardly … when","Hardly + had + S + V3 … when + past","Hardly had I sat down when the phone rang."],["No sooner … than","No sooner + had + S + V3 … than + past","No sooner had we launched the product than orders poured in."]],
  ex:[["Never have I seen such a compelling proposal.","ไม่เคยเห็นข้อเสนอที่น่าคล้อยตามขนาดนี้มาก่อนเลย"],["Not only does the plan save money, but it also reduces risk.","แผนนี้ไม่เพียงช่วยประหยัดเงิน แต่ยังลดความเสี่ยงด้วย"],["Only after the audit did we realise how serious the problem was.","ต้องรอจนตรวจสอบบัญชีเสร็จ เราถึงได้รู้ว่าปัญหาร้ายแรงแค่ไหน"]],
  mist:[["Not only she speaks Thai, but she also speaks Chinese.","Not only does she speak Thai, but she also speaks Chinese.","ประโยคไม่มีกริยาช่วย ต้องเติม does ไว้หน้าประธาน และ speak กลับเป็นรูปธรรมดา"],["Only when the client called we realised the mistake.","Only when the client called did we realise the mistake.","Only when… ต้องสลับที่ประโยคหลัก (did we realise) ไม่ใช่ปล่อยไว้แบบประโยคปกติ"],["No sooner had we started when the power went off.","No sooner had we started than the power went off.","No sooner คู่กับ than ส่วน Hardly คู่กับ when ห้ามสลับกัน"]]},
 dialogue:{cast:{A:"Arisa",B:"David"},lines:[
  ["A","David, I need your help. Tomorrow I'm pitching the regional expansion to the board, and they're sceptical.","เดวิด ช่วยหน่อยนะ พรุ่งนี้ฉันต้องเสนอแผนขยายธุรกิจในภูมิภาคต่อบอร์ด แต่พวกเขายังไม่ค่อยเชื่อ"],
  ["B","Then don't open with numbers. Open with something memorable, like 'Never has this market been so ready for us.'","งั้นอย่าเปิดด้วยตัวเลข เปิดด้วยประโยคที่คนจำได้ เช่น ‘ไม่เคยมีครั้งไหนที่ตลาดนี้พร้อมสำหรับเราเท่าตอนนี้’"],
  ["A","Isn't that a bit dramatic?","มันจะดราม่าเกินไปหรือเปล่า"],
  ["B","Used once, it's compelling. Used five times, it becomes empty rhetoric.","ใช้ครั้งเดียวจะฟังหนักแน่น แต่ถ้าใช้ห้าครั้งก็กลายเป็นแค่คำพูดสวยหรูที่ว่างเปล่า"],
  ["A","Fair enough. Then I'll add: 'Not only will this bring in new customers, but it will also let us leverage our supply chain.'","จริงด้วย งั้นฉันจะพูดต่อว่า ‘โครงการนี้ไม่เพียงจะนำลูกค้าใหม่เข้ามา แต่ยังทำให้เราใช้ประโยชน์จากห่วงโซ่อุปทานที่มีอยู่ได้เต็มที่’"],
  ["B","Good. And be ready for the finance director. He'll concede the potential, but he'll worry about the risk.","ดีมาก แล้วเตรียมรับมือผู้อำนวยการฝ่ายการเงินด้วย เขาจะยอมรับว่ามีศักยภาพ แต่จะกังวลเรื่องความเสี่ยง"],
  ["A","I know. Only when he sees the risk analysis will he feel comfortable.","รู้แล้ว ต้องให้เขาเห็นการวิเคราะห์ความเสี่ยงก่อน เขาถึงจะสบายใจ"],
  ["B","Exactly. Rarely does a board reject a plan that answers its questions in advance.","ใช่เลย บอร์ดแทบไม่เคยปฏิเสธแผนที่ตอบคำถามของพวกเขาไว้ล่วงหน้าแล้ว"]],
  q:[mc("What does David warn Arisa about?",["using dramatic phrases too often","showing too many numbers at the end","talking to the finance director"],0),mc("What will make the finance director feel comfortable?",["a memorable opening","seeing the risk analysis","a smaller budget"],1)]},
 practice:[
  mc("Never ___ such a well-prepared proposal.",["I have seen","have I seen","I saw"],1,"ขึ้นต้นด้วย Never ต้องสลับกริยาช่วย have ไว้หน้าประธาน"),
  mc("Not only ___ the deadline, but she also stayed under budget.",["she met","did she meet","she did meet"],1,"ประโยคเดิมไม่มีกริยาช่วย ต้องเติม did แล้วสลับไว้หน้าประธาน"),
  fill("No sooner had the CEO finished speaking ___ the questions began.","than","No sooner คู่กับ than เสมอ"),
  mc("Hardly ___ the meeting started when the fire alarm went off.",["had","has","did"],0,"Hardly … when ใช้ past perfect: had + V3 (started)"),
  mc("Only when the contract was signed ___.",["we could relax","could we relax","we relaxed"],1,"Only when … สลับกริยาช่วยในประโยคหลัก"),
  ord("No sooner had we arrived than the meeting began","ทันทีที่เรามาถึง การประชุมก็เริ่มขึ้น","No sooner + had + ประธาน + V3 … than + อดีต")],
 quiz:[fill("Only after the audit ___ we discover the error. (do ในรูปอดีต)","did"),mc("No sooner had she joined the company ___ she was promoted.",["when","than","that"],1),mc("The consultant made a ___ case for restructuring, and nobody could argue with it.",["compelling","conceded","rhetoric"],0)],
 role:{th:"ครูรับบทกรรมการบริหารที่ยังไม่เชื่อในข้อเสนอของคุณ ลองโน้มน้าวด้วย inversion เช่น Never has… / Not only… but also… / Only when… will…",opener:"I've read your proposal, but frankly I'm not convinced. Why should we invest in this now?",
  shadow:["Never has the market been so ready for a product like this.","Not only will it cut costs, but it will also reduce risk.","Only when we act now will we stay ahead of our competitors.","Rarely do we get an opportunity like this."]},
 writing:{th:"เขียนจดหมายสั้นถึงคณะกรรมการบริหาร 120–160 คำ โน้มน้าวให้อนุมัติโครงการของคุณ ใช้ inversion อย่างน้อย 3 แบบ",model:"Dear members of the board, I am writing to ask for your support for our proposal to open a regional office in Ho Chi Minh City. Never before has our company had such a clear opportunity to grow in Southeast Asia. Demand for our services in Vietnam has risen by forty per cent in two years, and our competitors have been slow to respond. Not only would a local office bring us closer to our clients, but it would also allow us to leverage our existing supply chain. I fully concede that the initial costs are significant. However, only when we have people on the ground will we be able to compete seriously. Rarely does an opportunity of this scale remain open for long. I would therefore urge you to approve the proposal at next month's meeting."}},

{id:"u22",lv:6,en:"Hedging and precision",th:"ภาษาระมัดระวังและแม่นยำ",
 vocab:[
  v("plausible","ฟังขึ้น มีความเป็นไปได้","adj.","That is a plausible explanation, but we need more data.","คำอธิบายนั้นฟังขึ้น แต่เรายังต้องการข้อมูลเพิ่ม"),
  v("preliminary","เบื้องต้น","adj.","The preliminary results look promising.","ผลเบื้องต้นดูมีแนวโน้มที่ดี"),
  v("caveat","ข้อแม้ ข้อควรระวัง","n.","One caveat: the sample size was very small.","มีข้อควรระวังหนึ่งข้อ คือกลุ่มตัวอย่างมีขนาดเล็กมาก"),
  v("correlation","ความสัมพันธ์ (ทางสถิติ)","n.","There is a strong correlation between training and productivity.","การฝึกอบรมกับผลิตภาพมีความสัมพันธ์กันสูง"),
  v("substantiate","ยืนยันด้วยหลักฐาน","v.","The claim has not been substantiated.","ข้อกล่าวอ้างนี้ยังไม่มีหลักฐานยืนยัน"),
  v("inconclusive","ยังสรุปไม่ได้","adj.","The evidence remains inconclusive.","หลักฐานยังไม่พอจะสรุปได้"),
  v("marginally","เพียงเล็กน้อย","adv.","Sales were marginally higher than last year.","ยอดขายสูงกว่าปีที่แล้วเพียงเล็กน้อย"),
  v("attribute","ระบุว่าเป็นผลมาจาก","v.","The rise in costs can be attributed to higher fuel prices.","ต้นทุนที่เพิ่มขึ้นอาจมีสาเหตุมาจากราคาน้ำมันที่สูงขึ้น")
 ],
 grammar:{title:"Hedging: softening claims",
  intro:["ในงานเขียนวิชาการและรายงานธุรกิจ การฟันธงเกินหลักฐาน เช่น This proves that… ทำให้ดูไม่น่าเชื่อถือ ผู้เขียนระดับสูงจึงใช้ <mark>hedging</mark> เพื่อบอกระดับความมั่นใจให้พอดีกับหลักฐานที่มี ไม่ใช่เพราะไม่มั่นใจ แต่เพราะ<mark>แม่นยำ</mark>",
   "เครื่องมือหลักมี 4 กลุ่ม: <b>modal</b> (may, might, could, may well) · <b>กริยา</b> (appear, seem, tend to, suggest, indicate) · <b>คำวิเศษณ์และวลี</b> (arguably, largely, to some extent) · <b>โครงสร้าง It / There</b> (It would appear that…, There is some evidence to suggest that…)",
   "คนไทยมักใช้ maybe กับทุกอย่าง ซึ่งเป็นภาษาพูดเกินไปสำหรับงานเขียน และมักใส่ are หน้า tend to เพราะแปลจาก ‘มีแนวโน้ม’ แต่ <mark>tend เป็นกริยา</mark> อีกข้อคืออย่าใส่ hedge ซ้อนกันจนไม่เหลือใจความ <mark>หนึ่งข้ออ้างใช้หนึ่ง hedge</mark> ก็พอ"],
  head:["ประเภท","ตัวอย่างคำ","ตัวอย่างประโยค"],
  rows:[["Modal","may, might, could, may well","This may well be the main cause."],["กริยา","appear, seem, tend to, suggest","Younger customers tend to prefer mobile apps."],["คำวิเศษณ์และวลี","arguably, largely, to some extent","This is arguably our most important market."],["โครงสร้าง It / There","It would appear that… / There is some evidence to suggest that…","It would appear that the campaign was successful."]],
  ex:[["The decline in sales may well be due to seasonal factors.","ยอดขายที่ลดลงค่อนข้างเป็นไปได้ว่ามาจากปัจจัยตามฤดูกาล"],["There is some evidence to suggest that remote teams are more productive.","มีหลักฐานบางส่วนที่ชี้ว่าทีมที่ทำงานทางไกลมีผลิตภาพสูงกว่า"],["To some extent, the results were affected by the small sample size.","ผลลัพธ์ได้รับผลกระทบจากกลุ่มตัวอย่างที่เล็กอยู่บ้างในระดับหนึ่ง"]],
  mist:[["Young people are tend to use mobile banking.","Young people tend to use mobile banking.","tend เป็นกริยา ไม่ต้องมี are นำหน้า"],["There is some evidences to suggest that…","There is some evidence to suggest that…","evidence เป็นคำนามนับไม่ได้ ไม่เติม s"],["This may well to be the reason.","This may well be the reason.","หลัง modal (may well) ใช้กริยารูปธรรมดา ไม่มี to"]]},
 dialogue:{cast:{A:"Pim",B:"Richard"},lines:[
  ["A","Richard, could you look at my conclusion before I send the report to the client?","ริชาร์ด ช่วยดูบทสรุปของฉันก่อนส่งรายงานให้ลูกค้าได้ไหม"],
  ["B","Sure. Hmm, 'This proves that our training programme doubled productivity.' That's quite a strong claim.","ได้สิ อืม ‘ข้อมูลนี้พิสูจน์ว่าโครงการฝึกอบรมของเราทำให้ผลิตภาพเพิ่มเป็นสองเท่า’ เป็นข้อกล่าวอ้างที่แรงพอสมควรนะ"],
  ["A","But productivity really did go up after the training.","แต่ผลิตภาพเพิ่มขึ้นจริงๆ หลังการอบรมนะ"],
  ["B","It did, but correlation isn't causation. Other factors may well have played a part, like the new software.","ใช่ แต่ความสัมพันธ์ไม่ได้แปลว่าเป็นเหตุเป็นผลกัน ปัจจัยอื่นอาจมีส่วนด้วยก็ได้ เช่น ซอฟต์แวร์ใหม่"],
  ["A","So how should I phrase it?","แล้วฉันควรเขียนยังไงดี"],
  ["B","Something like: 'There is some evidence to suggest that the programme contributed to higher productivity.'","ประมาณว่า ‘มีหลักฐานบางส่วนที่ชี้ว่าโครงการนี้มีส่วนทำให้ผลิตภาพสูงขึ้น’"],
  ["A","Doesn't that sound weak? The client wants clear answers.","ฟังดูไม่หนักแน่นหรือเปล่า ลูกค้าอยากได้คำตอบที่ชัดเจน"],
  ["B","It sounds precise, not weak. Add a caveat about the small sample, and your findings will be much harder to challenge.","มันฟังแม่นยำต่างหาก ไม่ใช่อ่อน ใส่ข้อควรระวังเรื่องกลุ่มตัวอย่างที่เล็กไปด้วย แล้วจะไม่มีใครแย้งผลของคุณได้ง่ายๆ"]],
  q:[mc("What is the problem with Pim's original conclusion?",["It is too long.","It claims more than the evidence shows.","It uses the wrong figures."],1),mc("According to Richard, what else might explain the rise in productivity?",["the new software","a pay rise","longer working hours"],0)]},
 practice:[
  mc("Younger employees ___ prefer flexible working hours.",["are tend to","tend to","tending to"],1,"tend เป็นกริยา ใช้ tend to + V ได้เลย ไม่ต้องมี are"),
  mc("There is some evidence to ___ that the policy has reduced costs.",["suggest","suggests","suggesting"],0,"to + กริยารูปธรรมดา: evidence to suggest"),
  fill("It would ___ that the new system has reduced errors. (ดูเหมือนว่า)","appear|seem","It would appear/seem that… เป็นการ hedge แบบทางการ"),
  mc("The drop in sales ___ well be due to the rainy season.",["may","should","must"],0,"may well = ค่อนข้างเป็นไปได้ ส่วน must ฟันธงเกินไป"),
  mc("ประโยคใดเหมาะกับรายงานวิชาการที่สุด",["This proves that exercise cures depression.","Maybe exercise is good for depression, I think.","Exercise appears to reduce symptoms of depression."],2,"appears to ฟังเป็นวิชาการและไม่อ้างเกินหลักฐาน"),
  ord("Remote workers tend to report higher job satisfaction","พนักงานที่ทำงานทางไกลมักรายงานว่าพึงพอใจในงานมากกว่า","tend to + V ไม่ต้องมี are")],
 quiz:[fill("To some ___, the results were affected by the small sample size.","extent"),mc("The results are ___, so we need more data before we decide.",["inconclusive","substantiated","marginally"],0),mc("This is ___ the most important issue facing the industry today.",["arguably","arguable","argue"],0)],
 role:{th:"คุณนำเสนอผลวิจัยตลาดเบื้องต้นต่อหัวหน้า ครูจะถามจี้ให้ฟันธง ลองตอบอย่างระมัดระวังแต่ชัดเจน ด้วย It would appear that… / tend to / to some extent / may well",opener:"So, based on your preliminary research, will customers actually pay more for an eco-friendly version of our product?",
  shadow:["It would appear that younger customers are willing to pay more.","There is some evidence to suggest that demand is growing.","To some extent, the results depend on the region.","This may well be our biggest opportunity this year."]},
 writing:{th:"เขียนย่อหน้าสรุปผลการสำรวจ 120–160 คำ ใช้ hedging อย่างน้อย 4 แบบ และระบุข้อควรระวัง (caveat) หนึ่งข้อ",model:"The results of our customer survey suggest that demand for plant-based snacks is growing in Bangkok. Around sixty per cent of respondents under thirty said they had bought such products in the past month, whereas older respondents tended to be less interested. It would appear that price is the main barrier, as many participants stated that they would buy more if products were cheaper. There is also some evidence to suggest that packaging influences purchasing decisions, although this finding is arguably less reliable. One important caveat should be noted. The sample was relatively small and was largely drawn from office workers, so the results may not reflect the wider population. Nevertheless, the findings indicate that this market may well offer significant opportunities, and a larger study is recommended before any major investment is made."}},

{id:"u23",lv:6,en:"Nuance in meaning",th:"ความต่างเล็กๆ ที่เปลี่ยนความหมาย",
 vocab:[
  v("imperative","จำเป็นอย่างยิ่ง ขาดไม่ได้","adj.","It is imperative that the data be kept confidential.","ข้อมูลต้องถูกเก็บเป็นความลับโดยเด็ดขาด"),
  v("stipulate","กำหนดไว้เป็นเงื่อนไข","v.","The contract stipulates that payment be made within 30 days.","สัญญากำหนดว่าต้องชำระเงินภายใน 30 วัน"),
  v("mandatory","ภาคบังคับ ต้องทำ","adj.","Safety training is mandatory for all new staff.","พนักงานใหม่ทุกคนต้องเข้าอบรมความปลอดภัย"),
  v("discretion","ดุลยพินิจ","n.","Bonuses are paid at the manager's discretion.","โบนัสจ่ายตามดุลยพินิจของผู้จัดการ"),
  v("contingency","เหตุไม่คาดฝัน (ที่ต้องเตรียมรับมือ)","n.","We need a contingency plan in case the supplier fails.","เราต้องมีแผนสำรองเผื่อซัพพลายเออร์ส่งของไม่ได้"),
  v("waive","ยกเว้น (ค่าธรรมเนียม สิทธิ์)","v.","The bank agreed to waive the fee.","ธนาคารยอมยกเว้นค่าธรรมเนียมให้"),
  v("compliance","การปฏิบัติตามกฎระเบียบ","n.","All branches must ensure compliance with the new data law.","ทุกสาขาต้องปฏิบัติตามกฎหมายข้อมูลฉบับใหม่"),
  v("incumbent","เป็นหน้าที่ (ของใคร)","adj.","It is incumbent on managers to set an example.","ผู้จัดการมีหน้าที่ต้องทำตัวเป็นแบบอย่าง")
 ],
 grammar:{title:"The subjunctive and formal conditionals",
  intro:["หลังคำที่แสดงความจำเป็นหรือข้อเรียกร้อง เช่น essential, vital, imperative, insist, recommend, suggest, demand ภาษาอังกฤษทางการใช้ <mark>subjunctive: กริยารูปธรรมดาไม่ผัน</mark> กับทุกประธาน เช่น It is essential that he <b>be</b> on time. / We recommend that she <b>take</b> the offer. รูปปฏิเสธใช้ <b>not + V</b> (that he not be late) ภาษาอังกฤษแบบบริติชใช้ should + V แทนได้ แต่รูปไม่ผันปลอดภัยที่สุดในงานเขียนทางการ คนไทยมักพูดว่า suggest him to… ซึ่งผิดเสมอ",
   "<mark>would rather + ประธานอีกคน + past simple</mark> ใช้บอกอย่างสุภาพว่าอยากให้คนอื่นทำหรือไม่ทำอะไร: I'd rather you didn't mention it. ส่วน <mark>It's (high) time + ประธาน + past simple</mark> แปลว่า ‘ถึงเวลาแล้ว (ช้าไปด้วยซ้ำ)’: It's high time we updated the system. ใช้รูปอดีต แต่ความหมายเป็นปัจจุบัน",
   "<mark>Conditional แบบตัด if</mark> ฟังสุภาพและทางการ ใช้บ่อยในอีเมลธุรกิจ: <b>Should you</b> need… (= If you need…), <b>Were it not for</b>… (= If it were not for…), <b>Had we</b> known… (= If we had known…)"],
  head:["โครงสร้าง","ความหมาย","ตัวอย่าง"],
  rows:[["It is essential / vital that + S + V","จำเป็นที่…","It is vital that every client receive a copy."],["insist / recommend / demand that + S + V","ยืนกราน / แนะนำ / เรียกร้องให้…","The auditor insisted that the report be revised."],["would rather + S + past simple","อยากให้ (คนอื่น)…","I'd rather you didn't share this yet."],["It's high time + S + past simple","ถึงเวลาแล้วที่…","It's high time we reviewed our pricing."],["Should you… / Were it not for… / Had I…","ถ้า… (ทางการ)","Should you need further information, please contact me."]],
  ex:[["It is imperative that the contract be signed before Friday.","สัญญาต้องได้รับการลงนามก่อนวันศุกร์โดยเด็ดขาด"],["Were it not for your support, this project would not be possible.","ถ้าไม่มีการสนับสนุนจากคุณ โครงการนี้คงเกิดขึ้นไม่ได้"],["I'd rather you didn't forward this email to the client.","ฉันไม่อยากให้คุณส่งต่ออีเมลนี้ถึงลูกค้า"]],
  mist:[["I suggest him to take the offer.","I suggest that he take the offer.","suggest ไม่ใช้โครงสร้าง suggest + คน + to V ต้องใช้ suggest that + ประธาน + กริยารูปธรรมดา"],["It's high time we update the system.","It's high time we updated the system.","หลัง It's high time ใช้ past simple แม้จะพูดถึงปัจจุบัน"],["I'd rather you don't tell anyone.","I'd rather you didn't tell anyone.","would rather + ประธานอีกคน ใช้ past simple"]]},
 dialogue:{cast:{A:"Kanya",B:"Mark"},lines:[
  ["A","Mark, have you seen the auditor's letter? They've stipulated that all customer data be stored locally by March.","มาร์ก เห็นจดหมายจากผู้ตรวจสอบหรือยัง เขากำหนดว่าข้อมูลลูกค้าทั้งหมดต้องจัดเก็บในประเทศภายในเดือนมีนาคม"],
  ["B","I've seen it. Frankly, it's high time we moved our servers anyway.","เห็นแล้ว พูดตรงๆ ยังไงก็ถึงเวลาที่เราต้องย้ายเซิร์ฟเวอร์อยู่แล้ว"],
  ["A","Agreed. But it's imperative that the migration be completed without any data loss.","เห็นด้วย แต่การย้ายระบบต้องเสร็จโดยไม่มีข้อมูลสูญหายเลยแม้แต่นิดเดียว"],
  ["B","Of course. Were it not for the new IT team, I'd be far more worried.","แน่นอน ถ้าไม่ได้ทีมไอทีชุดใหม่ ผมคงกังวลกว่านี้มาก"],
  ["A","One more thing. I'd rather you didn't mention the audit to the client until we have a plan.","อีกเรื่องหนึ่ง ฉันไม่อยากให้คุณบอกลูกค้าเรื่องการตรวจสอบจนกว่าเราจะมีแผนชัดเจน"],
  ["B","Understood. Should they ask, I'll simply say we're upgrading our systems.","เข้าใจแล้ว ถ้าเขาถาม ผมจะบอกแค่ว่าเรากำลังอัปเกรดระบบ"],
  ["A","Good. I'm also going to recommend that the board approve a contingency budget, just in case.","ดีค่ะ ฉันจะเสนอให้บอร์ดอนุมัติงบสำรองไว้ด้วย เผื่อมีอะไรผิดพลาด"],
  ["B","Sensible. Had we done this last year, we'd have saved ourselves a lot of stress.","สมเหตุสมผล ถ้าเราทำแบบนี้ตั้งแต่ปีที่แล้ว คงไม่ต้องเครียดขนาดนี้"]],
  q:[mc("What has the auditor required?",["that customer data be stored locally","that the company hire a new IT team","that the client be informed immediately"],0),mc("What does Kanya ask Mark not to do?",["move the servers","mention the audit to the client","approve the budget"],1)]},
 practice:[
  mc("It is essential that the report ___ checked by a lawyer before we send it.",["be","being","to be"],0,"หลัง It is essential that ใช้กริยารูปธรรมดา be กับทุกประธาน"),
  mc("I'd rather you ___ the figures until they're confirmed.",["didn't share","don't share","won't share"],0,"would rather + ประธานอีกคน ใช้ past simple"),
  fill("It's high time we ___ our pricing strategy. (review)","reviewed","It's high time + past simple"),
  mc("___ you require any further information, please do not hesitate to contact me.",["Should","Would","Had"],0,"Should you… = If you… แบบทางการ"),
  mc("___ it not for the new software, we would need twice as many staff.",["Were","Was","Had"],0,"Were it not for… = If it were not for… ใช้ were เสมอ"),

const DAY=864e5;

/* ---------- state & saving ---------- */
const KEY="eng-class-v1";
function fresh(){return {v:1,updatedAt:0,name:"",xp:0,_xpSeen:0,days:[],placement:{done:false,level:1,score:0},lessons:{},words:{},exams:[],mistakes:[],custom:[],stats:{},settings:{slow:false,rate:"normal",accent:"US",goal:"normal"}}}
function migrate(s){
  const f=fresh(); if(!s||typeof s!=="object") return f;
  return Object.assign(f,s,{placement:Object.assign(f.placement,s.placement||{}),settings:Object.assign(f.settings,s.settings||{}),
    _xpSeen:typeof s._xpSeen==="number"?s._xpSeen:(Number(s.xp)||0),lessons:s.lessons&&typeof s.lessons==="object"?s.lessons:{},words:s.words&&typeof s.words==="object"?s.words:{},days:Array.isArray(s.days)?s.days:[],exams:Array.isArray(s.exams)?s.exams:[]});
}
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw) S=migrate(JSON.parse(raw));}catch(e){}
const LOADED_AT=S.updatedAt||0; // compare remote copies with what was on disk, not with saves made while booting
const cloud={ref:null,timer:null,writing:false,again:false,on:false};
function save(){
  trackXp(); S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cloud.ref){clearTimeout(cloud.timer);cloud.timer=setTimeout(flushCloud,1200)}
  if(NB){clearTimeout(save.nt);save.nt=setTimeout(()=>{NB.save(JSON.stringify(S)).catch(()=>{})},300)}
}
async function flushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){cloud.again=true;return}
  cloud.writing=true;
  try{await cloud.ref.set(JSON.parse(JSON.stringify(S)))}
  catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){cloud.ref=null;cloud.on=false}}
  finally{cloud.writing=false;if(cloud.again){cloud.again=false;flushCloud()}}
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    cloud.ref=ref; cloud.on=true;
    if(snap.exists){
      const d=snap.data()||{};
      if((d.updatedAt||0)>LOADED_AT){
        S=migrate(JSON.parse(JSON.stringify(d)));
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(route.name!=="lesson") render(); else updateChrome();
      } else if((S.updatedAt||0)>(d.updatedAt||0)) flushCloud();
    } else if(S.updatedAt) flushCloud();
    if(route.name==="report") render();
  }catch(e){}
}

function rec(id){return S.lessons[id]||(S.lessons[id]={reached:0,done:false,best:0,stars:0})}
function isDone(i){const r=S.lessons[COURSE[i].id];return !!(r&&r.done)}
function firstOfLevel(lv){return COURSE.findIndex(u=>u.lv===lv)}
function unlocked(i){return i===0||isDone(i-1)||(S.placement.done&&i<=firstOfLevel(S.placement.level))}
function nextIdx(){
  const st=S.placement.done?Math.max(0,firstOfLevel(S.placement.level)):0;
  for(let i=st;i<COURSE.length;i++) if(unlocked(i)&&!isDone(i)) return i;
  for(let i=0;i<st;i++) if(unlocked(i)&&!isDone(i)) return i;
  return COURSE.length-1;
}
function markDay(){const k=dayKey(); if(!S.days.includes(k)){S.days.push(k); if(S.days.length>400) S.days=S.days.slice(-400)}}
function streak(){
  const set=new Set(S.days); let d=new Date(); if(!set.has(dayKey(d))) d=new Date(Date.now()-DAY);
  let n=0; while(set.has(dayKey(d))){n++; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1)} return n;
}
function addWords(u){let added=0;u.vocab.forEach(w=>{if(!S.words[w.en]){S.words[w.en]={b:0,due:Date.now()};added++}});return added}
function dueWords(){const now=Date.now();return Object.keys(S.words).filter(k=>WORDS[k]&&S.words[k].due<=now)}
const INT=[0,1,2,4,7,15,30];

/* ---------- speech ---------- */
const Speech={
  ok:!!NB||"speechSynthesis" in window, voices:[],
  init(){if(NB||!this.ok) return; const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang))}catch(e){}}; load(); try{speechSynthesis.addEventListener("voiceschanged",load)}catch(e){}},
  pick(i){const acc=S.settings.accent==="GB"?/en[-_]GB/i:/en[-_]US/i; let pref=this.voices.filter(x=>acc.test(x.lang)); if(!pref.length) pref=this.voices.filter(x=>/en[-_](US|GB)/i.test(x.lang)); const l=pref.length?pref:this.voices; return l.length?l[i%l.length]:null},
  stop(){if(NB){NB.stopSpeak();return} if(this.ok) try{speechSynthesis.cancel()}catch(e){}},
  say(text,o){
    o=o||{};
    if(NB) return NB.speak(text,{rate:o.rate||(o.slow||S.settings.slow?0.7:(RATES[S.settings.rate]||0.95)),pitch:o.pitch||1}).catch(()=>{});
    return new Promise(res=>{
      if(!this.ok){toast("เบราว์เซอร์นี้ยังอ่านออกเสียงไม่ได้");return res()}
      try{
        const u=new SpeechSynthesisUtterance(text); u.lang=S.settings.accent==="GB"?"en-GB":"en-US";
        const vc=this.pick(o.voice||0); if(vc) u.voice=vc;
        u.rate=o.rate||(o.slow||S.settings.slow?0.72:(RATES[S.settings.rate]||0.95)); u.pitch=o.pitch||1;
        let done=false; const fin=()=>{if(!done){done=true;res()}};
        u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(2500,text.length*140));
        speechSynthesis.speak(u);
      }catch(e){res()}
    });
  }
};
Speech.init();

const CHATS={};
function mountChat(el){
  const key=el.dataset.chat; const cfg=chatCfg(key);
  const st=CHATS[key]||(CHATS[key]={turns:[],busy:false,ctl:null,note:"",draft:""});
  el.innerHTML="";
  if(AI.state!=="ready"){
    const d=document.createElement("div"); d.className="chat chat-off";
    d.innerHTML=AI.state==="pending"
      ?'<p class="muted">กำลังเชื่อมต่อครู AI…</p>'
      :'<p><b>ครู AI ยังไม่พร้อมใช้งานในหน้านี้</b></p><p class="muted" style="margin-top:6px">ครู AI ทำงานเมื่อเปิดหน้านี้ใน Claude และกดอนุญาตให้ใช้งาน ระหว่างนี้ยังฝึกพูดตามประโยค ทำแบบฝึกหัด และทบทวนคำศัพท์ได้ตามปกติ</p>';
    el.appendChild(d); return;
  }
  const box=document.createElement("div"); box.className="chat";
  const log=document.createElement("div"); log.className="chat-log"; log.setAttribute("aria-live","polite");
  const note=document.createElement("div"); note.className="chat-note"; note.hidden=!st.note; note.textContent=st.note;
  const form=document.createElement("form"); form.className="chat-form";
  form.innerHTML='<label class="sr" for="in-'+esc(key)+'">ข้อความถึงครู</label><textarea id="in-'+esc(key)+'" rows="1" placeholder="'+esc(cfg.placeholder)+'"></textarea><button class="btn btn-primary" type="submit">ส่ง</button>';
  box.append(log,note,form); el.appendChild(box);
  const ta=form.querySelector("textarea"), btn=form.querySelector("button");
  ta.value=st.draft;
  const bubble=(role,text,live)=>{
    const m=document.createElement("div"); m.className="msg "+(role==="user"?"u":"t");
    if(role!=="user"){
      const who=document.createElement("div"); who.className="who"; who.innerHTML="<span>Teacher Jane</span>"; m.appendChild(who);
    }
    const body=document.createElement("div"); m.appendChild(body);
    fillBubble(m,body,role,text,cfg.speak&&!live);
    log.appendChild(m); return {m,body};
  };
  bubble("assistant",cfg.opener);
  st.turns.forEach(t=>bubble(t.role,t.content));
  if(st.busy){const b=bubble("assistant","กำลังคิด…",true);b.m.classList.add("thinking");st.liveEl=b}
  log.scrollTop=log.scrollHeight;
  const setBusy=b=>{st.busy=b;btn.textContent=b?"หยุด":"ส่ง";btn.type=b?"button":"submit"};
  setBusy(st.busy);
  btn.addEventListener("click",e=>{if(st.busy){e.preventDefault();st.ctl&&st.ctl.abort()}});
  ta.addEventListener("input",()=>{st.draft=ta.value;ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,140)+"px"});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}});
  el._fill=t=>{ta.value=t;st.draft=t;ta.focus()};
  form.addEventListener("submit",async e=>{
    e.preventDefault(); if(st.busy) return;
    const text=ta.value.trim(); if(!text) return;
    ta.value=""; st.draft=""; st.note=""; note.hidden=true;
    st.turns.push({role:"user",content:text}); bubble("user",text);
    const live=bubble("assistant","กำลังคิด…",true); live.m.classList.add("thinking");
    log.scrollTop=log.scrollHeight;
    const ctl=new AbortController(); st.ctl=ctl; setBusy(true);
    const turns=[{role:"user",content:cfg.rules},{role:"assistant",content:cfg.opener}].concat(st.turns.slice(-16));
    if(turns[2]&&turns[2].role==="assistant") turns.splice(2,1);
    try{
      const r=await AI.fn(turns,{cache:false,signal:ctl.signal,modelTier:"default",onText:({text})=>{live.m.classList.remove("thinking");fillBubble(live.m,live.body,"assistant",text,false);log.scrollTop=log.scrollHeight}});
      st.turns.push({role:"assistant",content:r.text});
      fillBubble(live.m,live.body,"assistant",r.text,cfg.speak);
      markDay(); bump("prac"); S.xp+=2; save(); updateChrome();
    }catch(err){
      live.m.classList.remove("thinking");
      if(err&&err.text){st.turns.push({role:"assistant",content:err.text});fillBubble(live.m,live.body,"assistant",err.text,false)} else live.m.remove();
      if(!err||err.code!=="cancelled"){st.note=aiError(err);note.textContent=st.note;note.hidden=false}
    }finally{
      setBusy(false);st.ctl=null;log.scrollTop=log.scrollHeight;
      if(!log.isConnected&&document.querySelector('[data-chat="'+key+'"]')) render();
    }
  });
}
function fillBubble(m,body,role,text,withSay){
  body.textContent="";
  if(role==="user"){body.textContent=text;return}
  const i=text.search(/\n\s*-{3,}\s*\n?/);
  const main=i>=0?text.slice(0,i).trim():text;
  const fb=i>=0?text.slice(i).replace(/^\s*-{3,}\s*/,"").trim():"";
  const p=document.createElement("span"); p.textContent=main; body.appendChild(p);
  if(fb){const f=document.createElement("span"); f.className="fb"; f.textContent=fb; body.appendChild(f)}
  const who=m.querySelector(".who");
  if(who){const old=who.querySelector(".say"); if(old) old.remove();
    if(withSay&&main&&/[a-z]/i.test(main)){who.insertAdjacentHTML("beforeend",sayBtn(main,"ฟังครูพูด"))}}
}

/* ---------- pronunciation practice (native app only) ---------- */
const PR={}; let prActive=null;
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","there's":"there is","where's":"where is","here's":"here is","i'll":"i will","you'll":"you will","we'll":"we will","i've":"i have","you've":"you have","we've":"we have","i'd":"i would","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","haven't":"have not","hasn't":"has not","can't":"can not","cannot":"can not","wasn't":"was not","weren't":"were not","couldn't":"could not","wouldn't":"would not","it'll":"it will","he'll":"he will","she'll":"she will","they'll":"they will","they've":"they have","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would","you'd":"you would","who's":"who is","mustn't":"must not","needn't":"need not","won't":"will not","shouldn't":"should not","let's":"let us"};
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function pronWords(s){
  const out=[];
  String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/-/g," ").replace(/[^a-z0-9' ]/g," ").split(/\s+/).forEach(w=>{
    w=w.replace(/^'+|'+$/g,""); if(!w) return;
    if(CONTR[w]) return out.push.apply(out,CONTR[w].split(" "));
    if(/^\d+$/.test(w)){
      if(w.length>2||w[0]==="0") w.split("").forEach(d=>out.push(d==="0"?"oh":ONES[+d]));
      else {const n=+w; if(n<20) out.push(ONES[n]); else {out.push(TENS[Math.floor(n/10)]); if(n%10) out.push(ONES[n%10])}}
      return;
    }
    if(w==="zero"||w==="o") return out.push("oh");
    out.push(w.replace(/'s$/,""));
  });
  return out;
}
function align(t,h){
  const n=t.length,m=h.length,d=[];
  for(let i=0;i<=n;i++) d.push(new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) d[i][j]=t[i]===h[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){if(t[i]===h[j]){ok[i]=true;i++;j++} else if(d[i+1][j]>=d[i][j+1]) i++; else j++}
  return ok;
}
function gradePron(text,heard){
  const toks=text.split(/\s+/).filter(Boolean), groups=toks.map(pronWords), flat=[].concat.apply([],groups);
  const ok=align(flat,pronWords(heard)); let k=0;
  const tokens=toks.map((w,i)=>{const n=groups[i].length, good=ok.slice(k,k+n).every(Boolean); k+=n; return {w,ok:good}});
  const score=flat.length?Math.round(ok.filter(Boolean).length/flat.length*100):0;
  return {state:"done",heard,score,tokens};
}
function micBtn(text){
  if(!NB) return "";
  const on=prActive===text;
  return '<button class="mic'+(on?" on":"")+'" data-act="pron" data-text="'+esc(text)+'" aria-label="'+(on?"หยุดฟัง":"พูดประโยคนี้ให้แอปฟัง")+'" aria-pressed="'+on+'">'+ICON.mic+'</button>';
}
function pronResult(text){
  const r=PR[text]; if(!NB||!r) return "";
  if(r.state==="listening") return '<div class="pron live" role="status"><span class="muted">กำลังฟัง… พูดได้เลย แตะไมค์อีกครั้งเมื่อพูดจบ</span><p class="heard" lang="en">'+esc(r.heard||"")+'</p></div>';
  if(r.state==="error") return '<div class="pron" role="status"><span class="pen">'+esc(r.msg)+'</span></div>';
  const msg=!r.heard?"ไม่ได้ยินเสียง ลองพูดใกล้ไมค์ขึ้นอีกนิด":r.score>=90?"ชัดเจนมาก!":r.score>=70?"ดีแล้ว ลองเน้นคำสีแดงอีกนิด":"ฟังต้นฉบับอีกครั้ง แล้วพูดช้าๆ ชัดๆ";
  return '<div class="pron" role="status"><p class="pron-words" lang="en">'+r.tokens.map(t=>'<span class="'+(t.ok?"ok":"miss")+'">'+esc(t.w)+'</span>').join(" ")+'</p>'
    +'<p><b>'+r.score+'%</b> <span class="pen">'+esc(msg)+'</span></p>'
    +'<p class="muted" style="font-size:14px">แอปได้ยินว่า: <span lang="en">'+esc(r.heard||"–")+'</span></p></div>';
}
async function pronounce(text){
  if(!NB) return;
  if(prActive){const same=prActive===text; await NB.stopListening(); if(same) return}
  Speech.stop();
  let ok=false;
  try{ok=(await NB.sttAvailable())&&(await NB.sttPermission())}catch(e){}
  if(!ok){PR[text]={state:"error",msg:"ใช้ไมโครโฟนไม่ได้ เปิดสิทธิ์ไมโครโฟนและการรู้จำเสียงพูดให้แอปนี้ในการตั้งค่าของเครื่อง"};render();return}
  const target=pronWords(text);
  prActive=text; PR[text]={state:"listening",heard:""}; render();
  let heard="";
  try{
    heard=await NB.listen({maxMs:4000+target.length*600,hints:[text],
      onPartial:t=>{const r=PR[text]; if(r&&r.state==="listening"){r.heard=t; const el=document.querySelector(".pron.live .heard"); if(el) el.textContent=t}},
      done:t=>align(target,pronWords(t)).every(Boolean)});
  }catch(e){if(prActive===text) prActive=null;PR[text]={state:"error",msg:"ฟังเสียงไม่สำเร็จ ลองกดไมค์อีกครั้ง"};render();return}
  if(prActive===text) prActive=null;
  PR[text]=gradePron(text,heard);
  if(PR[text].score>=70){S.xp+=2;S.pron=(S.pron||0)+1;markDay();save()}
  render();
}

    {q:"Would you like me to call a taxi for you?",o:["Thanks, but my colleague is driving me.","It was a very long call.","At the taxi stand outside."],a:0,why:"เป็นการเสนอความช่วยเหลือ ตอบปฏิเสธอย่างสุภาพพร้อมเหตุผล ข้อ B และ C หยิบคำ call/taxi มาหลอก"},
    {q:"Why was the shipment delayed?",o:["By express mail.","There was a problem at customs.","Yes, it's a little late."],a:1,why:"ถาม Why ต้องตอบเหตุผล คำถาม Wh- ตอบด้วย Yes/No ไม่ได้ ข้อ C จึงผิดทันที"},
    {q:"The printer on the third floor isn't working, is it?",o:["Three copies, please.","No, but a technician is on the way.","I work on the fourth floor."],a:1,why:"คำถามแบบ tag question ตอบ No (มันเสีย) แล้วบอกว่าช่างกำลังมา ข้อ A และ C เล่นกับตัวเลขและคำว่า floor"}
   ]},
  {kind:"sets",listen:true,title:"Part 3: Conversations",
   dir:"You will hear some conversations between two or more people. You will be asked to answer three questions about what the speakers say in each conversation.",
   dirTh:"ฟังบทสนทนา แล้วตอบคำถามบทละ 3 ข้อ อ่านคำถามก่อนกดฟังจะช่วยให้จับประเด็นได้ง่ายขึ้น",
   sets:[
    {audio:[["W","Hi, I'm calling about the apartment on Maple Street that was advertised online. Is it still available?"],["M","Yes, it is. It's a two-bedroom unit on the fifth floor, and the rent includes water and internet."],["W","That sounds great. I'd like to see it this week, but I work until six every day."],["M","No problem. I can show it to you on Thursday evening at seven. Just bring a copy of your ID."]],
     qs:[
      {q:"Why is the woman calling?",o:["To report a problem with her internet","To ask about an apartment","To pay her rent","To change a delivery address"],a:1,why:"ประโยคแรก: I'm calling about the apartment on Maple Street"},
      {q:"What is included in the rent?",o:["Parking","Electricity","Water and internet","Furniture"],a:2,why:"ผู้ชายพูดว่า the rent includes water and internet"},
      {q:"What does the man ask the woman to bring?",o:["A deposit","A reference letter","A form of identification","A signed contract"],a:2,why:"Just bring a copy of your ID (ID = บัตรแสดงตัวตน)"}]},
    {audio:[["M","Karen, the client from Singapore just moved our meeting to tomorrow morning. Are the sales figures ready?"],["W","Almost. I'm still waiting for the numbers from the Bangkok branch. They said they'd send them by noon."],["M","OK. Once you have them, could you put everything into the slides? I'd like to review them before I leave today."],["W","Sure. I'll e-mail you the presentation by four o'clock."]],
     qs:[
      {q:"What problem does the man mention?",o:["A client changed a meeting time.","A flight was canceled.","Sales have decreased.","A branch office has closed."],a:0,why:"the client ... just moved our meeting to tomorrow morning = ลูกค้าเลื่อนเวลาประชุม"},
      {q:"What is the woman waiting for?",o:["A signed contract","Information from another office","A new laptop","Approval from a manager"],a:1,why:"waiting for the numbers from the Bangkok branch = ข้อมูลจากสาขาอื่น (ข้อสอบมักเปลี่ยนคำให้ต่างจากที่ได้ยิน)"},
      {q:"What will the woman send by four o'clock?",o:["An invoice","A presentation","A travel itinerary","A product sample"],a:1,why:"I'll e-mail you the presentation by four o'clock"}]}
   ]},
  {kind:"sets",listen:true,title:"Part 4: Talks",
   dir:"You will hear some talks given by a single speaker. You will be asked to answer three questions about what the speaker says in each talk.",
   dirTh:"ฟังประกาศหรือข้อความเสียงจากผู้พูดคนเดียว แล้วตอบคำถามเรื่องละ 3 ข้อ",
   sets:[
    {audio:[["N","Attention, shoppers. Thank you for shopping at Greenfield Market. Today only, all fresh fruit in our produce section is twenty percent off. Please also note that our pharmacy will close early today, at five p.m., for staff training. It will reopen tomorrow at the usual time of eight a.m. If you need help finding anything, please ask any staff member in a green apron."]],
     qs:[
      {q:"Where is the announcement being made?",o:["At a pharmacy school","At a grocery store","On a farm","At a clothing shop"],a:1,why:"shoppers, Greenfield Market, fresh fruit = ร้านขายของสด ซูเปอร์มาร์เก็ต"},
      {q:"What is on sale today?",o:["Fresh fruit","Vegetables","Medicine","Aprons"],a:0,why:"all fresh fruit ... is twenty percent off"},
      {q:"Why will the pharmacy close early?",o:["For repairs","For a holiday","For staff training","For an inventory count"],a:2,why:"will close early today ... for staff training"}]},
    {audio:[["M","Hi, this is Daniel from Brightline Office Supplies, returning your call about the order for your new office. Unfortunately, the ergonomic chairs you selected are out of stock until the end of the month. We do have a similar model in black that we can deliver on Monday at no extra cost. Please call me back at 555-0148 before Friday so I can reserve them for you."]],
     qs:[
      {q:"What is the purpose of the message?",o:["To confirm a payment","To explain that a product is unavailable","To advertise a new store","To schedule a job interview"],a:1,why:"the chairs you selected are out of stock = สินค้าหมด"},
      {q:"What does the speaker offer?",o:["A discount","A similar product","Free installation","A full refund"],a:1,why:"a similar model in black ... at no extra cost (ไม่ใช่ส่วนลด แต่เป็นสินค้าทดแทน)"},
      {q:"What should the listener do before Friday?",o:["Return the call","Visit the store","Send an e-mail","Pay a fee"],a:0,why:"Please call me back ... before Friday"}]}
   ]}
  ]},
 reading:{title:"Reading",th:"การอ่าน",time:15*60,est:"15 นาที",
  intro:["Part 5 เติมประโยค, Part 6 เติมข้อความ และ Part 7 อ่านจับใจความ","จับเวลา 15 นาที ใกล้เคียงอัตราเวลาของข้อสอบจริง (ประมาณ 45 วินาทีต่อข้อ)"],
  parts:[
  {kind:"mc",title:"Part 5: Incomplete Sentences",
   dir:"A word or phrase is missing in each of the sentences below. Four answer choices are given below each sentence. Select the best answer to complete the sentence.",
   dirTh:"เลือกคำที่เติมลงในช่องว่างแล้วประโยคถูกต้องที่สุด ส่วนนี้วัดไวยากรณ์และคำศัพท์",
   items:[
    {q:"The new software will allow employees to complete their reports more ___.",o:["quick","quickly","quicker","quickness"],a:1,why:"ขยายกริยา complete ต้องใช้ adverb คือ quickly"},
    {q:"Please submit your travel expense forms ___ Friday.",o:["by","until","since","within"],a:0,why:"by + วันเวลา = ภายในกำหนดนั้น ส่วน until ใช้กับการกระทำที่ต่อเนื่องไปจนถึงเวลานั้น"},
    {q:"Ms. Chen has worked in the finance department ___ 2019.",o:["for","during","since","from"],a:2,why:"since + จุดเริ่มต้นของเวลา ใช้คู่กับ present perfect (has worked)"},
    {q:"All visitors must sign in at the front desk ___ entering the building.",o:["before","while","during","between"],a:0,why:"ต้องลงชื่อก่อนเข้าอาคาร before + V-ing"},
    {q:"The conference was ___ successful that the organizers plan to hold it again next year.",o:["such","so","very","too"],a:1,why:"so + adjective + that = มากจนกระทั่ง ส่วน such ต้องตามด้วยคำนาม"},
    {q:"Neither the manager ___ her assistant was available for comment.",o:["or","and","nor","but"],a:2,why:"neither ... nor ... ใช้เป็นคู่กันเสมอ"},
    {q:"The package ___ yesterday, but it has not arrived yet.",o:["was sent","sent","sending","is sending"],a:0,why:"พัสดุถูกส่ง จึงใช้ passive และมี yesterday จึงเป็นอดีต was sent"},
    {q:"Applicants should have at least three years of ___ in customer service.",o:["experienced","experiencing","experience","experiment"],a:2,why:"หลัง of ต้องเป็นคำนาม experience (ประสบการณ์ทำงาน นับไม่ได้)"},
    {q:"The board of directors will ___ the proposal at next week's meeting.",o:["discuss","discussion","discussing","discussed"],a:0,why:"หลัง will ใช้กริยารูปธรรมดา"},
    {q:"If the weather ___ good tomorrow, the company picnic will be held in the park.",o:["will be","is","was","be"],a:1,why:"เงื่อนไขแบบที่ 1: If + present simple, ... will + V (ห้ามใช้ will ในประโยค if)"}
   ]},
  {kind:"textfill",title:"Part 6: Text Completion",
   dir:"Read the text that follows. A word, phrase, or sentence is missing in parts of the text. Select the best answer to complete the text.",
   dirTh:"อ่านข้อความแล้วเลือกคำหรือประโยคที่เติมในช่องว่าง บางช่องต้องเลือกทั้งประโยคให้เข้ากับเนื้อเรื่อง",
   head:["To: All staff","From: Facilities Team","Subject: Second-floor renovation"],
   text:["Please be advised that the second floor of our building will be closed for renovation from March 3 to March 14. During this time, employees in the Accounting Department will {1} to the conference room on the fourth floor. {2}","We apologize for any {3} this may cause. If you have any questions, please contact the facilities team {4} extension 212."],
   items:[
    {o:["relocate","relocation","relocating","relocated"],a:0,why:"หลัง will ต้องใช้กริยารูปธรรมดา relocate"},
    {o:["The renovation was completed last year.","Laptops and phones will be provided there.","The accounting software is very expensive.","Please send your invoices by mail."],a:1,why:"ประโยคก่อนหน้าบอกว่าย้ายไปห้องประชุม ประโยคนี้บอกสิ่งที่เตรียมไว้ที่นั่น จึงต่อเนื่องที่สุด ข้อ A ขัดกับเนื้อเรื่อง"},
    {o:["convenience","inconvenience","inconvenient","conveniently"],a:1,why:"หลัง any ต้องเป็นคำนาม และบริบทคือขอโทษที่ไม่สะดวก = inconvenience"},
    {o:["in","on","at","to"],a:2,why:"ใช้ at กับเบอร์ต่อภายใน (at extension 212)"}
   ]},

 reading:{title:"Reading",th:"การอ่าน",time:60*60,est:"60 นาที",
  intro:["ข้อสอบเต็มชุด 3 บทความ 40 ข้อ 60 นาที เท่าข้อสอบจริง","คำถามหลายแบบ: True/False/Not Given, Yes/No/Not Given, Matching Headings, Matching Information, เลือกคำตอบ และเติมคำ","แนะนำให้ใช้เวลาประมาณ 20 นาทีต่อบทความ"],
  parts:[
  {kind:"passage",title:"Reading Passage 1",
   dir:"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.",
   dirTh:"อ่านบทความแล้วตอบคำถาม 13 ข้อ ใช้เวลาประมาณ 20 นาที บนจอกว้างบทความจะอยู่ด้านซ้ายตลอด เลื่อนดูคำถามได้ทางขวา",
   passage:{title:"Vertical Farming: Growing Food in the City",paras:[
    ["A","For most of history, farms have spread outwards across the land. Vertical farming turns this idea on its side: crops are grown in stacked layers inside buildings, often in the middle of cities. Instead of soil, many vertical farms use hydroponics, a method in which plant roots sit in water that contains carefully measured nutrients. Light comes not from the sun but from LED lamps that can be tuned to the colours plants use most efficiently."],
    ["B","Supporters argue that the approach solves several problems at once. Because the environment is fully controlled, crops can be harvested all year round, regardless of droughts, floods or cold winters. Pests are far less common indoors, so growers rarely need chemical pesticides. Water use is also dramatically lower than in open fields, since the water that plants do not absorb is collected and recycled rather than draining away into the ground."],
    ["C","Location is another advantage. A vertical farm built close to a city's supermarkets can deliver lettuce that was picked the same morning. Shorter journeys mean fresher food, and they also reduce the fuel burned by lorries carrying produce over long distances. Some farms have been set up in unusual places, such as disused warehouses, old factories and even underground tunnels."],
    ["D","However, the technology has clear limits. The most serious is energy. Replacing sunlight with electric lighting is expensive, and in places where electricity comes mainly from coal or gas, the environmental benefit of saving water and transport may be cancelled out. For this reason, most vertical farms concentrate on leafy greens and herbs, which grow quickly, are light, and sell at a high price. Staple crops such as wheat and rice take too long to grow and are worth too little to make indoor production economic."],
    ["E","The business side has also proved difficult. Several well-funded companies expanded rapidly, only to close when energy prices rose and investors lost patience. Critics say that the industry promised too much, too early. Supporters reply that every new agricultural technology has gone through similar difficulties, and that falling prices for LEDs and renewable electricity will gradually improve the economics."],
    ["F","What seems likely is that vertical farming will complement, rather than replace, traditional agriculture. For crops that travel badly and spoil quickly, growing them indoors near the people who eat them makes sense. For the grain that feeds most of the world, fields under the open sky will remain essential for the foreseeable future."]]},
   groups:[
    {type:"tfng",dir:"Do the following statements agree with the information given in Reading Passage 1? Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this.",
     dirTh:"TRUE = ตรงกับบทความ, FALSE = ขัดกับบทความ, NOT GIVEN = บทความไม่ได้พูดถึง อย่าใช้ความรู้ของตัวเองตอบ",
     items:[
      {q:"In vertical farms, plants usually receive their light from the sun.",a:"F",why:"ย่อหน้า A: Light comes not from the sun but from LED lamps"},
      {q:"Pests are less of a problem in vertical farms than in open fields.",a:"T",why:"ย่อหน้า B: Pests are far less common indoors"},
      {q:"Vertical farms use more water than traditional farms.",a:"F",why:"ย่อหน้า B: Water use is also dramatically lower"},
      {q:"Vertical farms in underground tunnels produce the highest yields.",a:"NG",why:"ย่อหน้า C พูดแค่ว่ามีฟาร์มในอุโมงค์ ไม่ได้พูดถึงผลผลิตเลย"},
      {q:"Energy is the biggest challenge for vertical farming.",a:"T",why:"ย่อหน้า D: The most serious is energy"},
      {q:"The first vertical farm was built in a disused factory.",a:"NG",why:"บทความไม่ได้บอกว่าฟาร์มแรกสร้างที่ไหน"}]},

  passage:{title:"Why Teenagers Sleep Late",paras:[
   ["A","Parents around the world complain that teenagers stay up late at night and are almost impossible to wake in the morning. For many years this behaviour was blamed on laziness or on too much time spent with screens. Research over the last three decades, however, suggests that the explanation is largely biological."],
   ["B","Every person has an internal body clock, known as the circadian rhythm, which controls when we feel alert and when we feel sleepy. One of its most important signals is melatonin, a hormone released by the brain as evening approaches. In adults and young children, melatonin levels rise at around nine or ten o'clock at night. In adolescents, the release of melatonin is delayed by up to two hours, which means that teenagers genuinely do not feel tired until much later."],
   ["C","This shift would not matter if teenagers could simply sleep later in the morning. Sleep scientists recommend that people aged thirteen to eighteen get between eight and ten hours of sleep a night. Yet in many countries, secondary school begins before eight o'clock, and students must get up by six or half past six. As a result, surveys regularly find that most teenagers sleep fewer than seven hours on school nights."],
   ["D","The effects of this shortage are wide-ranging. Tired students find it harder to concentrate and remember new information, and their marks tend to suffer. Lack of sleep has also been linked to low mood, weaker immune systems and a higher risk of road accidents among young drivers. Some researchers argue that chronic sleep loss is one of the most widespread and least recognised health problems among young people."],
   ["E","In response, some school districts have experimented with later start times. When schools in one American city moved the start of the day from 7.50 to 8.45, students slept on average 34 minutes longer each night. Attendance improved, fewer students fell asleep in class, and exam results rose modestly. Similar trials in the United Kingdom and Brazil produced comparable findings."],
   ["F","Changing school timetables is not always easy, however. Later starts can mean later finishing times, which affect after-school sports and part-time jobs, and bus schedules may need to be redesigned. Parents who work early shifts may also find it difficult to arrange transport. Despite these obstacles, a growing number of education authorities now believe that the benefits outweigh the costs."]]},
