<title>ห้องเรียนอังกฤษส่วนตัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Itim&display=swap">
<style>
:root{
  --paper:#F5F7FC; --surface:#FFFFFF; --ink:#18203A; --ink-2:#465071; --ink-3:#737D9C;
  --line:#E2E7F2; --margin:rgba(201,52,52,.32);
  --accent:#2D47C9; --accent-ink:#FFFFFF; --accent-soft:#E8EDFF;
  --mark:#FFE36A; --star:#E0A800;
  --red:#C93434; --red-soft:#FDEDED; --green:#1B7F52; --green-soft:#E2F4EB;
  --shadow:0 1px 2px rgba(24,32,58,.05),0 6px 20px rgba(24,32,58,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --f-pen:"Itim","IBM Plex Sans Thai Looped",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1320; --surface:#171C2B; --ink:#E8EBF5; --ink-2:#B4BBD0; --ink-3:#8790AB;
    --line:#272E42; --margin:rgba(255,133,131,.28);
    --accent:#93A6FF; --accent-ink:#0D1233; --accent-soft:#222B50;
    --mark:rgba(229,201,74,.38); --star:#F2C94C;
    --red:#FF8987; --red-soft:#3A1F25; --green:#63D49E; --green-soft:#15302A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1320; --surface:#171C2B; --ink:#E8EBF5; --ink-2:#B4BBD0; --ink-3:#8790AB;
  --line:#272E42; --margin:rgba(255,133,131,.28);
  --accent:#93A6FF; --accent-ink:#0D1233; --accent-soft:#222B50;
  --mark:rgba(229,201,74,.38); --star:#F2C94C;
  --red:#FF8987; --red-soft:#3A1F25; --green:#63D49E; --green-soft:#15302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
a{color:var(--accent)}
[lang="en"]{font-feature-settings:"kern"}
mark{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 2px}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.muted{color:var(--ink-3)}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.pen{font-family:var(--f-pen);color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px/1 var(--f-display);letter-spacing:-.02em}
.brand-name{font:700 17px/1.1 var(--f-display)}
.brand-sub{display:block;white-space:nowrap;font:500 11px/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 10px;white-space:nowrap;border-radius:10px;border:0;background:none;color:var(--ink-2);font-weight:500;font-size:15px;cursor:pointer}
@media (min-width:1101px) and (max-width:1360px){.nav svg{display:none}.brand-sub{display:none}}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.streak{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.streak svg{width:16px;height:16px;color:var(--red)}
@media (max-width:1100px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}
  .nav button{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px}
  .streak{margin-left:auto}
  .brand-sub{display:none}
  main{padding-bottom:84px}
}
main .wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
@media (min-width:780px){main .wrap{padding-inline:28px;padding-block:32px 64px}}

/* type & basics */
.h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
.h2{font-size:clamp(22px,3.4vw,28px);font-weight:700}
.h3{font-size:19px;font-weight:600}
.lede{color:var(--ink-2);max-width:62ch;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.say{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;flex:none;vertical-align:middle}
.say:hover{background:var(--accent-soft)}
.say svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.now{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.lock{color:var(--ink-3)}
.stars{color:var(--star);letter-spacing:1px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* exercise-book surface: red margin line */
.notebook{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px 24px 48px;background-image:linear-gradient(to right,transparent 30px,var(--margin) 30px,var(--margin) 31.5px,transparent 31.5px)}
@media (max-width:520px){.notebook{padding:20px 16px 20px 36px;background-image:linear-gradient(to right,transparent 20px,var(--margin) 20px,var(--margin) 21.5px,transparent 21.5px)}}

/* home */
.home-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:24px;align-items:start}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}}
.class-card .h2{margin-top:6px}
.class-card .th-sub{color:var(--ink-2);font-size:17px;margin-top:2px}
.mini-steps{list-style:none;padding:0;margin:18px 0 20px;display:flex;flex-wrap:wrap;gap:6px}
.mini-steps li{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3)}
.mini-steps li.done{color:var(--green);border-color:transparent;background:var(--green-soft)}
.mini-steps li.cur{color:var(--accent);border-color:var(--accent)}
.side-stack{display:flex;flex-direction:column;gap:14px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .big{font:700 30px/1 var(--f-display);color:var(--accent);min-width:48px;font-variant-numeric:tabular-nums}
.tile b{display:block;font-size:16px}
.tile small{color:var(--ink-3);font-size:14px;line-height:1.5;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px}
.stats b{display:block;font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-3)}
.section{margin-top:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* course list */
.level{margin-top:36px}
.level:first-child{margin-top:8px}
.level-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.level-code{font:700 44px/1 var(--f-display);color:var(--accent);letter-spacing:-.02em}
.level-head .bar{flex:1;min-width:120px;max-width:240px;margin-bottom:8px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.lrow:hover:not([disabled]){border-color:var(--accent)}
.lrow[disabled]{cursor:not-allowed;opacity:.62}
.lnum{font:600 13px var(--f-mono);color:var(--ink-3)}
.ltitle b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.3}
.ltitle small{display:block;color:var(--ink-3);font-size:14px}
.lstat{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
@media (max-width:520px){.lrow{grid-template-columns:34px 1fr;}.lstat{grid-column:2;align-items:flex-start;flex-direction:row;gap:8px}}

/* lesson */
.lesson-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.lesson-head .h2{margin-top:4px}
.lesson-head .th-sub{color:var(--ink-2)}
.back{background:none;border:0;padding:0;color:var(--ink-3);cursor:pointer;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.back:hover{color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--surface)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.stepper{display:flex;gap:6px;overflow-x:auto;margin:20px 0 24px;padding-bottom:4px;scrollbar-width:thin}
.step{flex:1 0 auto;min-width:92px;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:pointer;text-align:left;font-size:14px}
.step .n{font:500 11px var(--f-mono);letter-spacing:.04em}
.step.is-done{color:var(--ink-2)}
.step.is-done .n::after{content:" ✓";color:var(--green)}
.step.is-current{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.step[disabled]{cursor:not-allowed;opacity:.55}
.stage-foot{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* vocab */
.vocab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.vocab{grid-template-columns:1fr}}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);animation:rise .25s ease}
@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
.flash-top{display:flex;justify-content:space-between;color:var(--ink-3)}
.flash-word{font:700 clamp(34px,7vw,52px)/1.1 var(--f-display);letter-spacing:-.01em;margin:14px 0 10px;overflow-wrap:anywhere}
.flash-th{font-size:22px;font-weight:500;color:var(--ink-2);margin-top:14px}
.flash-ex{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:flex;gap:12px;align-items:flex-start}
.flash-ex p[lang="en"]{font-size:17px}
.flash-ex p+p{color:var(--ink-3);font-size:15px}
.flash-nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.wordlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.wordlist button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.wordlist button:hover{background:var(--surface);border-color:var(--line)}
.wordlist button[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.wordlist .w{font-weight:600}
.wordlist .t{color:var(--ink-3);text-align:right}

/* grammar */
.gram p{max-width:66ch;margin-top:10px}
.gram h3{margin-top:26px;margin-bottom:10px}
.tbl-wrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;letter-spacing:.05em;color:var(--ink-3);font-weight:600;background:var(--paper)}
td[lang="en"]{font-weight:500}
.ex-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.ex-list li{display:flex;gap:12px;align-items:flex-start}
.ex-list .th{color:var(--ink-3);font-size:14.5px}
.mistakes{margin-top:26px;border-top:1px dashed var(--line);padding-top:6px}
.mistakes h3{font-family:var(--f-pen);color:var(--red);font-weight:400;font-size:22px}
.mist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mist:last-child{border-bottom:0}
.mist .x{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.mist s{color:var(--red);text-decoration-thickness:2px}
.mist .ok{color:var(--green);font-weight:600}
.mist .why{grid-column:1/-1;font-family:var(--f-pen);color:var(--red);font-size:17px;line-height:1.5}

/* dialogue */
.dlg-cast{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dlg{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.dlg li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start}
.dlg .who{font:600 14px var(--f-display);color:var(--ink-3);padding-top:4px}
.dlg li.B .who{color:var(--accent)}
.dlg .line[lang="en"]{font-size:17px}
.dlg .tr{color:var(--ink-3);font-size:14.5px}
.dlg li.playing .line{background:linear-gradient(transparent 55%,var(--mark) 55%)}
@media (max-width:520px){.dlg li{grid-template-columns:1fr auto}.dlg .who{grid-column:1/-1;padding:0}}

/* exercises */
.runner{max-width:680px}
.rn-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;color:var(--ink-3)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:18px;height:6px;border-radius:9px;background:var(--line)}
.dots i.cur{background:var(--accent)}
.dots i.ok{background:var(--green)}
.dots i.no{background:var(--red)}
.q{font-size:20px;font-weight:500;line-height:1.55;margin-bottom:16px}
.q .hint{display:block;font-size:14.5px;color:var(--ink-3);font-weight:400}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink-2);text-align:center;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.is-right{border-color:var(--green);background:var(--green-soft)}
.opt.is-wrong{border-color:var(--red);background:var(--red-soft)}
.fill{display:flex;gap:10px;flex-wrap:wrap}
.fill input{flex:1;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.built{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:12px;align-items:center}
.built:empty::before{content:"แตะคำด้านล่างเพื่อเรียงประโยค";color:var(--ink-3);font-size:14px;padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tl{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;color:var(--ink)}
.tl:hover{border-color:var(--accent)}
.built .tl{background:var(--accent-soft);border-color:transparent}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.no{background:var(--red-soft);color:var(--red)}
.feedback .pen{font-size:17px}
.feedback b{font-weight:600}
.comp{margin-top:28px}
.comp .q{font-size:17px;margin:18px 0 10px}

/* results */
.result{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score-ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;text-align:center;border:6px solid var(--accent)}
.score-ring.pass{border-color:var(--green)}
.score-ring.fail{border-color:var(--red)}
.score-ring b{display:block;font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score-ring span{font-size:12.5px;color:var(--ink-3)}
.result .stars{font-size:26px}
@media (max-width:520px){.result{grid-template-columns:1fr;justify-items:start}}
textarea.ta{width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:16px;line-height:1.6}
.grade{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.grade .corr{font-size:17px;background:var(--green-soft);padding:12px 14px;border-radius:12px}
.grade ul{margin:0;padding-left:20px}
.grade li{font-family:var(--f-pen);color:var(--red);font-size:17px}

/* chat */
.chat{border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.chat-log{height:min(460px,58vh);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.t{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.u{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-top-right-radius:4px}
.msg .fb{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--f-pen);color:var(--red);font-size:17px;line-height:1.5}
.msg .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 12.5px var(--f-display);color:var(--ink-3);margin-bottom:2px}
.msg .say{width:28px;height:28px}
.msg .say svg{width:14px;height:14px}
.msg.thinking{color:var(--ink-3);font-style:italic}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-form textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--paper);min-height:44px;max-height:140px;line-height:1.5}
.chat-note{padding:8px 16px;font-size:13.5px;color:var(--red)}
.chat-off{padding:20px}
.teacher-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start;margin-top:20px}
@media (max-width:860px){.teacher-grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sugg button{text-align:left;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.shadow-list{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.shadow-list li{padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sh-row{display:flex;align-items:center;gap:10px}
.sh-row p{flex:1;font-size:17px}
.is-native .ai-only{display:none!important}
.mic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--red);cursor:pointer;flex:none}
.mic svg{width:17px;height:17px}
.mic.on{background:var(--red);border-color:var(--red);color:var(--surface);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--red-soft)}}
.pron{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px dashed var(--line);display:flex;flex-direction:column;gap:4px;text-align:left}
.pron-words{font-size:18px;font-weight:500;line-height:1.6}
.pron-words .ok{color:var(--green)}
.pron-words .miss{color:var(--red);text-decoration:underline wavy;text-underline-offset:4px}
.pron .heard{color:var(--ink-2);min-height:1.5em}
.says{display:flex;gap:6px;align-items:center}

/* review */
.review-card{max-width:560px;margin:10px auto 0;text-align:center}
.review-card .flash{padding:32px 24px}
.grade-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.grade-btns .btn{flex-direction:column;gap:0;line-height:1.3;padding:10px 6px}
.grade-btns small{font-weight:400;font-size:12px;color:var(--ink-3)}
.mastery{display:inline-flex;gap:3px}
.mastery i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mastery i.on{background:var(--green)}

/* report */
.cert{position:relative;background:var(--surface);border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:-9px;border-radius:4px;padding:34px 28px;text-align:center}
.cert .seal{position:absolute;right:22px;bottom:22px;width:64px;height:64px;border-radius:50%;background:var(--mark);display:grid;place-items:center;font:700 13px/1.1 var(--f-display);color:var(--ink);transform:rotate(-12deg)}
.cert h3{font-size:26px;margin:6px 0}
.cert .name{font:400 30px var(--f-pen);color:var(--accent);border-bottom:1px solid var(--line);display:inline-block;padding:0 24px;margin:8px 0}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.name-field{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.name-field input{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);min-width:0;flex:1;max-width:320px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:14.5px;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (max-width:1100px){.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
/* exam room */
.x-hub{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;align-items:start}
@media (max-width:860px){.x-hub{grid-template-columns:1fr}}
.x-exam{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.x-logo{font:700 34px/1 var(--f-display);letter-spacing:.04em;color:var(--accent)}
.x-secs{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.x-sec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;color:var(--ink)}
.x-sec:hover{border-color:var(--accent)}
.x-sec b{font:600 17px var(--f-display)}
.x-sec>small{grid-column:1;color:var(--ink-3);font-size:13.5px}
.x-last{grid-column:2;grid-row:1/3;text-align:right;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.x-last small{font-size:13px;color:var(--ink-3);font-weight:500}
.x-total{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.x-total b{display:block;font:700 28px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.x-total b small{font-size:14px;color:var(--ink-3);font-weight:500}
.x-tabs{margin-top:14px}
.xoptsbox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px;margin:10px 0 4px;background:var(--surface);display:flex;flex-direction:column;gap:3px;font-size:15px}
.xoptsbox b{display:inline-block;min-width:34px;font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.x-intro{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.x-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:520px){.x-modes{grid-template-columns:1fr}}
.x-mode{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;color:var(--ink)}
.x-mode:hover{border-color:var(--accent)}
.x-mode b{font:600 17px var(--f-display)}
.x-mode small{color:var(--ink-3);font-size:14px}
.xbar{position:sticky;top:var(--topbar-h,60px);z-index:10;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0;margin-top:18px;border-bottom:1px solid var(--line)}
.xtimer{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.xtimer.over{color:var(--red)}
.xpart{margin-top:30px}
.xdir{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px;margin:10px 0 8px}
.xdir p[lang="en"]{font-size:15px}
.xq{padding:14px 0;border-bottom:1px solid var(--line)}
.xq-h{display:flex;gap:10px;align-items:flex-start}
.xq-t{flex:1;min-width:0}
.xnum{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-mono);flex:none}
.xopts{display:flex;flex-direction:column;gap:6px;margin:10px 0 0 38px}
.xopts.row{flex-direction:row;flex-wrap:wrap}
.xo{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink);font-size:16px;line-height:1.5}
.xopts.row .xo{width:auto;min-width:64px;justify-content:center}
.xopts.codes .xo{min-width:46px;padding:8px 10px}
.xo .l{font:600 13px var(--f-mono);color:var(--ink-3);padding-top:2px}
.xo:hover:not([disabled]){border-color:var(--accent)}
.xo[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.xo[aria-pressed="true"] .l{color:var(--accent)}
.xo.ok{border-color:var(--green);background:var(--green-soft)}
.xo.no{border-color:var(--red);background:var(--red-soft)}
.xo[disabled]{cursor:default}
.xin{font-size:16px;padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);width:11em;max-width:100%;margin:0 4px}
.xin.ok{border-color:var(--green);background:var(--green-soft)}
.xin.no{border-color:var(--red);background:var(--red-soft)}
.xwhy{margin:8px 0 0 38px;font-family:var(--f-pen);color:var(--red);font-size:16.5px;line-height:1.5}
.xwhy.ok{color:var(--green)}
.xwhy b{font-family:var(--f-body);font-weight:600}
.xplay{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.xscript{margin-top:8px;padding:10px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;font-size:15px}
.xscript summary{cursor:pointer;color:var(--ink-2);font-weight:500}
.xscript p{margin-top:6px}
.xscript b{font:600 12px var(--f-mono);color:var(--ink-3);margin-right:8px}
.xset{margin-top:14px}
.xdoc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.xdoc .gap{font:600 13px var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px}
.xform{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:10px;max-width:720px}
.xform .fr{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.xform .fr:last-child{border-bottom:0}
.fr-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fr-why{grid-column:1/-1}
.fr-why .xwhy{margin-left:0}
@media (max-width:520px){.xform .fr{grid-template-columns:1fr}}
.xread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:12px}
.xpass{position:sticky;top:calc(var(--topbar-h,60px) + 58px);max-height:calc(100vh - var(--topbar-h,60px) - 80px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.xpass p{margin-top:10px;line-height:1.75}
.xpass .pl{font:700 14px var(--f-mono);color:var(--accent);margin-right:8px}
@media (max-width:860px){.xread{grid-template-columns:1fr}.xpass{position:static;max-height:none}}
.xgroup{margin-bottom:22px}
.xsubmit{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.xres{margin-top:18px}
.xscore{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.xscore b{display:block;font:700 46px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.xscore b small{font-size:18px;color:var(--ink-3);font-weight:500}
.xscore span{font-size:13.5px;color:var(--ink-3)}
.xta{min-height:220px;margin-top:12px}
.xta.sm{min-height:90px;margin:10px 0 0 38px;width:calc(100% - 38px)}
.xmodel{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px;max-width:75ch}
.xgrade{margin-top:16px}
.xgrade h3{margin-top:18px}
.band-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.band-grid div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column}
.band-grid span{font-size:13px;color:var(--ink-3)}
.band-grid b{font:700 26px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.band-grid .ov{border-color:var(--accent);background:var(--accent-soft)}
.band-grid small{font-size:12.5px;color:var(--ink-2)}
.xcomments{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cue{border:2px solid var(--ink);border-radius:6px;padding:16px 20px;background:var(--surface);max-width:520px;margin-top:12px}
.cue ul{margin:4px 0;padding-left:20px}
.xchart{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:720px}
.xchart figcaption{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-wrap{overflow-x:auto;margin-top:8px}
.chart-wrap svg{display:block;width:100%;min-width:520px;height:auto}
.xchart .grid{stroke:var(--line);stroke-width:1}
.xchart .base{stroke:var(--ink-3);stroke-width:1}
.xchart .tick{fill:var(--ink-3);font:12px var(--f-mono)}
.xchart .val{fill:var(--ink);font:600 13px var(--f-body)}
/* practice gym */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:18px}
.p-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;color:var(--ink)}
.p-card:hover{border-color:var(--accent)}
.p-title{font:600 18px/1.3 var(--f-display)}
.p-desc{color:var(--ink-2);font-size:14.5px;line-height:1.55;flex:1}
.p-meta{font-size:13px;color:var(--accent);font-weight:600}
.p-card.hot .p-meta{color:var(--red)}
.daily .goals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:640px){.daily .goals{grid-template-columns:1fr 1fr}}
.goal{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;color:var(--ink)}
.goal:hover{border-color:var(--accent)}
.goal b{display:block;font-size:14.5px;font-weight:600}
.goal small{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.goal .gc{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.goal.ok{background:var(--green-soft);border-color:transparent}
.goal.ok .gc{background:var(--green);border-color:var(--green);color:var(--surface)}
.home-row{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px;align-items:start}
@media (max-width:860px){.home-row{grid-template-columns:1fr}}
.phrase .ph-en{font:600 21px/1.35 var(--f-display)}
.dict{max-width:720px}
.dict-in{width:100%;margin-top:14px;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
.dict-res{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.snd-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.snd-opts .opt{text-align:center;font-size:22px;font-family:var(--f-display);padding:18px}
.story p{font-size:18px;line-height:1.85;margin-top:12px;max-width:68ch}
.story p:first-child{margin-top:0}
.story p.playing{background:linear-gradient(transparent 60%,var(--mark) 60%)}
.gw{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.gw:hover{color:var(--accent)}
.gloss-panel{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;margin-top:14px;max-width:520px;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
@media (max-width:1100px){.gloss-panel{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
.deck-list{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 16px}
.deck-list li{display:flex;align-items:center;gap:10px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.deck{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.deck b{font:600 17px var(--f-display)}
.deck details summary{cursor:pointer;color:var(--ink-2);font-size:14px}
.deck .deck-list{grid-template-columns:1fr}
.addword{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;margin-top:12px}
.addword input{min-width:0;font-size:16px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
@media (max-width:720px){.addword{grid-template-columns:1fr}}
.mist-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mist-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mist-item .ok-ans{color:var(--green);font-weight:600;margin-top:4px}
/* games, badges, study calendar */
.mg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;max-width:680px}
.mg-col{display:flex;flex-direction:column;gap:8px}
.mg{padding:14px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;cursor:pointer;color:var(--ink);min-height:56px}
.mg:hover:not([disabled]){border-color:var(--accent)}
.mg.sel{border-color:var(--accent);background:var(--accent-soft)}
.mg.bad{border-color:var(--red);background:var(--red-soft)}
.mg.done{opacity:.35;border-style:dashed;cursor:default}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);color:var(--ink-3)}
.badge b{font-size:15px;font-weight:600}
.badge small{font-size:12.5px;line-height:1.45}
.badge .bd-icon{font-size:22px;line-height:1}
.badge.on{border-style:solid;border-color:var(--star);color:var(--ink)}
.badge.on .bd-icon{color:var(--star)}
.badge.on small{color:var(--ink-2)}
.cal-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cal-days{display:grid;grid-template-rows:repeat(7,16px);gap:4px;font-size:11px;color:var(--ink-3);line-height:16px}
.cal{display:grid;grid-template-rows:repeat(7,16px);grid-auto-columns:16px;gap:4px}
.cd{display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--line)}
.cd.on{background:var(--green)}
.cd.fut{background:transparent;border:1px dashed var(--line)}
.cal-legend{display:flex;gap:16px;font-size:13px;color:var(--ink-3);margin-top:8px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
/* email workshop, dictionary, speed game, settings, XP chart */
.em-model{white-space:pre-wrap;margin-top:12px;background:var(--accent-soft);padding:12px 14px;border-radius:12px}
.dq-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dq-item{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sp-card{max-width:680px}
.sp-word{font:700 34px/1.2 var(--f-display);text-align:center;margin:6px 0 16px;overflow-wrap:anywhere}
.sp-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.sp-opts{grid-template-columns:1fr}}
.sp-card.ok{animation:sp-ok .6s ease-out}
.sp-card.no{animation:sp-no .6s ease-out}
@keyframes sp-ok{from{box-shadow:0 0 0 3px var(--green)}to{box-shadow:0 0 0 0 transparent}}
@keyframes sp-no{from{box-shadow:0 0 0 3px var(--red)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.sp-card.ok,.sp-card.no{animation:none}}

 grammar:{title:"be going to กับ will",
  intro:["<mark>be going to</mark> ใช้กับแผนที่ตัดสินใจไว้แล้ว เช่น จองตั๋วแล้ว: I'm going to visit Japan next month.",

   "หลัง will และ going to ใช้กริยารูปธรรมดาเสมอ"],
  head:["ใช้เมื่อ","รูปประโยค","ตัวอย่าง"],
  rows:[["แผนที่ตั้งใจไว้","am/is/are going to + V","We're going to stay for five days."],["ตัดสินใจตอนนั้น","will + V","OK, I'll buy one this weekend."],["คาดเดา","will + V","It will probably be cold."]],
  ex:[["I'm going to visit Japan with my sister.","ฉันจะไปญี่ปุ่นกับพี่สาว (วางแผนไว้แล้ว)"],["The phone's ringing. I'll get it.","โทรศัพท์ดัง เดี๋ยวฉันรับเอง"],["I think you'll love Osaka.","ฉันว่าคุณต้องชอบโอซาก้าแน่"]],
  mist:[["I will going to go.","I'm going to go.","เลือกใช้อย่างใดอย่างหนึ่ง"],["I going to travel.","I'm going to travel.","ขาด am"],["She will goes.","She will go.","หลัง will ไม่เติม s"]]},
 dialogue:{cast:{A:"Jane",B:"Beam"},lines:[
  ["A","Do you have any plans for the long holiday?","วันหยุดยาวนี้มีแผนอะไรไหม"],
  ["B","Yes! I'm going to visit Japan with my sister.","มีครับ ผมจะไปญี่ปุ่นกับพี่สาว"],

  q:[mc("Who is going to Japan with Beam?",["a friend","Beam's sister","Jane"],1),mc("How long will they stay in Osaka?",["three days","five days","two weeks"],1)]},

  ord("What are you going to do tomorrow","พรุ่งนี้คุณจะทำอะไร")],

 grammar:{title:"Present Perfect: have / has + V3",
  intro:["ใช้เล่าประสบการณ์ที่ <mark>ไม่ระบุเวลา</mark> ว่าเกิดเมื่อไร: I have been to Singapore. / Have you ever tried…?",
   "ถ้าบอกเวลาในอดีตชัดเจน (yesterday, in 2020, last week) ต้องเปลี่ยนไปใช้ past simple",
   "been to = เคยไปแล้วกลับมา ส่วน gone to = ไปแล้วยังไม่กลับ"],
  head:["ประธาน","รูปประโยค","ตัวอย่าง"],
  rows:[["I / you / we / they","have + V3","I have tried sushi."],["he / she / it","has + V3","She has been to Japan."],["คำถาม","Have / Has + ประธาน + ever + V3?","Have you ever flown?"]],
  ex:[["I've been to Singapore twice.","ฉันเคยไปสิงคโปร์สองครั้ง"],["No, I haven't. I've never eaten it.","ไม่เคย ไม่เคยกินเลย"],["Have you finished your homework yet?","ทำการบ้านเสร็จหรือยัง"]],
  mist:[["I have went there.","I have been there.","ใช้ V3 ไม่ใช่ V2"],["I have seen it yesterday.","I saw it yesterday.","มีเวลาชัดเจนใช้อดีต"],["Have you ever eat durian?","Have you ever eaten durian?","ต้องเป็น V3"]]},
 dialogue:{cast:{A:"Jane",B:"Mint"},lines:[

  ["B","It smells strong, but it tastes great. You should try it!","กลิ่นแรงแต่รสชาติดีมาก ครูควรลองนะคะ"]],

 grammar:{title:"ขอร้องและเสนออย่างสุภาพ",
  intro:["ระดับความสุภาพ: <b>Can you…?</b> (กันเอง) → <b>Could you…?</b> (สุภาพ) → <mark>Would you mind + V-ing?</mark> (สุภาพมาก)",
   "ตอบ Would you mind…? ถ้ายินดีทำให้ ต้องตอบว่า <b>No, not at all.</b> (แปลตรงตัวคือ “ไม่รังเกียจเลย”)",
   "เสนอความช่วยเหลือใช้ Shall I…? หรือ Would you like me to…?"],

  rows:[["กันเอง","Can you + V?","Can you help me?"],["สุภาพ","Could you + V?","Could you send the report?"],["สุภาพมาก","Would you mind + V-ing?","Would you mind waiting?"],["เสนอช่วย","Shall I + V?","Shall I book a room?"]],
  ex:[["Could you send the report by Friday?","ช่วยส่งรายงานภายในวันศุกร์ได้ไหม"],["Would you mind booking a meeting room?","รบกวนจองห้องประชุมให้หน่อยได้ไหม"],["Would you like me to add the charts?","ให้ฉันใส่กราฟเพิ่มไหม"]],
  mist:[["Could you to send it?","Could you send it?","หลัง could ไม่มี to"],["Would you mind to open the door?","Would you mind opening the door?","mind ตามด้วย V-ing"],["Please you help me.","Could you help me, please?","please ไม่วางหน้าประธาน"]]},
 dialogue:{cast:{A:"Manager",B:"Nok"},lines:[

 dialogue:{cast:{A:"Jane",B:"Ploy"},lines:[
  ["A","You don't look well. What's the matter?","ดูไม่ค่อยสบายนะ เป็นอะไรไป"],

  ["B","Thanks. I'll see a doctor if I don't feel better tomorrow.","ขอบคุณค่ะ ถ้าพรุ่งนี้ไม่ดีขึ้นจะไปหาหมอ"]],
  q:[mc("What's wrong with Ploy?",["a headache and a sore throat","a stomachache","a broken leg"],0),mc("What does Jane advise?",["go to work","go home and rest","eat ice cream"],1)]},

{id:"u13",lv:4,en:"Telling stories",th:"เล่าเรื่องราวในอดีต",
 vocab:[
  v("suddenly","ทันใดนั้น","adv.","Suddenly, the lights went out.","ทันใดนั้น ไฟก็ดับ"),
  v("meanwhile","ในขณะเดียวกัน","adv.","Meanwhile, the others were waiting outside.","ในขณะเดียวกัน คนอื่นๆ รออยู่ข้างนอก"),
  v("eventually","ในที่สุด","adv.","Eventually, we found the hotel.","ในที่สุดเราก็หาโรงแรมเจอ"),
  v("realise","ตระหนัก รู้ตัว","v.","I realised I had left my keys at home.","ฉันรู้ตัวว่าลืมกุญแจไว้ที่บ้าน"),
  v("manage to","ทำ…ได้สำเร็จ","phr.","We managed to catch the last train.","เราขึ้นรถไฟเที่ยวสุดท้ายได้ทัน"),
  v("unexpected","ไม่คาดคิด","adj.","We had an unexpected visitor.","เรามีแขกที่ไม่ได้คาดคิดมาเยี่ยม"),
  v("witness","พยาน ผู้เห็นเหตุการณ์","n.","A witness called the police.","พยานคนหนึ่งโทรแจ้งตำรวจ"),
  v("apparently","ดูเหมือนว่า ได้ยินมาว่า","adv.","Apparently, the shop closed last year.","ได้ยินมาว่าร้านปิดไปตั้งแต่ปีที่แล้ว")
 ],
 grammar:{title:"Narrative tenses: past simple, past continuous, past perfect",
  intro:["เวลาเล่าเรื่องในอดีต ภาษาอังกฤษใช้ 3 tense ทำงานร่วมกัน:",
   "<mark>past continuous</mark> (was/were + V-ing) เป็นฉากหลังที่กำลังดำเนินอยู่ ส่วน <mark>past simple</mark> เป็นเหตุการณ์ที่แทรกเข้ามา: I was walking home when it started to rain.",
   "<mark>past perfect</mark> (had + V3) ใช้กับเหตุการณ์ที่เกิดก่อนอีกเหตุการณ์หนึ่งในอดีต: When I arrived, the train had left."],
  head:["Tense","รูป","หน้าที่ในเรื่องเล่า"],
  rows:[["Past continuous","was/were + V-ing","ฉากหลัง: I was driving to work…"],["Past simple","V2","เหตุการณ์หลัก: …when my car stopped."],["Past perfect","had + V3","เกิดก่อน: I had forgotten to fill the tank."]],
  ex:[["I was cooking dinner when the phone rang.","ฉันกำลังทำอาหารเย็นอยู่ตอนที่โทรศัพท์ดัง"],["By the time we arrived, the film had already started.","พอเราไปถึง หนังก็เริ่มไปแล้ว"],["While she was waiting for the bus, she met an old friend.","ระหว่างที่รอรถเมล์ เธอเจอเพื่อนเก่า"]],
  mist:[["When I arrived, the train already left.","When I arrived, the train had already left.","เกิดก่อนอีกเหตุการณ์ในอดีตใช้ had + V3"],["I was knowing the answer.","I knew the answer.","know เป็นกริยาแสดงสภาพ ไม่ใช้รูป -ing"],["While I walked home, it was starting to rain.","While I was walking home, it started to rain.","ฉากหลังใช้ continuous เหตุการณ์แทรกใช้ past simple"]]},
 dialogue:{cast:{A:"Jane",B:"Beam"},lines:[
  ["A","You look tired. Is everything OK?","ดูเหนื่อยนะ ทุกอย่างโอเคไหม"],
  ["B","I had a crazy morning. I was driving to work when my car suddenly stopped in the middle of the road.","เช้านี้วุ่นมากครับ ผมกำลังขับรถไปทำงาน แล้วรถก็ดับกลางถนน"],
  ["A","Oh no! What happened?","ตายแล้ว เกิดอะไรขึ้น"],
  ["B","I had forgotten to fill up the tank. I had been so busy all week that I didn't notice.","ผมลืมเติมน้ำมัน ทั้งสัปดาห์ยุ่งมากจนไม่ทันสังเกต"],
  ["A","So how did you get to work?","แล้วมาทำงานได้ยังไง"],
  ["B","A kind man who was walking past helped me push the car to a petrol station. Eventually, I arrived an hour late.","มีผู้ชายใจดีที่เดินผ่านมาช่วยเข็นรถไปปั๊ม สุดท้ายผมมาสายหนึ่งชั่วโมง"]],
  q:[mc("Why did Beam's car stop?",["It had run out of fuel.","It had a flat tyre.","Another car hit it."],0),mc("Who helped Beam?",["a mechanic","a man who was walking past","a police officer"],1)]},
 practice:[
  mc("I ___ TV when the lights went out.",["watched","was watching","had watched"],1,"ฉากหลังที่กำลังดำเนินอยู่ใช้ past continuous"),
  mc("When we got to the cinema, the film ___.",["already started","had already started","was already starting"],1,"หนังเริ่มก่อนที่เราจะไปถึง ใช้ had + V3"),
  fill("While she ___ for the bus, it started to rain. (wait)","was waiting","ฉากหลังใช้ was + V-ing"),
  mc("She ___ the answer, so she put up her hand.",["knew","was knowing","had been knowing"],0,"know ไม่ใช้รูป -ing"),
  fill("By the time I arrived, everyone ___ home. (go)","had gone","เกิดก่อนที่ฉันจะไปถึง"),
  ord("I was walking home when I saw an accident","ฉันกำลังเดินกลับบ้านตอนที่เห็นอุบัติเหตุ")],
 quiz:[mc("They ___ dinner when I called them.",["had","were having","have had"],1),fill("He realised he ___ his keys at the office. (leave)","had left"),mc("___ I was studying, my brother was playing games.",["When","While","By the time"],1)],
 role:{th:"เล่าเรื่องที่เคยเกิดขึ้นกับคุณ เช่น เหตุการณ์ไม่คาดคิดหรือวันที่วุ่นวาย ครูจะถามรายละเอียด ใช้ past continuous และ past perfect",opener:"I love a good story! Can you tell me about something unexpected that happened to you?",
  shadow:["I was walking to work when it started to rain.","By the time I got there, the shop had closed.","Suddenly, I realised I had left my phone at home.","Eventually, everything turned out fine."]},
 writing:{th:"เล่าเหตุการณ์ไม่คาดคิดที่เคยเกิดขึ้น 4–5 ประโยค ใช้ past continuous และ past perfect",model:"Last month I was waiting for a train at Siam station when I heard someone call my name. It was my old teacher, whom I hadn't seen for ten years. She had moved to Japan after I graduated, and she had just come back to Thailand. We talked until my train had left, but I didn't mind at all."}},

{id:"u14",lv:4,en:"In the news",th:"ข่าวและการเล่าต่อ",
 vocab:[
  v("announce","ประกาศ","v.","The company announced a new product.","บริษัทประกาศเปิดตัวสินค้าใหม่"),
  v("claim","อ้างว่า","v.","He claims that he saw a ghost.","เขาอ้างว่าเห็นผี"),
  v("according to","ตามที่…กล่าว","prep.","According to the report, prices will rise.","ตามรายงาน ราคาจะสูงขึ้น"),
  v("headline","พาดหัวข่าว","n.","Did you read today's headlines?","อ่านพาดหัวข่าววันนี้หรือยัง"),
  v("reporter","นักข่าว","n.","A reporter interviewed the mayor.","นักข่าวสัมภาษณ์นายกเทศมนตรี"),
  v("official","เจ้าหน้าที่ทางการ","n.","Officials said the road would reopen soon.","เจ้าหน้าที่กล่าวว่าถนนจะเปิดใช้เร็วๆ นี้"),
  v("confirm","ยืนยัน","v.","Can you confirm your booking?","ช่วยยืนยันการจองได้ไหม"),
  v("deny","ปฏิเสธ (ข้อกล่าวหา)","v.","He denied taking the money.","เขาปฏิเสธว่าไม่ได้เอาเงินไป")
 ],
 grammar:{title:"Reported speech: said, told, asked",
  intro:["เวลาเล่าต่อคำพูดของคนอื่น มัก <mark>ถอยเวลาไปหนึ่งขั้น</mark>: am/is → was, will → would, can → could, have done → had done",
   "<mark>say</mark> ไม่ต้องมีคนตามหลัง (She said that…) ส่วน <mark>tell</mark> ต้องมีคนตามหลัง (She told me that…)",
   "คำถามใช้ asked + if/whether หรือคำขึ้นต้น wh- แล้ว <mark>เรียงประโยคแบบบอกเล่า</mark>: She asked where I lived."],
  head:["คำพูดตรง","คำพูดอ้อม"],
  rows:[["\"I am tired.\"","She said (that) she was tired."],["\"I will call you.\"","He said he would call me."],["\"I have finished.\"","She said she had finished."],["\"Are you ready?\"","He asked if I was ready."],["\"Where do you live?\"","She asked where I lived."]],
  ex:[["The minister said that prices would fall next year.","รัฐมนตรีกล่าวว่าราคาจะลดลงปีหน้า"],["She told me she was leaving the company.","เธอบอกฉันว่าจะลาออกจากบริษัท"],["He asked me whether I had seen the news.","เขาถามฉันว่าเห็นข่าวหรือยัง"]],
  mist:[["She said me that she was busy.","She told me that she was busy.","มีคนตามหลังใช้ tell"],["He asked where did I live.","He asked where I lived.","คำถามอ้อมเรียงแบบประโยคบอกเล่า"],["She said she will come.","She said she would come.","ถอยเวลา will → would"]]},
 dialogue:{cast:{A:"Mint",B:"Tom"},lines:[
  ["A","Did you see the news this morning?","เห็นข่าวเมื่อเช้าไหม"],
  ["B","No, what happened?","ยังเลย เกิดอะไรขึ้น"],
  ["A","The government announced that the new train line would open next month.","รัฐบาลประกาศว่ารถไฟสายใหม่จะเปิดเดือนหน้า"],
  ["B","Really? Last year they said it would be ready much earlier.","จริงเหรอ ปีที่แล้วเขาบอกว่าจะเสร็จเร็วกว่านี้มาก"],
  ["A","I know. A reporter asked the minister why it had taken so long, and he said there had been problems with the budget.","ใช่ นักข่าวถามรัฐมนตรีว่าทำไมใช้เวลานาน เขาบอกว่ามีปัญหาเรื่องงบประมาณ"],
  ["B","Well, according to my brother, who works for the railway, they are still testing the trains.","แต่พี่ชายฉันที่ทำงานการรถไฟบอกว่ายังทดสอบรถกันอยู่เลย"]],
  q:[mc("What did the government announce?",["A new train line would open next month.","Train tickets would be cheaper.","A station had closed."],0),mc("According to the minister, why was there a delay?",["bad weather","problems with the budget","a shortage of trains"],1)]},
 practice:[
  mc("She ___ me that she was tired.",["said","told","asked"],1,"มีคน (me) ตามหลังใช้ told"),
  mc("\"I will help you.\" → He said he ___ help me.",["will","would","can"],1,"ถอยเวลา will → would"),
  fill("\"I am busy.\" → She said she ___ busy.","was","ถอยเวลา am → was"),
  mc("\"Do you like coffee?\" → He asked me ___ I liked coffee.",["that","if","what"],1,"คำถาม Yes/No ใช้ if หรือ whether"),
  mc("\"Where is the station?\" → She asked where ___.",["is the station","the station was","was the station"],1,"คำถามอ้อมเรียงแบบบอกเล่า"),
  ord("He said that he had lost his wallet","เขาบอกว่าทำกระเป๋าสตางค์หาย")],
 quiz:[fill("\"I have finished.\" → He said he ___ finished.","had"),mc("They ___ that the flight had been cancelled.",["told","said","asked"],1),mc("The officer asked us where ___ from.",["were we","we were","are we"],1)],
 role:{th:"ครูจะชวนคุยเรื่องข่าว ลองเล่าต่อข่าวหรือเรื่องที่ได้ยินมา โดยใช้ said, told และ asked",opener:"Did you hear any interesting news this week? Tell me what happened!",
  shadow:["She said that she would be late.","He told me he had lost his job.","According to the news, prices will rise.","They asked if we were ready."]},
 writing:{th:"เล่าต่อบทสนทนาหรือข่าวที่ได้ยินมา 4–5 ประโยค ใช้ reported speech",model:"Yesterday my manager told me that our team had done a great job this year. She said that the company would give everyone a bonus. My colleague asked whether we could also have an extra day off, and she said she would think about it."}},

{id:"u15",lv:4,en:"Regrets and wishes",th:"ความเสียดายและความปรารถนา",
 vocab:[
  v("regret","เสียใจ เสียดาย","v.","I regret not studying harder.","ฉันเสียดายที่ไม่ได้ตั้งใจเรียนกว่านี้"),
  v("opportunity","โอกาส","n.","This is a great opportunity for you.","นี่เป็นโอกาสที่ดีมากสำหรับคุณ"),
  v("decision","การตัดสินใจ","n.","It was a difficult decision.","มันเป็นการตัดสินใจที่ยาก"),
  v("afford","มีเงินพอจ่าย","v.","I can't afford a new car.","ฉันไม่มีเงินพอซื้อรถใหม่"),
  v("career","อาชีพการงาน","n.","She has had a successful career.","เธอประสบความสำเร็จในหน้าที่การงาน"),
  v("apply","สมัคร","v.","I applied for three jobs last week.","สัปดาห์ที่แล้วฉันสมัครงานไปสามที่"),
  v("lucky","โชคดี","adj.","You're lucky to have such good friends.","คุณโชคดีที่มีเพื่อนดีๆ แบบนี้"),
  v("wish","อยากให้ ปรารถนา","v.","I wish I could speak French.","ฉันอยากพูดภาษาฝรั่งเศสได้")
 ],
 grammar:{title:"Third conditional and wish",
  intro:["<mark>Third conditional</mark> ใช้สมมติสิ่งที่ไม่ได้เกิดขึ้นในอดีต: If + had + V3, would have + V3 เช่น If I had studied harder, I would have passed.",
   "<mark>wish + past simple</mark> ใช้กับสิ่งที่อยากให้ต่างไปจากตอนนี้: I wish I lived near the sea.",
   "<mark>wish + past perfect</mark> ใช้เสียดายสิ่งที่ผ่านไปแล้ว: I wish I had gone to the party."],
  head:["รูปแบบ","ใช้เมื่อ","ตัวอย่าง"],
  rows:[["If + had V3, would have V3","สมมติอดีตที่ไม่ได้เกิด","If I had left earlier, I wouldn't have missed the bus."],["wish + past","อยากให้ตอนนี้ต่างไป","I wish I had more time."],["wish + past perfect","เสียดายเรื่องที่ผ่านไปแล้ว","I wish I had studied harder."]],
  ex:[["If we had booked earlier, we would have got a cheaper ticket.","ถ้าเราจองเร็วกว่านี้ คงได้ตั๋วถูกกว่านี้"],["I wish I could speak Japanese.","ฉันอยากพูดภาษาญี่ปุ่นได้"],["She wishes she hadn't said that.","เธอเสียดายที่พูดแบบนั้นออกไป"]],
  mist:[["If I would have known, ...","If I had known, ...","ห้ามใช้ would ในส่วน if"],["I wish I have a car.","I wish I had a car.","wish ตามด้วยรูปอดีต"],["If I had seen you, I would say hello.","If I had seen you, I would have said hello.","สมมติอดีตต้องใช้ would have + V3"]]},
 dialogue:{cast:{A:"Jane",B:"Ploy"},lines:[
  ["A","You look a bit down. What's wrong?","ดูหงอยๆ นะ เป็นอะไรหรือเปล่า"],
  ["B","I just found out that my friend got the job I wanted. I wish I had applied earlier.","เพิ่งรู้ว่าเพื่อนได้งานที่ฉันอยากได้ เสียดายที่ไม่ได้สมัครให้เร็วกว่านี้"],
  ["A","Why didn't you?","ทำไมไม่สมัครล่ะ"],
  ["B","I wasn't sure I was good enough. If I had sent my application on time, I might have got an interview.","ไม่แน่ใจว่าตัวเองเก่งพอ ถ้าส่งใบสมัครทันเวลา อาจจะได้สัมภาษณ์ก็ได้"],
  ["A","I understand, but there will be other opportunities. Next time, don't wait!","เข้าใจนะ แต่ยังมีโอกาสอื่นอีก คราวหน้าอย่ารอนะ"],
  ["B","You're right. I just wish I were more confident.","จริงค่ะ แค่อยากมั่นใจในตัวเองมากกว่านี้"]],
  q:[mc("What does Ploy regret?",["not applying for a job earlier","leaving her old job","arguing with her friend"],0),mc("Why didn't she apply?",["She was too busy.","She wasn't sure she was good enough.","She didn't see the advertisement."],1)]},
 practice:[
  mc("If I ___ harder, I would have passed the exam.",["studied","had studied","would study"],1,"third conditional: If + had + V3"),
  mc("I wish I ___ more free time.",["have","had","will have"],1,"อยากให้ตอนนี้ต่างไป wish + past"),
  fill("If she had left earlier, she ___ the train. (not miss)","wouldn't have missed|would not have missed","would have + V3 รูปปฏิเสธ"),
  mc("I wish I ___ to the party last night. Everyone says it was great.",["went","had gone","would go"],1,"เสียดายเรื่องที่ผ่านไปแล้ว wish + had V3"),
  mc("If we had known about the traffic, we ___ the train.",["would take","would have taken","had taken"],1),
  ord("I wish I had brought my umbrella","เสียดายจังที่ไม่ได้เอาร่มมา")],
 quiz:[fill("I wish I ___ speak French. (can)","could"),mc("If he had asked me, I ___ him.",["would help","would have helped","had helped"],1),mc("She wishes she ___ so much yesterday.",["didn't eat","hadn't eaten","doesn't eat"],1)],
 role:{th:"คุยกับครูเรื่องสิ่งที่เคยเสียดาย และสิ่งที่อยากให้เป็น ใช้ I wish… และ If I had…",opener:"Everyone has a few regrets. Is there anything you wish you had done differently?",
  shadow:["I wish I had studied English earlier.","If I had known, I would have told you.","I wish I could travel more.","If we had left earlier, we wouldn't have been late."]},
 writing:{th:"เขียนเรื่องที่เสียดาย และสิ่งที่อยากให้เป็น 4–5 ประโยค",model:"When I was at university, I had a chance to study in Australia for a year, but I didn't go because I was afraid. If I had gone, my English would have improved much faster. I wish I had been braver. Now I wish I had more time to travel, so I'm saving money for a trip next year."}},

{id:"u16",lv:4,en:"Solving mysteries",th:"การคาดเดาและสรุปเหตุผล",
 vocab:[
  v("clue","เบาะแส","n.","The police found an important clue.","ตำรวจพบเบาะแสสำคัญ"),
  v("suspect","ผู้ต้องสงสัย","n.","The suspect was seen near the bank.","มีคนเห็นผู้ต้องสงสัยใกล้ธนาคาร"),
  v("mystery","ปริศนา เรื่องลึกลับ","n.","It's still a mystery who sent the letter.","ยังเป็นปริศนาว่าใครส่งจดหมายมา"),
  v("obviously","เห็นได้ชัด","adv.","Obviously, he was not happy.","เห็นได้ชัดว่าเขาไม่พอใจ"),
  v("possibly","อาจจะ เป็นไปได้","adv.","It will possibly rain tomorrow.","พรุ่งนี้ฝนอาจจะตก"),
  v("definitely","แน่นอน","adv.","I'll definitely come to your party.","ฉันไปงานเลี้ยงของคุณแน่นอน"),
  v("explanation","คำอธิบาย","n.","There must be a simple explanation.","ต้องมีคำอธิบายง่ายๆ แน่ๆ"),
  v("footprint","รอยเท้า","n.","There were footprints in the snow.","มีรอยเท้าอยู่บนหิมะ")
 ],
 grammar:{title:"Modals of deduction: must, might, can't",
  intro:["ใช้เดาอย่างมีเหตุผลจากหลักฐานที่เห็น: <mark>must</mark> = มั่นใจเกือบ 100% ว่าใช่, <mark>might / may / could</mark> = อาจจะ, <mark>can't</mark> = มั่นใจว่าไม่ใช่",
   "เดาเรื่องในอดีตใช้ modal + <mark>have + V3</mark>: She must have forgotten. / He can't have seen us.",
   "ระวัง: mustn't แปลว่า \"ห้าม\" ไม่ได้แปลว่า \"คงไม่ใช่\""],
  head:["คำ","ความมั่นใจ","ตัวอย่าง (ปัจจุบัน / อดีต)"],
  rows:[["must","มั่นใจว่าใช่","He must be tired. / He must have left."],["might / may / could","อาจจะ","She might be at home. / She might have missed the bus."],["can't","มั่นใจว่าไม่ใช่","It can't be true. / He can't have seen us."]],
  ex:[["The lights are off. They must be asleep.","ไฟปิดหมดแล้ว พวกเขาคงหลับแล้ว"],["She isn't answering. She might have left her phone at home.","เธอไม่รับสาย อาจจะลืมโทรศัพท์ไว้ที่บ้าน"],["He can't have finished already. He only started ten minutes ago.","เขาไม่น่าจะทำเสร็จแล้ว เพิ่งเริ่มไปสิบนาทีเอง"]],
  mist:[["He must to be tired.","He must be tired.","หลัง modal ไม่มี to"],["She mustn't be at home.","She can't be at home.","เดาว่าไม่ใช่ใช้ can't (mustn't = ห้าม)"],["He must forgot.","He must have forgotten.","เดาเรื่องในอดีตใช้ must have + V3"]]},
 dialogue:{cast:{A:"Tom",B:"Mint"},lines:[
  ["A","That's strange. My laptop isn't on my desk.","แปลกจัง แล็ปท็อปไม่อยู่บนโต๊ะ"],
  ["B","You must have left it in the meeting room. You were there all morning.","คุณคงลืมไว้ในห้องประชุมแน่ๆ อยู่ที่นั่นทั้งเช้าเลยนี่"],
  ["A","No, I can't have left it there. I remember bringing it back.","ไม่น่าใช่ ผมจำได้ว่าถือกลับมาแล้ว"],
  ["B","Then someone might have borrowed it. Have you asked Nok?","งั้นอาจมีคนยืมไป ถามนกหรือยัง"],
  ["A","Not yet. Oh, wait, look. There's a note: took your laptop to IT for the update, back at three, Nok.","ยังเลย อ้าว ดูสิ มีโน้ต: เอาแล็ปท็อปไปให้ไอทีอัปเดต จะเอามาคืนตอนบ่ายสาม นก"],
  ["B","Well, that explains it!","งั้นก็เข้าใจแล้ว"]],
  q:[mc("Where did Mint first think the laptop was?",["in the meeting room","on Nok's desk","in the IT department"],0),mc("Where was the laptop really?",["in the meeting room","with the IT department","in Tom's bag"],1)]},
 practice:[
  mc("He's been working for twelve hours. He ___ be exhausted.",["must","can't","might not"],0,"มีหลักฐานชัด มั่นใจว่าเหนื่อย"),
  mc("That ___ be Anna. She's on holiday in Japan.",["must","can't","might"],1,"มั่นใจว่าไม่ใช่"),
  mc("I'm not sure where Tom is. He ___ be in the canteen.",["must","might","can't"],1,"ไม่แน่ใจ ใช้ might"),
  fill("The ground is wet. It must ___ rained last night.","have","เดาเรื่องในอดีต must have + V3"),
  mc("She passed the exam easily. She ___ studied hard.",["must have","can't have","mustn't"],0),
  ord("You must have left it at home","คุณคงลืมไว้ที่บ้านแน่ๆ")],
 quiz:[mc("He didn't answer my call. He ___ asleep.",["might be","can't be","must to be"],0),fill("They can't ___ us. It was too dark. (see)","have seen"),mc("This watch ___ very expensive. It's made of gold.",["can't be","must be","mustn't be"],1)],
 role:{th:"ครูเล่าปริศนาเล็กๆ ให้ฟัง ลองช่วยเดาว่าเกิดอะไรขึ้น ใช้ must, might และ can't",opener:"Here's a little mystery: I came home yesterday and my front door was open, but nothing was missing. What do you think happened?",
  shadow:["He must be at work by now.","She might have missed the bus.","It can't be true.","They must have forgotten about the meeting."]},
 writing:{th:"เขียนคาดเดาเหตุการณ์ปริศนา 4–5 ประโยค ใช้ must, might, can't (have)",model:"My neighbour's car has been in front of his house all week, and his lights haven't been on. He must be away on holiday. He can't have gone by car, so he might have taken a flight. Or perhaps he is staying with his daughter, who lives in Chiang Mai."}},
{id:"u17",lv:5,en:"Turning points",th:"จุดเปลี่ยนและการสมมติขั้นสูง",
 vocab:[
  v("hypothetical","สมมติ","adj.","Let's consider a hypothetical situation.","ลองพิจารณาสถานการณ์สมมติ"),
  v("outcome","ผลลัพธ์","n.","Nobody could predict the outcome.","ไม่มีใครคาดเดาผลลัพธ์ได้"),
  v("circumstances","สถานการณ์ สภาพแวดล้อม","n.","Under the circumstances, you did well.","ในสถานการณ์แบบนั้น คุณทำได้ดีแล้ว"),
  v("inevitable","หลีกเลี่ยงไม่ได้","adj.","Change is inevitable.","การเปลี่ยนแปลงเป็นสิ่งที่หลีกเลี่ยงไม่ได้"),
  v("pursue","มุ่งไล่ตาม","v.","She decided to pursue a career in law.","เธอตัดสินใจเดินตามเส้นทางอาชีพกฎหมาย"),
  v("hindsight","การมองย้อนกลับไป","n.","In hindsight, I should have waited.","มองย้อนกลับไป ฉันน่าจะรอก่อน"),
  v("dilemma","สถานการณ์กลืนไม่เข้าคายไม่ออก","n.","I'm facing a real dilemma.","ฉันกำลังเจอสถานการณ์กลืนไม่เข้าคายไม่ออก"),
  v("turning point","จุดเปลี่ยน","n.","Moving abroad was a turning point in my life.","การย้ายไปต่างประเทศเป็นจุดเปลี่ยนในชีวิตฉัน")
 ],
 grammar:{title:"Mixed conditionals",
  intro:["ใช้เมื่อ <mark>เงื่อนไขกับผลอยู่คนละช่วงเวลา</mark> ต่างจาก conditional ปกติที่อยู่ช่วงเวลาเดียวกัน",
   "<b>อดีต → ปัจจุบัน</b>: If + had V3, would + V เช่น If I had taken that job, I would be living in Singapore now.",
   "<b>ปัจจุบัน → อดีต</b>: If + past simple, would have + V3 เช่น If I spoke Japanese, I would have understood the film."],
  head:["ทิศทาง","รูป","ตัวอย่าง"],
  rows:[["อดีต → ปัจจุบัน","If + had V3, would + V","If I had studied medicine, I would be a doctor now."],["ปัจจุบัน → อดีต","If + past, would have + V3","If she weren't so shy, she would have spoken at the meeting."],["เทียบ: third conditional","If + had V3, would have V3","If I had studied, I would have passed."]],
  ex:[["If I hadn't missed the flight, I would be in Tokyo right now.","ถ้าไม่ตกเครื่อง ตอนนี้คงอยู่โตเกียวแล้ว"],["If he were more organised, he wouldn't have forgotten the meeting.","ถ้าเขาเป็นคนมีระเบียบกว่านี้ คงไม่ลืมประชุม"],["In hindsight, if we had invested earlier, we would be much richer today.","มองย้อนกลับไป ถ้าลงทุนเร็วกว่านี้ ตอนนี้คงรวยกว่านี้มาก"]],
  mist:[["If I had taken the job, I would have lived in Singapore now.","If I had taken the job, I would be living in Singapore now.","ผลในปัจจุบัน (now) ใช้ would + V"],["If I would have known, ...","If I had known, ...","ห้ามใช้ would ในส่วน if"],["If I didn't lose my phone yesterday, ...","If I hadn't lost my phone yesterday, ...","เงื่อนไขในอดีตใช้ had + V3"]]},
 dialogue:{cast:{A:"Jane",B:"Tom"},lines:[
  ["A","I heard you almost moved to Australia a few years ago.","ได้ยินว่าเมื่อหลายปีก่อนคุณเกือบย้ายไปออสเตรเลีย"],
  ["B","That's right. I got a job offer in Sydney, but I turned it down because my father was ill.","ใช่ครับ ผมได้ข้อเสนองานที่ซิดนีย์ แต่ปฏิเสธไปเพราะพ่อป่วย"],
  ["A","Do you ever think about what might have happened?","เคยคิดไหมว่าถ้าไปจะเป็นยังไง"],
  ["B","Sometimes. If I had accepted the offer, I would probably be living by the beach now.","บางครั้งครับ ถ้าตอนนั้นตอบรับ ตอนนี้คงได้อยู่ริมทะเล"],
  ["A","But you wouldn't have met your wife!","แต่คุณก็คงไม่ได้เจอภรรยา"],
  ["B","True. In hindsight, it was definitely the right decision.","จริงครับ มองย้อนกลับไป มันเป็นการตัดสินใจที่ถูกแน่นอน"]],
  q:[mc("Why did Tom turn down the job?",["The salary was too low.","His father was ill.","He didn't like Sydney."],1),mc("How does Tom feel about his decision now?",["He regrets it deeply.","He thinks it was right.","He is still unsure."],1)]},
 practice:[
  mc("If I had taken that job, I ___ in London now.",["will live","would be living","had lived"],1,"เงื่อนไขอดีต ผลตอนนี้ (now) ใช้ would + V"),
  mc("If she ___ such a shy person, she would have spoken at yesterday's meeting.",["isn't","weren't","won't be"],1,"นิสัยที่ยังเป็นอยู่ (ปัจจุบัน) ส่งผลต่อเรื่องเมื่อวาน"),
  fill("If I ___ breakfast, I wouldn't be so hungry now. (have)","had had","เงื่อนไขในอดีต had + V3 (had had)"),
  mc("If we had left earlier, we ___ there by now.",["would be","would have been","will be"],0,"by now = ตอนนี้"),
  mc("If he spoke better English, he ___ the job last year.",["would get","would have got","will get"],1,"ความสามารถปัจจุบัน ส่งผลต่อเรื่องปีที่แล้ว"),
  ord("If I had saved more money I would be travelling now","ถ้าเก็บเงินได้มากกว่านี้ ตอนนี้คงได้เที่ยวอยู่")],
 quiz:[fill("If I ___ my passport, I would be on the plane now. (not lose)","hadn't lost|had not lost"),mc("If she were taller, she ___ the basketball team last year.",["would join","would have joined","had joined"],1),mc("In ___, I should have asked for help.",["hindsight","dilemma","outcome"],0)],
 role:{th:"คุยกับครูเรื่องจุดเปลี่ยนในชีวิต และจินตนาการว่าถ้าตัดสินใจต่างไป ตอนนี้ชีวิตจะเป็นอย่างไร ใช้ mixed conditionals",opener:"Let's talk about turning points. Was there a moment in your life when a different decision would have changed everything?",
  shadow:["If I had chosen a different major, I would be working in another field now.","If I were more patient, I wouldn't have argued with him.","In hindsight, it was the right decision.","That was a real turning point in my life."]},
 writing:{th:"เขียนเรื่องจุดเปลี่ยนในชีวิต 5–6 ประโยค ใช้ mixed conditionals อย่างน้อย 2 ประโยค",model:"The biggest turning point in my life was when I decided to study engineering instead of art. If I had followed my heart, I would probably be working as a designer now. However, if I weren't so practical, I wouldn't have chosen such a stable career. In hindsight, I think it was the right choice, although I still paint at weekends."}},

{id:"u18",lv:5,en:"News and formal reports",th:"ภาษาทางการในข่าวและรายงาน",
 vocab:[
  v("allegedly","ว่ากันว่า ถูกกล่าวหาว่า","adv.","He allegedly stole the money.","ว่ากันว่าเขาขโมยเงินไป"),
  v("widely","อย่างกว้างขวาง","adv.","It is widely believed that exercise improves mood.","เชื่อกันอย่างกว้างขวางว่าการออกกำลังกายช่วยให้อารมณ์ดี"),
  v("rumour","ข่าวลือ","n.","There's a rumour that the boss is leaving.","มีข่าวลือว่าหัวหน้าจะลาออก"),
  v("controversial","เป็นที่ถกเถียง","adj.","The new law is very controversial.","กฎหมายใหม่เป็นที่ถกเถียงอย่างมาก"),
  v("assume","สันนิษฐาน ทึกทัก","v.","I assumed you already knew.","ฉันนึกว่าคุณรู้อยู่แล้ว"),
  v("consider","พิจารณา ถือว่า","v.","She is considered one of the best doctors.","เธอถือเป็นหนึ่งในหมอที่เก่งที่สุด"),
  v("reportedly","มีรายงานว่า","adv.","The company is reportedly for sale.","มีรายงานว่าบริษัทกำลังจะถูกขาย"),
  v("spokesperson","โฆษก","n.","A spokesperson confirmed the news.","โฆษกยืนยันข่าวนี้")
 ],
 grammar:{title:"Passive reporting: It is said that… / X is said to…",
  intro:["ภาษาข่าวและงานเขียนวิชาการมักเลี่ยงการบอกว่าใครพูด จึงใช้ passive reporting",
   "<mark>It + is/was + said/believed/thought/reported + that…</mark> เช่น It is said that the castle is haunted.",
   "<mark>Subject + is said/believed + to V</mark> สำหรับปัจจุบัน หรือ <mark>to have + V3</mark> สำหรับอดีต เช่น He is believed to have left the country."],
  head:["รูปแบบ","ตัวอย่าง"],
  rows:[["It is said that + ประโยค","It is said that he is very rich."],["S + is said to + V (ปัจจุบัน)","He is said to be very rich."],["S + is said to have + V3 (อดีต)","He is said to have made his money in property."]],
  ex:[["It is estimated that ten million people visit the city every year.","คาดว่ามีคนมาเที่ยวเมืองนี้ปีละสิบล้านคน"],["The company is reported to be planning job cuts.","มีรายงานว่าบริษัทกำลังวางแผนลดพนักงาน"],["The painting is thought to have been stolen in 1990.","เชื่อกันว่าภาพวาดถูกขโมยไปเมื่อปี 1990"]],
  mist:[["He is said that he is rich.","He is said to be rich.","ขึ้นต้นด้วยคน ต้องตามด้วย to V (หรือใช้ It is said that…)"],["She is believed to leave yesterday.","She is believed to have left yesterday.","เหตุการณ์ในอดีตใช้ to have + V3"],["It says that the museum is closed.","It is said that the museum is closed.","ต้องใช้ passive (is said)"]]},
 dialogue:{cast:{A:"Mint",B:"Ploy"},lines:[
  ["A","Have you read about the new airport project?","อ่านข่าวโครงการสนามบินใหม่หรือยัง"],
  ["B","Yes. It's reported to be the most expensive project in the country's history.","อ่านแล้ว มีรายงานว่าเป็นโครงการที่แพงที่สุดในประวัติศาสตร์ประเทศ"],
  ["A","And it's controversial, too. Some people are worried about the environment.","แถมยังเป็นที่ถกเถียงด้วย บางคนกังวลเรื่องสิ่งแวดล้อม"],
  ["B","Apparently, thousands of trees are expected to be cut down.","ได้ยินว่าต้นไม้หลายพันต้นจะถูกตัด"],
  ["A","A spokesperson said they would plant new forests elsewhere, but not everyone believes that.","โฆษกบอกว่าจะปลูกป่าใหม่ที่อื่น แต่ไม่ใช่ทุกคนจะเชื่อ"],
  ["B","Well, the project is thought to create around twenty thousand jobs, so many people support it.","แต่เชื่อกันว่าโครงการจะสร้างงานราวสองหมื่นตำแหน่ง คนจำนวนมากเลยสนับสนุน"]],
  q:[mc("What is said about the airport project's cost?",["It is the most expensive in the country's history.","It is cheaper than expected.","It has not been decided."],0),mc("Why do many people support the project?",["It will protect forests.","It is expected to create jobs.","It will reduce traffic."],1)]},
 practice:[
  mc("It ___ that the new law will reduce crime.",["is believed","believes","is believing"],0),
  mc("The singer is said ___ two million records last year.",["to sell","to have sold","selling"],1,"เหตุการณ์ในอดีต to have + V3"),
  fill("The bridge is thought ___ the oldest in Europe. (be)","to be"),
  mc("___ is reported that the talks have failed.",["There","It","He"],1),
  mc("The thief is believed ___ the country.",["to leave","to have left","has left"],1),
  ord("It is said that the house is haunted","ว่ากันว่าบ้านหลังนี้มีผีสิง")],
 quiz:[fill("The company is expected ___ its profits this year. (double)","to double"),mc("It ___ that over 500 people attended.",["is estimated","estimates","is estimating"],0),mc("He is thought ___ his job last month.",["to lose","to have lost","lost"],1)],
 role:{th:"ครูรับบทนักข่าวสัมภาษณ์คุณเรื่องข่าวในเมือง ลองเล่าข่าวแบบทางการด้วย It is said that… และ is believed to…",opener:"Good evening. We're here to discuss the rumours about the new shopping mall in your area. What have you heard about it?",
  shadow:["It is said that the mall will open next year.","The project is believed to cost billions.","He is reported to have resigned.","It is widely thought that prices will rise."]},
 writing:{th:"เขียนรายงานข่าวสั้นๆ 5 ประโยค ใช้ passive reporting อย่างน้อย 3 ครั้ง",model:"A rare white elephant has reportedly been seen in a national park in the north. It is believed to have walked across the border from Laos. According to rangers, the elephant is thought to be around ten years old. It is estimated that hundreds of tourists have already visited the area. Officials are expected to announce new rules to protect the animal."}},

{id:"u19",lv:5,en:"Getting your point across",th:"การเน้นย้ำใจความ",
 vocab:[
  v("genuinely","อย่างแท้จริง","adv.","I'm genuinely sorry.","ฉันขอโทษจากใจจริง"),
  v("absolutely","อย่างที่สุด แน่นอน","adv.","You're absolutely right.","คุณพูดถูกที่สุด"),
  v("particularly","โดยเฉพาะ","adv.","I particularly enjoyed the music.","ฉันชอบดนตรีเป็นพิเศษ"),

const DAY=864e5;

/* ---------- state & saving ---------- */
const KEY="eng-class-v1";
function fresh(){return {v:1,updatedAt:0,name:"",xp:0,days:[],placement:{done:false,level:1,score:0},lessons:{},words:{},exams:[],mistakes:[],custom:[],stats:{},settings:{slow:false,rate:"normal",accent:"US",goal:"normal"}}}
function migrate(s){
  const f=fresh(); if(!s||typeof s!=="object") return f;
  return Object.assign(f,s,{placement:Object.assign(f.placement,s.placement||{}),settings:Object.assign(f.settings,s.settings||{}),
    lessons:s.lessons&&typeof s.lessons==="object"?s.lessons:{},words:s.words&&typeof s.words==="object"?s.words:{},days:Array.isArray(s.days)?s.days:[],exams:Array.isArray(s.exams)?s.exams:[]});
}
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw) S=migrate(JSON.parse(raw));}catch(e){}
const cloud={ref:null,timer:null,writing:false,again:false,on:false};
function save(){
  trackXp(); S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cloud.ref){clearTimeout(cloud.timer);cloud.timer=setTimeout(flushCloud,1200)}
  if(NB){clearTimeout(save.nt);save.nt=setTimeout(()=>{NB.save(JSON.stringify(S)).catch(()=>{})},300)}
}
async function flushCloud(){
  if(!cloud.ref) return;
  if(cloud.writing){cloud.again=true;return}
  cloud.writing=true;
  try{await cloud.ref.set(JSON.parse(JSON.stringify(S)))}
  catch(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){cloud.ref=null;cloud.on=false}}
  finally{cloud.writing=false;if(cloud.again){cloud.again=false;flushCloud()}}
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    cloud.ref=ref; cloud.on=true;
    if(snap.exists){
      const d=snap.data()||{};
      if((d.updatedAt||0)>(S.updatedAt||0)){
        S=migrate(JSON.parse(JSON.stringify(d)));
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(route.name!=="lesson") render(); else updateChrome();
      } else if((S.updatedAt||0)>(d.updatedAt||0)) flushCloud();
    } else if(S.updatedAt) flushCloud();
    if(route.name==="report") render();
  }catch(e){}
}

function rec(id){return S.lessons[id]||(S.lessons[id]={reached:0,done:false,best:0,stars:0})}
function isDone(i){const r=S.lessons[COURSE[i].id];return !!(r&&r.done)}
function firstOfLevel(lv){return COURSE.findIndex(u=>u.lv===lv)}
function unlocked(i){return i===0||isDone(i-1)||(S.placement.done&&i<=firstOfLevel(S.placement.level))}
function nextIdx(){for(let i=0;i<COURSE.length;i++) if(unlocked(i)&&!isDone(i)) return i; return COURSE.length-1}
function markDay(){const k=dayKey(); if(!S.days.includes(k)){S.days.push(k); if(S.days.length>400) S.days=S.days.slice(-400)}}
function streak(){
  const set=new Set(S.days); let d=new Date(); if(!set.has(dayKey(d))) d=new Date(Date.now()-DAY);
  let n=0; while(set.has(dayKey(d))){n++; d=new Date(d.getTime()-DAY)} return n;
}
function addWords(u){let added=0;u.vocab.forEach(w=>{if(!S.words[w.en]){S.words[w.en]={b:0,due:Date.now()};added++}});return added}
function dueWords(){const now=Date.now();return Object.keys(S.words).filter(k=>WORDS[k]&&S.words[k].due<=now)}

/* ---------- speech ---------- */
const Speech={
  ok:!!NB||"speechSynthesis" in window, voices:[],
  init(){if(NB||!this.ok) return; const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang))}catch(e){}}; load(); try{speechSynthesis.addEventListener("voiceschanged",load)}catch(e){}},
  pick(i){const acc=S.settings.accent==="GB"?/en[-_]GB/i:/en[-_]US/i; let pref=this.voices.filter(x=>acc.test(x.lang)); if(!pref.length) pref=this.voices.filter(x=>/en[-_](US|GB)/i.test(x.lang)); const l=pref.length?pref:this.voices; return l.length?l[i%l.length]:null},
  stop(){if(NB){NB.stopSpeak();return} if(this.ok) try{speechSynthesis.cancel()}catch(e){}},
  say(text,o){
    o=o||{};
    if(NB) return NB.speak(text,{rate:o.slow||S.settings.slow?0.7:(RATES[S.settings.rate]||0.95),pitch:o.pitch||1}).catch(()=>{});
    return new Promise(res=>{
      if(!this.ok){toast("เบราว์เซอร์นี้ยังอ่านออกเสียงไม่ได้");return res()}
      try{
        const u=new SpeechSynthesisUtterance(text); u.lang=S.settings.accent==="GB"?"en-GB":"en-US";
        const vc=this.pick(o.voice||0); if(vc) u.voice=vc;
        u.rate=o.slow||S.settings.slow?0.72:(RATES[S.settings.rate]||0.95); u.pitch=o.pitch||1;
        let done=false; const fin=()=>{if(!done){done=true;res()}};
        u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(2500,text.length*140));
        speechSynthesis.speak(u);
      }catch(e){res()}
    });
  }
};
Speech.init();
