  passage:{title:"Will Robots Take Our Jobs?",paras:[
   ["A","Few topics generate as much anxiety as the idea that machines will soon do our jobs. Newspaper headlines regularly warn that millions of positions will vanish as artificial intelligence and robots become more capable. Such fears are understandable, but in my view they rest on a misunderstanding of how technology has changed work in the past."],
   ["B","The history of the last two centuries shows a clear pattern. When the first mechanical looms appeared in English textile mills, weavers protested that they would all be unemployed. Some did lose their livelihoods, and the transition was painful for individual families. Yet over the following decades, cheaper cloth increased demand, and far more people ended up working in the textile industry than before. Similar stories can be told about the tractor, the telephone switchboard and the personal computer."],
   ["C","The reason is that technology rarely replaces an entire job; instead, it takes over particular tasks. Bank cash machines, for example, did not eliminate bank tellers. Because each branch needed fewer tellers, banks opened more branches, and tellers moved away from counting money towards advising customers. The number of tellers in the United States actually rose for several decades after cash machines were introduced."],
   ["D","Nevertheless, it would be foolish to assume that the future will simply repeat the past. Today's artificial intelligence can perform tasks that were once thought to require human judgement, such as translating documents, writing computer code and analysing medical scans. The speed of change is also greater: earlier technologies spread over generations, whereas new software can be adopted by millions of businesses within a few years."],
   ["E","For this reason, I believe governments should focus less on predicting which jobs will disappear and more on helping workers adapt. Adult education is the most important tool. Too many training programmes are designed for young people at the start of their careers, while workers in their forties and fifties receive little support. Short, flexible courses, partly funded by employers, would allow people to learn new skills without giving up their income."],
   ["F","Individuals, too, can prepare. The skills that machines find hardest to copy are those involving creativity, complex communication and care for other people. Nurses, teachers and skilled tradespeople are unlikely to be replaced soon. Rather than fearing technology, workers should look for ways to use it to become more productive in their current roles."]]},

 {kind:"passage",title:"Reading Passage 1",dir:"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.",dirTh:"อ่านบทความแล้วตอบคำถาม 13 ข้อ",
  passage:{title:"The Return of the Night Train",paras:[
   ["A","For much of the twentieth century, overnight trains were a normal way to travel across Europe. Passengers could board in Paris in the evening and wake up in Vienna or Rome the next morning. By the early 2000s, however, many of these services had disappeared. Low-cost airlines offered cheaper and faster journeys, and railway companies found sleeper trains expensive to operate, since each carriage carries far fewer passengers than an ordinary one."],
   ["B","In the last decade, the trend has reversed. Austria's national railway began taking over routes that other companies had abandoned, and new private operators have launched services between cities such as Amsterdam, Berlin and Prague. Several governments have supported these services with subsidies, arguing that they reduce carbon emissions."],
   ["C","The environmental case is strong. According to one estimate, a journey by night train produces less than a tenth of the carbon dioxide of the same trip by plane. For travellers who are worried about climate change, this is a powerful reason to choose the train, even if the journey takes longer."],
   ["D","Convenience also plays a part. Although a flight may take only two hours, passengers must travel to an airport outside the city, arrive well before departure and pass through security checks. A night train, by contrast, leaves from the city centre and arrives in the city centre, and the time on board is spent sleeping rather than waiting. Many business travellers also value saving the cost of a hotel room."],
   ["E","Problems remain. Tickets for a private sleeping compartment can cost more than a flight, and demand is so high on popular routes that trains are often fully booked weeks in advance. Operators also complain that a shortage of modern sleeping carriages limits how quickly they can expand, as new carriages take years to design and build."]]},

   {type:"tfng",dir:"Do the following statements agree with the information given in Reading Passage 1? Write TRUE, FALSE or NOT GIVEN.",dirTh:"TRUE = ตรงกับบทความ, FALSE = ขัดกับบทความ, NOT GIVEN = ไม่ได้พูดถึง",
    items:[{q:"Sleeper carriages carry more passengers than ordinary carriages.",a:"F",why:"ย่อหน้า A: far fewer passengers"},
     {q:"Austria's national railway took over routes that other companies had stopped running.",a:"T",why:"ย่อหน้า B: taking over routes that other companies had abandoned"},
     {q:"The night train between Amsterdam and Prague is the most popular route in Europe.",a:"NG",why:"บทความไม่ได้บอกว่าเส้นทางไหนนิยมที่สุด"},
     {q:"A night train journey produces about half the carbon dioxide of a flight.",a:"F",why:"ย่อหน้า C: less than a tenth ไม่ใช่ครึ่งหนึ่ง"},

 writing:{title:"Writing",th:"การเขียน",time:60*60,est:"60 นาที",kind:"writing",
  intro:["Task 1 อธิบายกราฟเส้น อย่างน้อย 150 คำ และ Task 2 เรียงความแบบสาเหตุและทางแก้ อย่างน้อย 250 คำ","ส่งให้ครู AI ประเมินได้ทีละ Task"],
  tasks:[
   {n:1,min:150,mins:20,prompt:"The graph below shows the average number of hours per week that people in one country spent on three leisure activities between 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
    chart:{type:"line",title:"Average hours per week spent on leisure activities",unit:"hours",max:20,step:5,years:["2000","2005","2010","2015","2020"],series:[{name:"Watching TV",v:[15,14,12,10,8]},{name:"Using the internet",v:[2,5,9,13,17]},{name:"Reading",v:[5,4.5,4,3.5,3]}]},
    model:"The line graph illustrates how many hours per week people in one country spent watching television, using the internet and reading between 2000 and 2020.\n\nOverall, watching television and reading both became less popular over the period, while internet use rose dramatically and overtook television to become the most time-consuming activity.\n\nIn 2000, people spent 15 hours a week watching TV, far more than the time spent reading (5 hours) or online (just 2 hours). Over the next two decades, television viewing fell steadily, dropping to 10 hours in 2015 and 8 hours by 2020.\n\nBy contrast, internet use grew rapidly, reaching 9 hours in 2010. The two lines crossed shortly after 2010, and by the end of the period people were spending 17 hours a week online, more than double the figure for television. Reading showed a slow but continuous decline, falling from 5 hours to only 3 hours in 2020."},
   {n:2,min:250,mins:40,prompt:"In many countries, children now spend more time using electronic devices than playing outdoors. What are the causes of this? What can be done to encourage children to spend more time outside?",
    model:"It is increasingly common for children to spend their free time looking at screens rather than playing outside. In my view, this trend has several causes, but there are also practical steps that parents, schools and governments can take to reverse it.\n\nThe most obvious cause is the attraction of the devices themselves. Games and video apps are designed to be highly engaging, with constant rewards that make it difficult for children to stop. Another reason is that many parents are busy and find that a tablet keeps their children quiet and safe at home. In addition, cities have become more crowded, and in many neighbourhoods there are few parks or safe places where children can play without supervision. Parents who worry about traffic or strangers may therefore prefer to keep their children indoors.\n\nThere are, however, several ways to encourage outdoor activity. Firstly, parents can set clear limits on screen time and act as role models by going outside with their children, for example by cycling or visiting parks at weekends. Secondly, schools can include more outdoor lessons and sports in the timetable, and organise clubs such as gardening or hiking. Finally, local governments should invest in safe, attractive public spaces. When a neighbourhood has a well-maintained playground close to home, children are far more likely to use it.\n\nIn conclusion, children spend so much time on devices because the technology is appealing, parents are busy and safe outdoor spaces are limited. By combining sensible family rules, active schools and better public facilities, society can help children enjoy the benefits of playing outside."}]},

   {part:1,title:"Part 1: Introduction and interview",th:"คำถามทั่วไป ตอบ 2–3 ประโยค ขยายด้วยเหตุผลหรือตัวอย่าง",qs:["Let's talk about what you do. Do you work, or are you a student?","What do you enjoy most about your work or studies?","Do you like cooking? Why or why not?","What kind of food is popular in your country?"]},
   {part:2,title:"Part 2: Long turn",th:"เตรียม 1 นาที แล้วพูดต่อเนื่อง 1–2 นาที ให้ครบทุกข้อในบัตร",
    card:{topic:"Describe a place you visited that you would like to go back to.",points:["where it is","when you went there","what you did there"],end:"and explain why you would like to go back."},
    model:"The place I'd like to talk about is Chiang Mai, in the north of Thailand. I went there about two years ago with three friends from university during the cool season, which is the best time to visit. We stayed for five days. On the first day, we explored the old city and visited some beautiful temples. We also went to the Sunday walking street, where we tried lots of local food, such as khao soi, a curry noodle soup that I absolutely loved. Later in the trip, we drove up Doi Suthep mountain early in the morning to watch the sunrise, and it was one of the most peaceful moments I've ever experienced. The reason I'd like to go back is that I feel I only saw a small part of the region. Next time, I'd love to stay in a village in the mountains and learn more about the local culture. Also, the pace of life there is much slower than in Bangkok, so it's the perfect place to relax and recharge."},

{writing:{title:"Writing",th:"การเขียน",time:60*60,est:"60 นาที",kind:"writing",

  tasks:[
   {n:1,min:150,mins:20,prompt:"The table below shows the number of international tourists (in millions) who visited five countries in 2013 and 2023. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
    table:{title:"International tourist arrivals (millions)",note:"ข้อมูลสมมติสำหรับฝึก",cols:["Country","2013","2023"],rows:[["Thailand","26.5","28.2"],["Malaysia","25.7","20.1"],["Singapore","15.6","13.6"],["Japan","10.4","25.1"],["Vietnam","7.6","12.6"]]},
    model:"The table compares the number of international tourists, in millions, who visited five Asian countries in 2013 and 2023.\n\nOverall, three of the five countries received more visitors in 2023 than a decade earlier, with Japan showing by far the largest increase. Thailand remained the most popular destination in both years.\n\nIn 2013, Thailand and Malaysia attracted similar numbers of tourists, at 26.5 million and 25.7 million respectively. Ten years later, Thailand's figure had risen slightly to 28.2 million, whereas Malaysia's fell to 20.1 million.\n\nJapan experienced remarkable growth, with visitor numbers more than doubling from 10.4 million to 25.1 million, which made it the second most visited country in 2023. Vietnam also grew considerably, from 7.6 million to 12.6 million. Singapore, on the other hand, saw a modest decline, from 15.6 million to 13.6 million."},
   {n:2,min:250,mins:40,prompt:"Many young people take a year off between finishing school and starting university in order to work or travel. Do the advantages of this outweigh the disadvantages?",
    model:"In many countries, it has become popular for school leavers to spend a year working or travelling before they start university. While this choice has some drawbacks, I believe that the advantages are greater, provided that the year is planned carefully.\n\nThe main benefit of a gap year is the personal growth it offers. Young people who travel alone or work in a new environment learn to manage money, solve problems and communicate with people from different backgrounds. These skills are rarely taught in school, but they are highly valued by universities and employers. A gap year can also help students choose the right course. Many eighteen-year-olds are unsure what they want to study, and a year of work experience may show them which career really suits them, reducing the risk of dropping out later.\n\nThere are, of course, some disadvantages. Travelling can be expensive, and not every family can afford it. Some students may also lose the habit of studying and find it difficult to return to academic work after a year away. In addition, starting university a year later means entering the job market later, which could delay financial independence.\n\nHowever, most of these problems can be avoided with good planning. Students can work for part of the year to pay for their travel, and they can keep up their studies through online courses or reading. In this way, a gap year becomes a productive period rather than a long holiday.\n\nIn conclusion, although a gap year involves some costs and risks, the independence, maturity and clearer direction it can provide mean that its advantages outweigh its disadvantages."}]},

   {part:2,title:"Part 2: Long turn",th:"เตรียม 1 นาที แล้วพูดต่อเนื่อง 1–2 นาที ให้ครบทุกข้อในบัตร",

  passage:{title:"From Medicine to Morning Cup: A Short History of Tea",paras:[
   ["A","Tea is now the most widely consumed drink in the world after water, but it began as a medicine. According to Chinese legend, the emperor Shen Nong discovered tea nearly five thousand years ago when leaves from a wild tree blew into a pot of water he was boiling. Whether or not the story is true, early written records show that tea was first valued for its supposed health benefits, and doctors prescribed it to treat tiredness and headaches."],
   ["B","By the time of the Tang dynasty, in the eighth century, tea had become an everyday drink in China. A writer named Lu Yu produced the first book devoted entirely to tea, describing how it should be grown, prepared and served. At this time, tea leaves were usually pressed into hard bricks, which were easy to transport and could even be used as money in some remote regions."],
   ["C","Tea reached Europe in the early seventeenth century, brought by Dutch traders. At first it was extremely expensive and was kept in locked boxes. In England, it became fashionable after the Portuguese princess Catherine of Braganza, who married King Charles II in 1662, made it popular at court. Some doctors, however, warned that drinking too much tea could damage a woman's beauty, a claim that did little to reduce demand."],
   ["D","In the 1840s, Anna, Duchess of Bedford, began to feel hungry in the late afternoon, since dinner was served as late as eight o'clock. She asked for tea and a light meal to be brought to her room, and soon started inviting friends to join her. The custom of afternoon tea spread quickly among wealthy families and later became a national tradition."],
   ["E","Britain's growing demand created a problem, because almost all tea came from China, which would accept only silver in payment. To reduce this dependence, the British began growing tea in India, establishing huge plantations in Assam and Darjeeling. Within fifty years, India had overtaken China as Britain's main supplier, and tea had changed from a luxury into a drink enjoyed by people of every social class."]]},
  groups:[

    items:[{q:"Tea was originally used to treat health problems.",a:"T",why:"ย่อหน้า A: doctors prescribed it to treat tiredness and headaches"},

     {q:"Dutch traders made large profits from selling tea in Europe.",a:"NG",why:"ย่อหน้า C บอกแค่ว่าพ่อค้าดัตช์นำชาเข้ามา ไม่ได้พูดถึงกำไร"},

     {q:"a traditional story about how tea was discovered",a:"A",why:"According to Chinese legend ... Shen Nong"}]},

 Object.assign({kind:"mc",title:"Part 5: Incomplete Sentences",items:[
  {q:"The software update will be installed ___ the weekend to avoid disrupting work.",o:["between","among","along","over"],a:3,why:"over the weekend = ในช่วงสุดสัปดาห์ ส่วน between และ among ใช้กับของตั้งแต่สองสิ่งขึ้นไป"},
  {q:"Neither the manager ___ her assistant was available to answer questions.",o:["nor","or","and","but"],a:0,why:"neither ต้องคู่กับ nor เสมอ (neither A nor B = ทั้ง A และ B ต่างก็ไม่...)"},
  {q:"When the shipment was delayed, the sales team contacted customers ___.",o:["immediate","immediacy","immediately","more immediate"],a:2,why:"ขยายกริยา contacted ต้องใช้ adverb คือ immediately (ทันที) ส่วน immediate เป็น adjective"},
  {q:"Ms. Rao has worked at the law firm ___ 2019.",o:["for","since","from","during"],a:1,why:"since + จุดเริ่มต้นของเวลา ใช้คู่กับ present perfect ส่วน for ใช้กับช่วงเวลา เช่น for five years"},
  {q:"The gym offers a free trial class to anyone ___ is interested in joining.",o:["whose","whom","which","who"],a:3,why:"anyone เป็นคน และช่องว่างทำหน้าที่ประธานของ is จึงใช้ who ส่วน whom เป็นกรรม และ which ใช้กับสิ่งของ"},
  {q:"If the order ___ by noon, it will be delivered the next day.",o:["places","is placed","placing","will place"],a:1,why:"คำสั่งซื้อถูกสั่ง ต้องเป็น passive และประโยค if ของเงื่อนไขแบบที่ 1 ใช้ present simple ไม่ใช้ will"},
  {q:"The conference room is too small ___ all the participants.",o:["to hold","holding","for hold","hold"],a:0,why:"too + adjective + to V = ...เกินกว่าจะ... (ห้องเล็กเกินกว่าจะจุผู้เข้าร่วมทั้งหมด)"},
  {q:"Please keep your receipt ___ you need to return the item.",o:["so that","although","in case","unless"],a:2,why:"in case = เผื่อว่า (เก็บใบเสร็จไว้เผื่อต้องคืนของ) ส่วน unless = เว้นแต่ ความหมายไม่เข้า"},
  {q:"The new restaurant has received very ___ reviews since it opened.",o:["favor","favorably","favorite","favorable"],a:3,why:"หน้าคำนาม reviews ต้องเป็น adjective คือ favorable (ในทางที่ดี) ส่วน favorite แปลว่าชอบที่สุด ความหมายไม่เข้ากับบทวิจารณ์"},
  {q:"Mr. Lee suggested ___ the product launch until testing is complete.",o:["to postpone","postpone","postponing","postponed"],a:2,why:"suggest + V-ing ห้ามใช้ suggest + to V ซึ่งเป็นตัวหลอกที่คนไทยมักพลาด"}]},P5DIR),

 {kind:"sets",listen:true,title:"Part 3",dir:"Choose the correct letter, A, B or C.",dirTh:"ฟังนักศึกษาสองคนคุยกันเรื่องรายงานทัศนศึกษาที่พื้นที่ชุ่มน้ำ แล้วเลือกคำตอบ",
  sets:[{audio:[["W","Hi, Tom. Have you had a chance to read the draft of our field trip report on the wetland visit?"],["M","Yes, I read it last night. The introduction's fine, but I think the section on water quality is a bit weak. We only have results from two sites."],["W","Well, we actually collected samples from three sites, but one of the bottles broke on the way back, so we lost that sample. I think we just need to explain that in the limitations section."],["M","Good point. Now, the bird survey. Our numbers were much lower than the reserve's own counts. I assumed it was because of the rain."],["W","It only rained for about ten minutes, though. The ranger told us that the real reason was the time of day. We were there around midday, when most birds are resting in the reeds. Early morning is much better for counting."],["M","Ah, I'd forgotten that. We should mention it. What about the photos? We've got about sixty."],["W","The tutor said no more than ten. There are some nice ones of the group, and a couple of a heron, but I think we should choose the ones that show the different habitats, like the reed beds and the open water."],["M","Agreed. So how shall we divide the rest of the work? I could write the conclusion."],["W","Actually, I'd rather you did the graphs, since you're so much better with the spreadsheet than I am. I'll write the conclusion and the recommendations."],["M","OK, fair enough."]],

       {q:"What will Tom do next?",o:["write the conclusion","make the graphs","write the recommendations"],a:1,why:"Tom เสนอเขียนบทสรุป แต่เพื่อนขอให้ทำ graphs ส่วนเพื่อนเขียนบทสรุปและข้อเสนอแนะเอง"}]}]},
 {kind:"form",title:"Part 4",max:1,dir:"Complete the notes below. Write ONE WORD ONLY for each answer.",dirTh:"ฟังการบรรยายเรื่องการนอนของสัตว์ แล้วเติมโน้ต 1 คำเท่านั้น",
  audio:[["N","In today's lecture, I'm going to look at sleep in the animal kingdom. Scientists used to think that only animals with large brains needed to sleep. However, every animal that has been carefully studied so far shows some form of sleep, including very simple creatures such as jellyfish, which have no brain at all. Some animals sleep in remarkable ways. Dolphins, for example, need to stay partly alert all the time, so only one half of the brain sleeps at a time. The other half remains awake, which allows the dolphin to keep swimming and to rise to the surface to breathe. Some birds do something similar. Ducks sleeping at the edge of a group often keep one eye open, facing outwards, so that they can watch for predators. The amount of sleep animals need also varies enormously. Some bats sleep for up to twenty hours a day, whereas giraffes may sleep for less than five. In general, large grazing animals sleep less, partly because their food is low in nutrients, so they must spend many hours eating. So why do animals sleep at all? There is no single answer, but one leading theory is that sleep gives the brain a chance to clear away waste products that build up during the day."]],
  formTitle:"SLEEP IN ANIMALS",
  rows:[
   {label:"Which animals sleep?",pre:"even simple creatures such as",post:"show some form of sleep",a:"jellyfish",why:"very simple creatures such as jellyfish"},
   {label:"Dolphins",pre:"only one",post:"of the brain sleeps at a time",a:"half",why:"only one half of the brain sleeps at a time"},
   {label:"Reason",pre:"this allows them to rise to the surface to",a:"breathe",why:"rise to the surface to breathe"},
   {label:"Ducks",pre:"keep one eye open to watch for",a:"predators",why:"so that they can watch for predators"},
   {label:"Grazing animals",pre:"sleep less because their food is low in",a:"nutrients",why:"their food is low in nutrients (ตัวเลข 20 และ 5 ชั่วโมงเป็นข้อมูลของค้างคาวและยีราฟ ไม่ได้ถาม)"},
   {label:"Why sleep?",pre:"the brain clears away",post:"products",a:"waste",why:"clear away waste products that build up during the day"}]}]},
reading:{title:"Reading",th:"การอ่าน",time:20*60,est:"20 นาที",
 intro:["บทความ 1 เรื่อง 13 ข้อ: True/False/Not Given, หาย่อหน้าที่มีข้อมูล และเติมประโยค","จับเวลา 20 นาทีต่อบทความเท่ากับข้อสอบจริง"],
 parts:[
 {kind:"passage",title:"Reading Passage 1",dir:"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.",dirTh:"อ่านบทความแล้วตอบคำถาม 13 ข้อ",
  passage:{title:"Saving Seeds for the Future",paras:[
   ["A","For thousands of years, farmers saved seeds from their best plants and sowed them the following season. As a result, every region developed its own local varieties of wheat, rice, maize and beans, each suited to the local soil and climate. During the twentieth century, however, most farmers replaced these traditional varieties with a small number of modern, high-yield crops. According to some estimates, around three-quarters of the genetic diversity of crops was lost in this way. This matters because a forgotten local variety may carry genes that allow it to survive drought or resist a particular disease, qualities that plant breeders may urgently need in the future."],
   ["B","Seed banks were created to prevent further losses. Their basic method is surprisingly simple. Seeds are cleaned, dried until they contain very little water, sealed in foil packets and stored in freezers at about minus 18 degrees Celsius. Under these conditions, the seeds of many species remain alive for decades, and some for much longer. Every few years, a small number of seeds from each sample are tested to see whether they will still grow. If the germination rate starts to fall, the seeds are planted and a fresh supply is collected, a process known as regeneration."],
   ["C","The best-known facility is the Svalbard Global Seed Vault, which opened in 2008 on a remote Norwegian island about 1,300 kilometres from the North Pole. The vault is cut deep into a mountain, where the surrounding frozen ground would keep the seeds cold even if the electricity supply failed. Svalbard is not an ordinary seed bank but a backup. National and regional seed banks send it duplicate copies of their collections, which now total more than a million samples. The arrangement works rather like a safety deposit box at a bank: the depositors still own their seeds, and only they can take them out."],
   ["D","For several years, nobody needed to. Then, in 2015, an agricultural research centre in Aleppo, Syria, became the first organisation to make a withdrawal. The civil war had made it impossible for its scientists to reach their own collection of wheat, barley and lentils. Using the copies stored at Svalbard, they planted the seeds at new research stations in Lebanon and Morocco, and later sent freshly harvested seeds back to the vault to replace those they had taken."],
   ["E","Seed banks do have limitations. Not all seeds can survive being dried. The seeds of avocado, cocoa and mango, for instance, die if they lose too much water. For such species, scientists must remove the embryo and freeze it in liquid nitrogen at around minus 196 degrees, a technique that is expensive and requires highly skilled staff. A second problem is that a frozen seed stops changing. Crops growing in fields continue to adapt to changing temperatures and new pests, but seeds in a freezer cannot."],
   ["F","For this reason, many experts argue that seed banks should be combined with conservation on farms. In the mountains of Peru, for example, local communities in an area known as the Potato Park grow hundreds of traditional potato varieties, sharing seeds and knowledge between villages. Supporters of this approach believe that seed banks are best seen as an insurance policy, not as a replacement for the farmers who keep crop diversity alive."]]},
  groups:[
   {type:"tfng",dir:"Do the following statements agree with the information given in Reading Passage 1? Write TRUE, FALSE or NOT GIVEN.",dirTh:"TRUE = ตรงกับบทความ, FALSE = ขัดกับบทความ, NOT GIVEN = ไม่ได้พูดถึง",
    items:[{q:"Most farmers continued to grow traditional crop varieties throughout the twentieth century.",a:"F",why:"ย่อหน้า A: most farmers replaced these traditional varieties ตรงข้ามกับข้อความ"},
     {q:"Seed bank staff check stored seeds from time to time to find out whether they can still grow.",a:"T",why:"ย่อหน้า B: Every few years ... tested to see whether they will still grow"},
     {q:"The seeds at Svalbard would stay cold even without electricity.",a:"T",why:"ย่อหน้า C: frozen ground would keep the seeds cold even if the electricity supply failed"},
     {q:"Any country is allowed to withdraw seeds that another country has deposited at Svalbard.",a:"F",why:"ย่อหน้า C: only they (ผู้ฝากเอง) can take them out"},
     {q:"The withdrawal made by the Aleppo research centre is the largest in the vault's history.",a:"NG",why:"ย่อหน้า D บอกว่าเป็นการเบิกครั้งแรก (first) แต่ไม่ได้บอกว่าใหญ่ที่สุด"}]},
   {type:"select",opts:PARA6,dir:"Reading Passage 1 has six paragraphs, A–F. Which paragraph contains the following information? You may use any letter more than once.",dirTh:"หาว่าข้อมูลแต่ละข้ออยู่ในย่อหน้าไหน ตัวอักษรเดียวกันใช้ซ้ำได้",
    items:[{q:"a comparison between a seed store and a service offered by banks",a:"C",why:"rather like a safety deposit box at a bank"},
     {q:"the reason why scientists could not use their own seed collection",a:"D",why:"The civil war had made it impossible for its scientists to reach their own collection"},
     {q:"examples of seeds that cannot survive being dried",a:"E",why:"The seeds of avocado, cocoa and mango ... die if they lose too much water"},
     {q:"an example of communities protecting crop diversity themselves",a:"F",why:"local communities in ... the Potato Park grow hundreds of traditional potato varieties"}]},
   {type:"gap",max:2,dir:"Complete the sentences below. Choose NO MORE THAN TWO WORDS from the passage for each answer.",dirTh:"เติมคำจากบทความ ไม่เกิน 2 คำ",
    items:[{q:"After being cleaned and dried, seeds are sealed in ___ and frozen.",a:"foil packets|packets",show:"foil packets",why:"ย่อหน้า B: sealed in foil packets"},
     {q:"Planting old seeds to collect a fresh supply is called ___.",a:"regeneration",why:"ย่อหน้า B: a process known as regeneration"},
     {q:"The embryos of some species are frozen in ___.",a:"liquid nitrogen",why:"ย่อหน้า E: freeze it in liquid nitrogen"},
     {q:"Some experts see seed banks as an ___ rather than a replacement for farmers.",a:"insurance policy",why:"ย่อหน้า F: an insurance policy, not as a replacement (คำว่า an มีให้แล้ว)"}]}]}]},
writing:{title:"Writing",th:"การเขียน",time:60*60,est:"60 นาที",kind:"writing",
  intro:["Task 1 อธิบายกราฟแท่ง อย่างน้อย 150 คำ และ Task 2 เรียงความแสดงความคิดเห็นแบบ Agree/Disagree อย่างน้อย 250 คำ","ตัวเลขในกราฟเป็นข้อมูลสมมติสำหรับฝึกเขียน","ส่งให้ครู AI ประเมินได้ทีละ Task"],
  tasks:[
   {n:1,min:150,mins:20,prompt:"The chart below shows the percentage of shoppers in one country who mainly used cash, cards or mobile phones to pay for purchases in 2012, 2017 and 2022. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.",
    chart:{title:"Main payment method used by shoppers (%)",years:["2012","2017","2022"],series:[{name:"Cash",v:[62,38,14]},{name:"Card",v:[31,45,36]},{name:"Mobile phone",v:[7,17,50]}]},
    model:"The bar chart shows the proportion of shoppers in one country who mainly paid for their purchases with cash, cards or mobile phones in 2012, 2017 and 2022.\n\nOverall, cash declined dramatically over the decade, while mobile payment grew rapidly and had become the most popular method by 2022. Card use rose at first but then fell back.\n\nIn 2012, cash was by far the dominant method, used by 62% of shoppers, roughly double the figure for cards (31%). Only 7% paid mainly by mobile phone. Five years later, the picture had changed considerably: cards had overtaken cash, rising to 45%, while cash fell to 38% and mobile payment more than doubled to 17%.\n\nThe most striking change occurred between 2017 and 2022. Mobile payment soared to 50%, making it the preferred choice of half of all shoppers. Card use dropped back to 36%, and cash continued its steep decline, reaching just 14%, less than a quarter of its 2012 level."},
   {n:2,min:250,mins:40,prompt:"Some people believe that all employees should have the right to work from home for at least part of the week. To what extent do you agree or disagree?",
    model:"Since the pandemic, working from home has become normal for millions of office workers, and some people now argue that it should be a legal right. I largely agree that employees should be allowed to work from home for part of the week, although this right cannot apply to every job.\n\nThe strongest argument in favour is that remote work improves employees' quality of life. Many people in large cities spend two or three hours a day commuting, which is tiring and expensive. Working from home even two days a week gives this time back to them, allowing them to exercise, rest or spend time with their families. In addition, many employees find that they can concentrate better at home, away from the noise and interruptions of an open-plan office, so their productivity may actually increase.\n\nSecondly, a right to flexible work would make the job market fairer. Parents of young children, people with disabilities and those who live far from city centres often struggle to work full-time in an office. If they could work remotely for part of the week, employers would have access to a much wider pool of talent.\n\nNevertheless, I do not believe this right should be universal. Nurses, factory workers, shop assistants and bus drivers obviously cannot do their jobs from their living rooms. The law should therefore apply only to roles that can realistically be done remotely.\n\nIn conclusion, I agree that employees whose work can be done from home should have the right to do so for part of the week, as this benefits both workers and society. However, the rule must be flexible enough to reflect the needs of different jobs."}]},

    card:{topic:"Describe a skill you learned that you are proud of.",points:["what the skill is","when and how you learned it","how difficult it was to learn"],end:"and explain why you are proud of it."},
    model:"The skill I'd like to talk about is swimming, which might sound quite ordinary, but for me it was a real achievement. When I was a child, I had a frightening experience at the beach, and after that I was scared of deep water. So, although most of my friends could swim, I never learned. About three years ago, when I was twenty-five, I decided I'd had enough of sitting by the pool while everyone else was having fun. I signed up for adult lessons at a sports centre near my office and went twice a week after work. To be honest, it was much harder than I expected. For the first few weeks, I couldn't even put my face in the water without panicking. My teacher was very patient, though, and she broke everything down into small steps, like floating and breathing, before we moved on to proper strokes. After about four months, I swam a full length of the pool without stopping. I'm proud of this skill not because I'm a fast swimmer, because I'm definitely not, but because I faced a fear I'd had for most of my life. It taught me that it's never too late to learn something new, and now I go swimming every weekend."},

  {audio:[["N","Good morning, everyone, and welcome to Greenleaf Beverages. I'm Somchai, and I'll be your guide for today's tour of our bottling plant. Before we go onto the factory floor, please put on the safety glasses and hairnets from the basket by the door. For safety reasons, photography is not allowed inside the production area, so please keep your phones in your pockets. We'll start at the filling line, where more than twenty thousand bottles are filled every hour, and we'll finish in our tasting room, where you can try our new line of sparkling teas. The whole tour lasts about forty-five minutes."]],
   qs:[{q:"Who most likely is the speaker?",o:["A tour guide","A safety inspector","A new employee","A sales representative"],a:0,why:"I'll be your guide for today's tour ผู้พูดเป็นไกด์นำชมโรงงาน แม้จะพูดเรื่องความปลอดภัย แต่ไม่ใช่ผู้ตรวจความปลอดภัย"},
       {q:"What are the listeners asked NOT to do?",o:["Speak loudly","Touch the machines","Enter the tasting room","Take photographs"],a:3,why:"photography is not allowed inside the production area ห้ามถ่ายรูป ส่วนห้องชิมเป็นจุดที่ทัวร์จะไปจบ จึงเข้าได้"},
       {q:"Where will the tour end?",o:["At the filling line","In a tasting room","At the front entrance","In a warehouse"],a:1,why:"we'll finish in our tasting room ข้อ A คือจุดเริ่มต้นทัวร์ (We'll start at the filling line) ไม่ใช่จุดจบ"}]},
  {audio:[["N","This is an important safety announcement from HomeChef Appliances. We are recalling our Model K-200 electric kettle, sold between March and August of this year. In some units, the handle may become loose, which could cause burns. If you own this kettle, please stop using it immediately. You can return it to any store where it was sold for a full refund, even without a receipt. Alternatively, you can visit our website to request a free replacement, which will be delivered to your home. This recall does not affect any other HomeChef products."]],
   qs:[{q:"What is the problem with the product?",o:["It uses too much electricity.","It was sold at the wrong price.","Its handle may come loose.","Its lid does not close properly."],a:2,why:"the handle may become loose ด้ามจับอาจหลวมและทำให้ผู้ใช้โดนลวกได้"},
       {q:"What are customers told to do immediately?",o:["Stop using the product","Call customer service","Bring a receipt to a store","Check the model number online"],a:0,why:"please stop using it immediately ข้อ C ผิดเพราะคืนสินค้าได้แม้ไม่มีใบเสร็จ (even without a receipt)"},
       {q:"What does the speaker say about the website?",o:["It lists the stores that sold the kettle.","It offers a discount code.","It explains how to repair the kettle.","Customers can request a replacement there."],a:3,why:"visit our website to request a free replacement ขอเปลี่ยนเครื่องใหม่ฟรีผ่านเว็บไซต์ และจะส่งถึงบ้าน"}]}]},P4DIR)
]},
 reading:{title:"Reading",th:"การอ่าน",time:15*60,est:"15 นาที",intro:TR_INTRO,parts:[
 Object.assign({kind:"mc",title:"Part 5: Incomplete Sentences",items:[
  {q:"All visitors must sign in at the reception desk ___ entering the laboratory.",o:["before","until","since","during"],a:0,why:"before + V-ing = ก่อนจะ... (ลงชื่อก่อนเข้าห้องแล็บ) ส่วน during ต้องตามด้วยคำนาม เช่น during the visit และ until ใช้กับการทำต่อเนื่องจนถึงจุดหนึ่ง"},
  {q:"The factory's new machines operate much more ___ than the old ones.",o:["efficient","efficiency","efficiently","efficiencies"],a:2,why:"ขยายกริยา operate ต้องใช้ adverb คือ efficiently (more efficiently = อย่างมีประสิทธิภาพมากกว่า) ส่วน efficient เป็น adjective ใช้ขยายคำนาม"},
  {q:"The new policy lets employees ___ from home two days a week.",o:["to work","work","working","worked"],a:1,why:"let + กรรม + กริยาช่องที่ 1 ไม่มี to (let employees work) คนไทยมักพลาดใส่ to เพราะติดรูป allow sb to V"},
  {q:"By the time the new manager arrives next month, the team ___ the software upgrade.",o:["completes","completed","has completed","will have completed"],a:3,why:"By the time + เหตุการณ์ในอนาคต ใช้ future perfect (will have + V3) บอกว่างานจะเสร็จก่อนเวลานั้น"},
  {q:"Participants in the charity run should bring ___ own water bottles.",o:["they","them","their","theirs"],a:2,why:"หน้า own + คำนาม ต้องใช้คำแสดงความเป็นเจ้าของ their (their own bottles) ส่วน theirs ใช้แทนคำนามทั้งก้อน ไม่วางหน้าคำนาม"},
  {q:"Only ___ seats are still available for Thursday's factory tour, so please register soon.",o:["a few","a little","much","every"],a:0,why:"seats เป็นคำนามนับได้พหูพจน์ จึงใช้ a few ส่วน a little และ much ใช้กับคำนามนับไม่ได้ และ every ต้องตามด้วยคำนามเอกพจน์"},
  {q:"The hotel ___ the conference will be held has three large ballrooms.",o:["which","where","what","who"],a:1,why:"ขยายสถานที่ (the hotel) และประโยคหลังช่องว่างครบแล้ว (the conference will be held) จึงใช้ where ถ้าใช้ which ต้องเป็น in which หรือมีบุพบท in ท้ายประโยค"},
  {q:"The recall ___ only kettles sold between March and August.",o:["effects","effective","affection","affects"],a:3,why:"affect (v.) = ส่งผลต่อ ประธานเอกพจน์จึงเป็น affects ส่วน effect ส่วนใหญ่ใช้เป็นคำนาม (ผลกระทบ) เป็นคู่คำที่สับสนบ่อย"},
  {q:"If we ___ more staff at the help desk, we could answer tickets much faster.",o:["have","had","will have","would have"],a:1,why:"ประโยคเงื่อนไขแบบที่ 2 (สมมติว่าไม่จริงในปัจจุบัน) ใช้ If + past simple คู่กับ could/would + V1 ส่วน have และ will have ใช้กับเงื่อนไขแบบที่ 1 ซึ่งต้องคู่กับ will ไม่ใช่ could"},
  {q:"The outdoor part of the factory tour was canceled ___ the heavy rain.",o:["because","although","due to","so that"],a:2,why:"due to + คำนาม (the heavy rain) = เนื่องจาก ส่วน because ต้องตามด้วยประโยค (because it rained heavily) จึงเป็นตัวหลอกที่ความหมายถูกแต่ไวยากรณ์ผิด"}]},P5DIR),
 Object.assign({kind:"textfill",title:"Part 6: Text Completion",head:["To: All Employees","From: Facilities Management","Subject: New cafeteria menu"],
  text:["Beginning Monday, October 6, the staff cafeteria will offer a new menu {1} by the results of our recent employee survey. Many of you asked for healthier choices, so the menu will now include a daily salad bar and at least two vegetarian dishes. {2}","In addition, the cafeteria will stay open until 3 P.M. instead of 2 P.M., so employees who work through lunch can still get a hot meal. Payment can now be made by card or {3} our mobile app. Please send any comments to Nina Park, {4} manages the cafeteria contract."],
  items:[
   {o:["inspire","inspiring","inspires","inspired"],a:3,why:"เมนูถูกคิดขึ้นโดยได้แรงบันดาลใจจากผลสำรวจ จึงใช้ V3 แบบ passive ย่อ (a new menu which is inspired by...) มีคำว่า by ต่อท้ายเป็นตัวบอก"},
   {o:["Nutritional information for each dish will also be displayed at the counter.","The company parking lot will be repaved next month.","Our next employee survey will be sent out in December.","The cafeteria first opened in 2015."],a:0,why:"ต่อจากเรื่องอาหารสุขภาพและเมนูมังสวิรัติ จึงเหมาะกับข้อมูลโภชนาการของอาหาร ข้อ C หลอกด้วยคำว่า survey แต่ไม่เกี่ยวกับเมนูใหม่"},
   {o:["between","under","through","along"],a:2,why:"through = ผ่านทาง (ชำระผ่านแอป) ใช้คู่ขนานกับ by card ได้ ข้ออื่นไม่มีความหมายว่าช่องทาง"},
   {o:["which","who","whom","whose"],a:1,why:"ขยาย Nina Park ซึ่งเป็นคน และช่องว่างเป็นประธานของกริยา manages จึงใช้ who ส่วน whom เป็นกรรม และ which ใช้กับสิ่งของ"}]},P6DIR),
 Object.assign({kind:"sets",title:"Part 7: Reading Comprehension",sets:[
  {doc:{title:"E-mail",lines:["<b>From:</b> Daniel Reyes, Events Coordinator, Grand Orchid Hotel","<b>To:</b> Pimchanok Wong, Tri-Asia Pharmaceuticals","<b>Subject:</b> Your conference booking, November 12–13","Dear Ms. Wong,","Thank you for choosing the Grand Orchid Hotel for your company's regional sales conference. I am writing to confirm the details of your booking.","We have reserved the Lotus Ballroom for 120 guests on both days, as well as 45 guest rooms for the nights of November 11 and 12. The package includes a projector, microphones, morning and afternoon coffee breaks, and a buffet lunch each day.","Unfortunately, the Lotus Ballroom is not available on the evening of November 12 for your farewell dinner. Instead, we would be happy to host the dinner on our riverside terrace at no extra charge. If it rains, the dinner will be moved to the Jasmine Room on the second floor.","To secure the booking, a deposit of 30 percent must be paid by October 15. Please also send us the final number of guests, along with any dietary requirements, no later than one week before the event.","Kind regards,","Daniel Reyes"]},
   qs:[{q:"Why was the e-mail sent?",o:["To advertise a new ballroom","To request payment for a past event","To invite Ms. Wong to a dinner","To confirm the details of a reservation"],a:3,why:"I am writing to confirm the details of your booking ยืนยันรายละเอียดการจอง ข้อ B ผิดเพราะงานยังไม่เกิดขึ้น เงินมัดจำเป็นการจ่ายล่วงหน้า"},
       {q:"Where will the farewell dinner most likely take place if the weather is good?",o:["On the riverside terrace","In the Lotus Ballroom","In the Jasmine Room","At a nearby restaurant"],a:0,why:"โรงแรมเสนอจัดที่ riverside terrace จะย้ายไป Jasmine Room เฉพาะกรณีฝนตก ส่วน Lotus Ballroom ไม่ว่างช่วงเย็นวันนั้น"},
       {q:"What must Ms. Wong do by October 15?",o:["Send the final number of guests","Choose the lunch menu","Pay a deposit","Book extra guest rooms"],a:2,why:"a deposit of 30 percent must be paid by October 15 ข้อ A หลอก เพราะจำนวนแขกสุดท้ายส่งได้ถึงหนึ่งสัปดาห์ก่อนงาน"}]},
  {doc:{title:"Job posting",lines:["<b>Data Analyst (Full-Time) – Siam Fresh Markets</b>","Siam Fresh Markets, a supermarket chain with 38 stores across Thailand, is seeking a Data Analyst to join the marketing team at its head office in Nonthaburi.","The successful candidate will study sales and customer data, prepare weekly reports for store managers, and help the marketing team measure the results of promotions.","<b>Requirements:</b> a bachelor's degree in statistics, economics, or a related field; at least two years of experience with Excel and SQL; and the ability to explain findings clearly to people without a technical background. Experience in the retail industry is preferred.","We offer a competitive salary, health insurance, and the option to work from home two days a week.","Applications must be submitted through our careers page by September 30. Shortlisted candidates will be asked to complete a short online test before being invited to an interview."]},
   qs:[{q:"What is one of the job's responsibilities?",o:["Managing a supermarket","Preparing reports for store managers","Designing store layouts","Training new cashiers"],a:1,why:"prepare weekly reports for store managers ทำรายงานรายสัปดาห์ให้ผู้จัดการสาขา ข้อ A หลอกเพราะงานนี้อยู่สำนักงานใหญ่ ไม่ได้บริหารสาขา"},
       {q:"What is indicated about experience in the retail industry?",o:["It is an advantage but not required.","It must be at least two years.","It is not considered.","It is required for all applicants."],a:0,why:"is preferred = ถ้ามีจะได้เปรียบ แต่ไม่บังคับ ข้อ B หลอกเพราะ 2 ปีเป็นประสบการณ์ Excel และ SQL ไม่ใช่ประสบการณ์ค้าปลีก"},
       {q:"What will shortlisted candidates be asked to do first?",o:["Visit the head office","Send a reference letter","Give a presentation","Take an online test"],a:3,why:"complete a short online test before being invited to an interview ต้องทำแบบทดสอบออนไลน์ก่อนได้รับเชิญสัมภาษณ์"}]}]},P7DIR)
]}});

  audio:[["W","Good morning, Lakeside Holiday Cottages. Sarah speaking."],["M","Hi. I'm ringing about renting one of your cottages this summer."],["W","Lovely. Could I take your name first?"],["M","Yes, it's Mark Pritchard."],["W","Is that P, R, I, C, H, A, R, D?"],["M","Not quite. There's a T before the C. So it's P, R, I, T, C, H, A, R, D."],["W","Thank you, Mr Pritchard. Did you have a particular cottage in mind?"],["M","My wife liked the photos of Willow Cottage on your website."],["W","Willow is lovely, but it only has two bedrooms. How many people will be staying?"],["M","Five. Two adults and three children. Oh, wait, my mother's coming with us now, so that's six."],["W","Six, then. In that case, I'd recommend Bramble Cottage. It has three bedrooms and a big garden. That's B, R, A, M, B, L, E."],["M","That sounds perfect."],["W","And when would you like to arrive?"],["M","On Saturday the ninth of August, for one week."],["W","Let me check. I'm afraid Bramble is already booked that week, but the following Saturday, the sixteenth, is free."],["M","The sixteenth. Yes, we can do that."],["W","Good. The price in July is six hundred and forty pounds a week, but August is our high season, so it's seven hundred and twenty."],["M","OK, that's fine."],["W","When you arrive, you'll need to collect the keys. The post office used to keep them for us, but it's closed now, so please pick them up from the village shop. It's open until eight."],["M","The village shop. Got it. Is there anything we need to bring?"],["W","Bed linen is provided, and there's a washing machine, but guests need to bring their own towels."],["M","Towels. OK, thanks very much."]],

 {kind:"sets",listen:true,title:"Part 3",dir:"Choose the correct letter, A, B or C.",dirTh:"ฟังนักศึกษาสองคนวางแผนทำแบบสำรวจเรื่องอาหารเหลือทิ้งในโรงอาหาร แล้วเลือกคำตอบ",
  sets:[{audio:[["W","So, Jake, we need to finalise the plan for our survey on food waste in the campus canteen. Have you thought about how we're going to collect the data?"],["M","I was thinking of an online questionnaire. It's quick, and we could send it to everyone on the student email list."],["W","That was my first idea too, but Dr Evans said that response rates for online surveys here are really low, often under ten percent. She suggested we stand at the canteen exit at lunchtime and ask people our questions face to face."],["M","Fair enough. It'll take longer, but we'll get more answers. How many people should we aim for?"],["W","Well, I thought a hundred would be enough, but she said we need at least a hundred and fifty if we want to compare different groups, like first-year and final-year students."],["M","OK, a hundred and fifty, then. What about the questions? I've drafted about twenty."],["W","I read them, and they're good, but Dr Evans warned us that people won't stop for long when they're on their way out. She said we should keep it short, ten questions at most, and avoid open questions because they're so hard to analyse."],["M","So mostly multiple choice. I'll start cutting some of them."],["W","Actually, before you do that, we should run a pilot. Let's try the questions on a few friends this week and see which ones confuse people."],["M","Good idea. I'll ask my housemates tonight. And shall I book a room for our presentation?"],["W","No, I'll do that. I have to go to the department office tomorrow anyway. You focus on testing the questions."]],
   qs:[{q:"How will the students collect their data?",o:["by sending an online questionnaire","by asking students questions at the canteen","by observing what students throw away"],a:1,why:"Jake เสนอแบบสอบถามออนไลน์ (ตัวหลอก) แต่อาจารย์บอกว่าอัตราตอบกลับต่ำ ให้ยืนถามแบบ face to face ที่ทางออกโรงอาหาร"},

       {q:"What advice did the tutor give about the questions?",o:["Keep the questionnaire short.","Include more open questions.","Ask about cooking at home."],a:0,why:"keep it short, ten questions at most และให้หลีกเลี่ยงคำถามปลายเปิด (open questions) จึงไม่ใช่ข้อ B"},

 {kind:"form",title:"Part 4",max:1,dir:"Complete the notes below. Write ONE WORD ONLY for each answer.",dirTh:"ฟังการบรรยายเรื่องประวัติศาสตร์ของกระดาษ แล้วเติมโน้ต 1 คำเท่านั้น",
  audio:[["N","Today I'm going to talk about the history of paper, a material we now take completely for granted. Before paper existed, people in China wrote on strips of bamboo, which were heavy and awkward to carry, or on silk, which was light but far too expensive for everyday use. The invention of paper is traditionally credited to a court official called Cai Lun, who, in the year 105, presented the emperor with sheets made from tree bark, hemp, old rags and worn-out fishing nets. These materials were soaked, beaten into a pulp, spread on a screen and left to dry. For several centuries, the technique remained largely unknown outside China. It spread slowly westwards, and by the end of the eighth century there was a paper mill in Baghdad, which became a major centre of book production. Paper later reached Europe through Spain and Italy. In the thirteenth century, papermakers in the Italian town of Fabriano introduced two important changes. They used hammers driven by water wheels to beat the pulp, and they began adding watermarks, faint designs that can be seen when a sheet is held up to the light, to identify the mill that had made it. For hundreds of years, European paper was made from old linen and cotton rags. But by the nineteenth century, the demand for newspapers and books was so great that there was a serious shortage of rags. The solution was wood pulp, which was cheap and plentiful. Unfortunately, most paper made in this way contained acid, which slowly breaks down the fibres. That is why many books from this period are now turning yellow and falling apart on library shelves."]],

function timerText(){const left=X.sec.time-(Date.now()-X.startAt)/1000; return left>=0?"เหลือ "+mmss(left):"หมดเวลา +"+mmss(-left)}
/* in-progress attempts survive a reload */
const XP=(()=>{try{return JSON.parse(localStorage.getItem("exam-progress")||"{}")||{}}catch(e){return {}}})();
function saveProgress(){
  if(!X||!X.started||X.submitted||!X.sec.parts) return;
  const snap={mode:X.mode,startAt:X.startAt,ans:X.ans,plays:X.plays}, js=JSON.stringify(snap);
  if(XP[X.sec.id]&&JSON.stringify(XP[X.sec.id])===js) return;
  XP[X.sec.id]=snap; try{localStorage.setItem("exam-progress",JSON.stringify(XP))}catch(e){}
}
function dropProgress(id){if(XP[id]){delete XP[id]; try{localStorage.setItem("exam-progress",JSON.stringify(XP))}catch(e){}}}
function restoreAttempt(sec){
  const a=newAttempt(sec), p=XP[sec.id];
  if(p&&p.ans&&typeof p.ans==="object") Object.assign(a,{started:true,mode:p.mode==="exam"?"exam":"practice",startAt:+p.startAt||Date.now(),ans:p.ans,plays:p.plays&&typeof p.plays==="object"?p.plays:{}});
  return a;
}
function gradeExam(){
  stopAudio();
  const sec=X.sec; let c=0;
  const parts=sec.parts.map(p=>{let pc=0; p.qs.forEach(q=>{if(isRight(q,X.ans[q.key])){c++;pc++}}); return {title:p.title,c:pc,t:p.qs.length}});
  X.submitted=true; X.confirm=false; X.endAt=Date.now();
  const rec={id:sec.base,set:sec.set,c,t:sec.total,mode:X.mode};
  if(sec.exam==="toeic") rec.score=toeicScaled(c,sec.total); else rec.band=ieltsBand(sec.key,c,sec.total);
  X.result=Object.assign({parts},rec); dropProgress(sec.id);
  if(!answeredCount()){X.result.blank=true; render(); window.scrollTo(0,0); return}
  sec.parts.forEach(p=>p.qs.forEach(q=>{if(!isRight(q,X.ans[q.key])){const it=examMistake(sec,p,q); if(it) addMistake(EXAM_NAMES[sec.base]+" ชุด "+sec.set,it)}}));
  S.xp+=c*2; examRecord(rec);
  render(); window.scrollTo(0,0);
}

/* audio */
async function playScript(k){
  const lines=AUD[k]; if(!lines||!X) return;
  Speech.stop(); const tok=++xTok;
  X.playing=k; X.plays[k]=(X.plays[k]||0)+1; refreshPlay();
  for(const l of lines){
    const bits=String(l[1]).split(/(?<!\b(?:Mr|Ms|Mrs|Dr)\.)(?<=[.!?])\s+(?=[A-Z"])/);
    for(const b of bits){ if(tok!==xTok) return; await Speech.say(b,{voice:VOICE[l[0]][0],pitch:VOICE[l[0]][1]}); }
    if(tok!==xTok) return;
    await new Promise(r=>setTimeout(r,400));
  }
  if(tok===xTok&&X){X.playing=null; refreshPlay()}
}
function stopAudio(){xTok++; Speech.stop(); if(X&&X.playing){X.playing=null; refreshPlay()}}

/* timers: one ticker for every exam clock on screen */
setInterval(()=>{
  if(route.name!=="examrun"||!X||!X.started) return;
  const el=$("#xtimer");
  if(el&&!X.submitted){const left=X.sec.time-(Date.now()-X.startAt)/1000; el.textContent=timerText(); el.classList.toggle("over",left<0);

    if(left<=0&&X.mode==="exam"&&X.sec.kind==="writing"&&!X.wDone){X.wDone=true; toast("หมดเวลาแล้ว ดูตัวอย่างคำตอบได้"); const f=document.activeElement, pos=f&&f.selectionStart, id=f&&f.id; render(); const g=id&&document.getElementById(id); if(g){g.focus(); try{g.setSelectionRange(pos,pos)}catch(e){}}}}

function taskFigure(t){
  if(t.table) return tableFig(t.table);
  if(t.chart) return t.chart.type==="line"?lineSVG(t.chart):chartSVG(t.chart);
  return "";
}
function taskData(t){
  if(t.table) return "\nTable ("+t.table.title+", columns: "+t.table.cols.join(", ")+"): "+t.table.rows.map(r=>r.join(" ")).join("; ");
  if(t.chart) return "\nChart data ("+t.chart.title+"): "+t.chart.series.map(s=>s.name+": "+t.chart.years.map((y,i)=>y+" = "+s.v[i]+(t.chart.unit?" "+t.chart.unit:"%")).join(", ")).join("; ");
  return "";
}
function tableFig(tb){
  return '<figure class="xchart"><figcaption><b lang="en">'+esc(tb.title)+'</b>'+(tb.note?'<span class="muted" style="font-size:13px">'+esc(tb.note)+'</span>':'')+'</figcaption><div class="tbl-wrap" style="margin-top:8px"><table lang="en"><thead><tr>'+tb.cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'
   +tb.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' style="font-variant-numeric:tabular-nums;text-align:right"':'')+'>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></figure>';
}
function lineSVG(ch){
  const W=660,H=320,pl=40,pr=190,pt=20,pb=38,iw=W-pl-pr,ih=H-pt-pb,cols=["var(--s1)","var(--s2)","var(--s3)"];
  const X=i=>pl+i*iw/(ch.years.length-1), Y=v=>pt+ih-v/ch.max*ih;
  let g="";
  for(let v=0;v<=ch.max;v+=ch.step){g+='<line x1="'+pl+'" x2="'+(pl+iw)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="grid"/><text x="'+(pl-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="tick">'+v+'</text>'}
  ch.years.forEach((yr,i)=>{g+='<text x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle" class="tick">'+yr+'</text>'});
  g+='<line x1="'+pl+'" x2="'+(pl+iw)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" class="base"/>';
  ch.series.forEach((s,si)=>{
    g+='<polyline fill="none" stroke="'+cols[si]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+s.v.map((v,i)=>X(i)+","+Y(v)).join(" ")+'"/>';
    s.v.forEach((v,i)=>{g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4.5" fill="'+cols[si]+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(s.name)+', '+ch.years[i]+': '+v+' '+ch.unit+'</title></circle>'});
    const last=s.v[s.v.length-1];
    g+='<text x="'+(pl+iw+10)+'" y="'+(Y(last)+4)+'" class="val">'+esc(s.name)+' · '+last+'</text>';
  });
  const summary=ch.series.map(s=>s.name+" "+s.v.join(", ")).join("; ");
  return '<figure class="xchart"><figcaption><b lang="en">'+esc(ch.title)+'</b><span class="legend">'+ch.series.map((s,i)=>'<span lang="en"><i style="background:'+cols[i]+'"></i>'+esc(s.name)+'</span>').join("")+'</span></figcaption>'
   +'<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.title+" ("+ch.unit+") for "+ch.years.join(", ")+": "+summary)+'"><text x="'+pl+'" y="12" class="tick">'+esc(ch.unit)+'</text>'+g+'</svg></div><p class="chart-hint">เลื่อนกราฟไปทางขวาเพื่อดูให้ครบ →</p></figure>';
}
function chartSVG(ch){
  const W=640,H=320,pl=46,pr=14,pt=26,pb=38,max=70,iw=W-pl-pr,ih=H-pt-pb,bw=36,gap=2;
  const cols=["var(--s1)","var(--s2)","var(--s3)"], gw=iw/ch.years.length;
  const bar=(x,y,w,h,r)=>{r=Math.min(r,h,w/2); return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'};
  let g="";
  for(let v=0;v<=max;v+=10){const y=pt+ih-v/max*ih; g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" class="tick">'+v+'%</text>'}
  ch.years.forEach((yr,yi)=>{
    const cx=pl+gw*yi+gw/2, tot=ch.series.length*bw+(ch.series.length-1)*gap, x0=cx-tot/2;
    ch.series.forEach((s,si)=>{const v=s.v[yi],h=v/max*ih,x=x0+si*(bw+gap),y=pt+ih-h;
      g+='<path d="'+bar(x,y,bw,h,4)+'" fill="'+cols[si]+'"><title>'+esc(s.name)+', '+yr+': '+v+'%</title></path><text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" class="val">'+v+'</text>'});
    g+='<text x="'+cx+'" y="'+(H-14)+'" text-anchor="middle" class="tick">'+yr+'</text>';
  });
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'" class="base"/>';
  const summary=ch.series.map(s=>s.name+" "+s.v.join("%, ")+"%").join("; ");
  return '<figure class="xchart"><figcaption><b lang="en">'+esc(ch.title)+'</b><span class="legend">'+ch.series.map((s,i)=>'<span lang="en"><i style="background:'+cols[i]+'"></i>'+esc(s.name)+'</span>').join("")+'</span></figcaption>'
   +'<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(ch.title+" for "+ch.years.join(", ")+": "+summary)+'">'+g+'</svg></div><p class="chart-hint">เลื่อนกราฟไปทางขวาเพื่อดูให้ครบ →</p></figure>';
}
function cleanGrade(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.criteria)) return null;
  const b=v=>Math.max(0,Math.min(9,halfBand(Number(v)||0)));
  return {overall:b(d.overall),criteria:d.criteria.slice(0,4).map(c=>({name:String(c.name||""),band:b(c.band),comment:String(c.comment||"")})),
    corrections:Array.isArray(d.corrections)?d.corrections.slice(0,6).map(c=>({wrong:String(c.wrong||""),right:String(c.right||""),why:String(c.why||"")})):[],
    improved:String(d.improved||""),better:Array.isArray(d.better)?d.better.slice(0,3).map(x=>({question:String(x.question||""),answer:String(x.answer||"")})):[],
    tips:Array.isArray(d.tips)?d.tips.slice(0,3).map(String):[]};
}

   +(d.improved?'<h3 class="h3">ตัวอย่างที่ปรับให้ดีขึ้น</h3><div class="xmodel">'+paras(d.improved)+'</div>':'')

}
async function gradeWriting(n){
  const sec=X.sec, t=sec.tasks[n-1], key=sec.id+"-w"+n, text=(XD[key]||"").trim();
  if(wordCount(text)<40){toast("เขียนอย่างน้อย 40 คำก่อนส่งให้ครูประเมิน");return}
  XR[key]={busy:true}; render();
  const data=taskData(t);
  const prompt="You are an experienced IELTS Writing examiner. Assess this IELTS Academic Writing Task "+n+" response against the public IELTS Writing band descriptors. Be realistic and strict; do not inflate scores. Responses under "+t.min+" words must be penalised.\n\nTask: "+t.prompt+data+"\n\nWord count: "+wordCount(text)
   +"\n\nCandidate response:\n\"\"\"\n"+text.slice(0,6000)+"\n\"\"\"\n\nReply with only a JSON object in this shape:\n{\"overall\": 6.5, \"criteria\": [{\"name\": \""+(n===1?"Task Achievement":"Task Response")+"\", \"band\": 6, \"comment\": \"1-2 sentences in Thai\"}, {\"name\": \"Coherence and Cohesion\", \"band\": 6.5, \"comment\": \"...\"}, {\"name\": \"Lexical Resource\", \"band\": 6.5, \"comment\": \"...\"}, {\"name\": \"Grammatical Range and Accuracy\", \"band\": 6, \"comment\": \"...\"}], \"corrections\": [{\"wrong\": \"exact phrase from the response\", \"right\": \"corrected phrase\", \"why\": \"short reason in Thai\"}], \"improved\": \"the weakest paragraph of the response rewritten at band 7-8 level\", \"tips\": [\"up to 3 short tips in Thai\"]}\nBands go from 0 to 9 in steps of 0.5; overall is the average of the four criteria. Give the 3-6 most important corrections.";
  try{
    const d=cleanGrade(await AI.fn.json(prompt,{modelTier:"default"}));
    if(!d) throw {code:"invalid_json"};
    XR[key]={data:d}; S.xp+=10; examRecord({id:"ielts-writing",set:sec.set,task:n,band:d.overall,mode:"ai"});
  }catch(e){XR[key]={err:e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}}

}

const STORIES=[
 {id:"a1a",lv:"A1",title:"Nok's New Cat",th:"แมวตัวใหม่ของนก",
  paras:["Nok lives in a small house in Chiang Mai. One morning, she hears a sound outside her door. It is a little white cat. The cat is hungry and cold.","Nok gives it some milk and a warm towel. The cat drinks the milk and sleeps on the towel.","Nok's mother comes home at five o'clock. \"Can we keep the cat?\" Nok asks. Her mother smiles. \"Yes, but you must feed it every day.\" Nok is very happy. She calls the cat Snow because it is white like snow."],

  paras:["Ben is a waiter at a busy café. On Monday, he gets up at six o'clock and takes the bus to work. The café opens at seven.","Ben makes coffee, cleans the tables and talks to the customers. At twelve o'clock, many office workers come for lunch. Ben is very busy, but he likes his job because the customers are friendly.","He finishes work at four o'clock. After work, he goes to the park and plays basketball with his friends. In the evening, he cooks dinner and watches a movie. He goes to bed at ten because he is tired."],

 {id:"a2a",lv:"A2",title:"The Lost Wallet",th:"กระเป๋าสตางค์ที่หายไป",
  paras:["Last Friday, Mai took the train home after work. The train was crowded, so she stood near the door. When she got off at her station, she noticed a brown wallet on the platform. Inside, there was some money, a bank card and an ID card with the name Somchai Wong.","Mai didn't know what to do at first. Then she decided to take the wallet to the station office. The officer thanked her and called the owner.","Twenty minutes later, an old man arrived, looking worried. When he saw his wallet, he smiled and shook Mai's hand. \"My wife's photo is in there,\" he said. \"It is more important to me than the money.\" Mai felt happy all evening."],
  gloss:[["crowded","แออัด คนแน่น"],["noticed","สังเกตเห็น"],["wallet","กระเป๋าสตางค์"],["platform","ชานชาลา"],["decided","ตัดสินใจ"],["officer","เจ้าหน้าที่"],["owner","เจ้าของ"],["worried","กังวล"]],
  qs:[{q:"Where did Mai find the wallet?",o:["on a train seat","on the platform","near a ticket machine"],a:1},{q:"What did Mai do with the wallet?",o:["She kept the money.","She took it to the station office.","She posted it to the owner."],a:1},{q:"Why was the man so happy?",o:["His wife's photo was in the wallet.","He needed the money for rent.","Mai gave him a reward."],a:0}]},
 {id:"a2b",lv:"A2",title:"My First Job Interview",th:"สัมภาษณ์งานครั้งแรก",
  paras:["When I was twenty-two, I had my first job interview at a travel company. I was very nervous, so I prepared for a whole week. I read about the company, practised answering questions with my sister, and bought a new shirt.","On the day of the interview, I left home early because I didn't want to be late. Unfortunately, there was an accident on the road and my bus stopped for thirty minutes. I arrived five minutes late and apologised. The manager said it was no problem.","She asked me why I wanted to work in travel. I told her about my trips around Thailand and how much I enjoyed helping tourists. Two days later, she called me and offered me the job."],
  gloss:[["nervous","ประหม่า กังวล"],["prepared","เตรียมตัว"],["practised","ฝึกซ้อม"],["Unfortunately","โชคไม่ดี น่าเสียดาย"],["accident","อุบัติเหตุ"],["apologised","ขอโทษ"],["tourists","นักท่องเที่ยว"],["offered","เสนอให้"]],
  qs:[{q:"How did the writer prepare for the interview?",o:["by reading about the company and practising","by visiting the office","by calling the manager"],a:0},{q:"Why was the writer late?",o:["The writer woke up late.","There was an accident on the road.","The writer took the wrong bus."],a:1},{q:"What happened two days later?",o:["The writer had a second interview.","The writer was offered the job.","The writer started work."],a:1}]},
 {id:"b1a",lv:"B1",title:"The Village That Saved Its Forest",th:"หมู่บ้านที่รักษาป่าไว้ได้",
  paras:["Twenty years ago, the hills around the village of Ban Pa Kha were almost bare. Farmers had cut down most of the trees to grow corn, and every rainy season, floods washed soil into the river. The water became muddy, and the fish that villagers depended on began to disappear.","Worried about the future, a group of older villagers suggested an unusual plan. Instead of clearing more land, the village would protect the remaining forest and plant new trees on the slopes. At first, many farmers were against the idea, because they feared losing their income. To solve this, the village started growing coffee in the shade of the young trees, which turned out to be more profitable than corn.","Today, the hills are green again. The floods are smaller, the river is clear, and the village's coffee is sold in cafés in Bangkok. Visitors now come to learn how the community manages its land, and young people who once moved to the city for work are returning home."],
  gloss:[["bare","โล่ง เตียน"],["floods","น้ำท่วม"],["soil","ดิน"],["depended on","พึ่งพา"],["remaining","ที่เหลืออยู่"],["slopes","ไหล่เขา ทางลาด"],["shade","ร่มเงา"],["profitable","ทำกำไรได้"]],
  qs:[{q:"What problem did the village face twenty years ago?",o:["a shortage of coffee","floods and a muddy river","too many tourists"],a:1},{q:"Why were some farmers against the plan at first?",o:["They did not like coffee.","They were afraid of losing income.","They wanted to move to the city."],a:1},{q:"What is one result of the plan?",o:["Young people are returning to the village.","The village grows more corn.","The river is used for transport."],a:0}]},
 {id:"b1b",lv:"B1",title:"Learning a Language as an Adult",th:"เรียนภาษาตอนเป็นผู้ใหญ่",
  paras:["Many adults believe they are too old to learn a new language. Research suggests that this is only partly true. Children do have an advantage with pronunciation: those who start young usually develop an accent that sounds more natural. However, adults often learn grammar and vocabulary faster, because they can use their experience, their knowledge of their first language and more effective study strategies.","What matters most, according to many teachers, is regular practice. Studying for fifteen minutes every day is usually more effective than studying for two hours once a week, because the brain remembers information better when it is reviewed at spaced intervals. Adults also benefit from using the language for real purposes, such as watching films, reading about their hobbies or talking with colleagues.","Finally, attitude plays a large role. Learners who are not afraid of making mistakes tend to speak more, and the more they speak, the faster they improve. Mistakes are not a sign of failure but a normal part of the learning process."],
  gloss:[["advantage","ข้อได้เปรียบ"],["pronunciation","การออกเสียง"],["accent","สำเนียง"],["effective","มีประสิทธิภาพ"],["strategies","กลยุทธ์ วิธีการ"],["intervals","ช่วงเว้นระยะ"],["purposes","จุดประสงค์"],["attitude","ทัศนคติ"]],
  qs:[{q:"According to the text, what advantage do children have?",o:["They learn grammar faster.","Their pronunciation sounds more natural.","They have more free time."],a:1},{q:"Why is studying a little every day effective?",o:["The brain remembers better with spaced review.","Teachers give more homework.","It is cheaper."],a:0},{q:"What does the writer say about mistakes?",o:["They should be avoided.","They are a normal part of learning.","They show that a learner is too old."],a:1}]}

function dailyRec(){const k=dayKey(); if(!S.daily||S.daily.d!==k) S.daily={d:k,review:0,step:0,dict:0,prac:0}; return S.daily}
function bump(f,n){const d=dailyRec(); d[f]=(d[f]||0)+(n||1)}
function stat(k){if(!S.stats||typeof S.stats!=="object") S.stats={}; return S.stats[k]||(S.stats[k]={})}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function registerWords(){
  if(!registerWords.done){
    registerWords.done=true;
    DECKS.forEach(d=>d.words.forEach(w=>{if(!WORDS[w[0]]) WORDS[w[0]]={en:w[0],th:w[1],pos:w[2],ex:w[3],exTh:w[4],unit:"deck-"+d.id}}));
    STORIES.forEach(s=>s.gloss.forEach(g=>{
      const k=g[0].toLowerCase(); if(WORDS[k]) return;
      const m=s.paras.join(" ").match(new RegExp("[^.!?]*\\b"+escRe(g[0])+"\\b[^.!?]*[.!?]","i"));
      WORDS[k]={en:k,th:g[1],pos:"",ex:m?m[0].replace(/^[\s"]+/,"").trim():"",exTh:"",unit:"story-"+s.id};
    }));
  }
  (Array.isArray(S.custom)?S.custom:[]).forEach(w=>{if(w&&w.en&&!WORDS[w.en]) WORDS[w.en]={en:w.en,th:w.th||"",pos:"",ex:w.ex||"",exTh:"",unit:"custom"}});
}

/* mistakes notebook */
function addMistake(src,it){
  if(!it||!src) return;
  const item={t:it.t,q:it.q,o:it.o,a:it.a,w:it.w||it.why||"",hint:it.hint}; if(it.alts) item.alts=it.alts;
  if(item.t==="mc"&&!Array.isArray(item.o)) return;
  const id=(src+"|"+(item.q||"")+"|"+(item.t==="order"?item.a:"")).slice(0,240);
  S.mistakes=(Array.isArray(S.mistakes)?S.mistakes:[]).filter(m=>m.id!==id).concat([{id,src,it:item,at:Date.now()}]).slice(-150);
}
function mistSrc(r){
  if(r.kind==="placement") return "สอบวัดระดับ";
  if((r.kind==="practice"||r.kind==="quiz")&&L) return "บทที่ "+COURSE[L.idx].n+" · "+(r.kind==="quiz"?"สอบท้ายบท":"ฝึกทำ");
  if(r.kind==="gq"&&PRUN_META) return "ไวยากรณ์ · "+PRUN_META.title;
  if((r.kind==="lvt"||r.kind==="pb"||r.kind==="tg"||r.kind==="wf")&&PRUN_META) return PRUN_META.title;
  return "";
}
function mistAnswer(it){return it.t==="mc"?it.o[it.a]:it.t==="fill"?String(it.a).split("|")[0]:it.a}
// exam questions that can be practised without audio or a passage: TOEIC Part 2, Part 5 and Part 6
function examMistake(sec,p,q){
  if(p.kind==="respond") return {t:"mc",q:"คำถามที่ได้ยิน: \""+q.q+"\" เลือกคำตอบที่เหมาะสม",o:q.o,a:q.a,w:q.why};
  if(p.kind==="mc") return {t:"mc",q:q.q,o:q.o,a:q.a,w:q.why};
  if(p.kind==="textfill"){
    const idx=p.items.indexOf(q)+1;
    const txt=p.text.join(" ").replace(/\{(\d)\}/g,(m,i)=>+i===idx?"___":"(…)");
    const sents=txt.split(/(?<=[.!?])\s+/), j=sents.findIndex(x=>x.indexOf("___")>=0);
    return {t:"mc",q:(j>0?sents[j-1]+" ":"")+(sents[j]||"___"),o:q.o,a:q.a,w:q.why};
  }
  return null;
}

/* daily goals and phrase of the day */
function dailyItems(){
  const d=dailyRec(), due=dueWords().length;
  return GOALS.map(g=>{
    let n=goalN(g);
    if(g.k==="review"&&Object.keys(S.words).length) n=Math.max(1,Math.min(n,(d.review||0)+due));
    const v=Math.min(d[g.k]||0,n);
    return {g,n,v,ok:v>=n};
  });
}
function dailyCard(){
  const items=dailyItems(), done=items.filter(x=>x.ok).length;
  return '<section class="card daily"><div class="row" style="justify-content:space-between"><h2 class="h3">ภารกิจวันนี้</h2><span class="chip'+(done===items.length?' ok':'')+'">สำเร็จ '+done+'/'+items.length+'</span></div>'
   +'<div class="goals">'+items.map(x=>'<button class="goal'+(x.ok?' ok':'')+'" data-act="'+(x.g.to==="practice"?"pgo":"go")+'" data-to="'+x.g.to+'"'+(x.g.id?' data-id="'+x.g.id+'"':'')+'><span class="gc" aria-hidden="true">'+(x.ok?'✓':'')+'</span><span><b>'+x.g.label+'</b><small>'+x.v+' / '+x.n+' '+(x.g.unit||'คำ')+'</small></span></button>').join("")+'</div>'

/* sound discrimination */
function soundsNew(gid){
  const groups=gid==="mix"?SOUNDS:[SOUNDS.find(g=>g.id===gid)], rounds=[];
  for(let i=0;i<10;i++){const g=groups[Math.floor(Math.random()*groups.length)], pair=g.pairs[Math.floor(Math.random()*g.pairs.length)]; rounds.push({g:g.id,pair,say:Math.random()<.5?0:1,flip:Math.random()<.5})}
  SO={gid,rounds,i:0,pick:null,correct:0,done:false};
}

function glossText(s,text){
  let html=esc(text); const toks=[];
  s.gloss.slice().sort((a,b)=>b[0].length-a[0].length).forEach(g=>{
    html=html.replace(new RegExp("\\b("+escRe(esc(g[0]))+")\\b","i"),m=>{toks.push('<button class="gw" data-act="gloss" data-w="'+esc(g[0].toLowerCase())+'">'+m+'</button>'); return "\u0001"+(toks.length-1)+"\u0001"});
  });
  return html.replace(/\u0001(\d+)\u0001/g,(m,i)=>toks[+i]);
}

async function playStory(s){
  const tok=++storyTok; ST.playing=0;
  for(let i=0;i<s.paras.length;i++){
    if(tok!==storyTok||route.name!=="practice") return;
    ST.playing=i; document.querySelectorAll(".story p").forEach((p,j)=>p.classList.toggle("playing",j===i));
    for(const b of s.paras[i].split(/(?<=[.!?]"?)\s+/)){if(tok!==storyTok) return; await Speech.say(b)}
  }
  if(tok===storyTok){ST.playing=-1; if(route.name==="practice") render()}
}

  return pBack()+'<h1 class="h2" style="margin-top:8px">คลังไวยากรณ์</h1><p class="lede">เปิดดูคำอธิบายไวยากรณ์ได้ทุกเรื่องโดยไม่ต้องเข้าบทเรียน ทุกเรื่องมีแบบทดสอบสั้นๆ ข้อที่ผิดจะถูกจดลงสมุดคำผิด</p>'
   +'<section class="section" style="margin-top:22px"><h2 class="h3">จากบทเรียน</h2><div class="lessons" style="margin-top:10px">'+COURSE.map(u=>row(u.id,"U"+String(u.n).padStart(2,"0"),u.grammar.title,u.th+" · "+LEVELS[u.lv-1].code,gs[u.id])).join("")+'</div></section>'
   +'<section class="section"><h2 class="h3">หัวข้อเพิ่มเติม</h2><div class="lessons" style="margin-top:10px">'+GRAM_X.map((x,i)=>row(x.id,"G"+String(i+1).padStart(2,"0"),x.title,x.th,gs[x.id])).join("")+'</div></section>';
}
function gramSrc(id){const u=COURSE.find(x=>x.id===id); if(u) return {id,title:u.grammar.title,g:u.grammar,quiz:u.practice}; const x=GRAM_X.find(v=>v.id===id); return x?{id,title:x.g.title,g:x.g,quiz:x.quiz}:null}
function viewGram(id){
  const src=gramSrc(id); if(!src) return viewGrammarList();
  let h=pBack("grammar","คลังไวยากรณ์")+'<div style="margin-top:12px">'+stageGrammar({grammar:src.g})+'</div><section class="section"><h2 class="h3">แบบทดสอบ</h2>';
  if(PRUN&&PRUN_META&&PRUN_META.id===id){
    if(PRUN.done){const c=PRUN.results.filter(Boolean).length; h+='<div class="card" style="margin-top:12px;max-width:680px"><h2 class="h2">ถูก '+c+'/'+PRUN.items.length+'</h2><p class="lede">'+(c===PRUN.items.length?"เข้าใจเรื่องนี้ดีมาก":"ข้อที่ผิดถูกจดลงสมุดคำผิดแล้ว อ่านคำอธิบายด้านบนอีกรอบแล้วลองใหม่")+'</p><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="gqstart" data-id="'+id+'">ทำอีกครั้ง</button></div></div>'}
    else h+='<div style="margin-top:12px">'+runnerHTML(PRUN)+'</div>';
  } else h+='<div class="row" style="margin-top:10px"><button class="btn btn-primary" data-act="gqstart" data-id="'+id+'">เริ่มแบบทดสอบ '+src.quiz.length+' ข้อ</button></div>';
  return h+'</section>';
}

function viewScene(id){
  const sc=SCENES.find(x=>x.id===id); if(!sc) return viewScenes();
  const has=CHATS["scene:"+id]&&CHATS["scene:"+id].turns.length;
  return pBack("scenes","สถานการณ์จำลอง")+'<h1 class="h2" style="margin-top:8px">'+esc(sc.title)+'</h1>'
   +'<div class="card" style="margin:14px 0 18px"><p class="eyebrow">บทบาทของคุณ</p><p style="margin-top:4px;font-size:17px">'+esc(sc.th)+'</p>'+(has?'<button class="btn btn-sm btn-ghost" style="margin-top:8px;padding-left:0" data-act="scene-reset" data-id="'+id+'">เริ่มบทสนทนาใหม่</button>':'')+'</div>'
   +'<div data-chat="scene:'+id+'"></div>';
