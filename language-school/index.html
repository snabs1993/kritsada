   {q:"Where can Luke collect his bag?",o:["At the main bus station","At the university","At the train station"],a:0,why:"รูบี้บอกว่า “Our office is at the main bus station, and we're open until six.” ส่วนสถานีรถไฟกับมหาวิทยาลัยเป็นต้นทางและปลายทางของรถเมล์"},
   {q:"Why can't Luke use his student card as photo ID?",o:["It is too old","It is inside the lost bag","The office doesn't accept student cards"],a:1,why:"ลุคบอกว่า “my student card is in the bag.” ซึ่งตรงกับที่เขาบอกก่อนหน้าว่าบัตรอยู่ “in the front pocket” ของเป้ เขาจึงถามว่าใช้ใบขับขี่แทนได้ไหม"},
   {q:"How does Luke feel when he hears the news?",o:["Very relieved","Still worried","Angry about the charge"],a:0,why:"ลุคพูดว่า “Oh, that's such a relief!” และเมื่อได้ยินเรื่องค่าบริการก็ตอบว่า “No problem.” จึงไม่ได้โกรธ"}
  ]},
 {id:"p20",lv:"B1",title:"Choosing an Online Course",th:"เลือกคอร์สเรียนออนไลน์",cast:{A:"Kate",B:"Noah"},
  lines:[
   ["A","Noah, you did an online course last year, didn't you? I'm thinking of doing one, but there are so many options that I don't know where to start.","โนอาห์ ปีที่แล้วคุณเรียนคอร์สออนไลน์ใช่ไหม ฉันกำลังคิดจะเรียนสักคอร์ส แต่มีตัวเลือกเยอะจนไม่รู้จะเริ่มตรงไหน"],
   ["B","Yes, I did a photography course. What do you want to study?","ใช่ ผมเรียนคอร์สถ่ายภาพ คุณอยากเรียนอะไรล่ะ"],
   ["A","Data analysis. My manager says it would help me get a promotion. I've found two courses, but they're very different.","การวิเคราะห์ข้อมูล หัวหน้าบอกว่ามันจะช่วยให้ฉันได้เลื่อนตำแหน่ง ฉันเจอมาสองคอร์ส แต่ต่างกันมากเลย"],
   ["B","Go on, tell me about them.","เล่ามาเลย"],
   ["A","The first one is free. It's all videos, and you can watch them whenever you like. The second one costs three hundred dollars, but there's a live class every Thursday evening and a tutor who marks your work.","คอร์สแรกฟรี เป็นวิดีโอทั้งหมด ดูเมื่อไหร่ก็ได้ ส่วนคอร์สที่สองราคาสามร้อยดอลลาร์ แต่มีคลาสสดทุกเย็นวันพฤหัสฯ และมีติวเตอร์คอยตรวจงานให้"],
   ["B","Hmm. When I did mine, I chose a free one first, and to be honest, I gave up after three weeks. Nobody checked whether I was doing anything, so I just stopped.","อืม ตอนผมเรียน ผมเลือกคอร์สฟรีก่อน แล้วบอกตามตรงนะ ผมเลิกไปหลังสามสัปดาห์ ไม่มีใครเช็กว่าผมทำอะไรหรือเปล่า ผมก็เลยหยุดไปเฉย ๆ"],
   ["A","That's exactly what I'm worried about. I'm good at starting things, but not so good at finishing them.","นั่นแหละคือสิ่งที่ฉันกังวลเลย ฉันเก่งเรื่องเริ่มต้นทำอะไร แต่ไม่ค่อยเก่งเรื่องทำให้จบ"],
   ["B","Then the paid course might be worth it. Having a fixed class every week really helps. You feel you have to keep up.","ถ้างั้นคอร์สที่เสียเงินอาจคุ้มนะ การมีคลาสประจำทุกสัปดาห์ช่วยได้มากจริง ๆ มันทำให้รู้สึกว่าต้องเรียนให้ทัน"],
   ["A","True, but Thursday evenings are difficult. I sometimes have to work late on Thursdays.","จริง แต่เย็นวันพฤหัสฯ มันยาก บางทีฉันต้องทำงานดึกในวันพฤหัสฯ"],
   ["B","Are the live classes recorded? Some courses let you watch them later if you miss one.","คลาสสดมีการบันทึกไว้ไหม บางคอร์สให้ดูย้อนหลังได้ถ้าพลาดไป"],
   ["A","Let me check. Yes, it says here that all classes are recorded. And you get a certificate at the end.","ขอเช็กก่อนนะ ใช่ ตรงนี้เขียนว่าทุกคลาสมีการบันทึกไว้ แล้วเรียนจบก็ได้ใบประกาศนียบัตรด้วย"],
   ["B","A certificate could be useful if you want that promotion. Does your company pay for training?","ใบประกาศฯ อาจมีประโยชน์ถ้าคุณอยากได้เลื่อนตำแหน่ง บริษัทคุณออกค่าอบรมให้ไหม"],
   ["A","Actually, I'm not sure. I never thought to ask. There might be a training budget.","จริง ๆ ก็ไม่แน่ใจนะ ไม่เคยคิดจะถามเลย อาจจะมีงบสำหรับการอบรมก็ได้"],
   ["B","Definitely ask your manager first. If the company pays, the decision is easy.","ถามหัวหน้าก่อนเลย ถ้าบริษัทจ่ายให้ ก็ตัดสินใจง่ายแล้ว"],
   ["A","Good idea. I'll send her an email this afternoon. Thanks, Noah.","ความคิดดี บ่ายนี้ฉันจะส่งอีเมลหาเธอ ขอบคุณนะโนอาห์"]
  ],
  qs:[
   {q:"What is the conversation mainly about?",o:["Which course Kate should choose","How Noah learned photography","Why Kate wants to change jobs"],a:0,why:"เคทเปิดประเด็นว่า “I'm thinking of doing one, but there are so many options” แล้วทั้งคู่ก็คุยเปรียบเทียบคอร์สฟรีกับคอร์สเสียเงินตลอดบทสนทนา"},
   {q:"What happened when Noah did a free course?",o:["He finished it very quickly","He gave up after three weeks","He got a certificate"],a:1,why:"โนอาห์เล่าว่า “I gave up after three weeks. Nobody checked whether I was doing anything”"},
   {q:"Why does Noah suggest that Kate talks to her manager?",o:["Her manager is an expert in data","Her manager needs to agree to her Thursday evenings","The company might pay for the course"],a:2,why:"โนอาห์ถามว่า “Does your company pay for training?” แล้วบอกว่า “If the company pays, the decision is easy.”"},
   {q:"What is Noah's opinion of the paid course for Kate?",o:["He thinks it's a waste of money","He thinks the fixed classes could keep her motivated","He thinks it's too difficult for her"],a:1,why:"โนอาห์บอกว่า “the paid course might be worth it. Having a fixed class every week really helps. You feel you have to keep up.”"}
  ]},
 {id:"p21",lv:"B1",title:"A Problem with a New Phone",th:"ปัญหาโทรศัพท์เครื่องใหม่",cast:{A:"Jess",B:"Harry"},
  lines:[
   ["A","Hi. I bought this phone here about ten days ago, and I'm having some problems with it.","สวัสดีค่ะ ฉันซื้อโทรศัพท์เครื่องนี้ที่นี่เมื่อประมาณสิบวันก่อน และตอนนี้มีปัญหานิดหน่อยค่ะ"],
   ["B","I'm sorry to hear that. What seems to be the problem?","เสียใจด้วยครับ มีปัญหาอะไรครับ"],
   ["A","The battery goes down really quickly. I charge it fully in the morning, and by lunchtime it's almost empty. It also gets quite hot, even when I'm not using it.","แบตหมดเร็วมากค่ะ ตอนเช้าชาร์จเต็ม พอเที่ยงก็แทบหมดแล้ว แล้วเครื่องยังร้อนด้วย ถึงจะไม่ได้ใช้ก็ตาม"],
   ["B","That's not normal for this model. The battery should last at least a full day. Did you move your data from an old phone when you set it up?","แบบนี้ไม่ปกติสำหรับรุ่นนี้ครับ แบตควรอยู่ได้อย่างน้อยหนึ่งวันเต็ม ตอนตั้งค่าเครื่อง คุณย้ายข้อมูลมาจากเครื่องเก่าหรือเปล่าครับ"],
   ["A","Yes, I copied everything from my old phone. Photos, messages, all my apps.","ใช่ค่ะ ฉันก๊อปทุกอย่างมาจากเครื่องเก่า ทั้งรูป ข้อความ แล้วก็แอปทั้งหมด"],
   ["B","Can I have a look? Would you mind unlocking it for me?","ขอผมดูหน่อยได้ไหมครับ ช่วยปลดล็อกเครื่องให้หน่อยได้ไหมครับ"],
   ["A","Sure. Here you go.","ได้ค่ะ นี่ค่ะ"],
   ["B","Ah, I think I can see what's happening. Your photos are still uploading to the cloud. There are over twenty thousand of them, and it's been trying for days, because the upload keeps stopping and starting again.","อ้อ ผมว่าผมเห็นแล้วว่าเกิดอะไรขึ้น รูปของคุณยังอัปโหลดขึ้นคลาวด์ไม่เสร็จ มีมากกว่าสองหมื่นรูป และมันพยายามอัปโหลดมาหลายวันแล้ว เพราะการอัปโหลดหยุดแล้วเริ่มใหม่อยู่เรื่อย ๆ"],
   ["A","Really? I had no idea. So that's why it gets so hot?","จริงเหรอคะ ไม่รู้เลย เพราะอย่างนี้เครื่องถึงร้อนมากใช่ไหมคะ"],
   ["B","Most likely. The phone is working hard in the background all the time. If you connect to Wi-Fi at home tonight and leave it charging, the upload should finish.","น่าจะใช่ครับ โทรศัพท์ทำงานหนักอยู่เบื้องหลังตลอดเวลา ถ้าคืนนี้คุณต่อไวไฟที่บ้านแล้วเสียบชาร์จทิ้งไว้ การอัปโหลดน่าจะเสร็จครับ"],
   ["A","OK. But what if it still has problems after that? I don't want to be stuck with a bad phone.","โอเคค่ะ แต่ถ้าหลังจากนั้นยังมีปัญหาอีกล่ะ ฉันไม่อยากติดอยู่กับโทรศัพท์ที่ใช้ไม่ดี"],
   ["B","That's a fair question. You bought it ten days ago, so you're still within our fourteen-day return period. If the battery is still bad after the upload finishes, bring it back before next Friday and we'll swap it for a new one.","เป็นคำถามที่สมเหตุสมผลครับ คุณซื้อมาสิบวัน ยังอยู่ในช่วงคืนสินค้าสิบสี่วันของเรา ถ้าอัปโหลดเสร็จแล้วแบตยังแย่อยู่ เอามาคืนก่อนวันศุกร์หน้า แล้วเราจะเปลี่ยนเครื่องใหม่ให้ครับ"],
   ["A","That sounds fair. Do I need the box and the receipt?","ฟังดูยุติธรรมดีค่ะ ต้องเอากล่องกับใบเสร็จมาด้วยไหมคะ"],
   ["B","Yes, please bring both, and everything that came in the box, like the cable.","ครับ กรุณานำมาทั้งสองอย่าง แล้วก็ทุกอย่างที่มากับกล่อง เช่นสายชาร์จครับ"],
   ["A","Great. Thanks for explaining it so clearly. I was sure the phone was broken.","เยี่ยมเลยค่ะ ขอบคุณที่อธิบายได้ชัดเจนมาก ฉันนึกว่าโทรศัพท์เสียแน่ ๆ แล้ว"]
  ],
  qs:[
   {q:"What is the most likely cause of Jess's problem?",o:["The battery is broken","Her photos are still uploading in the background","She is using the wrong charger"],a:1,why:"แฮร์รีอธิบายว่า “Your photos are still uploading to the cloud” และ “The phone is working hard in the background all the time.”"},
   {q:"When must Jess return the phone if the problem continues?",o:["Before next Friday","By the end of the month","Today"],a:0,why:"แฮร์รีบอกว่า “bring it back before next Friday and we'll swap it for a new one.” เพราะยังอยู่ในช่วงคืนสินค้าสิบสี่วัน"},
   {q:"Why does Harry ask whether Jess moved data from an old phone?",o:["He wants to sell her extra storage","He needs to know her old phone's model","He suspects the problem is connected to the data she moved"],a:2,why:"หลังจากเจสบอกว่า “I copied everything from my old phone” แฮร์รีก็ตรวจเครื่องและพบว่ารูปยังอัปโหลดอยู่ แสดงว่าเขาสงสัยตั้งแต่แรกว่าปัญหามาจากการย้ายข้อมูล"},
   {q:"How does Jess feel at the end?",o:["Still angry with the shop","Reassured and satisfied","Confused about what to do"],a:1,why:"เจสพูดว่า “That sounds fair.” และ “Thanks for explaining it so clearly.” แสดงว่าเธอสบายใจขึ้นและพอใจกับคำตอบ"}
  ]},
 {id:"p22",lv:"B2",title:"Buying Versus Renting",th:"ซื้อบ้านหรือเช่าดี",cast:{A:"Fiona",B:"Simon"},
  lines:[
   ["A","So, Simon, I've finally done it. I've saved enough for a deposit, and I've started looking at flats to buy.","ไซมอน ในที่สุดฉันก็ทำได้แล้ว ฉันเก็บเงินพอสำหรับเงินดาวน์ และเริ่มดูห้องชุดที่จะซื้อแล้ว"],
   ["B","Congratulations! That must have taken ages. Although, you know me, I'm going to ask whether you're sure buying is the right move.","ยินดีด้วย! คงใช้เวลานานมากเลยนะ แต่รู้ใช่ไหมว่าผมเป็นคนยังไง ผมต้องถามอยู่แล้วว่าคุณแน่ใจเหรอว่าการซื้อเป็นทางเลือกที่ถูก"],
   ["A","I knew you would. Go on, then. Why are you so against it?","รู้อยู่แล้วว่าต้องถาม ว่ามาเลย ทำไมคุณถึงต่อต้านนักล่ะ"],
   ["B","I'm not against it as such. I just think people treat buying as the only sensible option, when it isn't always. I've been renting for eight years, and honestly, it suits me. When the boiler broke last winter, I made one phone call and my landlord sorted it out. It didn't cost me a penny.","ผมไม่ได้ต่อต้านหรอก ผมแค่คิดว่าคนมักมองว่าการซื้อเป็นทางเลือกเดียวที่ฉลาด ทั้งที่มันไม่ได้เป็นอย่างนั้นเสมอไป ผมเช่ามาแปดปีแล้ว และพูดตรง ๆ มันเหมาะกับผม ตอนเครื่องทำน้ำร้อนพังเมื่อหน้าหนาวที่แล้ว ผมโทรไปครั้งเดียว เจ้าของห้องก็จัดการให้หมด ผมไม่เสียเงินสักแดงเดียว"],
   ["A","That's true, but you're paying off someone else's mortgage every month. At least with a mortgage, I'd be building something I actually own. In twenty-five years, the flat would be mine.","ก็จริง แต่คุณกำลังผ่อนบ้านให้คนอื่นทุกเดือน อย่างน้อยถ้าฉันกู้ซื้อ ฉันก็กำลังสร้างสิ่งที่เป็นของฉันจริง ๆ อีกยี่สิบห้าปีห้องนั้นก็จะเป็นของฉัน"],
   ["B","Sure, but it's not as simple as saying rent is wasted and a mortgage isn't. A big chunk of your early mortgage payments goes on interest, not on the flat itself. Then there's insurance, repairs, service charges, and the cost of buying in the first place. It all adds up.","ใช่ แต่มันไม่ได้ง่ายแค่ว่าค่าเช่าคือเงินที่เสียเปล่าและเงินผ่อนไม่ใช่ เงินผ่อนช่วงแรก ๆ ส่วนใหญ่เป็นดอกเบี้ย ไม่ใช่ตัวห้อง แล้วยังมีค่าประกัน ค่าซ่อม ค่าส่วนกลาง และค่าใช้จ่ายตอนซื้ออีก รวม ๆ แล้วเยอะนะ"],
   ["A","I've done the sums, actually. Even with all of that, my monthly payments would be about the same as the rent I'm paying now. And rent keeps going up. My landlord's put it up twice in three years.","จริง ๆ ฉันคำนวณมาแล้ว ต่อให้รวมทุกอย่างนั้น ยอดผ่อนต่อเดือนก็พอ ๆ กับค่าเช่าที่ฉันจ่ายอยู่ตอนนี้ แล้วค่าเช่าก็ขึ้นเรื่อย ๆ เจ้าของห้องขึ้นค่าเช่าไปสองครั้งแล้วในสามปี"],
   ["B","Fair enough, that's a strong argument. But what about flexibility? If you get offered a great job in another city, selling a flat can take months. When I moved here, I just gave a month's notice and left.","ก็จริง นั่นเป็นเหตุผลที่หนักแน่น แต่แล้วเรื่องความยืดหยุ่นล่ะ ถ้าคุณได้ข้อเสนองานดี ๆ ในเมืองอื่น การขายห้องอาจใช้เวลาหลายเดือน ตอนผมย้ายมาที่นี่ ผมแค่แจ้งล่วงหน้าหนึ่งเดือนแล้วก็ย้ายออก"],
   ["A","I'm not planning to go anywhere, though. I'm settled here, my family's nearby, and I'm tired of moving every couple of years. I want to paint the walls whatever colour I like and not worry about losing my deposit.","แต่ฉันไม่ได้คิดจะไปไหนนะ ฉันลงหลักปักฐานที่นี่แล้ว ครอบครัวก็อยู่ใกล้ ๆ และฉันก็เบื่อการย้ายบ้านทุกสองสามปี ฉันอยากทาสีผนังสีอะไรก็ได้ที่ชอบ โดยไม่ต้องกังวลว่าจะโดนหักเงินประกัน"],
   ["B","OK, I can't argue with that. Stability is worth a lot. My only real worry is that you're putting almost all your savings into one thing. If prices fall, or interest rates rise, you could be in a difficult position.","โอเค ข้อนี้เถียงไม่ได้ ความมั่นคงมีค่ามาก สิ่งเดียวที่ผมห่วงจริง ๆ คือคุณกำลังเอาเงินเก็บเกือบทั้งหมดไปลงในสิ่งเดียว ถ้าราคาตก หรือดอกเบี้ยขึ้น คุณอาจลำบากได้"],
   ["A","That's why I'm not borrowing the maximum the bank offered. I'm going for something smaller and keeping some savings aside for emergencies.","นั่นแหละคือเหตุผลที่ฉันไม่กู้เต็มวงเงินที่ธนาคารเสนอ ฉันจะเลือกห้องที่เล็กลง และเก็บเงินส่วนหนึ่งไว้สำหรับเหตุฉุกเฉิน"],
   ["B","Now that's sensible. Honestly, it sounds like you've thought this through far more carefully than most people do.","อันนี้ฉลาดมาก พูดตรง ๆ ฟังดูเหมือนคุณคิดเรื่องนี้มาอย่างรอบคอบกว่าคนส่วนใหญ่เยอะเลย"],
   ["A","I have. And to be fair, renting clearly works for you. You travel a lot, and you'd hate being tied down.","ใช่ แล้วถ้าจะให้ยุติธรรม การเช่าก็เหมาะกับคุณจริง ๆ คุณเดินทางบ่อย และคงเกลียดการถูกผูกมัด"],
   ["B","Exactly. I suppose it depends on your life, not on some rule that everyone should own a home. So, when do I get the tour?","ใช่เลย ผมว่ามันขึ้นอยู่กับชีวิตของแต่ละคน ไม่ใช่กฎอะไรที่บอกว่าทุกคนต้องมีบ้านเป็นของตัวเอง ว่าแต่เมื่อไหร่ผมจะได้ไปชมห้องล่ะ"],
   ["A","Once I've found one! Come flat hunting with me on Saturday, and you can point out everything that's wrong with them.","ก็ต่อเมื่อฉันหาเจอก่อนสิ! วันเสาร์มาช่วยฉันตระเวนดูห้องสิ แล้วคุณจะได้ชี้ข้อเสียของทุกห้องให้ฉันฟัง"]
  ],
  qs:[
   {q:"What do Fiona and Simon finally agree on?",o:["Buying is always better than renting in the long run","Renting is a waste of money","The right choice depends on a person's situation"],a:2,why:"ไซมอนสรุปว่า “it depends on your life, not on some rule that everyone should own a home” และฟิโอน่าก็ยอมรับว่า “renting clearly works for you”"},
   {q:"Why does Fiona think buying would not cost her more each month?",o:["Her mortgage payments would be similar to her current rent","The bank has offered her a very low interest rate","Her family will help her with the payments"],a:0,why:"ฟิโอน่าบอกว่า “my monthly payments would be about the same as the rent I'm paying now.”"},
   {q:"Why is Fiona not borrowing the maximum amount the bank offered?",o:["She wants to buy a flat in another city","She wants to reduce the risk if prices fall or rates rise","Simon persuaded her to buy a bigger flat"],a:1,why:"ไซมอนเตือนว่า “If prices fall, or interest rates rise, you could be in a difficult position.” และฟิโอน่าตอบว่า “That's why I'm not borrowing the maximum” พร้อมเก็บเงินไว้ใช้ยามฉุกเฉิน"},
   {q:"How does Simon's attitude change during the conversation?",o:["He becomes more critical of Fiona's plan","He starts off sceptical but comes to see her plan as sensible","He decides to buy a flat himself"],a:1,why:"ตอนแรกไซมอนถามว่า “whether you're sure buying is the right move” แต่ต่อมาบอกว่า “Now that's sensible” และ “you've thought this through far more carefully than most people do.”"}
  ]},
 {id:"p23",lv:"C1",title:"Social Media and Teenagers",th:"ควรควบคุมโซเชียลมีเดียสำหรับวัยรุ่นไหม",cast:{A:"Priya",B:"Felix"},
  lines:[
   ["A","Welcome back to Open Question. I'm Priya, and before I became a presenter I spent fifteen years teaching in secondary schools, so today's topic is close to my heart. Several countries are now moving to ban social media for anyone under sixteen. My guest, Felix, researches digital policy, and I gather he has his doubts. Felix, why?","ยินดีต้อนรับกลับสู่รายการ Open Question ฉันปริยา ก่อนมาเป็นพิธีกร ฉันสอนหนังสือในโรงเรียนมัธยมมาสิบห้าปี หัวข้อวันนี้จึงใกล้ตัวฉันมาก ตอนนี้หลายประเทศกำลังเดินหน้าห้ามคนอายุต่ำกว่าสิบหกปีใช้โซเชียลมีเดีย แขกของเราวันนี้คือเฟลิกซ์ ผู้วิจัยด้านนโยบายดิจิทัล และได้ยินมาว่าเขามีข้อกังขา เฟลิกซ์คะ ทำไมล่ะคะ"],
   ["B","Thanks, Priya. Let me say at the outset that I'm not complacent about the harms. The evidence linking heavy use to anxiety and poor sleep, particularly among girls, is worrying enough to take seriously. My doubts are about whether a blanket ban is the right instrument, not about whether something needs to be done.","ขอบคุณครับปริยา ขอพูดไว้ตั้งแต่ต้นว่าผมไม่ได้นิ่งนอนใจเรื่องผลเสีย หลักฐานที่เชื่อมโยงการใช้งานหนักกับความวิตกกังวลและการนอนหลับที่แย่ลง โดยเฉพาะในเด็กผู้หญิง น่ากังวลพอที่จะต้องจริงจังกับมัน ข้อกังขาของผมอยู่ที่ว่าการห้ามแบบเหมารวมเป็นเครื่องมือที่เหมาะสมหรือเปล่า ไม่ใช่ว่าควรทำอะไรสักอย่างหรือไม่"],
   ["A","But from where I stood in the classroom, the change was unmistakable. Around the time smartphones became universal, I saw students who were more anxious, more distracted, and far less willing to take risks in front of their peers, in case a mistake ended up online. Surely, at some point, we have to stop waiting for perfect evidence.","แต่จากที่ฉันเห็นในห้องเรียน ความเปลี่ยนแปลงชัดเจนมาก ช่วงที่ทุกคนมีสมาร์ตโฟน ฉันเห็นนักเรียนที่วิตกกังวลมากขึ้น วอกแวกมากขึ้น และไม่กล้าเสี่ยงต่อหน้าเพื่อน ๆ มากเท่าเดิม เพราะกลัวว่าความผิดพลาดจะไปโผล่บนโลกออนไลน์ ถึงจุดหนึ่งเราก็ต้องเลิกรอหลักฐานที่สมบูรณ์แบบไม่ใช่หรือคะ"],
   ["B","I don't doubt what you observed, and I'd agree that waiting for certainty can itself be a decision. But correlation is doing a lot of heavy lifting in this debate. The years you're describing also brought exam pressure, economic anxiety, and a sharp drop in unsupervised play. Untangling the effect of one factor from all the others is genuinely difficult.","ผมไม่ได้สงสัยในสิ่งที่คุณเห็น และเห็นด้วยว่าการรอความแน่นอนก็เป็นการตัดสินใจแบบหนึ่ง แต่ในการถกเถียงเรื่องนี้ เราพึ่งพาความสัมพันธ์เชิงสถิติมากเกินไป ช่วงปีที่คุณพูดถึงยังมีทั้งแรงกดดันเรื่องสอบ ความกังวลทางเศรษฐกิจ และการที่เด็กได้เล่นอิสระโดยไม่มีผู้ใหญ่คุมน้อยลงอย่างมาก การแยกผลของปัจจัยหนึ่งออกจากปัจจัยอื่นทั้งหมดนั้นยากจริง ๆ"],
   ["A","Fine, but we regulate plenty of things without watertight proof. We don't let fourteen-year-olds buy alcohol, and nobody demands a controlled trial for that. Why should platforms that are deliberately designed to be compulsive get the benefit of the doubt?","ก็ได้ค่ะ แต่เราควบคุมหลายอย่างโดยไม่มีหลักฐานที่ไร้ช่องโหว่ เราไม่ให้เด็กอายุสิบสี่ซื้อเหล้า และไม่มีใครเรียกร้องให้ทำการทดลองแบบมีกลุ่มควบคุมก่อน ทำไมแพลตฟอร์มที่ถูกออกแบบมาโดยเจตนาให้คนเลิกไม่ได้ถึงควรได้รับการยกประโยชน์แห่งความสงสัยล่ะคะ"],
   ["B","That's a fair point, and I think the design argument is actually your strongest one. Endless scrolling, autoplay, streaks that punish you for taking a day off: those features exist to maximise time on the app, and children are particularly susceptible to them. Where I part company with you is on enforcement. How exactly do you verify that someone is sixteen?","เป็นประเด็นที่ยุติธรรมครับ และผมคิดว่าเหตุผลเรื่องการออกแบบคือข้อที่หนักแน่นที่สุดของคุณ การเลื่อนฟีดได้ไม่รู้จบ วิดีโอเล่นอัตโนมัติ การนับวันต่อเนื่องที่ลงโทษคุณถ้าหยุดไปวันเดียว ฟีเจอร์เหล่านี้มีไว้เพื่อให้คนอยู่ในแอปนานที่สุด และเด็กก็ตกเป็นเหยื่อได้ง่ายเป็นพิเศษ จุดที่ผมเห็นต่างจากคุณคือเรื่องการบังคับใช้ คุณจะตรวจสอบได้อย่างไรกันแน่ว่าใครอายุสิบหกแล้ว"],
   ["A","Age verification technology has improved considerably, hasn't it?","เทคโนโลยีตรวจสอบอายุพัฒนาไปมากแล้วไม่ใช่หรือคะ"],
   ["B","It has, but every method comes with a trade-off. Either you ask everyone, adults included, to upload identity documents to private companies, which is a privacy disaster waiting to happen, or you rely on estimating age from a face, which is prone to error. And determined teenagers are remarkably inventive. The likely outcome is that the most vulnerable simply migrate to less regulated corners of the internet, where there's even less oversight.","พัฒนาครับ แต่ทุกวิธีมีสิ่งที่ต้องแลก ไม่ว่าจะให้ทุกคนรวมถึงผู้ใหญ่อัปโหลดเอกสารยืนยันตัวตนให้บริษัทเอกชน ซึ่งเป็นหายนะด้านความเป็นส่วนตัวที่รอวันเกิด หรือจะพึ่งการประเมินอายุจากใบหน้า ซึ่งผิดพลาดได้ง่าย และวัยรุ่นที่ตั้งใจจริงก็หัวใสอย่างน่าทึ่ง ผลที่น่าจะเกิดคือเด็กที่เปราะบางที่สุดจะย้ายไปอยู่ในมุมของอินเทอร์เน็ตที่มีการควบคุมน้อยกว่า ซึ่งมีคนดูแลน้อยลงไปอีก"],
   ["A","So what would you do instead? Because educating them better has been the answer for a decade, and it doesn't seem to have worked.","แล้วคุณจะทำอะไรแทนล่ะคะ เพราะคำตอบว่าให้ความรู้เด็กให้ดีขึ้นก็ใช้มาสิบปีแล้ว และดูเหมือนจะไม่ได้ผล"],
   ["B","I'd put the burden on the platforms rather than on families. Make the safest settings the default for younger users: no algorithmic feeds pushing content they didn't ask for, no notifications overnight, no public follower counts. And give regulators the power to impose serious fines when companies fail to comply. That targets the design, which is the real problem, without shutting young people out entirely.","ผมจะโยนภาระไปที่แพลตฟอร์มแทนที่จะเป็นครอบครัว ให้การตั้งค่าที่ปลอดภัยที่สุดเป็นค่าเริ่มต้นสำหรับผู้ใช้อายุน้อย คือไม่มีฟีดที่อัลกอริทึมยัดเนื้อหาที่เด็กไม่ได้ขอ ไม่มีการแจ้งเตือนตอนกลางคืน ไม่แสดงจำนวนผู้ติดตามต่อสาธารณะ และให้อำนาจหน่วยงานกำกับดูแลลงโทษปรับอย่างหนักเมื่อบริษัทไม่ปฏิบัติตาม วิธีนี้พุ่งเป้าไปที่การออกแบบ ซึ่งเป็นต้นเหตุจริง โดยไม่ต้องกันเด็กออกไปทั้งหมด"],
   ["A","Shutting them out isn't necessarily a bad thing, though. Parents tell me they'd love a ban, precisely because it would take the pressure off. No child wants to be the only one in the class without an account.","แต่การกันเด็กออกไปก็ไม่จำเป็นต้องเป็นเรื่องแย่นะคะ ผู้ปกครองบอกฉันว่าอยากให้มีการห้ามมาก เพราะมันจะช่วยลดแรงกดดัน ไม่มีเด็กคนไหนอยากเป็นคนเดียวในห้องที่ไม่มีบัญชี"],
   ["B","That collective argument is persuasive, I'll admit. A ban changes the social norm in a way that individual rules at home simply can't. My worry is what gets lost. For a gay teenager in a small town, or a young carer who can't get out much, online communities can be a genuine lifeline.","ผมยอมรับว่าเหตุผลเชิงส่วนรวมข้อนี้มีน้ำหนัก การห้ามเปลี่ยนบรรทัดฐานทางสังคมได้ในแบบที่กฎของแต่ละบ้านทำไม่ได้ สิ่งที่ผมห่วงคือสิ่งที่จะสูญเสียไป สำหรับวัยรุ่นเกย์ในเมืองเล็ก ๆ หรือเด็กที่ต้องดูแลคนในครอบครัวจนแทบไม่ได้ออกไปไหน ชุมชนออนไลน์อาจเป็นที่พึ่งที่แท้จริง"],
   ["A","I take that seriously. Perhaps the honest position is that a ban protects the majority at some cost to a minority, and we should be upfront about that trade-off rather than pretending it's free.","ฉันให้ความสำคัญกับเรื่องนี้นะคะ บางทีจุดยืนที่ซื่อตรงคือ การห้ามปกป้องคนส่วนใหญ่โดยแลกกับต้นทุนบางอย่างของคนส่วนน้อย และเราควรพูดถึงการแลกเปลี่ยนนี้อย่างเปิดเผย แทนที่จะทำเป็นว่ามันไม่มีต้นทุน"],
   ["B","I'd go along with that. Where we differ is on which cost is larger, and frankly, neither of us can know that yet. Which is exactly why whatever we do should be evaluated rigorously, so that we're not having this same argument, just as blindly, in ten years' time.","ผมเห็นด้วยกับการมองแบบนั้นครับ จุดที่เราต่างกันคือต้นทุนฝั่งไหนมากกว่า และพูดตรง ๆ ตอนนี้เราทั้งคู่ยังไม่มีทางรู้ นั่นแหละคือเหตุผลที่ไม่ว่าเราจะทำอะไร ก็ควรประเมินผลอย่างเข้มงวด เพื่อที่อีกสิบปีเราจะไม่ต้องมาเถียงเรื่องเดิมแบบมืดบอดเหมือนเดิม"],
   ["A","On that, at least, we're in complete agreement. Felix, thank you.","อย่างน้อยเรื่องนั้นเราเห็นตรงกันทุกประการค่ะ ขอบคุณค่ะเฟลิกซ์"]
  ],
  qs:[
   {q:"What is the main point of disagreement between Priya and Felix?",o:["Whether social media causes any harm at all","Whether a ban for under-sixteens is the best way to reduce harm","Whether parents should check their children's phones"],a:1,why:"เฟลิกซ์บอกตั้งแต่ต้นว่า “I'm not complacent about the harms” แต่ “My doubts are about whether a blanket ban is the right instrument” ทั้งคู่จึงเห็นว่ามีปัญหา แต่เห็นต่างเรื่องวิธีแก้"},
   {q:"What does Felix propose instead of a ban?",o:["Safer default settings and serious fines for platforms","Compulsory digital education in schools","Banning smartphones from classrooms"],a:0,why:"เฟลิกซ์บอกว่า “Make the safest settings the default for younger users” และ “give regulators the power to impose serious fines when companies fail to comply.”"},
   {q:"Why does Felix mention a gay teenager in a small town and a young carer?",o:["To argue that bans are easy to get around","To prove that social media causes loneliness","To show that some young people depend on online communities"],a:2,why:"เฟลิกซ์ยกตัวอย่างนี้เพื่อชี้ว่า “online communities can be a genuine lifeline” สำหรับเด็กบางกลุ่ม ซึ่งจะสูญเสียไปถ้ามีการห้าม"},
   {q:"How does Felix respond to Priya's comparison with alcohol?",o:["He accepts it partly and says the design argument is her strongest","He dismisses it as irrelevant","He changes his mind and supports a ban"],a:0,why:"เฟลิกซ์ตอบว่า “That's a fair point, and I think the design argument is actually your strongest one.” แต่ต่อด้วย “Where I part company with you is on enforcement.” จึงเห็นด้วยเพียงบางส่วน"}
  ]},
 {id:"p24",lv:"C2",title:"Editing the Human Genome",th:"จริยธรรมการตัดต่อยีนมนุษย์",cast:{A:"Eleanor",B:"Theo"},
  lines:[
   ["A","Welcome to Deep Currents. I'm Eleanor, and my guest today is Theo, a geneticist who, somewhat unusually for his profession, has become one of the more prominent voices urging restraint. Our subject is gene editing, and in particular the prospect of altering human embryos. Theo, I confess to being something of an enthusiast. If we can spare a child a devastating inherited disease, isn't there a moral obligation to do so?","ยินดีต้อนรับสู่รายการ Deep Currents ฉันเอลินอร์ แขกของเราวันนี้คือธีโอ นักพันธุศาสตร์ผู้ซึ่งค่อนข้างแปลกสำหรับคนในวงการเดียวกัน ที่กลายมาเป็นหนึ่งในเสียงที่โดดเด่นซึ่งเรียกร้องให้ยับยั้งชั่งใจ หัวข้อของเราคือการตัดต่อยีน โดยเฉพาะความเป็นไปได้ที่จะดัดแปลงตัวอ่อนมนุษย์ ธีโอคะ ฉันต้องสารภาพว่าฉันค่อนข้างสนับสนุนเรื่องนี้ ถ้าเราช่วยให้เด็กคนหนึ่งรอดพ้นจากโรคทางพันธุกรรมที่ร้ายแรงได้ เราไม่มีหน้าที่ทางศีลธรรมที่ต้องทำหรอกหรือคะ"],
   ["B","It's a question I find genuinely hard, which is perhaps why I've ended up where I am. Let me draw a distinction that often gets blurred. Editing the cells of a patient who's already alive, say to treat sickle cell disease, affects that person alone, and they, or their parents, can consent. Editing an embryo is a different proposition altogether, because the change is inherited by every subsequent generation. We'd be making decisions on behalf of people who don't yet exist and can't possibly weigh in.","เป็นคำถามที่ผมรู้สึกว่ายากจริง ๆ ครับ ซึ่งอาจเป็นเหตุผลที่ผมมายืนอยู่ตรงจุดนี้ ขอแยกแยะสิ่งหนึ่งที่มักถูกทำให้พร่าเลือน การตัดต่อเซลล์ของผู้ป่วยที่มีชีวิตอยู่แล้ว เช่นเพื่อรักษาโรคโลหิตจางชนิดเม็ดเลือดแดงรูปเคียว ส่งผลต่อคนคนนั้นคนเดียว และเขาหรือพ่อแม่ของเขาให้ความยินยอมได้ แต่การตัดต่อตัวอ่อนเป็นอีกเรื่องหนึ่งโดยสิ้นเชิง เพราะการเปลี่ยนแปลงจะถ่ายทอดไปสู่ทุกรุ่นหลังจากนั้น เราจะตัดสินใจแทนคนที่ยังไม่เกิดและไม่มีทางแสดงความเห็นได้เลย"],
   ["A","But we make decisions on behalf of future generations all the time. Every choice about where to live, whom to marry, even what to eat during pregnancy shapes the lives of descendants who never consented. Why should a genetic change be held to a uniquely demanding standard?","แต่เราก็ตัดสินใจแทนคนรุ่นหลังอยู่ตลอดเวลานะคะ ทุกการเลือกว่าจะอยู่ที่ไหน จะแต่งงานกับใคร แม้แต่จะกินอะไรระหว่างตั้งครรภ์ ล้วนกำหนดชีวิตของลูกหลานที่ไม่เคยให้ความยินยอม ทำไมการเปลี่ยนแปลงทางพันธุกรรมต้องถูกตัดสินด้วยมาตรฐานที่เข้มงวดเป็นพิเศษด้วยล่ะคะ"],
   ["B","Because of its permanence and our ignorance, in roughly equal measure. Genes rarely do just one thing. A variant that raises the risk of one condition may well protect against another. The textbook example is the sickle cell trait, which gives some resistance to malaria. We understand the genome far less completely than the confident headlines imply, and an error in an embryo isn't a side effect you can simply treat. It's written into a family line.","เพราะความถาวรของมัน และความไม่รู้ของเรา ในสัดส่วนพอ ๆ กันครับ ยีนแทบไม่เคยทำหน้าที่เดียว ยีนแปรผันที่เพิ่มความเสี่ยงของโรคหนึ่งอาจช่วยป้องกันอีกโรคหนึ่งก็ได้ ตัวอย่างคลาสสิกคือยีนแฝงของโรคเม็ดเลือดแดงรูปเคียว ซึ่งช่วยให้ต้านทานมาลาเรียได้บ้าง เราเข้าใจจีโนมน้อยกว่าที่พาดหัวข่าวอันมั่นใจชวนให้คิดมาก และความผิดพลาดในตัวอ่อนไม่ใช่ผลข้างเคียงที่แค่รักษาก็หาย มันถูกจารึกไว้ในสายตระกูล"],
   ["A","Granted, the science isn't there yet. But that's an argument for caution and more research, not for prohibition in principle. Once the techniques become reliable, and I suspect they will, the moral calculation shifts considerably.","ยอมรับค่ะว่าวิทยาศาสตร์ยังไปไม่ถึง แต่นั่นเป็นเหตุผลให้ระมัดระวังและวิจัยเพิ่ม ไม่ใช่เหตุผลให้ห้ามโดยหลักการ เมื่อเทคนิคเชื่อถือได้แล้ว ซึ่งฉันคาดว่าจะเป็นอย่างนั้น การชั่งน้ำหนักทางศีลธรรมก็จะเปลี่ยนไปมาก"],
   ["B","On the narrow question of serious, single-gene diseases, I might concede that, eventually. What troubles me more is that the line between therapy and enhancement is far less stable than people assume. Today it's cystic fibrosis. Tomorrow it's a tendency towards depression. After that, perhaps height, or some crude stand-in for intelligence. Each step seems modest compared with the last, and there's rarely a single moment at which anyone decides to cross a line.","ในประเด็นแคบ ๆ เรื่องโรคร้ายแรงที่เกิดจากยีนเดียว ผมอาจยอมรับได้ในที่สุด สิ่งที่ผมกังวลมากกว่าคือเส้นแบ่งระหว่างการรักษากับการเสริมแต่งนั้นไม่มั่นคงอย่างที่คนคิด วันนี้เป็นโรคซิสติกไฟโบรซิส พรุ่งนี้เป็นแนวโน้มที่จะเป็นโรคซึมเศร้า หลังจากนั้นอาจเป็นส่วนสูง หรือตัวแทนหยาบ ๆ ของสติปัญญา แต่ละก้าวดูเล็กน้อยเมื่อเทียบกับก้าวก่อนหน้า และแทบไม่มีช่วงเวลาไหนที่ใครสักคนตัดสินใจข้ามเส้น"],
   ["A","The slippery slope. Forgive me, but that's an argument philosophers tend to treat with some suspicion. Slopes aren't inevitably slippery. Societies draw lines and hold them all the time. We allow alcohol but not heroin, and driving at seventy but not at a hundred and twenty.","ทางลาดลื่นสินะคะ ขออภัยนะคะ แต่นั่นเป็นเหตุผลที่นักปรัชญามักมองด้วยความระแวง ทางลาดไม่จำเป็นต้องลื่นเสมอไป สังคมขีดเส้นและยึดเส้นนั้นไว้ได้ตลอด เราอนุญาตแอลกอฮอล์แต่ไม่อนุญาตเฮโรอีน อนุญาตให้ขับเจ็ดสิบแต่ไม่ใช่หนึ่งร้อยยี่สิบ"],
   ["B","Fair enough, and I'd accept the slope isn't a law of nature. But the forces pushing down this particular slope are unusually strong. There's a lucrative fertility industry, intense parental anxiety, and competition between countries. And if enhancement were only available to the wealthy, you'd risk turning economic inequality into biological inequality, which would be far harder to undo.","ก็ยุติธรรมครับ และผมยอมรับว่าทางลาดไม่ใช่กฎธรรมชาติ แต่แรงที่ผลักลงทางลาดเส้นนี้แรงผิดปกติ มีทั้งอุตสาหกรรมการเจริญพันธุ์ที่ทำเงินมหาศาล ความวิตกกังวลอย่างหนักของพ่อแม่ และการแข่งขันระหว่างประเทศ และถ้าการเสริมแต่งมีให้เฉพาะคนรวย เราก็เสี่ยงที่จะเปลี่ยนความเหลื่อมล้ำทางเศรษฐกิจให้กลายเป็นความเหลื่อมล้ำทางชีววิทยา ซึ่งจะแก้ไขได้ยากกว่ามาก"],
   ["A","That's a sobering prospect, I'll grant you. Though one could argue that the wealthy already buy every conceivable advantage for their children, from private tutors to private healthcare. Genetics would be a difference of degree rather than of kind.","ยอมรับค่ะว่าเป็นภาพที่ชวนให้ได้สติ แต่ก็อาจแย้งได้ว่าคนรวยซื้อทุกข้อได้เปรียบที่นึกออกให้ลูกอยู่แล้ว ตั้งแต่ครูสอนพิเศษไปจนถึงบริการสุขภาพเอกชน พันธุกรรมก็จะเป็นแค่ความต่างในระดับ ไม่ใช่ความต่างในประเภท"],
   ["B","Perhaps. But there's another voice in this debate that tends to get overlooked. Many disabled people point out that describing their conditions as errors to be eliminated sends a rather chilling message about the worth of lives that are being lived right now. You needn't agree with every aspect of that critique to feel it deserves a hearing before, rather than after, the technology is rolled out.","อาจจะครับ แต่มีอีกเสียงหนึ่งในการถกเถียงนี้ที่มักถูกมองข้าม ผู้พิการจำนวนมากชี้ว่าการเรียกภาวะของพวกเขาว่าเป็นความผิดพลาดที่ต้องกำจัดทิ้ง ส่งสารที่ค่อนข้างน่าขนลุกเกี่ยวกับคุณค่าของชีวิตที่กำลังดำเนินอยู่ตอนนี้ คุณไม่จำเป็นต้องเห็นด้วยกับทุกแง่มุมของคำวิจารณ์นั้น ก็รู้สึกได้ว่ามันสมควรได้รับการรับฟังก่อน ไม่ใช่หลังจากที่เทคโนโลยีถูกนำออกมาใช้แล้ว"],
   ["A","I think that's right, and it's a perspective I've probably given too little weight. So where does that leave us? You're not calling for a permanent ban, I take it?","ฉันคิดว่าถูกค่ะ และเป็นมุมมองที่ฉันอาจให้น้ำหนักน้อยเกินไป แล้วสรุปเราอยู่ตรงไหนคะ ฉันเข้าใจว่าคุณไม่ได้เรียกร้องให้ห้ามถาวรใช่ไหมคะ"],
   ["B","No. I'd favour a pause on editing embryos for clinical use, together with genuinely open public debate, not just a committee of scientists and ethicists talking amongst ourselves. If, after all that, a society decides to permit narrowly defined therapeutic uses, I could live with that. What I can't accept is the technology racing ahead and ethics trailing behind, as a kind of paperwork filled in after the event.","ไม่ครับ ผมสนับสนุนให้ระงับการตัดต่อตัวอ่อนเพื่อใช้ทางคลินิกไว้ก่อน ควบคู่กับการถกเถียงสาธารณะที่เปิดกว้างจริง ๆ ไม่ใช่แค่คณะกรรมการนักวิทยาศาสตร์กับนักจริยศาสตร์คุยกันเอง ถ้าหลังจากทั้งหมดนั้นสังคมตัดสินใจอนุญาตการใช้เพื่อการรักษาที่นิยามไว้อย่างแคบ ผมก็รับได้ สิ่งที่ผมรับไม่ได้คือการที่เทคโนโลยีวิ่งนำไปก่อน แล้วจริยธรรมวิ่งตามหลังเหมือนเอกสารที่มากรอกกันหลังเกิดเรื่องไปแล้ว"],
   ["A","Which, to be fair, is rather how it's gone with most world-changing technologies. Theo, thank you. You've left this enthusiast somewhat more cautious, if not entirely converted.","ซึ่งถ้าจะให้ยุติธรรม ก็เป็นแบบนั้นกับเทคโนโลยีที่เปลี่ยนโลกเกือบทุกอย่าง ธีโอคะ ขอบคุณค่ะ คุณทำให้ผู้สนับสนุนอย่างฉันระมัดระวังขึ้นบ้าง แม้จะยังไม่ถึงกับเปลี่ยนใจทั้งหมด"]
  ],
  qs:[
   {q:"Which statement best summarises Theo's overall position?",o:["All forms of gene editing should be permanently banned","Embryo editing should be paused until the risks are better understood and the public has been properly consulted","Enhancement is acceptable provided it is available to everyone"],a:1,why:"ธีโอตอบว่าไม่ได้ต้องการห้ามถาวร แต่ “I'd favour a pause on editing embryos for clinical use, together with genuinely open public debate” และยังรับได้ถ้าสังคมอนุญาต “narrowly defined therapeutic uses”"},
   {q:"Why does Theo mention the sickle cell trait?",o:["To illustrate that a single gene variant can be both harmful and protective","To show that editing living patients is already routine","To argue that malaria is a greater threat than inherited disease"],a:0,why:"ธีโอพูดว่า “A variant that raises the risk of one condition may well protect against another” แล้วยกตัวอย่าง “the sickle cell trait, which gives some resistance to malaria”"},
   {q:"What does Eleanor imply by comparing genetic advantages to private tutors and private healthcare?",o:["That genetic enhancement would create an entirely new kind of injustice","That genetic inequality would not be fundamentally different from existing inequality","That the wealthy should be banned from paying for private healthcare"],a:1,why:"เอลินอร์สรุปว่า “Genetics would be a difference of degree rather than of kind.” หมายความว่ามันเป็นแค่การต่อยอดความเหลื่อมล้ำที่มีอยู่แล้ว ไม่ใช่สิ่งใหม่โดยสิ้นเชิง"},
   {q:"How has Eleanor's view changed by the end of the discussion?",o:["She has abandoned her support for gene editing entirely","She is exactly as enthusiastic as she was at the start","She has become more cautious without being fully persuaded"],a:2,why:"เอลินอร์ปิดท้ายว่า “You've left this enthusiast somewhat more cautious, if not entirely converted.” และก่อนหน้านั้นยอมรับว่า “it's a perspective I've probably given too little weight”"}
  ]}
);

 {id:"a1e",lv:"A1",title:"My Favourite Café",th:"คาเฟ่ร้านโปรด",
  paras:["Fah works in a bank in Bangkok. Every morning before work, she goes to a small café near her office. The café is quiet and clean, and it has big windows.","The owner is a kind old man. His name is Uncle Somsak. He knows Fah very well. Every day, she orders an iced tea with milk and a piece of toast. It costs sixty baht. She sits by the window and reads the news on her phone.","One Friday, the café is closed. Fah is sad. Then she sees a note on the door: \"Sorry! My daughter is getting married today. See you on Monday.\" Fah smiles. On Monday, she brings a small gift for Uncle Somsak."],
  gloss:[["quiet","เงียบ"],["clean","สะอาด"],["kind","ใจดี"],["orders","สั่ง (อาหาร เครื่องดื่ม)"],["costs","มีราคา"],["closed","ปิด"],["note","ข้อความสั้น ๆ โน้ต"],["gift","ของขวัญ"]],
  qs:[{q:"Where is the café?",o:["near Fah's house","near Fah's office","inside the bank"],a:1},{q:"What does Fah order every day?",o:["iced tea with milk and toast","hot coffee and cake","orange juice and eggs"],a:0},{q:"Why is the café closed on Friday?",o:["Uncle Somsak is sick.","It is a holiday.","Uncle Somsak's daughter is getting married."],a:2}]},
 {id:"a2e",lv:"A2",title:"Learning to Swim",th:"หัดว่ายน้ำตอนโต",
  paras:["Arun grew up in a big city far from the sea, and he never learned to swim. When he was thirty-five, his company planned a trip to an island. Everyone was excited about snorkelling, but Arun felt embarrassed. He didn't want his colleagues to know his secret.","Two months before the trip, he joined a beginners' class at the local pool. The other students were all children, and the first lesson was difficult. Arun was afraid to put his face in the water. His teacher was very patient. \"Breathe out slowly,\" she said. \"The water will hold you up.\"","Every week, Arun practised a little more. After six weeks, he could swim across the pool without stopping. On the island, he put on a mask and looked at the colourful fish under the water. It was one of the best days of his life."],
  gloss:[["island","เกาะ"],["embarrassed","อาย"],["colleagues","เพื่อนร่วมงาน"],["secret","ความลับ"],["afraid","กลัว"],["patient","อดทน ใจเย็น"],["breathe","หายใจ"],["colourful","มีสีสัน"]],
  qs:[{q:"Why did Arun feel embarrassed?",o:["He couldn't swim.","He didn't like his colleagues.","He was afraid of fish."],a:0},{q:"Who were the other students in the class?",o:["his colleagues","other adults","children"],a:2},{q:"What could Arun do after six weeks?",o:["teach children to swim","swim across the pool without stopping","dive to the bottom of the sea"],a:1}]},
 {id:"b1e",lv:"B1",title:"The Rise of Plant-Based Food",th:"อาหารจากพืชกำลังมาแรง",
  paras:["Ten years ago, if you wanted a burger without meat, your only choice was usually a dry vegetable patty. Today, supermarkets in many countries sell plant-based burgers, sausages and even chicken nuggets that look and taste surprisingly similar to the real thing. In Thailand, too, many cafés now offer oat milk, and some street food sellers have started making vegan versions of popular dishes.","There are several reasons for this change. Some people want to eat less meat for health reasons, while others are concerned about animals or the environment. Producing beef, in particular, uses huge amounts of land and water. Food companies have noticed this demand and invested heavily in new products.","However, not everyone is convinced. Critics point out that many plant-based products are highly processed and contain a lot of salt. They are also often more expensive than meat. Nutrition experts say the healthiest option is still simple food such as beans, tofu and vegetables. Even so, the trend shows no sign of slowing down, especially among young people."],
  gloss:[["surprisingly","อย่างน่าประหลาดใจ"],["concerned","เป็นห่วง กังวล"],["environment","สิ่งแวดล้อม"],["demand","ความต้องการ (ของตลาด)"],["invested","ลงทุน"],["convinced","เชื่อ มั่นใจ"],["processed","ผ่านการแปรรูป"],["trend","กระแส แนวโน้ม"]],
  qs:[{q:"What is one reason people choose plant-based food?",o:["It is always cheaper than meat.","They are concerned about the environment.","It contains more salt."],a:1},{q:"What do critics say about many plant-based products?",o:["They are highly processed.","They taste exactly like meat.","They are only sold in Thailand."],a:0},{q:"According to nutrition experts, what is the healthiest option?",o:["plant-based burgers","oat milk","simple food such as beans and vegetables"],a:2}]},
 {id:"b2e",lv:"B2",title:"The Hidden Cost of Fast Fashion",th:"ต้นทุนที่ซ่อนอยู่ของฟาสต์แฟชั่น",
  paras:["A T-shirt that costs less than a cup of coffee may seem like a bargain, but its true price is paid elsewhere. Over the past two decades, fast fashion brands have transformed the clothing industry by copying catwalk styles and getting them into shops within weeks. As a result, the average shopper now buys far more clothes than their parents did, and keeps them for roughly half as long.","The environmental consequences are considerable. Producing a single pair of jeans can require thousands of litres of water, and the dyes used in many factories pollute rivers in countries such as Bangladesh. Moreover, most cheap garments are made from polyester, a type of plastic that releases tiny fibres every time it is washed. Millions of tonnes of unwanted clothing end up in landfill or are shipped abroad, where they often overwhelm local markets.","There is also a human cost. Garment workers, the majority of whom are women, frequently work long hours for wages that barely cover their basic needs. Campaigners argue that brands should be held responsible for conditions throughout their supply chains. Meanwhile, a growing number of consumers are turning to second-hand shops, clothing swaps and repairs. Whether these habits can outweigh the industry's constant push for novelty remains to be seen."],
  gloss:[["bargain","ของถูก ของคุ้มราคา"],["transformed","เปลี่ยนแปลงอย่างสิ้นเชิง"],["consequences","ผลที่ตามมา"],["pollute","ทำให้เป็นมลพิษ"],["garments","เสื้อผ้า เครื่องนุ่งห่ม"],["landfill","หลุมฝังกลบขยะ"],["wages","ค่าจ้าง"],["supply chains","ห่วงโซ่อุปทาน"]],
  qs:[{q:"How has fast fashion changed the way people shop?",o:["People buy more clothes and keep them for less time.","People mostly buy second-hand clothes.","People spend more money on each item."],a:0},{q:"Why is polyester a problem?",o:["It needs thousands of litres of dye.","It releases tiny plastic fibres when it is washed.","It cannot be shipped abroad."],a:1},{q:"What do campaigners want brands to do?",o:["lower their prices even further","open more second-hand shops","take responsibility for conditions in their supply chains"],a:2}]},
 {id:"c1d",lv:"C1",title:"Why We Dream",th:"ทำไมเราจึงฝัน",
  paras:["Every night, most of us spend around two hours dreaming, yet scientists still disagree about why. For centuries, dreams were interpreted as messages from the gods or, following Sigmund Freud, as disguised expressions of repressed desires. Modern neuroscience has largely abandoned such symbolic readings, but it has not replaced them with a single, universally accepted explanation.","One influential theory holds that dreaming helps to consolidate memories. During sleep, particularly the phase known as rapid eye movement sleep, when most vivid dreams occur, the brain appears to replay and reorganise the day's experiences, strengthening some connections while discarding others. Studies have found that people who dream about a task they have just learned often perform it better the following day. Another hypothesis suggests that dreams act as a kind of overnight therapy, allowing us to revisit emotionally charged events in a safe setting and gradually reducing their intensity.","A more provocative idea is the threat simulation theory, which proposes that dreams evolved as a rehearsal space where our ancestors could practise escaping danger without any real risk. This might explain why so many dreams involve being chased or falling. Of course, these theories are not mutually exclusive, and dreaming may well serve several purposes at once. What is increasingly clear, however, is that sleep deprivation, which robs us of dreaming time, takes a measurable toll on memory, mood and judgement. Whatever dreams are for, the brain seems reluctant to do without them."],
  gloss:[["interpreted","ตีความ"],["repressed","ถูกเก็บกด"],["consolidate","ทำให้มั่นคง ประมวลรวม"],["discarding","ทิ้ง คัดออก"],["hypothesis","สมมติฐาน"],["rehearsal","การซ้อม"],["mutually exclusive","ไม่อาจเป็นจริงพร้อมกันได้"],["deprivation","การขาด การถูกพรากไป"]],
  qs:[{q:"What does the first paragraph say about modern science and dreams?",o:["It has proved Freud's theory correct.","It has not agreed on a single explanation for dreaming.","It has shown that dreams have no purpose."],a:1},{q:"According to the threat simulation theory, why do we dream?",o:["to practise escaping danger safely","to forget painful memories","to receive messages from our ancestors"],a:0},{q:"What conclusion does the writer reach?",o:["Only one theory can be correct.","Dreaming is less important than deep sleep.","Dreams may have several functions, and the brain seems to need them."],a:2}]}
);
GRAM_X.push(
 {id:"ppc",title:"Present Perfect Continuous vs Present Perfect",th:"have been + V-ing กับ have + V3",
  g:{title:"Present Perfect Continuous vs Present Perfect",
   intro:["ใช้ <mark>have/has been + V-ing</mark> เมื่อเน้น<mark>ระยะเวลาและความต่อเนื่อง</mark>ของการกระทำที่เริ่มในอดีตและยังทำอยู่ หรือเพิ่งหยุดและยังเห็นร่องรอย เช่น I've been waiting for an hour.","ใช้ <mark>have/has + V3</mark> เมื่อเน้น<mark>ผลลัพธ์หรือจำนวนที่ทำเสร็จแล้ว</mark> เช่น I've written three emails. ถ้ามีจำนวนชิ้นหรือจำนวนครั้ง ห้ามใช้รูป continuous","คนไทยมักพูด I am waiting for an hour หรือ I live here for five years เพราะภาษาไทยไม่ผันกาล แต่ถ้ามี for/since ต่อถึงปัจจุบันต้องใช้ perfect เสมอ และกริยาบอกสภาวะ (know, like, believe, own) ใช้แบบ continuous ไม่ได้"],
   head:["รูป","เน้น","ตัวอย่าง"],rows:[["have/has been + V-ing","ระยะเวลา ความต่อเนื่อง (How long?)","She has been studying English for two years."],["have/has + V3","ผลลัพธ์ จำนวน (How many / How much?)","She has finished two courses."],["have/has been + V-ing","เพิ่งหยุด ยังเห็นร่องรอย","You're wet! Have you been running?"],["กริยาบอกสภาวะ","ใช้ได้แค่ have + V3","I've known him since 2010."]],
   ex:[["I've been working here since 2019.","ฉันทำงานที่นี่มาตั้งแต่ปี 2019 (ตอนนี้ยังทำอยู่)"],["I've read three chapters this morning.","เช้านี้ฉันอ่านไปแล้วสามบท (เน้นจำนวนที่เสร็จ)"],["Her eyes are red. She's been crying.","ตาเธอแดง เธอเพิ่งร้องไห้มา (ยังเห็นร่องรอย)"]],
   mist:[["I am waiting for you for an hour.","I have been waiting for you for an hour.","มี for + ระยะเวลาต่อถึงปัจจุบัน ต้องใช้ have been + V-ing ไม่ใช่ present continuous"],["I've been knowing her for years.","I've known her for years.","know เป็นกริยาบอกสภาวะ ไม่ใช้รูป -ing"],["I've been drinking four cups of coffee today.","I've drunk four cups of coffee today.","บอกจำนวนที่ทำเสร็จแล้ว ใช้ have + V3"]]},
  quiz:[{t:"mc",q:"We ___ for the bus for 30 minutes, and it still hasn't come.",o:["wait","are waiting","have been waiting","waited"],a:2,w:"เริ่มรอในอดีตและยังรออยู่ มี for + ระยะเวลา จึงใช้ have been + V-ing"},{t:"mc",q:"She ___ five reports so far this week.",o:["has written","has been writing","is writing"],a:0,w:"บอกจำนวนงานที่เสร็จแล้ว (five reports) ใช้ have + V3"},{t:"mc",q:"I ___ Mr. Chen since we were at university.",o:["am knowing","have known","have been knowing","know"],a:1,w:"know เป็นกริยาบอกสภาวะ ใช้รูป -ing ไม่ได้ และมี since จึงใช้ have known"},{t:"mc",q:"Why are your hands so dirty? — I ___ in the garden all morning.",o:["will work","work","have been working"],a:2,w:"เพิ่งทำเสร็จและยังเห็นร่องรอย (มือสกปรก) และทำต่อเนื่องทั้งเช้า ใช้ have been + V-ing"},{t:"mc",q:"It ___ since this morning, so the roads are flooded.",o:["rains","is raining","rained","has been raining"],a:3,w:"ฝนเริ่มตกตั้งแต่เช้าและยังตกอยู่ มี since จึงใช้ has been + V-ing"}]},
 {id:"modal",title:"Modals of deduction: must / might / can't",th:"คาดเดาจากหลักฐาน",
  g:{title:"Modals of deduction (present): must / might / can't",
   intro:["ใช้ <mark>must + V</mark> เมื่อ<mark>เกือบมั่นใจว่าจริง</mark>จากหลักฐานที่เห็น: He's been working all day. He must be tired. (ต้อง...แน่ๆ)","ใช้ <mark>might / may / could + V</mark> เมื่อ<mark>คิดว่าอาจจะจริง</mark> แต่ไม่แน่ใจ: She isn't answering. She might be in a meeting.","ใช้ <mark>can't + V</mark> เมื่อเกือบมั่นใจว่า<mark>ไม่จริงแน่นอน</mark> คนไทยมักใช้ mustn't be ซึ่งผิด เพราะ mustn't แปลว่า \"ห้าม\" ไม่ใช่การคาดเดา"],
   head:["ความมั่นใจ","รูป","ตัวอย่าง"],rows:[["เกือบแน่ใจว่าใช่","must + V / must be","The lights are off. They must be asleep."],["อาจจะใช่","might / may / could + V","He might be stuck in traffic."],["เกือบแน่ใจว่าไม่ใช่","can't + V / can't be","That can't be Tom. He's in Japan."],["คาดว่ากำลังทำอยู่","must / might / can't + be + V-ing","She must be working from home today."]],
   ex:[["You've been travelling all night. You must be exhausted.","คุณเดินทางมาทั้งคืน ต้องเหนื่อยมากแน่ๆ"],["I'm not sure where Anna is. She could be at the gym.","ไม่แน่ใจว่าแอนนาอยู่ไหน เธออาจอยู่ที่ยิม"],["This bill can't be right. We only ordered two drinks.","บิลนี้ไม่ถูกแน่ๆ เราสั่งแค่เครื่องดื่มสองแก้ว"]],
   mist:[["His car isn't here. He mustn't be at home.","His car isn't here. He can't be at home.","คาดเดาว่า \"ไม่ใช่แน่ๆ\" ใช้ can't ส่วน mustn't แปลว่าห้าม"],["She must to be busy.","She must be busy.","หลัง modal ใช้กริยารูปฐาน ไม่มี to"],["He is maybe be sick.","He might be sick.","ใช้ might be หรือ Maybe he is sick อย่างใดอย่างหนึ่ง ไม่ใช้ is กับ be ซ้อนกัน"]]},
  quiz:[{t:"mc",q:"Somchai works three jobs and has two small children. He ___ very busy.",o:["must be","can't be","mustn't be"],a:0,w:"มีหลักฐานชัดเจน จึงมั่นใจว่าเขายุ่งแน่ๆ ใช้ must be"},{t:"mc",q:"That ___ John on the phone. He's sitting right next to me.",o:["must be","can't be","might be"],a:1,w:"จอห์นนั่งอยู่ข้างๆ จึงมั่นใจว่าไม่ใช่เขาแน่ๆ ใช้ can't be"},{t:"mc",q:"I'm not sure who's at the door. It ___ the delivery man.",o:["must be","can't be","might be"],a:2,w:"ไม่แน่ใจ แค่คาดว่าอาจจะใช่ ใช้ might be"},{t:"mc",q:"All the lights are on and I can hear music. They ___ be at home.",o:["can't","mustn't","must"],a:2,w:"หลักฐานชี้ชัดว่ามีคนอยู่ จึงใช้ must"},{t:"mc",q:"She isn't answering her phone. She ___ driving.",o:["must to be","might be","is be"],a:1,w:"คาดเดาว่าอาจกำลังขับรถ ใช้ might be + V-ing และหลัง modal ไม่มี to"}]},
 {id:"adjord",title:"Order of adjectives",th:"ลำดับคุณศัพท์หน้าคำนาม",
  g:{title:"Order of adjectives: a big black leather bag",
   intro:["ภาษาไทยวางคุณศัพท์<mark>หลัง</mark>คำนาม (กระเป๋าหนังสีดำใบใหญ่) แต่ภาษาอังกฤษวาง<mark>หน้า</mark>คำนามและมีลำดับค่อนข้างตายตัว: a big black leather bag","ลำดับทั่วไป: <mark>ความคิดเห็น → ขนาด → อายุ → รูปร่าง → สี → ที่มา → วัสดุ → จุดประสงค์ → คำนาม</mark> จำง่ายๆ ว่า \"คิด-ขนาด-อายุ-ร่าง-สี-มา-วัสดุ-ใช้\"","ในชีวิตจริงมักใช้แค่ 2–3 คำ คุณศัพท์ต่างกลุ่มเรียงกันได้เลยโดยไม่ต้องมี and หรือ comma"],
   head:["ลำดับ","กลุ่ม","ตัวอย่าง"],rows:[["1","ความคิดเห็น (opinion)","lovely, delicious, ugly"],["2","ขนาด (size)","big, small, tiny"],["3","อายุ (age)","old, new, young"],["4","รูปร่าง (shape)","round, square, long"],["5","สี (colour)","red, black, green"],["6","ที่มา (origin)","Thai, Japanese, Italian"],["7","วัสดุ (material)","wooden, silk, plastic"],["8","จุดประสงค์ (purpose)","running (shoes), sleeping (bag)"]],
   ex:[["She bought a beautiful Thai silk scarf.","เธอซื้อผ้าพันคอไหมไทยผืนสวย"],["We stayed in a small old wooden house.","เราพักในบ้านไม้หลังเล็กที่เก่าแก่"],["He's wearing new black running shoes.","เขาใส่รองเท้าวิ่งสีดำคู่ใหม่"]],
   mist:[["a black big car","a big black car","ขนาดมาก่อนสี"],["a Japanese old temple","an old Japanese temple","อายุมาก่อนที่มา และ old ขึ้นต้นด้วยเสียงสระจึงใช้ an"],["a bag leather brown","a brown leather bag","คุณศัพท์ต้องวางหน้าคำนาม ไม่ใช่ตามหลังแบบภาษาไทย"]]},
  quiz:[{t:"mc",q:"I'd like a ___ table for my kitchen.",o:["wooden round small","small round wooden","round wooden small"],a:1,w:"ขนาด (small) → รูปร่าง (round) → วัสดุ (wooden)"},{t:"mc",q:"She has ___ hair.",o:["long black beautiful","black beautiful long","beautiful long black"],a:2,w:"ความคิดเห็น (beautiful) → ขนาด/ความยาว (long) → สี (black)"},{t:"mc",q:"He gave me an ___ watch.",o:["expensive Swiss gold","Swiss gold expensive","gold expensive Swiss"],a:0,w:"ความคิดเห็น (expensive) → ที่มา (Swiss) → วัสดุ (gold) และ an ต้องตามด้วยเสียงสระ"},{t:"mc",q:"They opened a ___ restaurant near my office.",o:["Italian new small","new small Italian","small new Italian"],a:2,w:"ขนาด (small) → อายุ (new) → ที่มา (Italian)"},{t:"mc",q:"Where are my ___ boots?",o:["walking brown old","brown old walking","old brown walking"],a:2,w:"อายุ (old) → สี (brown) → จุดประสงค์ (walking) ซึ่งอยู่ติดคำนามเสมอ"}]},
 {id:"neither",title:"So / Neither / too / either",th:"ตอบว่า \"ฉันก็เหมือนกัน\"",
  g:{title:"Agreeing: So do I / Neither do I / too / either",
   intro:["ตอบว่า \"ฉันก็เหมือนกัน\" กับประโยค<mark>บอกเล่า</mark> ใช้ <mark>So + กริยาช่วย + ประธาน</mark> หรือ <mark>ประธาน + กริยาช่วย + too</mark>: I like jazz. — So do I. / I do too.","ถ้าประโยคเดิมเป็น<mark>ปฏิเสธ</mark> ใช้ <mark>Neither + กริยาช่วย + ประธาน</mark> หรือ <mark>ประธาน + กริยาช่วยปฏิเสธ + either</mark>: I don't eat meat. — Neither do I. / I don't either.","กริยาช่วยต้องตรงกับประโยคเดิม (am/is/are, do/does/did, have, can, will) คนไทยชอบตอบ Me too ทุกกรณี แต่ถ้าประโยคเดิมเป็นปฏิเสธต้องใช้ Me neither"],
   head:["ประโยคเดิม","ตอบว่าเหมือนกัน","ตัวอย่าง"],rows:[["บอกเล่า (+)","So + aux + S / S + aux + too","I'm hungry. — So am I. / I am too."],["ปฏิเสธ (−)","Neither + aux + S / S + aux-n't + either","I can't swim. — Neither can I. / I can't either."],["อดีต","ใช้ did / was / were","I went there last year. — So did I."],["ภาษาพูดสั้นๆ","Me too (+) / Me neither (−)","I don't like it. — Me neither."]],
   ex:[["I've been to Japan. — So have I.","ฉันเคยไปญี่ปุ่น — ฉันก็เคย"],["She didn't come to the party. — Neither did her husband.","เธอไม่ได้มางานเลี้ยง — สามีเธอก็ไม่ได้มา"],["Tom doesn't eat pork, and I don't either.","ทอมไม่กินหมู ฉันก็ไม่กินเหมือนกัน"]],
   mist:[["I don't like durian. — Me too.","I don't like durian. — Me neither.","ประโยคเดิมเป็นปฏิเสธ ต้องตอบด้วย neither ไม่ใช่ too"],["I love coffee. — So I do.","I love coffee. — So do I.","หลัง So ต้องเอากริยาช่วยขึ้นก่อนประธาน"],["I can't drive. — I can't too.","I can't drive. — I can't either.","ประโยคปฏิเสธใช้ either ไม่ใช่ too"]]},
  quiz:[{t:"mc",q:"A: I'm really tired today. B: (ฉันก็เหนื่อย) ___",o:["So do I.","So am I.","Neither am I."],a:1,w:"ประโยคเดิมใช้ am และเป็นบอกเล่า จึงตอบ So am I."},{t:"mc",q:"A: I didn't see the email. B: (ฉันก็ไม่เห็น) ___",o:["Neither did I.","So did I.","Neither didn't I."],a:0,w:"ประโยคเดิมเป็นปฏิเสธในอดีต ใช้ Neither + did + I (neither มีความหมายปฏิเสธอยู่แล้ว ไม่ต้องใส่ n't)"},{t:"mc",q:"She can speak Japanese, and her brother ___.",o:["does too","can either","can too"],a:2,w:"ประโยคบอกเล่าที่ใช้ can จึงตอบรับด้วย can too"},{t:"mc",q:"A: I haven't finished the report yet. B: (ฉันก็ยังไม่เสร็จ) ___ I.",o:["So have","Neither have","Neither did"],a:1,w:"ประโยคเดิมเป็นปฏิเสธและใช้ have จึงใช้ Neither have I."},{t:"mc",q:"A: I went to the concert last night. B: (ฉันก็ไป) So ___ I.",o:["did","went","was"],a:0,w:"ประโยคเดิมเป็นอดีตที่ใช้กริยาแท้ went กริยาช่วยที่ใช้คือ did"}]},
 {id:"gerinf2",title:"stop / remember / forget / try + V-ing or to V",th:"กริยาที่ความหมายเปลี่ยนตาม V-ing / to V",
  g:{title:"Verbs that change meaning: stop, remember, forget, try, regret",
   intro:["กริยาบางตัวตามด้วยได้ทั้ง V-ing และ to V แต่<mark>ความหมายเปลี่ยน</mark> ต้องเลือกให้ตรงกับสิ่งที่อยากพูด","<mark>remember / forget + V-ing</mark> = จำได้/ลืม<mark>สิ่งที่ทำไปแล้ว</mark> ส่วน <mark>remember / forget + to V</mark> = จำ/ลืม<mark>สิ่งที่ต้องทำ</mark>","<mark>stop + V-ing</mark> = เลิกทำ ส่วน <mark>stop + to V</mark> = หยุดสิ่งที่ทำอยู่เพื่อไปทำอีกอย่าง คนไทยมักแปล \"เลิกสูบบุหรี่\" เป็น stop to smoke ซึ่งกลับความหมายเป็น \"หยุดเพื่อสูบบุหรี่\""],
   head:["กริยา","+ V-ing","+ to V"],rows:[["stop","เลิกทำ: He stopped smoking.","หยุดเพื่อไปทำ: He stopped to smoke."],["remember","จำได้ว่าเคยทำ: I remember locking the door.","จำไว้ว่าต้องทำ: Remember to lock the door."],["forget","ลืมเรื่องที่เคยทำ: I'll never forget meeting you.","ลืมทำ: I forgot to call her."],["try","ลองทำดูว่าได้ผลไหม: Try restarting the computer.","พยายามทำ (ซึ่งยาก): I tried to open the jar, but I couldn't."],["regret","เสียใจที่ทำไปแล้ว: I regret saying that.","เสียใจที่ต้องแจ้ง: We regret to inform you that..."]],
   ex:[["I stopped to buy coffee on the way to work.","ฉันแวะซื้อกาแฟระหว่างทางไปทำงาน"],["Don't forget to send me the file.","อย่าลืมส่งไฟล์ให้ฉันนะ"],["If the printer doesn't work, try turning it off and on again.","ถ้าเครื่องพิมพ์ไม่ทำงาน ลองปิดแล้วเปิดใหม่ดู"]],
   mist:[["My father stopped to smoke last year. (หมายถึงเลิกบุหรี่)","My father stopped smoking last year.","เลิกทำใช้ stop + V-ing ส่วน stop to smoke แปลว่าหยุดเพื่อสูบบุหรี่"],["I forgot locking the door, so I went back.","I forgot to lock the door, so I went back.","ลืมทำสิ่งที่ต้องทำ ใช้ forget + to V"],["Please remember turning off the air conditioner.","Please remember to turn off the air conditioner.","เตือนให้ทำในอนาคต ใช้ remember + to V"]]},
  quiz:[{t:"mc",q:"I'll never forget ___ the sea for the first time.",o:["to see","seeing","see"],a:1,w:"ลืมไม่ลงถึงเหตุการณ์ที่เกิดขึ้นแล้ว ใช้ forget + V-ing"},{t:"mc",q:"Did you remember ___ milk? The fridge is empty.",o:["buying","buy","to buy"],a:2,w:"ถามว่าจำได้ไหมว่าต้องซื้อ (สิ่งที่ต้องทำ) ใช้ remember + to V"},{t:"mc",q:"The doctor told him to stop ___ fast food.",o:["eating","to eat","eat"],a:0,w:"หมอบอกให้เลิกกิน ใช้ stop + V-ing"},{t:"mc",q:"We had been driving for hours, so we stopped ___ lunch at a small café.",o:["having","to have","have"],a:1,w:"หยุดขับรถเพื่อไปกินข้าว ใช้ stop + to V"},{t:"mc",q:"The website isn't loading. Try ___ the page.",o:["refreshed","refresh","refreshing"],a:2,w:"แนะนำให้ลองทำดูว่าได้ผลไหม ใช้ try + V-ing"}]},
 {id:"conj",title:"although / despite / in spite of / however",th:"คำเชื่อมแสดงความขัดแย้ง",
  g:{title:"Contrast: although, even though, despite, in spite of, however",
   intro:["<mark>although / even though + ประโยค (ประธาน + กริยา)</mark>: Although it was raining, we went out.","<mark>despite / in spite of + คำนาม หรือ V-ing</mark>: Despite the rain, we went out. / In spite of being tired, she kept working. ถ้าจะตามด้วยประโยคต้องใช้ despite the fact that...","<mark>However</mark> เชื่อม<mark>สองประโยคที่แยกกัน</mark> มักขึ้นต้นประโยคใหม่แล้วตามด้วย comma: It was expensive. However, it was worth it. คนไทยมักใช้ despite + ประโยค เพราะแปลทุกคำว่า \"แม้ว่า\""],
   head:["คำ","ตามด้วย","ตัวอย่าง"],rows:[["although / even though","ประโยค (S + V)","Although he's rich, he lives simply."],["despite / in spite of","คำนาม / V-ing","Despite his wealth, he lives simply."],["despite the fact that","ประโยค (S + V)","Despite the fact that he's rich, he lives simply."],["however","ขึ้นประโยคใหม่ + comma","He's rich. However, he lives simply."]],
   ex:[["Even though the traffic was bad, we arrived on time.","แม้รถจะติดมาก เราก็มาถึงตรงเวลา"],["In spite of the high price, the tickets sold out quickly.","แม้ราคาจะสูง ตั๋วก็ขายหมดอย่างรวดเร็ว"],["The hotel was old. However, the staff were very friendly.","โรงแรมเก่า อย่างไรก็ตาม พนักงานเป็นมิตรมาก"]],
   mist:[["Despite it was raining, we played football.","Although it was raining, we played football.","despite ตามด้วยประโยคไม่ได้ ต้องใช้ although หรือ Despite the rain"],["In spite of she was ill, she came to work.","In spite of being ill, she came to work.","in spite of ตามด้วยคำนามหรือ V-ing เท่านั้น"],["Despite of the rain, we went out.","Despite the rain, we went out.","despite ไม่มี of (แต่ in spite of ต้องมี of)"]]},
  quiz:[{t:"mc",q:"___ the bad weather, the flight left on time.",o:["Although","Despite","However"],a:1,w:"ตามด้วยคำนาม (the bad weather) จึงใช้ Despite"},{t:"mc",q:"___ she studied hard, she didn't pass the exam.",o:["Although","Despite","In spite of"],a:0,w:"ตามด้วยประโยค (she studied hard) จึงใช้ Although"},{t:"mc",q:"The job pays well. ___, the hours are very long.",o:["Although","Despite","However"],a:2,w:"เชื่อมสองประโยคที่แยกกัน ขึ้นต้นประโยคใหม่และตามด้วย comma ใช้ However"},{t:"mc",q:"He went to work in spite of ___ a bad cold.",o:["he had","having","has"],a:1,w:"หลัง in spite of ใช้คำนามหรือ V-ing"},{t:"mc",q:"We enjoyed the trip ___ the long flight.",o:["although","however","in spite of"],a:2,w:"ตามด้วยคำนาม (the long flight) จึงใช้ in spite of"}]}
);

/* ---------- routing ---------- */
let route={name:"home",id:null};
let L=null;   // lesson runtime
let P=null;   // placement runtime
let R=null;   // review session
let teacherMode="talk";
let resetAsk=false;
const W={};   // writing drafts/results

let TESTOUT=null; // unit id opened straight into its quiz to skip it
function go(name,id){
  if(name==="shadow"){name="practice"; id=id?"shadow."+id:"shadow"}
  Speech.stop();
  if(NB&&prActive) NB.stopListening();
  if(typeof SH!=="undefined"&&SH&&SH.playing) shStop();
  if(typeof YTS!=="undefined"&&YTS){if(YTS.running) ytStop(); ytPlayer=null}
  if(NB&&name==="teacher") name="home";
  xTok++; if(X){if(X.playing&&X.mode==="exam"&&!X.submitted&&X.plays[X.playing]>0) X.plays[X.playing]--; X.playing=null}
  if(name==="practice"){storyTok++; if(!id||String(id).indexOf("gram.")!==0&&id!=="mistakes"){PRUN=null;PRUN_META=null} if(!id||String(id).indexOf("story.")!==0) ST=null}
  if(name==="examrun"){const sec=secById(id); if(!sec) return go("exam"); X=XS[id]||(XS[id]=restoreAttempt(sec))}
  if(name==="lesson"){
    const i=COURSE.findIndex(u=>u.id===id);
    if(i<0) return go("course");
    const testOut=TESTOUT===id; TESTOUT=null;
    if(!unlocked(i)&&!testOut){toast("บทนี้ยังล็อกอยู่ แตะบทนี้ในหน้าหลักสูตรเพื่อสอบข้าม");return}
    const r=rec(id);
    L={id,idx:i,step:r.done?0:Math.min(r.reached,5),vi:0,showTh:false,comp:{},practice:null,quiz:null,quizDone:null};
    if(testOut&&!r.done){L.step=5; L.testout=true}
    if(L.step===0&&addWords(COURSE[i])) save()
  }
  if(name==="placement") P={runner:null,result:null};
  if(name==="review") R=null;
  resetAsk=false;
  route={name,id:id||null};
  try{history.replaceState(null,"","#"+(name==="lesson"?"lesson-"+id:name==="examrun"?"exam-"+id:name==="practice"&&id?"practice-"+id:name))}catch(e){}
  render(); window.scrollTo(0,0);
}

function render(){

  const V={home:viewHome,course:viewCourse,lesson:viewLesson,review:viewReview,teacher:viewTeacher,report:viewReport,placement:viewPlacement,exam:viewExamHub,examrun:viewExamRun,practice:viewPractice}[route.name]||viewHome;

  const cs=$(".stepper .is-current"); if(cs){const sc=cs.parentElement; sc.scrollLeft+=cs.getBoundingClientRect().left-sc.getBoundingClientRect().left-(sc.clientWidth-cs.offsetWidth)/2}
  document.querySelectorAll(".nav button").forEach(b=>{
    const sh=route.name==="practice"&&/^(shadow|yt)/.test(route.id||"");
    const cur=b.dataset.to==="shadow"?sh:b.dataset.to==="practice"?(route.name==="practice"&&!sh):b.dataset.to===route.name||(b.dataset.to==="course"&&(route.name==="lesson"||route.name==="placement"))||(b.dataset.to==="exam"&&route.name==="examrun");
    if(cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");

}

function buildQuiz(u){
  const vs=shuffle(u.vocab), items=[];
  const others=(w,f)=>shuffle(u.vocab.filter(x=>x!==w)).slice(0,2).map(f);
  vs.slice(0,3).forEach(w=>items.push({t:"mc",q:"“"+w.en+"” แปลว่าอะไร",o:[w.th].concat(others(w,x=>x.th)),a:0}));
  vs.slice(3,5).forEach(w=>items.push({t:"mc",q:"“"+w.th+"” ภาษาอังกฤษคือ",o:[w.en].concat(others(w,x=>x.en)),a:0}));
  return shuffle(items.concat(u.quiz));
}
function stageQuiz(u){
  if(L.quizDone) return quizResult(u);
  if(!L.quiz) L.quiz=newRunner(buildQuiz(u),"quiz");
  return (L.testout?'<div class="feedback ok" style="margin:0 0 14px"><b>สอบข้ามบท</b><span>ถ้าได้ 70% ขึ้นไป บทนี้จะนับว่าผ่าน และบทถัดไปจะปลดล็อก ถ้าไม่ผ่านก็เลือกเรียนขั้นไหนก่อนก็ได้จากแถบด้านบน</span></div>':'')+'<p class="muted" style="margin-bottom:14px">สอบท้ายบท '+L.quiz.items.length+' ข้อ ต้องได้ 70% ขึ้นไปจึงผ่าน</p>'+runnerHTML(L.quiz);
}

/* ---------- exercise runner ---------- */
function newRunner(items,kind){
  const r={kind,items:items.map(x=>Object.assign({},x)),i:0,results:[],answered:false,ok:null,given:"",done:false};
  r.items.forEach(it=>{
    if(it.t==="mc"){const idx=shuffle(it.o.map((_,k)=>k)); it.o=idx.map(k=>it.o[k]); it.a=idx.indexOf(it.a)}
  });
  prepItem(r); return r;
}
function prepItem(r){
  const it=r.items[r.i]; if(!it) return;
  if(it.t==="order"){
    const words=it.a.split(" ").map((w,k)=>({w,k}));
    let pool=shuffle(words); let tries=0;
    while(words.length>1&&pool.map(x=>x.w).join(" ")===it.a&&tries++<8) pool=shuffle(words);
    r.pool=pool; r.built=[];
  }
}
function runnerHTML(r){
  const it=r.items[r.i];
  let h='<div class="runner"><div class="rn-top"><span class="mono">ข้อ '+(r.i+1)+'/'+r.items.length+'</span><div class="dots" aria-hidden="true">'
    +r.items.map((_,k)=>'<i class="'+(k<r.i||(k===r.i&&r.answered)?(r.results[k]?"ok":"no"):k===r.i?"cur":"")+'"></i>').join("")+'</div></div>';
  if(it.t==="mc"){
    h+='<p class="q"'+(/[ก-๙]/.test(it.q)?'':' lang="en"')+'>'+esc(it.q).replace(/___/g,'<span class="blank">'+(r.answered?esc(it.o[it.a]):"&nbsp;")+'</span>')+'</p><div class="opts">'
     +it.o.map((o,k)=>{let c="opt"; if(r.answered){if(k===it.a) c+=" is-right"; else if(k===r.given) c+=" is-wrong"} return '<button class="'+c+'" data-act="r-opt" data-o="'+k+'"'+(r.answered?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>';
  } else if(it.t==="fill"){
    const ans=capBlank(it,it.a.split("|")[0]);
    const q=esc(it.q).replace(/___/g,'<span class="blank">'+(r.answered?esc(r.ok?capBlank(it,r.given):ans):"&nbsp;")+'</span>');
    h+='<p class="q"><span lang="en">'+q+'</span><span class="hint">พิมพ์คำที่หายไป</span></p>'
     +'<form class="fill" data-form="fill"><label class="sr" for="fill-in">คำตอบ</label><input id="fill-in" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" value="'+esc(r.given||"")+'"'+(r.answered?" disabled":"")+'>'
     +(r.answered?"":'<button class="btn btn-primary" type="submit">ตรวจคำตอบ</button>')+'</form>';
  } else {
    h+='<p class="q">เรียงคำให้เป็นประโยคที่ถูกต้อง<span class="hint">'+esc(it.hint||"")+'</span></p>'
     +'<div class="built" lang="en">'+r.built.map(t=>'<button class="tl" data-act="r-unt" data-k="'+t.k+'"'+(r.answered?" disabled":"")+'>'+esc(t.w)+'</button>').join("")+'</div>'
     +'<div class="pool" lang="en">'+r.pool.map(t=>'<button class="tl" data-act="r-tile" data-k="'+t.k+'">'+esc(t.w)+'</button>').join("")+'</div>'
     +(r.answered?"":'<button class="btn btn-primary" data-act="r-order"'+(r.pool.length?" disabled":"")+'>ตรวจคำตอบ</button>');
  }
  if(r.answered){
    const right=it.t==="mc"?it.o[it.a]:it.t==="fill"?capBlank(it,it.a.split("|")[0]):it.a;
    h+='<div class="feedback '+(r.ok?"ok":"no")+'" role="status"><b>'+(r.ok?"ถูกต้อง!":"ยังไม่ถูก")+'</b>'
      +(r.ok?"":'<span>คำตอบที่ถูก: <b lang="en">'+esc(right)+'</b></span>')
      +(it.w?'<span class="pen">'+esc(it.w)+'</span>':'')+'</div>'
      +'<div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="r-next" id="r-next">'+(r.i===r.items.length-1?"ดูผล":"ข้อต่อไป")+'</button></div>';
  }
  return h+'</div>';
}
function capBlank(it,s){s=String(s||"");return it.q.trim().indexOf("___")===0?s.charAt(0).toUpperCase()+s.slice(1):s}
function curRunner(){
  if(route.name==="practice") return PRUN;
  if(route.name==="placement") return P&&P.runner;
  if(route.name==="lesson"&&L){const k=STEPS[L.step][0]; return k==="practice"?L.practice:k==="quiz"?L.quiz:null}
  return null;
}
function answer(r,ok,given){
  r.answered=true; r.ok=ok; r.given=given; r.results[r.i]=ok;
  const it=r.items[r.i];
  if(!ok&&r.kind!=="mist"){addMistake(mistSrc(r),it); save()}
  if(ok&&r.kind==="mist"&&it._mid){S.mistakes=(S.mistakes||[]).filter(m=>m.id!==it._mid); const ms=stat("mist"); ms.cleared=(ms.cleared||0)+1; save()}
  if(it.t==="order") Speech.say(it.a);
  render();
  const nb=$("#r-next"); if(nb) nb.focus({preventScroll:true});
}
function runnerNext(r){
  r.i++; r.answered=false; r.ok=null; r.given="";
  if(r.i>=r.items.length){r.done=true; runnerDone(r)} else prepItem(r);
  render();
  if(!r.done){const f=$("#fill-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus()}
}
function runnerDone(r){
  const c=r.results.filter(Boolean).length, tot=r.items.length;
  if(r.kind==="practice"){const rr=rec(L.id); rr.practice=Math.round(c/tot*100); S.xp+=c*2; markDay(); save()}
  if(r.kind==="quiz"){
    const u=COURSE[L.idx], rr=rec(u.id), pct=Math.round(c/tot*100);
    const stars=pct===100?3:pct>=85?2:pct>=70?1:0;
    const first=!rr.done&&pct>=70;
    rr.best=Math.max(rr.best||0,pct); rr.stars=Math.max(rr.stars||0,stars);
    if(pct>=70){rr.done=true; rr.reached=5; if(!rr.doneAt) rr.doneAt=Date.now()}
    S.xp+=c*5+(first?50:0); markDay(); save();
    L.quizDone={pct,correct:c,total:tot,stars};
    if(first) toast("ผ่านบทที่ "+u.n+" แล้ว +50 คะแนน");
  }
  if(r.kind==="scr"){const g=stat("games"); g.scr=Math.max(g.scr||0,c); S.xp+=c*2; bump("prac"); markDay(); save()}
  if(r.kind==="gq"||r.kind==="mist"){
    if(r.kind==="gq"&&PRUN_META){const gs=stat("gram"); gs[PRUN_META.id]=Math.max(gs[PRUN_META.id]||0,Math.round(c/tot*100))}
    S.xp+=c*2; bump("prac"); markDay(); save();
  }
  if(r.kind==="lvt"||r.kind==="pb"||r.kind==="tg"||r.kind==="wf") runnerDoneX(r,c,tot);
  if(r.kind==="placement"){
    const g=[0,4,8].map(s=>r.results.slice(s,s+4).filter(Boolean).length);
    const level=g[0]>=3&&g[1]>=3?3:g[0]>=3?2:1;
    S.placement={done:true,level:Math.max(level,S.placement.done?S.placement.level||1:1),score:c,at:Date.now()}; markDay(); save();
    P.result={level,score:c,g};
  }
}

async function playDialogue(u){
  Speech.stop();
  const d=u.dialogue;
  for(let i=0;i<d.lines.length;i++){
    if(route.name!=="lesson"||STEPS[L.step][0]!=="dialogue") return;
    document.querySelectorAll(".dlg li").forEach(x=>x.classList.remove("playing"));
    const li=$("#dl-"+i); if(li) li.classList.add("playing");
    await Speech.say(d.lines[i][1],{voice:d.lines[i][0]==="A"?0:1,pitch:d.lines[i][0]==="A"?1:1.15});
  }
  document.querySelectorAll(".dlg li").forEach(x=>x.classList.remove("playing"));
}
async function checkWriting(id){
  const u=COURSE.find(x=>x.id===id), w=W[id]||(W[id]={text:""});
  const text=(w.text||"").trim();
  if(text.length<5){toast("เขียนคำตอบก่อนส่งให้ครูตรวจ");return}
  w.busy=true; w.err=""; render();
  const prompt="You are an English teacher checking a short writing homework from a Thai adult learner.\nLevel: "+LEVELS[u.lv-1].code+"\nUnit grammar focus: "+u.grammar.title+"\nTask (Thai): "+u.writing.th+"\nStudent's text:\n\"\"\"\n"+text.slice(0,2000)+"\n\"\"\"\nReply with only a JSON object: {\"score\": integer 0-10, \"corrected\": \"the full corrected text in English\", \"notes\": [\"up to 4 short feedback points in Thai, each like: ✗ wrong → ✓ right เหตุผลสั้นๆ\"], \"praise\": \"one short encouraging sentence in Thai\"}";
  try{
    const res=await AI.fn.json(prompt,{modelTier:"default"});
    const score=Math.max(0,Math.min(10,Math.round(Number(res&&res.score)||0)));
    w.res={score,corrected:String(res&&res.corrected||""),notes:Array.isArray(res&&res.notes)?res.notes.slice(0,4).map(String):[],praise:String(res&&res.praise||"")};
    const r=rec(id); r.writing=Math.max(r.writing||0,score); S.xp+=score; markDay(); save();
  }catch(e){w.err=e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}
  w.busy=false;
  if(route.name==="lesson"&&L&&L.id===id) render();
}

  if((e.target.id==="goal-target"||e.target.id==="goal-date")&&S.goal){if(e.target.id==="goal-target") S.goal.target=Number(e.target.value); else S.goal.date=e.target.value; save(); toast("บันทึกเป้าหมายแล้ว")}});

/* ---------- boot ---------- */
(function boot(){
  let h=""; try{h=(location.hash||"").slice(1)}catch(e){}
  if(h.indexOf("lesson-")===0){const id=h.slice(7), i=COURSE.findIndex(u=>u.id===id); if(i>=0&&unlocked(i)){go("lesson",id);return}}
  if(h.indexOf("exam-")===0&&secById(h.slice(5))){go("examrun",h.slice(5));return}
  if(h.indexOf("practice-")===0){go("practice",h.slice(9));return}
  if(["home","course","review","teacher","report","placement","exam","practice"].includes(h)){go(h);return}
  render();
})();
initCloud();
initNative();
})();
</script>
