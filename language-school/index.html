const PACT={
  pgo:t=>go("practice",t.dataset.id||null),
  dlv:t=>{dictNew(t.dataset.lv); render(); Speech.say(dictItem()[0])},
  dplay:t=>{if(DI&&DI.i<DI.order.length){Speech.stop(); Speech.say(dictItem()[0],{slow:!!t.dataset.slow})}},
  dcheck:()=>{
    if(!DI||DI.res) return;
    const v=($("#dict-in")||{}).value||""; if(!v.trim()){toast("พิมพ์ประโยคที่ได้ยินก่อน");return}
    const it=dictItem(); DI.typed=v; DI.res=gradePron(it[0],v); DI.scores.push(DI.res.score);
    const d=stat("dict"); d.n=(d.n||0)+1; bump("dict"); S.xp+=DI.res.score>=80?2:1; markDay(); save(); render();
  },
  dnext:()=>{if(!DI) return; DI.i++; DI.res=null; DI.typed=""; render(); if(DI.i<DI.order.length){Speech.say(dictItem()[0]); const f=$("#dict-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus()}},
  sgroup:t=>{soundsNew(t.dataset.g); render(); const r=SO.rounds[0]; Speech.say(r.pair[r.say])},
  splay:t=>{if(!SO||SO.done) return; const r=SO.rounds[SO.i]; Speech.stop(); Speech.say(r.pair[r.say],{slow:!!t.dataset.slow})},
  spick:t=>{if(!SO||SO.pick!=null) return; SO.pick=+t.dataset.i; if(SO.pick===SO.rounds[SO.i].say) SO.correct++; render()},
  snext:()=>{
    if(!SO) return; SO.i++; SO.pick=null;
    if(SO.i>=SO.rounds.length){SO.done=true; const s=stat("sounds"); s[SO.gid]=Math.max(s[SO.gid]||0,SO.correct*10); bump("prac"); S.xp+=SO.correct; markDay(); save(); render(); return}
    render(); const r=SO.rounds[SO.i]; Speech.say(r.pair[r.say]);
  },
  gloss:t=>{if(!ST) return; ST.gloss=t.dataset.w||null; render(); if(ST.gloss) Speech.say(ST.gloss)},
  gadd:t=>{const k=t.dataset.w; if(k&&WORDS[k]&&!S.words[k]){S.words[k]={b:0,due:Date.now()}; save(); toast("เพิ่ม \""+k+"\" เข้าทบทวนแล้ว")} render()},
  gaddall:t=>{const s=STORIES.find(x=>x.id===t.dataset.id); let n=0; s.gloss.forEach(g=>{const k=g[0].toLowerCase(); if(WORDS[k]&&!S.words[k]){S.words[k]={b:0,due:Date.now()}; n++}}); save(); toast("เพิ่มเข้าทบทวน "+n+" คำ"); render()},
  stplay:()=>{const s=STORIES.find(x=>x.id===ST.id); if(ST.playing>=0){storyTok++; Speech.stop(); ST.playing=-1; render(); return} playStory(s); const b=document.querySelector('[data-act="stplay"]'); if(b) b.lastChild.textContent="หยุดอ่าน"},
  stq:t=>{
    const s=STORIES.find(x=>x.id===ST.id), qi=+t.dataset.q; if(ST.ans[qi]!=null) return;
    ST.ans[qi]=+t.dataset.o;
    if(Object.keys(ST.ans).length===s.qs.length){const c=s.qs.filter((q,i)=>ST.ans[i]===q.a).length, rd=stat("read"); rd[s.id]=Math.max(rd[s.id]||0,c); bump("prac"); S.xp+=c*3; markDay(); save()}
    render();
  },
  mstart:()=>{const list=S.mistakes||[]; if(!list.length) return; PRUN_META={id:"mist",title:"สมุดคำผิด"}; PRUN=newRunner(shuffle(list).slice(0,15).map(m=>Object.assign({},m.it,{_mid:m.id})),"mist"); render(); window.scrollTo(0,0)},
  mend:()=>{PRUN=null; PRUN_META=null; render()},
  mdel:t=>{const i=+t.dataset.i; if(Array.isArray(S.mistakes)&&S.mistakes[i]){S.mistakes.splice(i,1); save(); render()}},
  gqstart:t=>{const src=gramSrc(t.dataset.id); if(!src) return; PRUN_META={id:src.id,title:src.title}; PRUN=newRunner(src.quiz,"gq"); render(); const el=$(".runner"); if(el) el.scrollIntoView({block:"center"})},
  "scene-reset":t=>{const k="scene:"+t.dataset.id, st=CHATS[k]; if(st&&st.ctl) st.ctl.abort(); delete CHATS[k]; render()},
  "deck-add":t=>{const d=DECKS.find(x=>x.id===t.dataset.id); let n=0; d.words.forEach(w=>{if(!S.words[w[0]]){S.words[w[0]]={b:0,due:Date.now()}; n++}}); save(); toast("เพิ่ม "+n+" คำเข้าทบทวนแล้ว"); render()}
};

function lvDone(n){const us=COURSE.filter(u=>u.lv===n); return us.length>0&&us.every(u=>S.lessons[u.id]&&S.lessons[u.id].done)}
function maxStreak(){const s=stat("streak"); const now=streak(); if(now>(s.max||0)) s.max=now; return s.max||0}
function checkBadges(){
  if(!Array.isArray(S.badges)) S.badges=[];
  const fresh=BADGES.filter(b=>S.badges.indexOf(b.id)<0&&b.ok());
  if(!fresh.length) return;
  S.badges=S.badges.concat(fresh.map(b=>b.id)); save();
  toast("ได้รับเหรียญ: "+fresh.map(b=>b.t).join(", "));
}
function xpLevel(){const lv=Math.floor(S.xp/300)+1; return {lv,into:S.xp%300}}
function badgesHTML(){
  const got=Array.isArray(S.badges)?S.badges:[];
  return '<section class="section"><div class="section-head"><h2 class="h3">เหรียญความสำเร็จ</h2><span class="muted">ได้แล้ว '+got.length+'/'+BADGES.length+'</span></div><div class="badges">'
   +BADGES.map(b=>{const on=got.indexOf(b.id)>=0; return '<div class="badge'+(on?' on':'')+'"><span class="bd-icon" aria-hidden="true">'+(on?'★':'☆')+'</span><b>'+esc(b.t)+'</b><small>'+esc(b.d)+'</small></div>'}).join("")+'</div></section>';
}
function calendarHTML(){
  const set=new Set(S.days), weeks=12, today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today.getFullYear(),today.getMonth(),today.getDate()-((weeks-1)*7+today.getDay()));
  let cells="", n=0;
  for(let w=0;w<weeks;w++){
    for(let d=0;d<7;d++){
      const day=new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7+d), k=dayKey(day), future=day>today, on=set.has(k);
      if(on) n++;
      cells+='<i class="cd'+(on?' on':'')+(future?' fut':'')+'" style="grid-column:'+(w+1)+';grid-row:'+(d+1)+'" title="'+esc(day.toLocaleDateString("th-TH",{day:"numeric",month:"short"}))+(on?" · เข้าเรียน":"")+'"></i>';
    }
  }
  const days=["อา","จ","อ","พ","พฤ","ศ","ส"];
  return '<section class="section"><div class="section-head"><h2 class="h3">ปฏิทินการเรียน 12 สัปดาห์</h2><span class="muted">เข้าเรียน '+n+' วัน · ต่อเนื่องสูงสุด '+maxStreak()+' วัน</span></div>'
   +'<div class="cal-wrap"><div class="cal-days">'+days.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="cal" role="img" aria-label="เข้าเรียน '+n+' วันใน 12 สัปดาห์ล่าสุด">'+cells+'</div></div>'
   +'<p class="cal-legend"><span><i class="cd on"></i>เข้าเรียน</span><span><i class="cd"></i>ไม่ได้เข้าเรียน</span></p></section>';
}

/* ---------- games ---------- */
let MG=null, SB=null;
function gamePool(){
  let keys=Object.keys(S.words).filter(k=>WORDS[k]&&WORDS[k].th);
  if(keys.length<6) keys=keys.concat(COURSE.slice(0,2).reduce((a,u)=>a.concat(u.vocab.map(v=>v.en)),[]));
  return shuffle(Array.from(new Set(keys)));
}
function matchNew(){
  const pick=gamePool().slice(0,6);
  MG={words:pick,left:shuffle(pick),right:shuffle(pick),sel:null,done:[],miss:0,start:Date.now(),end:null,bad:null};
}

  if(!MG) matchNew();
  const best=stat("games").match;
  let h=pBack("games","เกม")+'<h1 class="h2" style="margin-top:8px">จับคู่คำศัพท์</h1><p class="lede">แตะคำภาษาอังกฤษ แล้วแตะความหมายที่ตรงกัน จับคู่ให้ครบ 6 คู่ให้เร็วที่สุด ถ้าจับผิดจะบวกเวลา 3 วินาที คำศัพท์สุ่มมาจากคลังของคุณ</p>'
   +'<div class="xbar" style="position:static"><span>จับคู่แล้ว <b>'+MG.done.length+'</b>/6</span><span class="xtimer" id="mtimer">'+(MG.end?mmss((MG.end-MG.start)/1000+MG.miss*3):mmss((Date.now()-MG.start)/1000+MG.miss*3))+'</span><span class="muted">'+(best?'สถิติดีที่สุด '+mmss(best):'')+'</span></div>';
  if(MG.end){
    const t=Math.round((MG.end-MG.start)/1000+MG.miss*3);

  }
  const col=(list,side)=>'<div class="mg-col">'+list.map(k=>{const done=MG.done.indexOf(k)>=0, sel=MG.sel&&MG.sel[0]===side&&MG.sel[1]===k, bad=MG.bad&&MG.bad.indexOf(side+":"+k)>=0;
    return '<button class="mg'+(done?' done':'')+(sel?' sel':'')+(bad?' bad':'')+'" data-act="mgpick" data-s="'+side+'" data-k="'+esc(k)+'"'+(done?' disabled':'')+(side==="en"?' lang="en"':'')+'>'+esc(side==="en"?WORDS[k].en:WORDS[k].th)+'</button>'}).join("")+'</div>';
  return h+'<div class="mg-grid">'+col(MG.left,"en")+col(MG.right,"th")+'</div>';
}
function spellNew(){
  const pool=gamePool().filter(k=>/^[a-z-]+$/i.test(WORDS[k].en)).slice(0,10);
  SB={list:pool,i:0,typed:"",res:null,correct:0};
}

  else h+='<div class="feedback '+(r==="ok"?"ok":"no")+'"><b>'+(r==="ok"?"สะกดถูกต้อง!":"ยังไม่ถูก")+'</b><span>คำที่ถูก: <b lang="en">'+esc(w.en)+'</b> · '+esc(w.th)+'</span></div><div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="sbnext">'+(SB.i+1<SB.list.length?"คำต่อไป":"ดูผล")+'</button></div>';

function scrambleItems(){

}

const GACT={
  mgnew:()=>{matchNew(); render()},
  mgpick:t=>{
    if(!MG||MG.end) return;
    const side=t.dataset.s, k=t.dataset.k;
    if(!MG.sel||MG.sel[0]===side){MG.sel=[side,k]; MG.bad=null; if(side==="en") Speech.say(WORDS[k].en); render(); return}
    if(MG.sel[1]===k){MG.done.push(k); MG.sel=null; MG.bad=null;
      if(MG.done.length===MG.words.length){MG.end=Date.now(); const t2=Math.round((MG.end-MG.start)/1000+MG.miss*3), g=stat("games"); if(!g.match||t2<g.match) g.match=t2; bump("prac"); S.xp+=10; markDay(); save()}}
    else {MG.miss++; MG.bad=[MG.sel[0]+":"+MG.sel[1],side+":"+k]; MG.sel=null}
    render();
  },
  sbnew:()=>{spellNew(); render(); if(SB.list.length) Speech.say(WORDS[SB.list[0]].en)},
  sbplay:t=>{if(SB&&SB.i<SB.list.length){Speech.stop(); Speech.say(WORDS[SB.list[SB.i]].en,{slow:!!t.dataset.slow})}},
  sbhint:()=>{if(SB){SB.hint=true; render()}},
  sbcheck:()=>{
    if(!SB||SB.res) return; const v=($("#sb-in")||{}).value||""; if(!v.trim()){toast("พิมพ์คำที่ได้ยินก่อน");return}
    const w=WORDS[SB.list[SB.i]]; SB.typed=v; SB.res=v.trim().toLowerCase()===w.en.toLowerCase()?"ok":"no"; if(SB.res==="ok") SB.correct++; render();
  },
  sbnext:()=>{
    if(!SB) return; SB.i++; SB.res=null; SB.typed=""; SB.hint=false;
    if(SB.i>=SB.list.length){const g=stat("games"); g.spell=Math.max(g.spell||0,SB.correct); bump("prac"); S.xp+=SB.correct; markDay(); save(); render(); return}
    render(); Speech.say(WORDS[SB.list[SB.i]].en); const f=$("#sb-in"); if(f&&window.matchMedia("(pointer:fine)").matches) f.focus();
  },
  scrstart:()=>{PRUN_META={id:"scr",title:"เรียงประโยค"}; PRUN=newRunner(scrambleItems(),"scr"); render()}
};

   intro:["<mark>many / a few / few</mark> ใช้กับคำนามนับได้ (พหูพจน์): many books, a few friends","<mark>much / a little / little</mark> ใช้กับคำนามนับไม่ได้: much money, a little time","<mark>a lot of / lots of / some / any</mark> ใช้ได้ทั้งสองแบบ ส่วน much มักใช้ในประโยคปฏิเสธและคำถาม","a few / a little = มีบ้าง (พอใช้ได้) ส่วน few / little = มีน้อยมาก (แทบไม่มี)"],
   head:["นับได้","นับไม่ได้","ใช้ได้ทั้งคู่"],rows:[["many","much","a lot of / lots of"],["a few (มีบ้าง)","a little (มีบ้าง)","some / any"],["few (แทบไม่มี)","little (แทบไม่มี)","plenty of / no"],["How many...?","How much...?","–"]],
   ex:[["How many people came to the party?","มีคนมางานปาร์ตี้กี่คน"],["There isn't much milk left.","นมเหลือไม่มาก"],["I have a few friends in Japan.","ฉันมีเพื่อนที่ญี่ปุ่นอยู่บ้าง"]],
   mist:[["How much people?","How many people?","people นับได้ ใช้ many"],["I have many homework.","I have a lot of homework.","homework นับไม่ได้"],["There are a little eggs.","There are a few eggs.","eggs นับได้ ใช้ a few"]]},
  quiz:[{t:"mc",q:"How ___ water do you drink every day?",o:["many","much","few"],a:1},{t:"mc",q:"There are only ___ tickets left. Hurry up!",o:["a few","a little","much"],a:0},{t:"mc",q:"I need ___ information about the course.",o:["many","some","a few"],a:1,w:"information นับไม่ได้"},{t:"mc",q:"We don't have ___ time. The train leaves in five minutes.",o:["much","many","few"],a:0},{t:"mc",q:"Very ___ people know the answer, so it's a difficult question.",o:["little","few","much"],a:1,w:"few = น้อยมาก ใช้กับนามนับได้"}]}
);

STORIES.push(
 {id:"c1a",lv:"C1",title:"The Attention Economy",th:"เศรษฐกิจแห่งความสนใจ",
  paras:["Every time you open a social media app, you enter a competition you may not even notice. Companies are not only competing for your money; they are competing for your attention, which has become one of the most valuable resources in the modern economy. The more time you spend on a platform, the more advertisements it can show you, and the more data it can collect about your habits.","To keep users scrolling, designers rely on techniques borrowed from psychology. Endless feeds remove natural stopping points, while notifications arrive at unpredictable moments, creating a sense of anticipation similar to that of a slot machine. Critics argue that these features are deliberately addictive, and that they make it increasingly difficult for people to concentrate on demanding tasks.","Not everyone agrees with this gloomy picture. Some researchers point out that people have always complained about new technologies, from novels to television. Nevertheless, a growing number of users are taking action, switching off notifications, setting daily limits or deleting apps altogether. Whether these small steps can outweigh the power of billion-dollar companies remains to be seen."],
  gloss:[["attention","ความสนใจ"],["valuable","มีค่า"],["techniques","เทคนิค วิธีการ"],["unpredictable","คาดเดาไม่ได้"],["anticipation","การรอคอยด้วยความตื่นเต้น"],["deliberately","โดยจงใจ"],["addictive","ทำให้เสพติด"],["outweigh","มีน้ำหนักมากกว่า"]],
  qs:[{q:"According to the article, why do companies want users' attention?",o:["to show more ads and collect data","to improve users' health","to reduce their costs"],a:0},{q:"What do critics say about notifications and endless feeds?",o:["They are deliberately addictive.","They help people concentrate.","They are too expensive to build."],a:0},{q:"How are some users responding?",o:["They are buying new phones.","They are switching off notifications or deleting apps.","They are complaining to the government."],a:1}]},
 {id:"c1b",lv:"C1",title:"Why We Procrastinate",th:"ทำไมเราชอบผัดวันประกันพรุ่ง",
  paras:["Most of us have delayed an important task while doing something far less useful, such as tidying a drawer or checking the news for the fifth time. This habit, known as procrastination, is often blamed on laziness or poor time management. However, psychologists now believe that the real cause is emotional rather than practical.","According to this view, we avoid tasks that make us feel anxious, bored or insecure. Putting them off provides immediate relief, which is why the habit is so hard to break. The problem is that the relief is temporary: the task remains, the deadline gets closer, and the stress eventually becomes worse than it would have been if we had simply started.","The good news is that procrastination can be reduced. Experts recommend breaking a large task into small, specific steps, so that the first one feels easy to begin. Others suggest being kind to yourself after a failure rather than criticising yourself, since guilt tends to make people avoid the task even longer. As one researcher puts it, the key is not to wait until you feel motivated, but to start and let the motivation follow."],
  gloss:[["delayed","เลื่อนออกไป"],["procrastination","การผัดวันประกันพรุ่ง"],["emotional","เกี่ยวกับอารมณ์"],["anxious","กังวล"],["relief","ความโล่งใจ"],["temporary","ชั่วคราว"],["guilt","ความรู้สึกผิด"],["motivated","มีแรงจูงใจ"]],
  qs:[{q:"What do psychologists now believe causes procrastination?",o:["laziness","emotions","poor planning"],a:1},{q:"Why is procrastination hard to stop?",o:["Delaying gives immediate relief.","Tasks are always boring.","Deadlines are too far away."],a:0},{q:"What do experts recommend?",o:["waiting until you feel motivated","criticising yourself after a failure","breaking tasks into small steps"],a:2}]}
);

async function checkEmail(id){
  const m=EMAILS.find(x=>x.id===id), text=(EMD[id]||"").trim(), r=EMR[id]||(EMR[id]={});
  if(wordCount(text)<15){toast("เขียนอีเมลอย่างน้อย 15 คำก่อนส่งให้ครูตรวจ");return}
  r.busy=true; r.err=""; render();
  const prompt="You are an English teacher checking a work email written by a Thai adult learner.\nEmail type: "+m.en+"\nTask (Thai): "+m.task+"\nStudent's email:\n\"\"\"\n"+text.slice(0,3000)+"\n\"\"\"\nCheck grammar, vocabulary, tone (formal or friendly as the task needs), structure (subject, greeting, purpose, closing) and whether every part of the task is covered.\nReply with only a JSON object: {\"score\": integer 0-10, \"corrected\": \"the full improved email in English, keeping the student's ideas\", \"notes\": [\"up to 5 short feedback points in Thai, each like: ✗ wrong → ✓ right เหตุผลสั้นๆ\"], \"praise\": \"one short encouraging sentence in Thai\"}";
  try{
    const res=await AI.fn.json(prompt,{modelTier:"default"});
    const score=Math.max(0,Math.min(10,Math.round(Number(res&&res.score)||0)));
    r.res={score,corrected:String(res&&res.corrected||""),notes:Array.isArray(res&&res.notes)?res.notes.slice(0,5).map(String):[],praise:String(res&&res.praise||"")};
    const d=emailDone(); d[id]=Math.max(d[id]||0,score); S.xp+=score; bump("prac"); markDay(); save();
  }catch(e){r.err=e&&e.code==="invalid_json"?"ครูตอบกลับมาไม่ครบ ลองกดส่งอีกครั้ง":aiError(e)}
  r.busy=false;
  if(route.name==="practice"&&route.id==="email."+id) render();
}

let DQ={q:"",ai:null,busy:false,err:""};
function dictMatches(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const th=/[฀-๿]/.test(q), out=[];
  Object.keys(WORDS).forEach(k=>{
    const w=WORDS[k]; if(!w||!w.en) return;
    const en=w.en.toLowerCase();
    let s=-1;
    if(th){if((w.th||"").indexOf(q)>=0) s=(w.th.indexOf(q)===0?1:2)}
    else if(en===q) s=0; else if(en.indexOf(q)===0) s=1; else if(en.indexOf(q)>=0) s=2;
    if(s>=0) out.push([s,en.length,k]);
  });
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,30).map(x=>x[2]);
}
function wordSrc(w){
  const u=w.unit||"";
  if(u==="custom") return "คำของฉัน";
  if(u.indexOf("deck-")===0){const d=DECKS.find(x=>"deck-"+x.id===u); return d?d.title:""}
  if(u.indexOf("story-")===0) return "บทอ่าน";
  const c=COURSE.find(x=>x.id===u); return c?"บทที่ "+c.n+" · "+LEVELS[c.lv-1].code:"";
}

/* ---------- speed game: meanings in 60 seconds ---------- */
let SPG=null;
function speedQ(){
  let pool=gamePool().filter(k=>WORDS[k]&&WORDS[k].th);
  if(pool.length<12) pool=pool.concat(shuffle(Object.keys(WORDS).filter(k=>WORDS[k].th&&WORDS[k].unit&&/^u\d/.test(WORDS[k].unit))).slice(0,40));
  pool=Array.from(new Set(pool));
  const k=pool[Math.floor(Math.random()*pool.length)], ths=new Set([WORDS[k].th]), opts=[k];
  for(const o of shuffle(pool)){if(opts.length>=4) break; if(!ths.has(WORDS[o].th)){ths.add(WORDS[o].th); opts.push(o)}}
  const sh=shuffle(opts); return {k,opts:sh,a:sh.indexOf(k)};
}
function speedLeft(){return SPG?Math.max(0,60-(Date.now()-SPG.start)/1000):60}
function speedFinish(){
  if(!SPG||SPG.end) return; SPG.end=Date.now();
  const g=stat("games"); SPG.best=g.speed||0; if(SPG.score>(g.speed||0)) g.speed=SPG.score;
  S.xp+=SPG.score; bump("prac"); markDay(); save();
}

function trackXp(){
  if(typeof S._xpSeen!=="number"){S._xpSeen=S.xp; return}
  const d=S.xp-S._xpSeen;
  if(d>0){
    if(!S.xpDay||typeof S.xpDay!=="object") S.xpDay={};
    const k=dayKey(); S.xpDay[k]=(S.xpDay[k]||0)+d;
    const ks=Object.keys(S.xpDay).sort(); while(ks.length>60) delete S.xpDay[ks.shift()];
  }
  S._xpSeen=S.xp;
}
function xpChartHTML(){
  const xd=S.xpDay&&typeof S.xpDay==="object"?S.xpDay:{}, days=[], today=new Date(); today.setHours(12,0,0,0);
  for(let i=13;i>=0;i--){const d=new Date(today.getTime()-i*DAY); days.push({d,k:dayKey(d),v:xd[dayKey(d)]||0})}
  const tot=days.reduce((a,x)=>a+x.v,0), max=Math.max.apply(null,days.map(x=>x.v)), act=days.filter(x=>x.v>0).length;
  let h='<section class="section"><div class="section-head"><h2 class="h3">คะแนนที่ได้ 14 วันล่าสุด</h2><span class="muted">รวม '+tot.toLocaleString()+' คะแนน'+(act?' · เฉลี่ย '+Math.round(tot/act)+' ต่อวันที่เรียน':'')+'</span></div>';
  if(!tot) return h+'<div class="card"><p class="muted">ยังไม่มีข้อมูล เรียน ฝึก หรือเล่นเกมเพื่อเก็บคะแนน แล้วกราฟจะขึ้นที่นี่</p></div></section>';
  const maxI=days.findIndex(x=>x.v===max);
  h+='<div class="card"><div class="xpc" role="img" aria-label="กราฟคะแนนรายวัน 14 วัน สูงสุด '+max+' คะแนน">'
   +days.map((x,i)=>{const lab=i===maxI||(i===13&&x.v>0); const t=x.d.toLocaleDateString("th-TH",{day:"numeric",month:"short"})+": "+x.v+" คะแนน";
     return '<div class="xpc-col" title="'+esc(t)+'">'+(lab?'<span class="xpc-v" style="bottom:calc('+(x.v/max*100)+'% + 3px)">'+x.v+'</span>':'')+'<i style="height:'+(x.v?Math.max(3,x.v/max*100):0)+'%"></i></div>'}).join("")
   +'</div><div class="xpc-x">'+days.map((x,i)=>'<span>'+(i%2===1?(i===13?'<b>'+x.d.getDate()+'</b>':x.d.getDate()):'')+'</span>').join("")+'</div></div></section>';
  return h;
}

/* ---------- listening to numbers, times and spelling ---------- */
const NUM_MODES=[["price","ราคา"],["time","เวลา"],["year","ปี ค.ศ."],["phone","เบอร์โทร"],["big","ตัวเลขหลักพัน"],["spell","สะกดชื่อ"]];
const SPELL_NAMES=["Pierce","Grant","Wilson","Thompson","Harris","Clarke","Walker","Wright","Hughes","Morgan","Bennett","Fraser","Quinn","Joyce","Vaughan","Rhodes","Kelly","Jarvis","Gibson","Lawrence","Fitzgerald","Carver","Holmes","Baxter"];
function w2(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?"-"+ONES[n%10]:"")}
function w3(n){const h=Math.floor(n/100), r=n%100; return (h?ONES[h]+" hundred":"")+(h&&r?" and ":"")+(r||!h?w2(r):"")}
function numWords(n){const th=Math.floor(n/1000), r=n%1000; return th?w3(th)+" thousand"+(r?(r<100?" and ":", ")+w3(r):""):w3(r)}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function numGen(mode){
  if(mode==="price"){
    const d=rnd(1,299), c=[0,25,49,50,75,95,99,rnd(1,98)][rnd(0,7)], cur=Math.random()<.5?["dollar","cent","$"]:["pound","pence","£"];
    const say=numWords(d)+" "+cur[0]+(d===1?"":"s")+(c?" "+(cur[0]==="dollar"?"and "+w2(c)+" cent"+(c===1?"":"s"):w2(c)):"");
    return {say,ans:(d+c/100).toFixed(2),show:cur[2]+d+(c?"."+String(c).padStart(2,"0"):""),hint:"พิมพ์เป็นตัวเลข เช่น 12.50"};
  }
  if(mode==="time"){
    const h=rnd(1,12), m=[0,5,10,15,20,25,30,35,40,45,50,55,rnd(1,59)][rnd(0,12)], nh=h%12+1;
    const dig=ONES[h]+" "+(m===0?"o'clock":m<10?"oh "+ONES[m]:w2(m));
    let say=dig;
    if(Math.random()<.5&&m%5===0){
      if(m===0) say=ONES[h]+" o'clock"; else if(m===15) say="quarter past "+ONES[h]; else if(m===30) say="half past "+ONES[h]; else if(m===45) say="quarter to "+ONES[nh];
      else if(m<30) say=w2(m)+" past "+ONES[h]; else say=w2(60-m)+" to "+ONES[nh];
    }
    return {say,ans:h+":"+String(m).padStart(2,"0"),show:h+":"+String(m).padStart(2,"0"),hint:"พิมพ์แบบ 7:15"};
  }
  if(mode==="year"){
    const y=rnd(1950,2029), yy=y%100;
    const say=y<2000?"nineteen "+(yy<10?"oh "+ONES[yy]:w2(yy)):y<2010?"two thousand"+(yy?" and "+ONES[yy]:""):"twenty "+w2(yy);
    return {say,ans:String(y),show:String(y),hint:"พิมพ์เป็นตัวเลข 4 หลัก"};
  }
  if(mode==="phone"){
    let d="0"+[6,8,9][rnd(0,2)]; while(d.length<10) d+=rnd(0,9);
    const word=c=>c==="0"?"oh":ONES[+c], grp=[d.slice(0,3),d.slice(3,6),d.slice(6)];
    return {say:grp.map(g=>g.split("").map(word).join(" ")).join(", "),ans:d,show:grp.join("-"),hint:"พิมพ์ตัวเลข 10 หลัก"};
  }
  if(mode==="big"){
    const n=Math.random()<.5?rnd(1000,9999):rnd(10000,99999);
    return {say:numWords(n),ans:String(n),show:n.toLocaleString("en-US"),hint:"พิมพ์เป็นตัวเลข"};
  }
  const nm=SPELL_NAMES[rnd(0,SPELL_NAMES.length-1)];
  return {say:nm.toUpperCase().split("").join(", "),ans:nm.toLowerCase(),show:nm,hint:"พิมพ์ชื่อที่สะกด"};
}
function numNorm(mode,s){
  s=String(s||"").trim().toLowerCase();
  if(mode==="price"){const v=parseFloat(s.replace(/[^0-9.]/g,"")); return isNaN(v)?"":v.toFixed(2)}
  if(mode==="time"){const m=/(\d{1,2})\D*(\d{2})?/.exec(s); if(!m) return ""; return (+m[1])+":"+(m[2]||"00")}
  if(mode==="spell") return s.replace(/[^a-z]/g,"");
  return s.replace(/\D/g,"");
}

async function pbPlayAll(id){

function runnerDoneX(r,c,tot){
  const pct=Math.round(c/tot*100);
  if(r.kind==="lvt"&&PRUN_META){const st=stat("lvtest"); st[PRUN_META.lv]=Math.max(st[PRUN_META.lv]||0,pct); S.xp+=c*3;
    if(pct>=80){let n=0; COURSE.filter(u=>u.lv===PRUN_META.lv).forEach(u=>{const rr=rec(u.id); if(rr.done) return; rr.done=true; rr.skipped=true; rr.reached=5; rr.best=Math.max(rr.best||0,pct); rr.stars=Math.max(rr.stars||0,pct===100?3:pct>=85?2:1); rr.doneAt=Date.now(); n++});
      if(n) toast("ผ่านระดับ "+LEVELS[PRUN_META.lv-1].code+" แล้ว ข้าม "+n+" บท ระดับถัดไปปลดล็อกแล้ว")}}
  if(r.kind==="pb"&&PRUN_META){const st=stat("pb"); st[PRUN_META.sit]=Math.max(st[PRUN_META.sit]||0,pct); S.xp+=c*2}
  if(r.kind==="tg"||r.kind==="wf"){const st=stat(r.kind); st.best=Math.max(st.best||0,c); S.xp+=c*2}
  bump("prac"); markDay(); save();
}

   ["A","I know! But it's a great way to meet people. And after the run, we usually go to a café together.","ใช่เลย! แต่มันเป็นวิธีรู้จักคนใหม่ ๆ ที่ดีมาก แล้วพอวิ่งเสร็จ พวกเราก็มักจะไปนั่งคาเฟ่ด้วยกัน"],
   ["B","So do you think you'll stay there for a long time?","แล้วเธอคิดว่าจะอยู่ที่นั่นอีกนานไหม"],
   ["A","I think so. The weather is terrible, of course. It rains all the time. But I'm starting to feel at home.","คิดว่าอย่างนั้นนะ แน่นอนว่าอากาศแย่มาก ฝนตกตลอดเวลา แต่ฉันเริ่มรู้สึกเหมือนอยู่บ้านแล้ว"],
   ["B","I'm really happy for you. Maybe I can visit you next month.","ฉันดีใจด้วยจริง ๆ เดือนหน้าฉันอาจจะไปเยี่ยมเธอนะ"],
   ["A","Please do! You can sleep on our sofa. Just bring an umbrella.","มาเลย! มานอนบนโซฟาที่ห้องเราได้ แค่อย่าลืมพกร่มมาด้วยนะ"]
  ],
  qs:[
   {q:"What is the conversation mainly about?",o:["Ben's plans to change jobs","How Sarah is settling into a new city","Why Sarah wants to move back home"],a:1,why:"ทั้งบทสนทนาเป็นเรื่องชีวิตของซาราห์ที่แมนเชสเตอร์ ตั้งแต่ “the first two weeks were quite hard” จนถึง “I'm starting to feel at home”"},
   {q:"How does Sarah get to work?",o:["She runs with her colleagues","She takes the bus","She walks"],a:2,why:"ซาราห์บอกว่าห้องพัก “close to my office, so I can walk to work” ส่วนการวิ่งเป็นกิจกรรมเย็นวันพุธ ไม่ใช่การเดินทางไปทำงาน"},
   {q:"Why is Ben surprised about the running club?",o:["Sarah didn't use to like running","The club meets too late","Sarah is always busy on Wednesdays"],a:0,why:"เบนพูดว่า “A running club? You never liked running!” แสดงว่าเขาแปลกใจเพราะซาราห์ไม่เคยชอบวิ่งมาก่อน"},
   {q:"How does Sarah feel about Manchester now?",o:["She wants to leave because of the weather","She is beginning to feel at home","She still feels lonely"],a:1,why:"แม้จะบ่นเรื่องฝน แต่ซาราห์บอกว่า “But I'm starting to feel at home.” และคิดว่าจะอยู่ที่นั่นอีกนาน"}
  ]},
 {id:"p4",lv:"B1",title:"Saving for a Trip",th:"เก็บเงินไปเที่ยว",cast:{A:"Lisa",B:"Mark"},
  lines:[
   ["A","Mark, you look worried. Is everything OK?","มาร์ก ดูเหมือนคุณกังวลอะไรอยู่นะ มีอะไรหรือเปล่า"],
   ["B","I've just checked my bank account. I want to go to Japan in December, but I haven't saved much money at all.","ผมเพิ่งเช็กบัญชีธนาคารมา ผมอยากไปญี่ปุ่นเดือนธันวาคม แต่แทบยังไม่ได้เก็บเงินเลย"],
   ["A","How much do you need for the trip?","ทริปนี้ต้องใช้เงินเท่าไหร่"],
   ["B","About 1,500 dollars. At the moment I've only got 300.","ประมาณ 1,500 ดอลลาร์ ตอนนี้ผมมีแค่ 300"],
   ["A","OK, let's think about it. Where does most of your money go every month?","โอเค มาลองคิดดูกัน แต่ละเดือนเงินส่วนใหญ่ของคุณหมดไปกับอะไร"],
   ["B","Rent, of course. But I also eat out a lot, and I buy coffee every morning on the way to work.","ค่าเช่าห้องอยู่แล้ว แต่ผมยังกินข้าวนอกบ้านบ่อย แล้วก็ซื้อกาแฟทุกเช้าระหว่างทางไปทำงาน"],
   ["A","Coffee every day can cost more than you think. If you make it at home, you could save around 80 dollars a month.","กาแฟทุกวันอาจแพงกว่าที่คุณคิดนะ ถ้าชงเองที่บ้าน คุณอาจประหยัดได้ประมาณเดือนละ 80 ดอลลาร์"],
   ["B","Really? That much? I never thought about it like that.","จริงเหรอ ขนาดนั้นเลย ผมไม่เคยมองแบบนั้นมาก่อนเลย"],
   ["A","Also, try cooking dinner three or four times a week. I usually cook on Sunday and take lunch to work too.","นอกจากนี้ ลองทำอาหารเย็นกินเองสักสัปดาห์ละสามสี่ครั้ง ฉันมักทำอาหารไว้ตั้งแต่วันอาทิตย์ แล้วห่อข้าวกลางวันไปทำงานด้วย"],
   ["B","That's a good idea, but I'm not a very good cook.","เป็นความคิดที่ดีนะ แต่ผมทำอาหารไม่ค่อยเก่ง"],
   ["A","Don't worry. Start with simple things, like pasta or fried rice. And here's another tip: when you get paid, move some money into a savings account straight away.","ไม่ต้องห่วง เริ่มจากอะไรง่าย ๆ อย่างพาสต้าหรือข้าวผัดก่อน แล้วมีอีกเคล็ดลับหนึ่ง พอเงินเดือนออก ให้โอนเงินส่วนหนึ่งเข้าบัญชีออมทรัพย์ทันที"],
   ["B","So I don't spend it by accident?","จะได้ไม่เผลอใช้หมดใช่ไหม"],
   ["A","Exactly. If you can't see it, you won't miss it.","ใช่เลย ถ้ามองไม่เห็นเงินก้อนนั้น คุณก็จะไม่รู้สึกว่าขาดมันไป"],
   ["B","Right. I'll start this month. Japan, here I come!","ได้เลย ผมจะเริ่มเดือนนี้เลย ญี่ปุ่น รอผมก่อนนะ!"]
  ],
  qs:[
   {q:"Why is Mark worried at the start?",o:["He lost his bank card","He doesn't have enough money for his trip","His rent has gone up"],a:1,why:"มาร์กบอกว่า “I want to go to Japan in December, but I haven't saved much money at all.”"},
   {q:"How much money does Mark have now?",o:["300 dollars","80 dollars","1,500 dollars"],a:0,why:"มาร์กบอกว่า “At the moment I've only got 300.” ส่วน 1,500 คือเงินที่ต้องใช้ และ 80 คือเงินที่อาจประหยัดได้จากกาแฟ"},
   {q:"What does Lisa suggest Mark should do when he gets paid?",o:["Buy his plane ticket","Pay his rent early","Put some money into a savings account immediately"],a:2,why:"ลิซ่าแนะนำว่า “when you get paid, move some money into a savings account straight away.”"},
   {q:"How does Mark feel at the end of the conversation?",o:["Doubtful that the plan will work","Motivated to start saving","Upset that he can't go to Japan"],a:1,why:"ตอนท้ายมาร์กพูดว่า “I'll start this month. Japan, here I come!” แสดงว่าเขามีกำลังใจและพร้อมเริ่มเก็บเงิน"}
  ]},
 {id:"p5",lv:"B2",title:"The Interview Debrief",th:"คุยกันหลังสัมภาษณ์งาน",cast:{A:"Rachel",B:"David"},
  lines:[
   ["A","So, how did the interview go? I've been waiting all afternoon to hear about it.","แล้วสัมภาษณ์เป็นยังไงบ้าง ฉันรอฟังมาทั้งบ่ายเลยนะ"],
   ["B","To be honest, I'm not really sure. Some parts went brilliantly, but there was one question that completely threw me.","พูดตามตรง ผมก็ไม่ค่อยแน่ใจ บางช่วงไปได้ดีมาก แต่มีคำถามหนึ่งที่ทำให้ผมไปไม่เป็นเลย"],
   ["A","Let's start with the good parts. What went well?","เริ่มจากส่วนที่ดีก่อนแล้วกัน อะไรไปได้ดีบ้าง"],
   ["B","They asked me about the marketing campaign I led last year, and I could talk about it in detail. I had real numbers, and I think the panel was genuinely impressed.","พวกเขาถามถึงแคมเปญการตลาดที่ผมเป็นคนนำเมื่อปีที่แล้ว และผมเล่าได้อย่างละเอียด ผมมีตัวเลขจริงมายืนยัน และคิดว่ากรรมการประทับใจจริง ๆ"],
   ["A","That's great. Concrete examples always make a strong impression. So what was the difficult question?","ดีมากเลย ตัวอย่างที่เป็นรูปธรรมสร้างความประทับใจได้เสมอ แล้วคำถามที่ยากคืออะไร"],
   ["B","They asked me to describe a time when I failed. My mind just went blank, and I ended up talking about a small scheduling mistake that didn't really matter.","พวกเขาให้เล่าถึงครั้งหนึ่งที่ผมล้มเหลว สมองผมว่างเปล่าไปเลย สุดท้ายเลยไปเล่าเรื่องจัดตารางผิดนิดหน่อยที่ไม่ได้สำคัญอะไร"],
   ["A","Hmm, that's a very common question. Interviewers usually want to see how you learn from mistakes, not just the mistake itself.","อืม นั่นเป็นคำถามที่เจอบ่อยมาก ผู้สัมภาษณ์มักอยากเห็นว่าคุณเรียนรู้อะไรจากความผิดพลาด ไม่ใช่แค่ตัวความผิดพลาดเอง"],
   ["B","I know, and that's what annoys me. I actually have a much better story about a product launch that went wrong, but I only remembered it on the train home.","ผมรู้ และนั่นแหละที่ทำให้ผมหงุดหงิด จริง ๆ ผมมีเรื่องที่ดีกว่านั้นมาก เรื่องการเปิดตัวสินค้าที่พังไม่เป็นท่า แต่ดันมานึกออกตอนนั่งรถไฟกลับบ้าน"],
   ["A","Well, it's not too late to use it. Why don't you mention it in your thank-you email? You could say you've reflected on the question and add a better example.","ก็ยังไม่สายเกินไปที่จะใช้นะ ทำไมไม่พูดถึงมันในอีเมลขอบคุณล่ะ บอกไปว่าคุณได้ทบทวนคำถามนั้นแล้ว และเพิ่มตัวอย่างที่ดีกว่าเข้าไป"],
   ["B","Isn't that a bit unusual? I don't want to look desperate.","มันจะแปลกไปหน่อยไหม ผมไม่อยากดูเหมือนคนร้อนรนอยากได้งานเกินไป"],
   ["A","Not at all, as long as you keep it short. It shows you're thoughtful. Just two or three sentences, then thank them for their time.","ไม่เลย ขอแค่เขียนให้สั้นกระชับ มันแสดงว่าคุณเป็นคนคิดรอบคอบ แค่สองสามประโยค แล้วก็ขอบคุณที่พวกเขาสละเวลา"],
   ["B","OK, that makes sense. They said they'd let candidates know by the end of next week, so I should send it tonight.","โอเค ฟังดูมีเหตุผล พวกเขาบอกว่าจะแจ้งผลผู้สมัครภายในสิ้นสัปดาห์หน้า งั้นผมควรส่งคืนนี้เลย"],
   ["A","Definitely. And whatever happens, you've clearly learned something useful for next time.","แน่นอน และไม่ว่าผลจะออกมาอย่างไร คุณก็ได้เรียนรู้สิ่งที่มีประโยชน์สำหรับครั้งหน้าแล้ว"],
   ["B","True. Next time I'll prepare a proper failure story before I walk in.","จริง ครั้งหน้าผมจะเตรียมเรื่องความล้มเหลวดี ๆ ไว้ก่อนเดินเข้าห้องสัมภาษณ์เลย"]
  ],
  qs:[
   {q:"What is David's overall feeling about the interview?",o:["Confident that he got the job","Uncertain, because some parts went well and one went badly","Sure that he failed completely"],a:1,why:"เดวิดบอกว่า “I'm not really sure. Some parts went brilliantly, but there was one question that completely threw me.” จึงรู้สึกไม่แน่ใจ"},
   {q:"Which part of the interview went well?",o:["Talking about a marketing campaign he led","Explaining a product launch that went wrong","Describing a scheduling mistake"],a:0,why:"เดวิดเล่าว่าตอนพูดถึง “the marketing campaign I led last year” เขามีตัวเลขจริงและกรรมการประทับใจ ส่วนเรื่องเปิดตัวสินค้าเขานึกออกตอนกลับบ้าน"},
   {q:"What does Rachel advise David to do?",o:["Call the panel to explain","Wait until he hears from them","Add a better example to a short thank-you email"],a:2,why:"เรเชลแนะนำว่า “Why don't you mention it in your thank-you email?” และย้ำว่า “as long as you keep it short”"},
   {q:"How does David first react to Rachel's suggestion?",o:["He worries it will seem desperate","He thinks it's a brilliant idea","He says it is too late"],a:0,why:"เดวิดถามกลับว่า “Isn't that a bit unusual? I don't want to look desperate.” แสดงว่าตอนแรกเขายังลังเล"}
  ]},
 {id:"p6",lv:"B2",title:"Better Sleep",th:"นอนหลับให้ดีขึ้น",cast:{A:"Anna",B:"James"},
  lines:[
   ["A","Welcome back to Healthy Habits. I'm Anna, and today James and I are talking about something we all do but rarely think about: sleep.","ยินดีต้อนรับกลับสู่รายการ Healthy Habits ฉันแอนนา วันนี้ฉันกับเจมส์จะคุยเรื่องที่เราทุกคนทำแต่แทบไม่เคยใส่ใจ นั่นคือการนอน"],
   ["B","Thanks, Anna. And I have a confession to make. Last night I slept for about five hours, which is far less than the seven to nine hours most adults need.","ขอบคุณครับแอนนา ผมมีเรื่องต้องสารภาพ เมื่อคืนผมนอนแค่ประมาณห้าชั่วโมง ซึ่งน้อยกว่าเจ็ดถึงเก้าชั่วโมงที่ผู้ใหญ่ส่วนใหญ่ต้องการอยู่มาก"],
   ["A","Five hours! What kept you up?","ห้าชั่วโมงเองเหรอ! อะไรทำให้คุณไม่ได้นอน"],
   ["B","My phone, mainly. I told myself I'd just check my messages, and suddenly it was one in the morning.","ส่วนใหญ่ก็มือถือนี่แหละครับ ผมบอกตัวเองว่าจะแค่เช็กข้อความ รู้ตัวอีกทีก็ตีหนึ่งแล้ว"],
   ["A","That's incredibly common. Screens are a problem for two reasons. The bright light tells your brain it's still daytime, and the content keeps your mind active when it should be slowing down.","เรื่องนี้เกิดขึ้นบ่อยมากค่ะ หน้าจอเป็นปัญหาด้วยสองเหตุผล แสงสว่างจ้าบอกสมองว่ายังเป็นกลางวันอยู่ และเนื้อหาก็ทำให้สมองตื่นตัวในเวลาที่ควรจะผ่อนคลายลง"],
   ["B","So what do you do? I know you're quite strict about your routine.","แล้วคุณทำยังไงครับ ผมรู้ว่าคุณค่อนข้างเคร่งเรื่องกิจวัตรก่อนนอน"],
   ["A","I am. I stop using screens an hour before bed, and I charge my phone in the kitchen, not the bedroom. Then I read a paper book until I feel sleepy.","ใช่ค่ะ ฉันเลิกใช้หน้าจอหนึ่งชั่วโมงก่อนนอน และชาร์จมือถือไว้ในครัว ไม่ใช่ในห้องนอน จากนั้นก็อ่านหนังสือเล่มจนรู้สึกง่วง"],
   ["B","The kitchen! That seems a bit extreme. What if you need an alarm?","ในครัวเลยเหรอ ดูสุดโต่งไปหน่อยนะ แล้วถ้าต้องใช้นาฬิกาปลุกล่ะ"],
   ["A","I bought an old-fashioned alarm clock. It was cheap, and honestly it changed my life. I fall asleep much faster now.","ฉันซื้อนาฬิกาปลุกแบบโบราณมาค่ะ ราคาถูกมาก และพูดตรง ๆ มันเปลี่ยนชีวิตฉันเลย ตอนนี้ฉันหลับเร็วขึ้นเยอะ"],
   ["B","Another thing I've read about is keeping the same wake-up time every day, even at weekends. Is that really important?","อีกเรื่องที่ผมเคยอ่านเจอคือการตื่นเวลาเดิมทุกวัน แม้แต่วันหยุดสุดสัปดาห์ มันสำคัญขนาดนั้นจริงเหรอ"],
   ["A","It is. If you sleep until eleven on Sunday, your body clock gets confused, and Monday morning feels terrible. Experts sometimes call it social jet lag.","สำคัญค่ะ ถ้าวันอาทิตย์คุณนอนถึงสิบเอ็ดโมง นาฬิกาชีวภาพจะสับสน แล้วเช้าวันจันทร์ก็จะรู้สึกแย่มาก ผู้เชี่ยวชาญบางคนเรียกอาการนี้ว่า social jet lag"],
   ["B","That explains a lot about my Mondays. What about caffeine? I usually have a coffee after lunch.","นั่นอธิบายเรื่องวันจันทร์ของผมได้หมดเลย แล้วคาเฟอีนล่ะ ผมมักดื่มกาแฟหลังมื้อกลางวัน"],
   ["A","Caffeine can stay in your body for six hours or more, so an afternoon coffee might still affect you at bedtime. Try switching to herbal tea or water after midday.","คาเฟอีนอาจค้างอยู่ในร่างกายได้หกชั่วโมงหรือนานกว่านั้น กาแฟตอนบ่ายจึงอาจยังส่งผลตอนเข้านอน ลองเปลี่ยนไปดื่มชาสมุนไพรหรือน้ำเปล่าหลังเที่ยงดูค่ะ"],
   ["B","All right, here's my challenge for this week: no phone in the bedroom and no coffee after twelve. I'll report back next episode.","เอาล่ะ นี่คือภารกิจของผมสัปดาห์นี้ ไม่เอามือถือเข้าห้องนอน และไม่ดื่มกาแฟหลังเที่ยง แล้วผมจะมารายงานผลในตอนหน้าครับ"]
  ],
  qs:[
   {q:"What is the main purpose of this episode?",o:["To compare different alarm clocks","To explain why coffee is unhealthy","To share practical habits for sleeping better"],a:2,why:"แอนนาเปิดรายการว่าจะคุยเรื่อง “sleep” และทั้งตอนเป็นคำแนะนำเรื่องหน้าจอ เวลาตื่น และคาเฟอีน นาฬิกาปลุกกับกาแฟเป็นเพียงรายละเอียดย่อย"},
   {q:"Why did James sleep for only five hours?",o:["He drank coffee late at night","He was using his phone","He woke up early for work"],a:1,why:"เจมส์บอกว่า “My phone, mainly. I told myself I'd just check my messages, and suddenly it was one in the morning.”"},
   {q:"Where does Anna keep her phone at night?",o:["In the kitchen","Next to her bed","In the living room"],a:0,why:"แอนนาบอกว่า “I charge my phone in the kitchen, not the bedroom.”"},
   {q:"What was James's first reaction to Anna's phone habit?",o:["He said he already does the same","He thought it was a bit extreme","He thought it was too expensive"],a:1,why:"เจมส์พูดว่า “The kitchen! That seems a bit extreme.” ส่วนคำว่า cheap พูดถึงนาฬิกาปลุก ไม่ใช่ความเห็นของเจมส์"}
  ]},
 {id:"p7",lv:"C1",title:"The Remote Work Debate",th:"ถกเถียงเรื่องการทำงานทางไกล",cast:{A:"Claire",B:"Daniel"},
  lines:[
   ["A","Welcome to Both Sides, the show where we take one question and argue it from opposite corners. I'm Claire, and today's question is whether companies should bring employees back to the office full time. Daniel, you're arguing yes, which I suspect won't make you very popular.","ยินดีต้อนรับสู่รายการ Both Sides รายการที่เราหยิบคำถามหนึ่งข้อมาถกกันจากคนละฝั่ง ฉันแคลร์ คำถามวันนี้คือบริษัทควรเรียกพนักงานกลับเข้าออฟฟิศเต็มเวลาหรือไม่ แดเนียล คุณอยู่ฝั่งที่เห็นด้วย ซึ่งฉันว่าคงไม่ทำให้คุณเป็นที่รักสักเท่าไหร่"],
   ["B","Probably not, but hear me out. My concern is less about productivity and more about how people learn. Junior staff pick up an enormous amount simply by overhearing how experienced colleagues handle a difficult call or a tricky client, and that kind of learning barely happens over video.","คงไม่หรอกครับ แต่ฟังผมก่อน สิ่งที่ผมกังวลไม่ได้อยู่ที่ประสิทธิภาพการทำงานเท่าไหร่ แต่อยู่ที่วิธีการเรียนรู้ของคน พนักงานรุ่นใหม่ได้เรียนรู้มหาศาลเพียงแค่ได้ยินว่ารุ่นพี่ที่มีประสบการณ์รับมือกับสายโทรศัพท์ยาก ๆ หรือลูกค้าที่จัดการยากอย่างไร และการเรียนรู้แบบนี้แทบไม่เกิดขึ้นผ่านวิดีโอคอลเลย"],
   ["A","I'll grant you that mentoring is harder at a distance. But forcing everyone back five days a week is a very blunt solution to that problem. Many people moved further out during the pandemic, and they'd lose two hours a day for the privilege of sitting on video calls in an open-plan office.","ฉันยอมรับว่าการเป็นพี่เลี้ยงทำได้ยากกว่าเมื่ออยู่ห่างกัน แต่การบังคับทุกคนกลับมาห้าวันต่อสัปดาห์เป็นทางแก้ที่หยาบเกินไป หลายคนย้ายไปอยู่ไกลขึ้นในช่วงโรคระบาด และพวกเขาจะต้องเสียเวลาวันละสองชั่วโมง เพียงเพื่อได้สิทธิ์มานั่งประชุมวิดีโอในออฟฟิศแบบเปิดโล่ง"],
   ["B","That last point is fair, but it's a failure of how offices are run rather than an argument against them. If people come in, those days should be designed around collaboration, not spent wearing headphones. Still, I'd argue that a shared culture needs a shared place.","ประเด็นสุดท้ายก็มีเหตุผลครับ แต่นั่นคือความล้มเหลวของการบริหารออฟฟิศ มากกว่าจะเป็นเหตุผลคัดค้านการมีออฟฟิศ ถ้าคนต้องเข้ามา วันเหล่านั้นก็ควรออกแบบให้เน้นการทำงานร่วมกัน ไม่ใช่นั่งใส่หูฟังทั้งวัน ถึงอย่างนั้น ผมก็ยังยืนยันว่าวัฒนธรรมร่วมกันต้องมีพื้นที่ร่วมกัน"],
   ["A","Does it, though? Some of the most tightly knit teams I've worked with were fully remote, spread across four time zones. What they had was clear communication and a manager who trusted them, and neither of those depends on a building.","จริงหรือคะ ทีมที่เหนียวแน่นที่สุดบางทีมที่ฉันเคยร่วมงานด้วยทำงานทางไกลเต็มรูปแบบ กระจายอยู่ในสี่เขตเวลา สิ่งที่พวกเขามีคือการสื่อสารที่ชัดเจนและผู้จัดการที่ไว้ใจพวกเขา ซึ่งทั้งสองอย่างไม่ได้ขึ้นอยู่กับตึกเลย"],
   ["B","Trust is the key word there, and I think it cuts both ways. A lot of return to office rules are really about managers who don't know how to measure output, so they measure presence instead. I'm not defending that.","ความไว้ใจคือคำสำคัญเลยครับ และผมคิดว่ามันใช้ได้กับทั้งสองฝั่ง กฎเรียกคนกลับเข้าออฟฟิศจำนวนมาก แท้จริงแล้วมาจากผู้จัดการที่ไม่รู้วิธีวัดผลงาน จึงหันไปวัดจากการมาปรากฏตัวแทน เรื่องนั้นผมไม่ได้แก้ต่างให้"],
   ["A","Then what exactly are you defending? Because it's starting to sound as if we agree.","แล้วตกลงคุณกำลังปกป้องอะไรอยู่คะ เพราะเริ่มฟังดูเหมือนเราเห็นตรงกันแล้วนะ"],
   ["B","Narrowly, I'm defending the idea that being physically together has value that is hard to measure and easy to lose. I'd accept a hybrid model, perhaps three days in the office, as long as those days are protected for teamwork and new starters are actually sitting next to someone who can help them.","ถ้าพูดให้แคบลง ผมปกป้องแนวคิดที่ว่าการได้อยู่ด้วยกันจริง ๆ มีคุณค่าที่วัดได้ยากแต่สูญเสียได้ง่าย ผมรับรูปแบบไฮบริดได้ อาจจะเข้าออฟฟิศสามวัน ตราบใดที่วันเหล่านั้นถูกกันไว้สำหรับการทำงานเป็นทีม และพนักงานใหม่ได้นั่งข้าง ๆ คนที่ช่วยพวกเขาได้จริง"],
   ["A","I could live with that, although I'd push for two days rather than three, and I'd let each team choose which ones. The real mistake is a single rule imposed from the top on people doing very different jobs.","แบบนั้นฉันรับได้ แม้ว่าฉันจะผลักดันให้เป็นสองวันแทนสามวัน และให้แต่ละทีมเลือกเองว่าจะเป็นวันไหน ความผิดพลาดที่แท้จริงคือการใช้กฎข้อเดียวสั่งลงมาจากเบื้องบน กับคนที่ทำงานต่างกันมาก"],
   ["B","So we've gone from full time in the office versus fully remote to arguing over a single day. I suspect that's roughly where most sensible companies will end up as well.","สรุปคือเราเปลี่ยนจากการเถียงว่าเข้าออฟฟิศเต็มเวลาหรือทำงานทางไกลเต็มรูปแบบ มาเป็นเถียงกันแค่เรื่องวันเดียว ผมว่านั่นก็คงเป็นจุดที่บริษัทส่วนใหญ่ที่มีเหตุผลจะไปลงเอยเหมือนกัน"],
   ["A","Perhaps. Although I'd add that the companies that get this right will be the ones that actually ask their staff before deciding, rather than announcing a policy by email on a Friday afternoon.","อาจจะใช่ค่ะ แต่ฉันขอเสริมว่า บริษัทที่ทำเรื่องนี้ได้ถูกต้องคือบริษัทที่ถามความเห็นพนักงานก่อนตัดสินใจจริง ๆ ไม่ใช่ประกาศนโยบายทางอีเมลตอนบ่ายวันศุกร์"],
   ["B","On that point, at least, we're in complete agreement. Nothing damages trust faster than a decision people only hear about after it's been made.","อย่างน้อยในประเด็นนี้เราเห็นตรงกันทุกอย่างครับ ไม่มีอะไรทำลายความไว้ใจได้เร็วไปกว่าการตัดสินใจที่คนได้ยินก็ตอนที่มันถูกตัดสินไปแล้ว"],
   ["A","On that rare note of agreement, we'll leave it there. Thanks for listening to Both Sides.","ด้วยความเห็นพ้องที่หาได้ยากนี้ ขอจบรายการไว้เพียงเท่านี้ ขอบคุณที่รับฟัง Both Sides ค่ะ"]
  ],
  qs:[
   {q:"How does the debate develop over the episode?",o:["The speakers become more strongly opposed","The speakers move closer to a compromise","One speaker completely changes sides"],a:1,why:"แคลร์พูดว่า “it's starting to sound as if we agree” และแดเนียลสรุปว่าจากเดิมเถียงกันสุดขั้ว ตอนนี้ “arguing over a single day” แสดงว่าทั้งคู่ค่อย ๆ หาจุดกึ่งกลาง แต่ไม่มีใครเปลี่ยนข้างทั้งหมด"},
   {q:"What is Daniel's main reason for supporting office work?",o:["Junior staff learn by watching experienced colleagues","Managers can measure output more easily","People are more productive in offices"],a:0,why:"แดเนียลบอกว่า “My concern is less about productivity and more about how people learn” และยกตัวอย่างพนักงานรุ่นใหม่ที่เรียนรู้จากการได้ยินรุ่นพี่ทำงาน"},
   {q:"What does Daniel suggest about many return to office rules?",o:["They are popular with junior staff","They are mainly designed to improve teamwork","They reflect managers who cannot measure output"],a:2,why:"แดเนียลพูดว่า “A lot of return to office rules are really about managers who don't know how to measure output, so they measure presence instead.” และบอกว่าเขาไม่ได้แก้ต่างให้เรื่องนี้"},
   {q:"What do Claire and Daniel still disagree about at the end?",o:["Whether hybrid work should exist at all","How many days people should spend in the office","Whether remote teams can build trust"],a:1,why:"แดเนียลเสนอ “perhaps three days in the office” ส่วนแคลร์บอกว่า “I'd push for two days rather than three” จึงยังต่างกันแค่จำนวนวัน"}
  ]},
 {id:"p8",lv:"C1",title:"Learning a Language Later in Life",th:"เรียนภาษาเมื่อเป็นผู้ใหญ่",cast:{A:"Maya",B:"Oliver"},
  lines:[
   ["A","Welcome to Lifelong Learner. I'm Maya, and my guest today is Oliver, who started learning Portuguese at forty-two and now works as a translator. Oliver, the first thing people usually ask is whether it's simply too late for adults to learn a language properly.","ยินดีต้อนรับสู่รายการ Lifelong Learner ฉันมายา แขกรับเชิญวันนี้คือโอลิเวอร์ ผู้เริ่มเรียนภาษาโปรตุเกสตอนอายุสี่สิบสอง และตอนนี้ทำงานเป็นนักแปล โอลิเวอร์คะ คำถามแรกที่คนมักถามคือ ผู้ใหญ่สายเกินไปแล้วหรือเปล่าที่จะเรียนภาษาให้เก่งจริง ๆ"],
   ["B","It's a question I hear constantly, and the short answer is no. Children do have an advantage when it comes to accent, but adults are actually faster learners in the early stages, because we can understand grammar explanations, use a dictionary and connect new words to things we already know.","เป็นคำถามที่ผมได้ยินอยู่ตลอดครับ และคำตอบสั้น ๆ คือไม่สาย เด็กได้เปรียบจริงเรื่องสำเนียง แต่ในช่วงแรกผู้ใหญ่เรียนได้เร็วกว่า เพราะเราเข้าใจคำอธิบายไวยากรณ์ ใช้พจนานุกรมเป็น และเชื่อมโยงคำใหม่กับสิ่งที่รู้อยู่แล้วได้"],
   ["A","So why do so many adults give up? I've started and abandoned at least three languages myself.","แล้วทำไมผู้ใหญ่จำนวนมากถึงเลิกกลางทางล่ะคะ ตัวฉันเองก็เริ่มเรียนแล้วทิ้งไปอย่างน้อยสามภาษา"],
   ["B","In my experience, it's rarely about ability. It's about time and, more importantly, embarrassment. Adults are used to being competent, and suddenly sounding like a five-year-old is genuinely uncomfortable, so people avoid speaking and then conclude they're not making progress.","จากประสบการณ์ของผม มันแทบไม่เกี่ยวกับความสามารถเลย แต่เกี่ยวกับเวลา และที่สำคัญกว่านั้นคือความอาย ผู้ใหญ่เคยชินกับการเป็นคนเก่ง พอจู่ ๆ ต้องพูดเหมือนเด็กห้าขวบก็อึดอัดใจจริง ๆ คนจึงเลี่ยงไม่พูด แล้วก็สรุปเอาเองว่าตัวเองไม่ก้าวหน้า"],
   ["A","That rings very true. How did you deal with that feeling?","ตรงใจมากเลยค่ะ แล้วคุณรับมือกับความรู้สึกนั้นอย่างไร"],
   ["B","I gave myself permission to be bad at it for a while. I set a goal of making ten mistakes a day in conversation, which sounds silly, but it turned errors into evidence that I was practising rather than proof that I was failing.","ผมอนุญาตให้ตัวเองพูดได้ไม่ดีไปสักพัก ผมตั้งเป้าว่าจะพูดผิดให้ได้วันละสิบครั้งเวลาสนทนา ฟังดูตลกนะครับ แต่มันเปลี่ยนความผิดพลาดให้เป็นหลักฐานว่าผมกำลังฝึกอยู่ แทนที่จะเป็นข้อพิสูจน์ว่าผมล้มเหลว"],
   ["A","I love that. What about the practical side? You must have had a job and a family at the time.","ชอบมากเลยค่ะ แล้วในแง่การปฏิบัติล่ะ ตอนนั้นคุณคงมีทั้งงานและครอบครัวต้องดูแล"],
   ["B","Exactly, so I never had long study sessions. Instead, I did twenty minutes every single day, mostly listening to podcasts on my commute. I'm convinced that consistency matters far more than intensity. A three-hour class once a week is less effective than a little every day.","ใช่ครับ ผมเลยไม่เคยมีเวลานั่งเรียนนาน ๆ แต่ผมเรียนวันละยี่สิบนาทีทุกวันไม่เว้นเลย ส่วนใหญ่คือฟังพอดแคสต์ระหว่างเดินทางไปทำงาน ผมเชื่อมั่นว่าความสม่ำเสมอสำคัญกว่าความหนักหน่วงมาก เรียนสามชั่วโมงสัปดาห์ละครั้งได้ผลน้อยกว่าเรียนทีละนิดทุกวัน"],
   ["A","And did the listening really help, even when you couldn't understand everything?","แล้วการฟังช่วยได้จริงไหมคะ แม้ในตอนที่คุณยังฟังไม่ออกทั้งหมด"],
   ["B","It did, as long as I understood most of it. If something was far too difficult, I switched to material for learners. The sweet spot is when you can follow the story but meet a few new words along the way.","ช่วยครับ ตราบใดที่ผมเข้าใจเนื้อหาส่วนใหญ่ ถ้าอะไรยากเกินไปมาก ผมจะเปลี่ยนไปฟังสื่อสำหรับผู้เรียน จุดที่พอดีที่สุดคือตอนที่คุณตามเรื่องทัน แต่ก็เจอคำใหม่บ้างระหว่างทาง"],
   ["A","What about your accent? Does it still bother you?","แล้วสำเนียงของคุณล่ะคะ ยังกวนใจอยู่ไหม"],
   ["B","Not anymore. People can tell I'm not a native speaker within about ten seconds, and that's perfectly fine. The goal was never to sound Brazilian. It was to be understood clearly and to understand others, and an accent doesn't get in the way of either.","ไม่แล้วครับ คนฟังแค่ประมาณสิบวินาทีก็รู้ว่าผมไม่ใช่เจ้าของภาษา และนั่นก็ไม่มีปัญหาอะไรเลย เป้าหมายไม่เคยอยู่ที่การพูดให้เหมือนคนบราซิล แต่คือการพูดให้คนอื่นเข้าใจชัดเจน และเข้าใจสิ่งที่คนอื่นพูด ซึ่งสำเนียงไม่ได้ขวางทั้งสองอย่างเลย"],
   ["A","That's a very reassuring note to end on. Oliver, thank you so much for joining us.","เป็นข้อคิดปิดท้ายที่ทำให้อุ่นใจมากค่ะ โอลิเวอร์ ขอบคุณมากที่มาร่วมรายการกับเรา"]
  ],
  qs:[
   {q:"What is Oliver's main message?",o:["Adults should focus on getting a native accent","Intensive weekly classes are the fastest route","Adults can learn a language well if they approach it sensibly"],a:2,why:"โอลิเวอร์ตอบคำถามแรกว่า “the short answer is no” คือไม่สายเกินไป แล้วอธิบายวิธีที่ได้ผล เช่น ยอมพูดผิดและเรียนทีละนิดทุกวัน เขาบอกด้วยว่าเรียนสัปดาห์ละครั้งได้ผลน้อยกว่า และไม่ได้ตั้งเป้าพูดเหมือนเจ้าของภาษา"},
   {q:"According to Oliver, why do many adults give up?",o:["They lack natural ability","They feel embarrassed about speaking badly","Grammar is too difficult for them"],a:1,why:"โอลิเวอร์บอกว่า “it's rarely about ability. It's about time and, more importantly, embarrassment.”"},
   {q:"What was the purpose of his goal of making ten mistakes a day?",o:["To make mistakes feel like a normal part of practice","To help him find a good teacher","To measure how fast he was improving"],a:0,why:"เขาอธิบายว่าเป้าหมายนี้ “turned errors into evidence that I was practising rather than proof that I was failing” คือทำให้การพูดผิดกลายเป็นเรื่องปกติของการฝึก"},
   {q:"How does Oliver feel about his accent now?",o:["He is still trying hard to lose it","He is relaxed about it, because being understood matters more","He is embarrassed when people notice it"],a:1,why:"โอลิเวอร์บอกว่า “that's perfectly fine” และ “The goal was never to sound Brazilian” เพราะเป้าหมายคือการสื่อสารให้เข้าใจกัน"}
  ]}
];

{"cat":"ไวยากรณ์","wrong":"I have many homework.","right":"I have a lot of homework.","why":"homework เป็นคำนามนับไม่ได้ จึงใช้ many และเติม -s ไม่ได้ ต้องใช้ a lot of หรือ much แทน ภาษาไทยไม่แยกนามนับได้/นับไม่ได้จึงสับสนง่าย"},
{"cat":"ไวยากรณ์","wrong":"There's nothing to do, so I'm boring.","right":"There's nothing to do, so I'm bored.","why":"คุณศัพท์ลงท้าย -ed บอกความรู้สึกของเรา ส่วน -ing บอกลักษณะของสิ่งที่ทำให้รู้สึก \"I'm boring\" จึงแปลว่า \"ฉันเป็นคนน่าเบื่อ\" ไม่ใช่ \"ฉันเบื่อ\""},
{"cat":"ไวยากรณ์","wrong":"I'm so exciting about the trip.","right":"I'm so excited about the trip.","why":"ถ้าพูดถึงความรู้สึกของตัวเองต้องใช้ excited ส่วน exciting ใช้บรรยายสิ่งที่น่าตื่นเต้น เช่น an exciting trip ภาษาไทยใช้คำว่า \"ตื่นเต้น\" คำเดียวทั้งสองความหมาย"},
{"cat":"ไวยากรณ์","wrong":"I don't sure.","right":"I'm not sure.","why":"sure เป็นคุณศัพท์ ไม่ใช่กริยา จึงต้องใช้กับ verb to be (am/is/are) และปฏิเสธด้วย not คนไทยแปลตรงจาก \"ไม่แน่ใจ\" จึงใส่ don't ผิดที่"},
{"cat":"ไวยากรณ์","wrong":"I will go to shopping tomorrow.","right":"I will go shopping tomorrow.","why":"กิจกรรมที่ลงท้าย -ing ใช้โครงสร้าง go + V-ing ได้เลยโดยไม่ต้องมี to (go shopping, go swimming) เพราะ to ใช้กับสถานที่ เช่น go to the mall"},
{"cat":"ไวยากรณ์","wrong":"She is work at a bank.","right":"She works at a bank.","why":"ประโยคปัจจุบันกาลธรรมดาไม่ต้องมี is หน้ากริยาแท้ คนไทยมักเติม is เพราะคิดว่าเป็นคำว่า \"เป็น/อยู่\" ที่ต้องมีทุกประโยค"},
{"cat":"ไวยากรณ์","wrong":"I have two brother.","right":"I have two brothers.","why":"คำนามนับได้ที่มีจำนวนมากกว่าหนึ่งต้องเติม -s/-es เสมอ ภาษาไทยบอกจำนวนด้วยตัวเลขอย่างเดียวโดยไม่เปลี่ยนรูปคำนาม"},
{"cat":"ไวยากรณ์","wrong":"I bought new car last week.","right":"I bought a new car last week.","why":"คำนามนับได้เอกพจน์ต้องมี article (a/an/the) หรือคำอย่าง my/this นำหน้า ภาษาไทยไม่มี article จึงมักตกหล่น"},
{"cat":"ไวยากรณ์","wrong":"I am agree with you.","right":"I agree with you.","why":"agree เป็นกริยาอยู่แล้ว จึงไม่ต้องใช้ am ซ้อนเข้าไป คนไทยมักใส่ am เพราะแปลมาจาก \"ฉันเห็นด้วย\" และคิดว่า agree เป็นคุณศัพท์"},
{"cat":"ไวยากรณ์","wrong":"I live in Bangkok since 2015.","right":"I have lived in Bangkok since 2015.","why":"เรื่องที่เริ่มในอดีตและยังเป็นอยู่ถึงตอนนี้ (ใช้คู่กับ since/for) ต้องใช้ Present Perfect (have + V3) ภาษาไทยไม่มีการผันกาลจึงใช้ปัจจุบันกาลธรรมดาแทน"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"I very like it.","right":"I really like it.","why":"very ใช้ขยายคุณศัพท์หรือกริยาวิเศษณ์เท่านั้น (very good) ขยายกริยาไม่ได้ ถ้าจะบอกว่า \"ชอบมาก\" ให้ใช้ really like หรือ like it very much"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"I play Facebook every night.","right":"I use Facebook every night.","why":"play ใช้กับเกม กีฬา หรือเครื่องดนตรี ส่วนโซเชียลมีเดียใช้ use หรือ be on Facebook คนไทยแปลตรงจาก \"เล่นเฟซ\""},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"Please borrow me your pen.","right":"Please lend me your pen.","why":"borrow คือ \"ขอยืม\" (ผู้รับเป็นคนทำ) ส่วน lend คือ \"ให้ยืม\" (เจ้าของเป็นคนทำ) ภาษาไทยใช้คำว่า \"ยืม\" คำเดียว จึงสลับกันบ่อย"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"I stay at Bangkok with my family.","right":"I live in Bangkok with my family.","why":"stay ใช้กับการพักชั่วคราว เช่น stay at a hotel ถ้าเป็นที่อยู่ถาวรต้องใช้ live และใช้ in กับเมืองหรือประเทศ คนไทยแปลตรงจาก \"อยู่ที่กรุงเทพฯ\""},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"We discussed about the budget.","right":"We discussed the budget.","why":"discuss เป็นกริยาที่มีกรรมตามได้ทันที ไม่ต้องมี about คนไทยมักเติม about เพราะแปลมาจาก \"พูดคุยเกี่ยวกับ\" (แต่ใช้ a discussion about ได้)"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"Can you explain me the process?","right":"Can you explain the process to me?","why":"explain ต้องตามด้วยสิ่งที่อธิบายก่อน แล้วจึงใช้ to + ผู้ฟัง (explain something to someone) ใส่คนไว้ต่อท้ายกริยาทันทีไม่ได้เหมือน \"อธิบายฉัน\" ในภาษาไทย"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"She is married with a doctor.","right":"She is married to a doctor.","why":"be married ใช้คู่กับบุพบท to เสมอ คนไทยใช้ with เพราะแปลจาก \"แต่งงานกับ\" ซึ่ง \"กับ\" มักแปลเป็น with"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"The price of this phone is very cheap.","right":"The price of this phone is very low.","why":"cheap และ expensive ใช้บรรยายตัวสินค้า (This phone is cheap.) ส่วนคำว่า price ต้องใช้ low หรือ high คนไทยแปลตรงจาก \"ราคาถูก/ราคาแพง\""},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"This is Tom. He is my fan.","right":"This is Tom. He is my boyfriend.","why":"fan ในภาษาอังกฤษแปลว่า \"แฟนคลับ/ผู้ชื่นชอบ\" ไม่ใช่คนรัก ถ้าหมายถึงแฟนต้องใช้ boyfriend, girlfriend หรือ partner"},
{"cat":"คำศัพท์ที่ใช้ผิด","wrong":"I will wait you in the lobby.","right":"I will wait for you in the lobby.","why":"wait ต้องตามด้วย for ก่อนบอกว่ารอใครหรือรออะไร คนไทยตัด for ทิ้งเพราะภาษาไทยพูดว่า \"รอคุณ\" ได้เลย"},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"Please open the light.","right":"Please turn on the light.","why":"เครื่องใช้ไฟฟ้าและไฟใช้ turn on/turn off (หรือ switch on/off) ส่วน open/close ใช้กับประตู หน้าต่าง หรือกล่อง คนไทยแปลตรงจาก \"เปิดไฟ\""},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"Can you close the TV?","right":"Can you turn off the TV?","why":"\"ปิดทีวี\" ในความหมายหยุดการทำงานต้องใช้ turn off เพราะ close หมายถึงปิดสิ่งที่เปิดออกได้ทางกายภาพ เช่น close the door"},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"There have many people in the room.","right":"There are many people in the room.","why":"การบอกว่า \"มีบางอย่างอยู่ที่ไหน\" ใช้ There is/There are ไม่ใช่ There have คนไทยแปลคำว่า \"มี\" เป็น have ตรง ๆ"},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"Although it rained, but we went out.","right":"Although it rained, we went out.","why":"although กับ but เป็นคำเชื่อมทั้งคู่ ใช้ในประโยคเดียวกันไม่ได้ ต้องเลือกใช้อย่างใดอย่างหนึ่ง คนไทยติดโครงสร้าง \"แม้ว่า...แต่...\""},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"Because I was tired, so I went home early.","right":"Because I was tired, I went home early.","why":"because กับ so ใช้ซ้อนในประโยคเดียวกันไม่ได้ เลือกใช้ Because... หรือ ..., so... อย่างใดอย่างหนึ่ง คนไทยแปลจาก \"เพราะ...จึง...\""},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"This shirt and that shirt are same same.","right":"These two shirts are the same.","why":"\"same same\" เป็นการพูดซ้ำคำแบบภาษาไทย (เหมือน ๆ กัน) ในภาษาอังกฤษต้องใช้ the same หรือ similar ถ้าแค่คล้ายกัน"},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"Don't forget to eat your medicine.","right":"Don't forget to take your medicine.","why":"การกินยาในภาษาอังกฤษใช้กริยา take ไม่ใช่ eat คนไทยแปลตรงจาก \"กินยา\""},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"I go first. See you tomorrow.","right":"I'm heading out now. See you tomorrow.","why":"\"ไปก่อนนะ\" ไม่ควรแปลตรงเป็น I go first ซึ่งฟังเหมือนขอเดินนำหน้า ให้ใช้ I'm heading out หรือ I have to go now แทน"},
{"cat":"สำนวนแปลตรงจากไทย","wrong":"Have you eaten rice yet?","right":"Have you eaten yet?","why":"\"กินข้าว\" ในภาษาไทยหมายถึงกินมื้ออาหาร แต่ eat rice แปลว่ากินข้าวสวยจริง ๆ ถ้าถามว่ากินอะไรมาหรือยังใช้ Have you eaten yet? หรือ Have you had lunch?"},
{"cat":"คำถาม-คำตอบ","wrong":"Can you speak English? — Can.","right":"Can you speak English? — Yes, I can.","why":"คำตอบสั้นในภาษาอังกฤษต้องมี Yes/No และประธานด้วย (Yes, I can.) ตอบแค่กริยาคำเดียวไม่ได้เหมือน \"ได้\" ในภาษาไทย"},
{"cat":"คำถาม-คำตอบ","wrong":"You don't like durian? — Yes. I don't like it.","right":"You don't like durian? — No, I don't.","why":"ภาษาอังกฤษเลือก Yes/No ตามความจริง ไม่ชอบก็ตอบ No แม้คำถามจะเป็นปฏิเสธ ส่วนภาษาไทยตอบ \"ใช่\" เพื่อยืนยันคำถาม จึงกลับด้านกัน"},
{"cat":"คำถาม-คำตอบ","wrong":"How to say this word in English?","right":"How do you say this word in English?","why":"How to...? เป็นแค่วลี ไม่ใช่ประโยคคำถามที่สมบูรณ์ ต้องมีกริยาช่วยและประธาน (How do you say...?) คนไทยแปลจาก \"พูดยังไง\""},
{"cat":"คำถาม-คำตอบ","wrong":"What your name?","right":"What is your name?","why":"คำถามที่ขึ้นต้นด้วย Wh- ต้องมี verb to be หรือกริยาช่วยตามหลังเสมอ ภาษาไทยพูด \"คุณชื่ออะไร\" ได้โดยไม่มีกริยาเชื่อม"},
{"cat":"คำถาม-คำตอบ","wrong":"Why you not come to the meeting yesterday?","right":"Why didn't you come to the meeting yesterday?","why":"คำถามปฏิเสธในอดีตต้องใช้กริยาช่วย didn't วางหน้าประธาน ภาษาไทยแค่ใส่ \"ไม่\" หน้ากริยาจึงเรียงคำตามแบบไทย"},
{"cat":"คำถาม-คำตอบ","wrong":"Do you understand? — Understand.","right":"Do you understand? — Yes, I understand.","why":"ภาษาอังกฤษตอบด้วยกริยาเปล่า ๆ ไม่ได้ ต้องมี Yes/No และประธาน (Yes, I do. / Yes, I understand.) ไม่ใช่ตอบคำเดียวว่า \"เข้าใจ\" แบบภาษาไทย"},
{"cat":"การออกเสียงและการสะกด","wrong":"I'd like some chocolate cake for desert.","right":"I'd like some chocolate cake for dessert.","why":"dessert (ขนมหวาน) มี s สองตัวและเน้นพยางค์หลัง ส่วน desert (ทะเลทราย) มี s ตัวเดียวและเน้นพยางค์หน้า คนไทยมักสะกดและออกเสียงสลับกัน"},
{"cat":"การออกเสียงและการสะกด","wrong":"She lead the meeting yesterday.","right":"She led the meeting yesterday.","why":"รูปอดีตของ lead (ลีด = นำ) คือ led ซึ่งออกเสียง \"เล็ด\" คนไทยสับสนเพราะ lead ที่แปลว่าตะกั่วก็ออกเสียง \"เล็ด\" เหมือนกัน"},
{"cat":"การออกเสียงและการสะกด","wrong":"Can you fly an egg for me?","right":"Can you fry an egg for me?","why":"fry (ทอด) ออกเสียง r ม้วนลิ้น ส่วน fly คือบิน คนไทยมักออกเสียง ร เป็น ล และตัดเสียงควบกล้ำ จึงสะกดและพูดสลับกัน"},
{"cat":"การออกเสียงและการสะกด","wrong":"I sink so, but let me check.","right":"I think so, but let me check.","why":"เสียง th ไม่มีในภาษาไทย คนไทยจึงออกเสียงเป็น ส หรือ ต ทำให้ think กลายเป็น sink (จม) ให้แตะปลายลิ้นที่ฟันหน้าแล้วเป่าลมออก"},
{"cat":"การออกเสียงและการสะกด","wrong":"I don't want to loose my job.","right":"I don't want to lose my job.","why":"lose (ลูซ เสียง z) แปลว่าทำหาย/สูญเสีย ส่วน loose (ลูส เสียง s) แปลว่าหลวม คนไทยสะกดสลับกันบ่อยเพราะออกเสียงคล้ายกัน"},
{"cat":"การออกเสียงและการสะกด","wrong":"The office is very quite today.","right":"The office is very quiet today.","why":"quiet (ไคว-เอิท สองพยางค์) แปลว่าเงียบ ส่วน quite (ไควท์ พยางค์เดียว) แปลว่าค่อนข้าง คนไทยมักสลับตัว e กับ t เวลาเขียน"},
{"cat":"การออกเสียงและการสะกด","wrong":"Can you advice me on this contract?","right":"Can you advise me on this contract?","why":"advise (เสียง z) เป็นกริยา ส่วน advice (เสียง s) เป็นคำนาม คนไทยมักใช้ advice เป็นกริยาเพราะออกเสียงท้ายเป็น ส เหมือนกัน"}
];

/* ---------- listening library (podcasts) ---------- */
let PD=null, podTok=0;
const POD_VOICE={A:[0,1.12],B:[1,0.9]};
function viewPods(){
  const st=stat("pod");
  return pBack()+'<h1 class="h2" style="margin-top:8px">ห้องฟังพอดแคสต์</h1><p class="lede">บทสนทนายาวแบบพอดแคสต์ '+PODS.length+' ตอน ฟังให้จบก่อนโดยไม่ดูบทพูด แล้วตอบคำถาม จากนั้นค่อยเปิดบทพูดและคำแปลดูจุดที่ฟังไม่ทัน</p>'
   +LEVELS.filter(lv=>PODS.some(p=>p.lv===lv.code)).map(lv=>'<section class="section" style="margin-top:22px"><h2 class="h3">'+lv.code+' <span lang="en">'+lv.name+'</span></h2><div class="lessons" style="margin-top:10px">'
     +PODS.filter(p=>p.lv===lv.code).map(p=>'<button class="lrow" data-act="pgo" data-id="pod.'+p.id+'"><span class="lnum">'+p.lv+'</span><span class="ltitle"><b lang="en">'+esc(p.title)+'</b><small>'+esc(p.th)+' · '+p.lines.length+' ช่วง · '+p.qs.length+' คำถาม</small></span><span class="lstat">'+(st[p.id]!=null?'<span class="chip'+(st[p.id]===p.qs.length?' ok':'')+'">'+st[p.id]+'/'+p.qs.length+'</span>':'')+'</span></button>').join("")+'</div></section>').join("");
}
function viewPod(id){
  const p=PODS.find(x=>x.id===id); if(!p) return viewPods();
  if(!PD||PD.id!==id) PD={id,ans:{},script:false,th:false,playing:-1};
  const answered=Object.keys(PD.ans).length, correct=p.qs.filter((q,i)=>PD.ans[i]===q.a).length;
  let h=pBack("pods","ห้องฟังพอดแคสต์")+'<p class="eyebrow" style="margin-top:8px">'+p.lv+' · '+esc(p.th)+'</p><h1 class="h2" lang="en">'+esc(p.title)+'</h1>'
   +'<p class="muted" style="margin-top:4px">ผู้พูด: <span lang="en">'+esc(p.cast.A)+'</span> และ <span lang="en">'+esc(p.cast.B)+'</span></p>'
   +'<div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="podplay">'+ICON.say+(PD.playing>=0?"หยุด":"ฟังทั้งตอน")+'</button>'
   +'<button class="btn btn-sm" data-act="podscript">'+(PD.script?"ซ่อนบทพูด":"ดูบทพูด")+'</button>'+(PD.script?'<button class="btn btn-sm btn-ghost" data-act="podth">'+(PD.th?"ซ่อนคำแปล":"แสดงคำแปล")+'</button>':'')+'</div>';
  if(PD.script) h+='<ol class="dlg pod-dlg" style="margin-top:14px">'+p.lines.map((l,i)=>'<li id="pd-'+i+'" class="'+(l[0]==="A"?"a":"b")+(PD.playing===i?" playing":"")+'"><span class="who" lang="en">'+esc(p.cast[l[0]])+'</span><div><p class="line" lang="en">'+esc(l[1])+'</p>'+(PD.th?'<p class="tr">'+esc(l[2])+'</p>':'')+'</div>'+sayBtn(l[1],"ฟังช่วงนี้")+'</li>').join("")+'</ol>';
  else h+='<div class="card pod-now" style="margin-top:14px"><p class="muted" id="pod-now">'+(PD.playing>=0?"กำลังฟังช่วงที่ "+(PD.playing+1)+"/"+p.lines.length:"กดฟังทั้งตอน ตั้งใจฟังใจความหลักก่อน แล้วค่อยตอบคำถามด้านล่าง")+'</p></div>';
  h+='<section class="comp"><h2 class="h3">คำถาม</h2>'+p.qs.map((q,qi)=>{const pick=PD.ans[qi];
     return '<p class="q" lang="en">'+(qi+1)+'. '+esc(q.q)+'</p><div class="opts">'+q.o.map((o,oi)=>{let c="opt"; if(pick!=null){if(oi===q.a) c+=" is-right"; else if(oi===pick) c+=" is-wrong"} return '<button class="'+c+'" data-act="podq" data-q="'+qi+'" data-o="'+oi+'"'+(pick!=null?" disabled":"")+' lang="en">'+esc(o)+'</button>'}).join("")+'</div>'+(pick!=null&&q.why?'<p class="muted" style="font-size:14px;margin-top:4px">'+esc(q.why)+'</p>':'')}).join("")
   +(answered===p.qs.length?'<div class="feedback '+(correct===p.qs.length?"ok":"no")+'" style="margin-top:16px"><b>ตอบถูก '+correct+'/'+p.qs.length+'</b><span>'+(PD.script?'':'เปิดบทพูดดูช่วงที่พลาด แล้วฟังซ้ำอีกรอบ')+'</span></div>':'')+'</section>';
  return h;
}
async function podPlay(p){
  const tok=++podTok; Speech.stop();
  for(let i=0;i<p.lines.length;i++){
    if(tok!==podTok||route.name!=="practice"||route.id!=="pod."+p.id) break;
    PD.playing=i; document.querySelectorAll(".pod-dlg li").forEach(x=>x.classList.remove("playing")); const el=$("#pd-"+i); if(el){el.classList.add("playing"); el.scrollIntoView({block:"nearest"})}
    const now=$("#pod-now"); if(now) now.textContent="กำลังฟังช่วงที่ "+(i+1)+"/"+p.lines.length;
    const v=POD_VOICE[p.lines[i][0]]||POD_VOICE.A;
    for(const b of String(p.lines[i][1]).split(/(?<!\b(?:Mr|Ms|Mrs|Dr)\.)(?<=[.!?])\s+(?=[A-Z"])/)){if(tok!==podTok) break; await Speech.say(b,{voice:v[0],pitch:v[1]})}
    await new Promise(r=>setTimeout(r,350));
  }
  if(tok===podTok&&PD){PD.playing=-1; if(route.name==="practice"&&route.id==="pod."+p.id) render()}
}

function shAlive(tok){return tok===shRunTok&&SH&&route.name==="practice"&&route.id==="shadow."+SH.id}
function shSetStatus(t,ms){
  SH.status=t; const el=$("#sh-status"); if(el) el.textContent=t;
  const bar=$("#sh-bar"); if(bar){bar.style.transition="none"; bar.style.width=ms?"100%":"0"; if(ms){void bar.offsetWidth; bar.style.transition="width "+ms+"ms linear"; bar.style.width="0"}}
  const card=$(".sh-card"); if(card) card.classList.toggle("you",SH.phase==="you");
}
async function shListen(text,ms){
  try{if(!(await NB.sttAvailable())||!(await NB.sttPermission())) return null}catch(e){return null}
  const target=pronWords(text); let heard="";
  try{heard=await NB.listen({maxMs:ms,hints:[text],onPartial:t=>{const el=$("#sh-heard"); if(el) el.textContent=t},done:t=>align(target,pronWords(t)).every(Boolean)})}catch(e){return null}
  return gradePron(text,heard);
}
function shCount(i){
  if(SH.counted[i]) return; SH.counted[i]=true;
  const st=shStat(); st.n=(st.n||0)+1; S.xp+=1; markDay();
  if(Object.keys(SH.counted).length===5) bump("prac");
  save();
}
async function shRun(auto){
  const set=shSets().find(x=>x.id===SH.id); if(!set) return;
  const tok=++shRunTok, c=shCfg(); Speech.stop(); SH.playing=true; SH.done=false; SH.phase=""; render();
  while(true){
    const it=set.items[SH.i], v=it.v==="B"?[1,0.9]:[0,1.06];
    for(let r=0;r<c.reps;r++){
      if(!shAlive(tok)) return;
      SH.phase=""; shSetStatus(c.mode==="overlap"?"พูดพร้อมเสียงเลย ตามให้ทันทีละคำ":"ฟังให้ดี…"+(c.reps>1?" (รอบ "+(r+1)+"/"+c.reps+")":""));
      await Speech.say(it.en,{rate:SH_SPEED[c.speed],voice:v[0],pitch:v[1]});
      if(!shAlive(tok)) return;
      if(!SH.seen[SH.i]){SH.seen[SH.i]=true; if(c.text==="after"){render()}}
      if(c.mode==="repeat"){
        const gap=shGap(it.en,c.speed); SH.phase="you";
        if(NB&&c.mic){
          shSetStatus("ถึงตาคุณ พูดตามได้เลย แอปกำลังฟัง",gap+1500);
          const res=await shListen(it.en,gap+1500);
          if(!shAlive(tok)) return;
          if(res){if(!SH.scores[SH.i]||res.score>=SH.scores[SH.i].score) SH.scores[SH.i]=res; if(res.score>=70){S.xp+=1}}
          SH.phase=""; render();
        } else {
          shSetStatus("ถึงตาคุณ พูดตามเลย",gap);
          await new Promise(res=>setTimeout(res,gap));
        }
        SH.phase="";
      } else await new Promise(res=>setTimeout(res,500));
    }
    if(!shAlive(tok)) return;
    shCount(SH.i);
    if(!auto) break;
    if(SH.i+1>=set.items.length){
      SH.done=true; const scored=Object.keys(SH.scores).map(k=>SH.scores[k].score), st=shStat();
      const avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):null, prev=st.sets[SH.id];
      st.sets[SH.id]={avg:avg!=null?Math.max(avg,prev&&prev.avg||0):(prev?prev.avg:null)}; S.xp+=5; save();
      break;
    }
    SH.i++; SH.status=""; render();
    const cur=document.querySelector(".sh-list li.cur"); if(cur) cur.scrollIntoView({block:"nearest"});
    await new Promise(res=>setTimeout(res,350));
  }
  if(shAlive(tok)){SH.playing=false; SH.phase=""; SH.status=""; render()}
}
function shStop(){shRunTok++; Speech.stop(); if(NB&&NB.stopListening) NB.stopListening().catch(()=>{}); if(SH){SH.playing=false; SH.phase=""; SH.status=""}}

};
