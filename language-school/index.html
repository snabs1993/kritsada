   ["A","Maybe we could make a cleaning rota. One week you do the kitchen and I do the bathroom, and then we swap.","เราอาจทำตารางเวรทำความสะอาดกันดีไหม สัปดาห์หนึ่งคุณทำครัว ฉันทำห้องน้ำ แล้วสัปดาห์ต่อไปก็สลับกัน"],
   ["B","That sounds sensible. And what about the dishes?","ฟังดูสมเหตุสมผลดี แล้วเรื่องจานล่ะ"],
   ["A","How about a simple rule: everyone washes their own dishes on the same day they use them.","ตั้งกฎง่าย ๆ ดีไหม ใครใช้จานก็ล้างของตัวเองภายในวันเดียวกันเลย"],
   ["B","OK, I can do that. Actually, there's something I wanted to mention too.","โอเค ผมทำได้ จริง ๆ แล้วผมก็มีเรื่องอยากพูดเหมือนกัน"],
   ["A","Go on.","ว่ามาเลย"],
   ["B","Sometimes you talk on the phone quite loudly late at night, and my bedroom is right next to the living room. I start work at seven, so it's hard to sleep.","บางครั้งคุณคุยโทรศัพท์เสียงค่อนข้างดังตอนดึก ๆ แล้วห้องนอนผมก็อยู่ติดกับห้องนั่งเล่นเลย ผมเริ่มงานเจ็ดโมงเช้า เลยนอนหลับยาก"],
   ["A","Oh, I'm so sorry. That's my sister in Canada. The time difference makes it difficult. I'll take her calls in my room from now on.","ตายแล้ว ขอโทษจริง ๆ นั่นพี่สาวฉันที่แคนาดาน่ะ เวลาต่างกันเลยลำบากหน่อย ต่อไปนี้ฉันจะไปคุยในห้องตัวเองนะ"],
   ["B","Thanks. I'm glad we talked about this. Shall I write the rota and put it on the fridge?","ขอบคุณนะ ดีใจที่เราได้คุยกันเรื่องนี้ ให้ผมเขียนตารางเวรแล้วแปะไว้ที่ตู้เย็นไหม"],
   ["A","Great idea. And let's have dinner together on Sunday. I'll cook, and you can wash up!","ดีเลย แล้ววันอาทิตย์มากินข้าวเย็นด้วยกันนะ ฉันทำอาหาร ส่วนคุณล้างจาน!"]
  ],
  qs:[
   {q:"What is the conversation mainly about?",o:["Finding a new flatmate","Solving problems about living together","Planning a dinner party for friends"],a:1,why:"ทั้งสองคุยเรื่องปัญหาในห้องที่แชร์กัน ทั้งเรื่องจานสกปรกและเสียงคุยโทรศัพท์ตอนดึก แล้วตกลงทำ “a cleaning rota” ร่วมกัน"},
   {q:"How does Ryan react when Chloe complains about the dishes?",o:["He apologises and agrees she has a point","He says the dishes belong to Chloe","He refuses to make a rota"],a:0,why:"ไรอันพูดว่า “Sorry about that.” และ “That's fair. I didn't realise it was bothering you so much.”"},
   {q:"Why does Chloe make phone calls late at night?",o:["She works a night shift","Her friends call her after parties","Her sister lives in Canada, where the time is different"],a:2,why:"โคลอี้อธิบายว่า “That's my sister in Canada. The time difference makes it difficult.”"},
   {q:"Why is the noise a problem for Ryan?",o:["He studies in the living room","His bedroom is next to the living room and he starts work early","He often has guests staying over"],a:1,why:"ไรอันบอกว่า “my bedroom is right next to the living room. I start work at seven, so it's hard to sleep.”"}
  ]},
 {id:"p12",lv:"B1",title:"Planning the Wedding",th:"วางแผนงานแต่งงาน",cast:{A:"Hannah",B:"Josh"},
  lines:[
   ["A","Josh, we really need to make some decisions about the wedding. It's only eight months away.","จอช เราต้องตัดสินใจเรื่องงานแต่งกันจริงจังแล้วนะ อีกแค่แปดเดือนเอง"],
   ["B","I know. Let's start with the biggest question: how many people are we going to invite?","ผมรู้ เริ่มจากคำถามใหญ่ที่สุดก่อนเลย เราจะเชิญแขกกี่คน"],
   ["A","My mum gave me a list of a hundred and twenty people. I've never met half of them.","แม่ฉันให้รายชื่อมาร้อยยี่สิบคน ครึ่งหนึ่งฉันไม่เคยเจอเลย"],
   ["B","A hundred and twenty? Our budget is fifteen thousand dollars. We can't feed that many people and still have a nice venue.","ร้อยยี่สิบคนเลยเหรอ งบเรามีหนึ่งหมื่นห้าพันดอลลาร์ เราเลี้ยงคนเยอะขนาดนั้นแล้วยังได้สถานที่ดี ๆ ไม่ได้หรอก"],
   ["A","I agree. I think eighty guests is the maximum. I'll talk to Mum this weekend. She won't be happy, but she'll understand.","ฉันเห็นด้วย ฉันว่าแปดสิบคนคือมากที่สุดแล้ว สุดสัปดาห์นี้ฉันจะคุยกับแม่ แม่คงไม่ค่อยพอใจ แต่ก็คงเข้าใจ"],
   ["B","Good. Now, the venue. I really liked the hotel by the river, but it's quite expensive.","ดีเลย ต่อไปเรื่องสถานที่ ผมชอบโรงแรมริมแม่น้ำมาก แต่ค่อนข้างแพง"],
   ["A","It's beautiful, but the garden at my aunt's farm is free, and it's big enough for eighty people.","ที่นั่นสวยก็จริง แต่สวนที่ฟาร์มของป้าฉันใช้ได้ฟรี แล้วก็กว้างพอสำหรับแปดสิบคนด้วย"],
   ["B","That's true. But what if it rains?","จริงด้วย แต่ถ้าฝนตกล่ะ"],
   ["A","We could hire a large tent. My cousin did that last year, and it only cost about a thousand dollars.","เราเช่าเต็นท์ใหญ่ได้ ลูกพี่ลูกน้องฉันก็ทำแบบนั้นเมื่อปีที่แล้ว เสียแค่ประมาณหนึ่งพันดอลลาร์เอง"],
   ["B","That's much cheaper than the hotel. OK, I'm happy with the farm. What about food?","ถูกกว่าโรงแรมเยอะเลย โอเค ผมโอเคกับฟาร์ม แล้วเรื่องอาหารล่ะ"],
   ["A","I'd love a buffet with Thai and Western dishes, so everyone can find something they like.","ฉันอยากได้บุฟเฟต์ที่มีทั้งอาหารไทยและอาหารฝรั่ง ทุกคนจะได้มีของที่ชอบกิน"],
   ["B","Perfect. My grandparents don't eat spicy food, so that works well. And music?","เยี่ยมเลย ปู่ย่าผมไม่กินเผ็ด แบบนี้ก็ลงตัวพอดี แล้วดนตรีล่ะ"],
   ["A","My friend Ploy plays in a band. She offered to play for us as a wedding present.","พลอยเพื่อนฉันเล่นอยู่ในวงดนตรี เธอเสนอว่าจะมาเล่นให้เป็นของขวัญแต่งงาน"],
   ["B","Really? That's amazing. So we've saved money on the venue and the music. Maybe we can spend a bit more on the honeymoon.","จริงเหรอ สุดยอดไปเลย งั้นเราประหยัดค่าสถานที่กับค่าดนตรีไปได้ บางทีเราอาจเอาเงินไปใช้กับฮันนีมูนเพิ่มอีกหน่อย"],
   ["A","Now you're talking! Let's start looking at beaches tonight.","นี่แหละที่อยากได้ยิน! คืนนี้มาเริ่มดูชายหาดกันเลย"]
  ],
  qs:[
   {q:"Where will the wedding most likely take place?",o:["At a hotel by the river","In the garden at Hannah's aunt's farm","On a beach"],a:1,why:"ฮันนาห์เสนอสวนที่ฟาร์มของป้า และจอชตอบว่า “OK, I'm happy with the farm.” ส่วนชายหาดคือที่สำหรับฮันนีมูน"},
   {q:"Why does Josh think a hundred and twenty guests is too many?",o:["The farm is too small","He doesn't know Hannah's family","It doesn't fit their budget"],a:2,why:"จอชบอกว่า “Our budget is fifteen thousand dollars. We can't feed that many people and still have a nice venue.”"},
   {q:"What is their plan if it rains?",o:["Hire a large tent","Move to the hotel","Change the date"],a:0,why:"ฮันนาห์บอกว่า “We could hire a large tent.” และเสียเพียงประมาณหนึ่งพันดอลลาร์"},
   {q:"How does Hannah feel about spending more money on the honeymoon?",o:["She thinks they should save it","She is excited about the idea","She wants to ask her mum first"],a:1,why:"ฮันนาห์ตอบว่า “Now you're talking! Let's start looking at beaches tonight.” แสดงว่าเธอตื่นเต้นและเห็นด้วยทันที"}
  ]},
 {id:"p13",lv:"B2",title:"The Missing Delivery",th:"โทรร้องเรียนเรื่องการจัดส่ง",cast:{A:"Laura",B:"Kevin"},
  lines:[
   ["A","Good afternoon, you're through to Brightway customer service. My name's Laura. How can I help you today?","สวัสดีค่ะ ฝ่ายบริการลูกค้าไบรต์เวย์ ดิฉันลอร่าค่ะ วันนี้มีอะไรให้ช่วยคะ"],
   ["B","Hi, Laura. I'm calling about a washing machine I ordered. It was supposed to be delivered last Tuesday, and I've now taken two days off work waiting for it. Nobody has turned up either time.","สวัสดีครับลอร่า ผมโทรมาเรื่องเครื่องซักผ้าที่สั่งไว้ มันควรจะมาส่งตั้งแต่วันอังคารที่แล้ว และตอนนี้ผมลางานไปสองวันแล้วเพื่อรอ แต่ไม่มีใครมาเลยสักครั้ง"],
   ["A","I'm really sorry to hear that. Could I take your order number, please, so I can look into it?","ต้องขออภัยจริง ๆ ค่ะ ขอเลขที่คำสั่งซื้อหน่อยได้ไหมคะ ดิฉันจะได้ตรวจสอบให้"],
   ["B","It's four seven two nine one. And I have to say, I'm pretty frustrated. Each time, I got a text the evening before confirming the delivery, and then nothing happened.","สี่ เจ็ด สอง เก้า หนึ่งครับ และต้องบอกเลยว่าผมหงุดหงิดมาก ทุกครั้งผมได้ข้อความยืนยันการจัดส่งตั้งแต่ตอนเย็นวันก่อน แล้วก็ไม่มีอะไรเกิดขึ้นเลย"],
   ["A","Thank you. I can see the order here. It looks like the delivery company marked it as failed on both days because they couldn't get into the building. Is there a gate or an entry code at your address?","ขอบคุณค่ะ ดิฉันเห็นคำสั่งซื้อแล้ว ดูเหมือนบริษัทขนส่งบันทึกว่าส่งไม่สำเร็จทั้งสองวัน เพราะเข้าไปในอาคารไม่ได้ ที่อยู่ของคุณมีประตูรั้วหรือรหัสผ่านเข้าอาคารไหมคะ"],
   ["B","There's a gate, yes, but the code is in the delivery notes. I wrote it when I placed the order. I've just checked, and it's definitely there.","มีประตูรั้วครับ แต่รหัสอยู่ในหมายเหตุการจัดส่งแล้ว ผมเขียนไว้ตอนสั่งซื้อ เมื่อกี้ผมเพิ่งเช็ก มันอยู่ตรงนั้นแน่นอน"],
   ["A","You're right, I can see it in the notes. It seems it wasn't passed on to the driver, which is our mistake, not yours. I do apologise.","คุณพูดถูกค่ะ ดิฉันเห็นในหมายเหตุแล้ว ดูเหมือนข้อมูลไม่ได้ถูกส่งต่อไปถึงคนขับ ซึ่งเป็นความผิดของเรา ไม่ใช่ของคุณ ต้องขออภัยด้วยจริง ๆ ค่ะ"],
   ["B","Well, I appreciate you admitting that. But what happens now? I really can't take another day off.","ก็ขอบคุณที่ยอมรับนะครับ แต่แล้วจะเอายังไงต่อ ผมลางานอีกวันไม่ได้แล้วจริง ๆ"],
   ["A","I completely understand. I can book a new delivery for this Saturday, between eight and twelve, and I'll call the delivery company myself to make sure they have the code. Would Saturday work for you?","เข้าใจเลยค่ะ ดิฉันจองการจัดส่งใหม่ให้ได้วันเสาร์นี้ ช่วงแปดโมงถึงเที่ยง และดิฉันจะโทรหาบริษัทขนส่งเองเพื่อให้แน่ใจว่าพวกเขาได้รหัสแล้ว วันเสาร์สะดวกไหมคะ"],
   ["B","Saturday morning is fine. But to be honest, I'd like something more than just a new date. I've lost two days' pay because of this.","เช้าวันเสาร์ได้ครับ แต่พูดตรง ๆ ผมอยากได้อะไรมากกว่าแค่วันส่งใหม่ ผมเสียค่าแรงไปสองวันเพราะเรื่องนี้"],
   ["A","That's reasonable. I'm afraid I'm not able to cover lost wages, but I can refund the forty dollar delivery charge in full, and I'll add a fifty dollar voucher to your account for the inconvenience.","สมเหตุสมผลค่ะ เสียดายที่ดิฉันชดเชยค่าแรงที่เสียไปไม่ได้ แต่ดิฉันคืนค่าจัดส่งสี่สิบดอลลาร์ให้เต็มจำนวนได้ และจะเพิ่มบัตรกำนัลห้าสิบดอลลาร์เข้าบัญชีของคุณเพื่อชดเชยความไม่สะดวกค่ะ"],
   ["B","OK. That's better than nothing. Will the old machine be taken away as well? That was part of the original order.","โอเค ดีกว่าไม่ได้อะไรเลย แล้วจะขนเครื่องเก่าไปด้วยไหมครับ นั่นเป็นส่วนหนึ่งของคำสั่งซื้อตั้งแต่แรก"],
   ["A","Yes, removing your old machine is included, and I've added a note to make that clear. You'll receive a confirmation email within the next hour.","ใช่ค่ะ รวมการขนเครื่องเก่าออกไปด้วย และดิฉันเพิ่มหมายเหตุให้ชัดเจนแล้ว คุณจะได้รับอีเมลยืนยันภายในหนึ่งชั่วโมงนี้ค่ะ"],
   ["B","Right. And if it goes wrong again on Saturday?","ครับ แล้วถ้าวันเสาร์มีปัญหาอีกล่ะ"],
   ["A","Then please call and ask for me directly. I'm putting my name and a reference number on your file, so you won't have to explain everything again.","ถ้าอย่างนั้นโทรมาแล้วขอสายดิฉันโดยตรงเลยค่ะ ดิฉันจะใส่ชื่อและเลขอ้างอิงไว้ในแฟ้มของคุณ คุณจะได้ไม่ต้องเล่าทุกอย่างใหม่อีกรอบ"],
   ["B","Thanks, Laura. You've been very helpful, even if the company hasn't been.","ขอบคุณครับลอร่า คุณช่วยได้มากเลย ถึงบริษัทจะไม่ได้ช่วยอะไรก็ตาม"]
  ],
  qs:[
   {q:"Why did the two deliveries fail?",o:["Kevin wasn't at home","The driver didn't receive the gate code","The washing machine was out of stock"],a:1,why:"ลอร่าอธิบายว่ารหัสอยู่ในหมายเหตุแล้ว แต่ “it wasn't passed on to the driver, which is our mistake” ส่วนเควินลางานรออยู่บ้านทั้งสองวัน"},
   {q:"What does Laura offer Kevin as compensation?",o:["Payment for the wages he lost","A cheaper washing machine","A refund of the delivery charge and a voucher"],a:2,why:"ลอร่าบอกว่า “I'm not able to cover lost wages” แต่ “I can refund the forty dollar delivery charge in full, and I'll add a fifty dollar voucher”"},
   {q:"Why does Laura put her name on Kevin's file?",o:["So she can get credit for solving the problem","So Kevin won't need to explain the whole story again","So the driver can contact her on Saturday"],a:1,why:"ลอร่าบอกว่าใส่ชื่อและเลขอ้างอิงไว้ “so you won't have to explain everything again”"},
   {q:"How does Kevin feel at the end of the call?",o:["Grateful to Laura but still unhappy with the company","Furious and ready to cancel his order","Delighted with the company's service"],a:0,why:"เควินพูดว่า “You've been very helpful, even if the company hasn't been.” คือชื่นชมลอร่า แต่ยังไม่พอใจบริษัท"}
  ]},
 {id:"p14",lv:"B2",title:"Greener Ways to Travel",th:"เดินทางแบบรักษ์โลก",cast:{A:"Sophie",B:"Adam"},
  lines:[
   ["A","So, Adam, we still haven't decided how we're getting to Barcelona in June. Have you looked at the options?","อดัม เรายังไม่ได้ตัดสินใจเลยนะว่าเดือนมิถุนายนจะเดินทางไปบาร์เซโลนายังไง คุณดูตัวเลือกไว้บ้างหรือยัง"],
   ["B","I have. Flying is obviously the quickest. It's about two hours from London, and the tickets are surprisingly cheap if we book now, around eighty pounds each.","ดูแล้ว เครื่องบินเร็วที่สุดอยู่แล้ว บินจากลอนดอนประมาณสองชั่วโมง แล้วตั๋วก็ถูกจนน่าแปลกใจถ้าจองตอนนี้ ประมาณคนละแปดสิบปอนด์"],
   ["A","I know, but I read that a return flight like that produces several times more carbon than going by train. We've been trying to eat less meat and use the car less, so it feels a bit strange to just ignore that.","ฉันรู้ แต่ฉันอ่านเจอว่าเที่ยวบินไปกลับแบบนั้นปล่อยคาร์บอนมากกว่านั่งรถไฟหลายเท่า เราพยายามกินเนื้อสัตว์น้อยลงและใช้รถน้อยลงมาตลอด ถ้าจะมองข้ามเรื่องนี้ไปเฉย ๆ ก็รู้สึกแปลก ๆ"],
   ["B","I get that. But the train takes most of a day. We'd have to change in Paris, and the tickets are nearly twice as expensive.","ผมเข้าใจ แต่รถไฟใช้เวลาเกือบทั้งวัน เราต้องเปลี่ยนขบวนที่ปารีส แล้วตั๋วก็แพงกว่าเกือบสองเท่า"],
   ["A","That's true, but think about what flying actually involves. You've got the journey to the airport, security, waiting at the gate. Door to door, it's probably five or six hours anyway.","ก็จริง แต่ลองคิดดูว่าการบินจริง ๆ ต้องทำอะไรบ้าง ต้องเดินทางไปสนามบิน ผ่านจุดตรวจความปลอดภัย นั่งรอที่ประตูขึ้นเครื่อง นับตั้งแต่ออกจากบ้านจนถึงที่พัก ก็น่าจะห้าหกชั่วโมงอยู่ดี"],
   ["B","Fair point. I hadn't really counted all that. And I suppose on the train we could actually relax, read, maybe have lunch in Paris.","มีเหตุผลนะ ผมไม่ได้นับตรงนั้นเลย แล้วบนรถไฟเราก็ได้พักผ่อนจริง ๆ อ่านหนังสือ หรืออาจแวะกินข้าวกลางวันที่ปารีส"],
   ["A","Exactly. We could even make it part of the holiday. Spend a night in Paris on the way there, and then the journey isn't wasted time at all.","ใช่เลย เราทำให้มันเป็นส่วนหนึ่งของวันหยุดได้ด้วย แวะค้างที่ปารีสสักคืนระหว่างทาง แล้วการเดินทางก็จะไม่ใช่เวลาที่เสียเปล่าเลย"],
   ["B","That would be nice, but it means an extra night of hotel costs. We need to be realistic about the budget.","ก็น่าสนุกนะ แต่แปลว่าต้องจ่ายค่าโรงแรมเพิ่มอีกคืน เราต้องมองงบประมาณตามความเป็นจริงด้วย"],
   ["A","What if we took the train there and flew back? That way we'd halve the emissions compared with flying both ways, and we wouldn't lose a whole day at the end, when we have to get back to work.","ถ้าเรานั่งรถไฟไปแล้วบินกลับล่ะ แบบนั้นเราจะลดการปล่อยก๊าซได้ครึ่งหนึ่งเมื่อเทียบกับบินทั้งไปและกลับ และก็ไม่ต้องเสียเวลาทั้งวันตอนขากลับที่ต้องรีบกลับไปทำงาน"],
   ["B","Hmm, that's a sensible compromise. Although if we're flying back anyway, some people would say we should buy carbon offsets.","อืม เป็นทางสายกลางที่สมเหตุสมผลดี แต่ถ้ายังไงก็ต้องบินกลับ บางคนก็จะบอกว่าเราควรซื้อคาร์บอนออฟเซ็ตชดเชย"],
   ["A","I'm a bit sceptical about offsets, to be honest. Some schemes are good, but others promise to plant trees that never actually get planted. Cutting what you emit in the first place is far more reliable.","พูดตรง ๆ ฉันค่อนข้างกังขาเรื่องออฟเซ็ตนะ บางโครงการก็ดี แต่บางโครงการสัญญาว่าจะปลูกต้นไม้ที่สุดท้ายไม่เคยได้ปลูกจริง การลดการปล่อยตั้งแต่ต้นเชื่อถือได้มากกว่าเยอะ"],
   ["B","That's a fair concern. What about when we're there? I'd assumed we'd rent a car to see the coast.","เป็นข้อกังวลที่มีเหตุผล แล้วตอนอยู่ที่นั่นล่ะ ผมนึกว่าเราจะเช่ารถขับเที่ยวชายฝั่ง"],
   ["A","The regional trains along the coast are supposed to be excellent, and much cheaper than a rental car plus parking. We'd only need a car if we wanted to go somewhere really remote.","ได้ยินว่ารถไฟท้องถิ่นเลียบชายฝั่งดีมาก และถูกกว่าเช่ารถบวกค่าจอดเยอะเลย เราจะต้องใช้รถก็ต่อเมื่ออยากไปที่ที่ห่างไกลมาก ๆ เท่านั้น"],
   ["B","All right, you've convinced me. Train out with a night in Paris, flight home, and public transport while we're there. I'll book the train tickets tonight before the prices go up.","โอเค คุณโน้มน้าวผมได้แล้ว ขาไปนั่งรถไฟและค้างปารีสหนึ่งคืน ขากลับบิน ส่วนตอนอยู่ที่นั่นใช้ขนส่งสาธารณะ คืนนี้ผมจะจองตั๋วรถไฟเลย ก่อนราคาจะขึ้น"],
   ["A","Perfect. And I'll find us a little hotel in Paris. This is starting to feel like two holidays in one.","เยี่ยมเลย ส่วนฉันจะหาโรงแรมเล็ก ๆ ในปารีสให้ เริ่มรู้สึกเหมือนได้เที่ยวสองทริปในทริปเดียวแล้ว"]
  ],
  qs:[
   {q:"What are Sophie and Adam mainly discussing?",o:["How to travel in a more environmentally friendly way","Whether to go to Barcelona or Paris for their holiday","How to find the cheapest hotel"],a:0,why:"ทั้งตอนเป็นการเปรียบเทียบเครื่องบิน รถไฟ ออฟเซ็ต และการเดินทางในพื้นที่ โดยโซฟีเริ่มจากประเด็นที่ว่าเครื่องบิน “produces several times more carbon than going by train” ส่วนบาร์เซโลนาเป็นจุดหมายที่ตัดสินใจไว้แล้ว"},
   {q:"Why does Sophie think flying is not much faster than it seems?",o:["Flights to Barcelona are often delayed","Getting to the airport, security and waiting add several hours","The train goes directly to Barcelona without changes"],a:1,why:"โซฟีบอกว่า “the journey to the airport, security, waiting at the gate. Door to door, it's probably five or six hours anyway.”"},
   {q:"What is Sophie's attitude towards carbon offsets?",o:["She thinks they are the best solution","She has never heard of them","She doubts that all schemes are reliable"],a:2,why:"โซฟีพูดว่า “I'm a bit sceptical about offsets” เพราะบางโครงการ “promise to plant trees that never actually get planted”"},
   {q:"What do they finally decide?",o:["Fly both ways and rent a car","Take the train there and fly back","Take the train both ways and rent a car"],a:1,why:"อดัมสรุปว่า “Train out with a night in Paris, flight home, and public transport while we're there.” จึงไม่เช่ารถ"}
  ]},
 {id:"p15",lv:"C1",title:"AI and the Hiring Process",th:"จริยธรรมของปัญญาประดิษฐ์ในการคัดเลือกพนักงาน",cast:{A:"Nina",B:"Marcus"},
  lines:[
   ["A","Welcome to Work in Progress. I'm Nina, and today we're looking at a question that affects almost everyone who applies for a job: what happens when the first reader of your CV isn't a person at all? My guest is Marcus, who studies how organisations use automated tools in recruitment. Marcus, how widespread is this?","ยินดีต้อนรับสู่รายการ Work in Progress ฉันนีน่า วันนี้เราจะคุยเรื่องที่ส่งผลต่อแทบทุกคนที่สมัครงาน นั่นคือจะเกิดอะไรขึ้นเมื่อผู้อ่านเรซูเม่ของคุณคนแรกไม่ใช่มนุษย์เลย แขกรับเชิญของเราคือมาร์คัส ผู้ศึกษาว่าองค์กรต่าง ๆ ใช้เครื่องมืออัตโนมัติในการสรรหาคนอย่างไร มาร์คัสคะ เรื่องนี้แพร่หลายแค่ไหน"],
   ["B","More widespread than most applicants realise. Large employers can receive thousands of applications for a single role, so many now use software to screen CVs, rank candidates, or even analyse recorded video interviews. For a lot of people, the first decision about their application is made by an algorithm.","แพร่หลายกว่าที่ผู้สมัครส่วนใหญ่คิดครับ นายจ้างรายใหญ่อาจได้รับใบสมัครหลายพันใบสำหรับตำแหน่งเดียว หลายแห่งจึงใช้ซอฟต์แวร์คัดกรองเรซูเม่ จัดอันดับผู้สมัคร หรือแม้แต่วิเคราะห์วิดีโอสัมภาษณ์ที่บันทึกไว้ สำหรับคนจำนวนมาก การตัดสินใจครั้งแรกเกี่ยวกับใบสมัครของพวกเขามาจากอัลกอริทึม"],
   ["A","The usual argument in favour is that machines are more objective than tired, biased humans. Is there any truth in that?","ข้อโต้แย้งฝั่งสนับสนุนที่ได้ยินบ่อยคือ เครื่องจักรเป็นกลางกว่ามนุษย์ที่เหนื่อยล้าและมีอคติ ข้อนี้มีความจริงอยู่บ้างไหมคะ"],
   ["B","There's some truth in it, which is what makes the issue so tricky. Human recruiters are demonstrably inconsistent. Studies have shown that identical CVs get different responses depending on the name at the top. In principle, a well-designed system could apply the same criteria to everyone. The problem lies in the phrase well-designed.","มีความจริงอยู่บ้างครับ และนั่นแหละที่ทำให้เรื่องนี้ซับซ้อน ผู้สรรหาที่เป็นมนุษย์ไม่คงเส้นคงวาอย่างเห็นได้ชัด งานวิจัยพบว่าเรซูเม่ที่เหมือนกันทุกประการได้รับการตอบกลับต่างกัน ขึ้นอยู่กับชื่อที่อยู่ด้านบน ตามหลักการแล้ว ระบบที่ออกแบบมาดีจะใช้เกณฑ์เดียวกันกับทุกคนได้ ปัญหาอยู่ที่คำว่าออกแบบมาดีนี่แหละ"],
   ["A","Because the system learns from past decisions?","เพราะระบบเรียนรู้จากการตัดสินใจในอดีตใช่ไหมคะ"],
   ["B","Exactly. If you train a model on who a company hired over the last ten years, and that company mostly hired men from a handful of universities, the model will quite reasonably conclude that those are the features of a good employee. It doesn't remove bias. It automates it, and then gives it a veneer of scientific neutrality.","ใช่เลยครับ ถ้าคุณฝึกโมเดลด้วยข้อมูลว่าบริษัทจ้างใครมาตลอดสิบปีที่ผ่านมา และบริษัทนั้นจ้างผู้ชายจากมหาวิทยาลัยไม่กี่แห่งเป็นส่วนใหญ่ โมเดลก็จะสรุปอย่างมีเหตุผลตามข้อมูลว่านั่นคือลักษณะของพนักงานที่ดี มันไม่ได้กำจัดอคติ แต่ทำให้อคติเป็นระบบอัตโนมัติ แล้วเคลือบมันด้วยภาพลักษณ์ของความเป็นกลางทางวิทยาศาสตร์"],
   ["A","And presumably that's harder to challenge than a single biased manager.","และก็คงโต้แย้งได้ยากกว่าผู้จัดการที่มีอคติคนเดียวด้วย"],
   ["B","Much harder. If a person rejects you unfairly, there's at least someone who can be asked to explain. With many of these systems, even the employer can't tell you precisely why one candidate scored higher than another. And scale matters too. One biased manager affects dozens of people. One biased system can affect hundreds of thousands.","ยากกว่ามากครับ ถ้ามนุษย์ปฏิเสธคุณอย่างไม่เป็นธรรม อย่างน้อยก็ยังมีคนที่ขอให้อธิบายได้ แต่กับระบบเหล่านี้หลายระบบ แม้แต่นายจ้างเองก็บอกไม่ได้แน่ชัดว่าทำไมผู้สมัครคนหนึ่งได้คะแนนสูงกว่าอีกคน และขนาดก็สำคัญด้วย ผู้จัดการที่มีอคติหนึ่งคนส่งผลต่อคนหลักสิบ แต่ระบบที่มีอคติหนึ่งระบบส่งผลต่อคนได้หลายแสนคน"],
   ["A","What about the video analysis tools you mentioned? Some claim to assess personality from facial expressions or tone of voice.","แล้วเครื่องมือวิเคราะห์วิดีโอที่คุณพูดถึงล่ะคะ บางตัวอ้างว่าประเมินบุคลิกภาพได้จากสีหน้าหรือน้ำเสียง"],
   ["B","Frankly, that's where I'd draw the line. The scientific basis for reading personality from someone's face is extremely weak, and these tools can penalise people for things that have nothing to do with the job, such as a disability, a regional accent, or simply being nervous on camera.","พูดตรง ๆ ตรงนั้นคือเส้นที่ผมจะไม่ยอมข้ามครับ หลักฐานทางวิทยาศาสตร์ที่รองรับการอ่านบุคลิกภาพจากใบหน้าอ่อนมาก และเครื่องมือเหล่านี้อาจลงโทษคนด้วยเรื่องที่ไม่เกี่ยวกับงานเลย เช่น ความพิการ สำเนียงท้องถิ่น หรือแค่ประหม่าหน้ากล้อง"],
   ["A","So are you arguing that artificial intelligence shouldn't be used in hiring at all?","งั้นคุณกำลังบอกว่าไม่ควรใช้ปัญญาประดิษฐ์ในการจ้างงานเลยหรือคะ"],
   ["B","No, and I think that position is increasingly unrealistic. What I'd argue for is three things. First, transparency, so that applicants know when an automated tool is involved. Second, regular independent audits to check whether outcomes differ across groups. And third, a genuine human decision at the end, not a manager who simply clicks approve on whatever the software recommends.","ไม่ครับ และผมคิดว่าจุดยืนแบบนั้นยิ่งวันยิ่งไม่สมจริง สิ่งที่ผมเรียกร้องมีสามข้อ ข้อแรกคือความโปร่งใส ให้ผู้สมัครรู้ว่ามีเครื่องมืออัตโนมัติเข้ามาเกี่ยวข้อง ข้อสองคือการตรวจสอบโดยหน่วยงานอิสระอย่างสม่ำเสมอ เพื่อดูว่าผลลัพธ์ต่างกันระหว่างกลุ่มคนหรือไม่ และข้อสามคือการตัดสินใจขั้นสุดท้ายโดยมนุษย์อย่างแท้จริง ไม่ใช่ผู้จัดการที่แค่กดอนุมัติตามที่ซอฟต์แวร์แนะนำ"],
   ["A","That last point is interesting. Is there a risk that people simply defer to the machine?","ประเด็นสุดท้ายน่าสนใจค่ะ มีความเสี่ยงไหมที่คนจะแค่คล้อยตามเครื่องจักรไปเลย"],
   ["B","A very real one. It's sometimes called automation bias. When a system presents a ranking with a confident score, people tend to assume it knows something they don't, even when their own judgement would have been better. So having a human in the loop only means something if that human feels able to disagree.","เสี่ยงจริงมากครับ บางทีเรียกว่าอคติจากระบบอัตโนมัติ เมื่อระบบแสดงอันดับพร้อมคะแนนที่ดูมั่นใจ คนมักคิดว่ามันรู้อะไรที่ตัวเองไม่รู้ แม้ในกรณีที่วิจารณญาณของตัวเองจะดีกว่า ดังนั้นการมีมนุษย์อยู่ในกระบวนการจะมีความหมายก็ต่อเมื่อคนคนนั้นรู้สึกว่ากล้าเห็นต่างได้"],
   ["A","Marcus, thank you. That's a great deal for both employers and applicants to think about.","ขอบคุณค่ะมาร์คัส เป็นเรื่องที่ทั้งนายจ้างและผู้สมัครงานต้องคิดกันอีกมากเลย"]
  ],
  qs:[
   {q:"What is Marcus's overall position on AI in hiring?",o:["It is always fairer than human recruiters","It should be banned completely","It can be used, but only with strong safeguards"],a:2,why:"มาร์คัสตอบว่าการไม่ใช้เลย “is increasingly unrealistic” แล้วเสนอสามข้อ คือ “transparency” “independent audits” และ “a genuine human decision at the end”"},
   {q:"Why can a system trained on past hiring decisions be biased?",o:["It cannot read CVs accurately","It copies patterns from the company's previous, possibly unfair, hiring","It is deliberately designed to exclude certain groups"],a:1,why:"มาร์คัสอธิบายว่าถ้าบริษัท “mostly hired men from a handful of universities” โมเดลก็จะสรุปว่านั่นคือลักษณะของพนักงานที่ดี “It doesn't remove bias. It automates it.”"},
   {q:"How does Marcus feel about tools that judge personality from video?",o:["He strongly objects because their scientific basis is weak","He thinks they are promising but need more testing","He believes they help nervous candidates"],a:0,why:"มาร์คัสพูดว่า “that's where I'd draw the line. The scientific basis for reading personality from someone's face is extremely weak” และบอกว่ามันอาจลงโทษคนที่ “simply being nervous on camera”"},
   {q:"What does Marcus imply about having a human in the loop?",o:["Humans should rank candidates before the software does","It only helps if the person feels free to overrule the system","Managers should approve the software's choices quickly"],a:1,why:"มาร์คัสสรุปว่า “having a human in the loop only means something if that human feels able to disagree” และวิจารณ์ผู้จัดการที่ “simply clicks approve”"}
  ]},
 {id:"p16",lv:"C2",title:"The Future of Cities",th:"อนาคตของเมือง",cast:{A:"Helen",B:"Julian"},
  lines:[
   ["A","Welcome to The Long View. I'm Helen, and joining me is the urban historian Julian. Our subject today is the future of cities, which, depending on whom you ask, are either on the brink of a renaissance or quietly hollowing out. Julian, let me nail my colours to the mast straight away: I think the case for denser, walkable neighbourhoods has never been stronger. Where do you stand?","ยินดีต้อนรับสู่รายการ The Long View ฉันเฮเลน และร่วมรายการกับฉันวันนี้คือจูเลียน นักประวัติศาสตร์เมือง หัวข้อของเราวันนี้คืออนาคตของเมือง ซึ่งแล้วแต่ว่าคุณถามใคร ก็จะได้คำตอบว่ากำลังจะเข้าสู่ยุคฟื้นฟู หรือไม่ก็กำลังกลวงลงอย่างเงียบ ๆ จูเลียนคะ ขอประกาศจุดยืนตั้งแต่ต้นเลยว่า ฉันคิดว่าเหตุผลสนับสนุนย่านที่หนาแน่นและเดินได้สะดวกไม่เคยหนักแน่นเท่านี้มาก่อน แล้วคุณยืนอยู่ตรงไหนคะ"],
   ["B","Somewhere rather more equivocal, I'm afraid. I don't quarrel with the destination, but I'm wary of the tone in which it's often sold. The fifteen-minute city, for instance, is a lovely idea on paper: everything you need within a short walk or cycle. But history is littered with planners who were utterly convinced they knew how other people ought to live, and the results were not always pretty.","คงอยู่ในจุดที่คลุมเครือกว่านั้นหน่อยครับ ผมไม่ได้ขัดแย้งกับเป้าหมายปลายทาง แต่ผมระแวงน้ำเสียงที่มักใช้ขายแนวคิดนี้ ยกตัวอย่างเมืองสิบห้านาที บนกระดาษเป็นแนวคิดที่งดงาม ทุกอย่างที่ต้องการอยู่ในระยะเดินหรือปั่นจักรยานไม่ไกล แต่ประวัติศาสตร์เต็มไปด้วยนักผังเมืองที่มั่นใจเต็มเปี่ยมว่าตัวเองรู้ดีว่าคนอื่นควรใช้ชีวิตอย่างไร และผลลัพธ์ก็ไม่ได้สวยงามเสมอไป"],
   ["A","You're thinking of the post-war tower blocks and urban motorways, presumably. But surely the lesson there is that top-down schemes which bulldozed neighbourhoods were the problem, not density as such. Some of the most beloved places on earth, old Paris, parts of Tokyo, are extraordinarily dense.","คุณคงนึกถึงตึกสูงยุคหลังสงครามกับทางด่วนที่ตัดผ่านเมืองใช่ไหมคะ แต่บทเรียนจากตรงนั้นก็คือ ปัญหาอยู่ที่โครงการแบบสั่งการจากบนลงล่างที่ไถย่านชุมชนทิ้ง ไม่ใช่ความหนาแน่นในตัวมันเอง สถานที่ที่คนรักที่สุดบางแห่งบนโลก อย่างปารีสเก่าหรือบางย่านของโตเกียว ก็หนาแน่นเป็นพิเศษ"],
   ["B","Granted, and that's a fair distinction. But here's the rub. The neighbourhoods everyone rhapsodises about evolved organically over centuries. You can't simply conjure that texture out of a masterplan. And when you do succeed in making a place delightful, you run headlong into the other problem: it becomes so desirable that the people it was meant for can no longer afford to live there.","ยอมรับครับ และเป็นการแยกแยะที่ยุติธรรม แต่ปัญหาอยู่ตรงนี้ ย่านที่ทุกคนพากันชื่นชมเหลือล้นนั้นค่อย ๆ วิวัฒน์ขึ้นเองตามธรรมชาติตลอดหลายศตวรรษ คุณเสกเนื้อสัมผัสแบบนั้นออกมาจากผังแม่บทไม่ได้ และถ้าคุณทำให้ที่ไหนน่าอยู่ได้สำเร็จ คุณก็จะชนเข้ากับอีกปัญหาเต็ม ๆ คือที่นั่นจะเป็นที่ต้องการมากจนคนที่ตั้งใจจะให้อยู่ไม่มีปัญญาจ่ายค่าอยู่อาศัยอีกต่อไป"],
   ["A","Which is precisely why we need to build far more of it. Gentrification is, at root, a symptom of scarcity. If walkable neighbourhoods are in such short supply that they command eye-watering prices, the answer is to legalise more of them, not to pull up the drawbridge.","นั่นแหละคือเหตุผลที่เราต้องสร้างให้มากขึ้นอีกเยอะ การปรับปรุงย่านจนคนเดิมอยู่ไม่ได้นั้น โดยรากเหง้าแล้วเป็นอาการของความขาดแคลน ถ้าย่านที่เดินได้มีน้อยจนราคาพุ่งสูงลิบ คำตอบก็คือทำให้การสร้างย่านแบบนี้ถูกกฎหมายมากขึ้น ไม่ใช่ชักสะพานปิดประตูใส่คนอื่น"],
   ["B","In theory, yes. In practice, supply responds glacially, and in the meantime long-standing residents are priced out. And let's be candid about who blocks new housing. It's rarely developers. It's existing homeowners who, perfectly understandably, don't want a six-storey building overshadowing their garden. Any vision that doesn't reckon with that politics is, frankly, wishful thinking.","ในทางทฤษฎีก็ใช่ครับ แต่ในทางปฏิบัติ อุปทานตอบสนองช้าเหมือนเต่าคลาน และระหว่างนั้นผู้อยู่อาศัยดั้งเดิมก็ถูกราคาบีบให้ออกไป และขอพูดกันตรง ๆ ว่าใครเป็นคนขวางการสร้างที่อยู่อาศัยใหม่ แทบไม่ใช่นักพัฒนาอสังหาฯ แต่เป็นเจ้าของบ้านเดิม ซึ่งเป็นเรื่องเข้าใจได้เลยที่พวกเขาไม่อยากให้ตึกหกชั้นมาบังแดดสวนของตัวเอง วิสัยทัศน์ใดที่ไม่คำนึงถึงการเมืองแบบนี้ พูดตรง ๆ ก็แค่ฝันลม ๆ แล้ง ๆ"],
   ["A","I'll concede the politics are fiendish. But I'd argue the status quo is itself a choice, and a costly one. Car-dependent sprawl locks people into long commutes, isolates the elderly and the young, who can't drive, and quietly bankrupts local councils that have to maintain miles of roads and pipes for relatively few taxpayers.","ฉันยอมรับว่าการเมืองเรื่องนี้ยากสุด ๆ แต่ฉันขอเถียงว่าการปล่อยทุกอย่างไว้อย่างที่เป็นอยู่ก็เป็นทางเลือกแบบหนึ่ง และเป็นทางเลือกที่ต้องจ่ายแพงด้วย การขยายเมืองออกไปแบบที่ต้องพึ่งรถยนต์ทำให้คนติดอยู่กับการเดินทางไกล ทำให้ผู้สูงอายุและเด็กที่ขับรถไม่ได้โดดเดี่ยว และค่อย ๆ ทำให้ท้องถิ่นล้มละลาย เพราะต้องดูแลถนนและท่อยาวหลายไมล์เพื่อผู้เสียภาษีจำนวนไม่มาก"],
   ["B","Oh, I don't dispute the fiscal argument for a moment. Where I'd push back is on the assumption that everyone secretly yearns for a flat above a bakery. Plenty of families move to the suburbs with their eyes wide open, for space, for gardens, for schools. Dismissing that as some kind of false consciousness isn't merely patronising, it's politically suicidal.","โอ้ ผมไม่ได้เถียงเรื่องเหตุผลทางการคลังเลยแม้แต่นิดเดียว จุดที่ผมจะแย้งคือสมมติฐานที่ว่าทุกคนแอบใฝ่ฝันอยากอยู่ห้องชุดเหนือร้านเบเกอรี่ ครอบครัวจำนวนมากย้ายไปชานเมืองโดยรู้ตัวดีทุกอย่าง เพื่อพื้นที่ เพื่อสวน เพื่อโรงเรียน การปัดตกเรื่องนี้ว่าเป็นแค่การหลงผิด ไม่ใช่แค่การดูถูกคนอื่น แต่ยังเป็นการฆ่าตัวตายทางการเมืองด้วย"],
   ["A","That's fair, and I'd never advocate forcing anyone out of a suburb. My point is more modest. At the moment, in many cities, it's actually illegal to build the kind of mixed, compact neighbourhood people claim to want. Zoning rules mandate the suburban model. So it isn't so much a free market choice as a rigged one.","ยุติธรรมค่ะ และฉันไม่มีวันสนับสนุนให้บังคับใครย้ายออกจากชานเมือง ประเด็นของฉันเจียมตัวกว่านั้น ตอนนี้ในหลายเมือง การสร้างย่านแบบผสมผสานและกะทัดรัดอย่างที่คนบอกว่าอยากได้นั้นผิดกฎหมายจริง ๆ กฎผังเมืองบังคับให้ต้องเป็นแบบชานเมือง ดังนั้นมันจึงไม่ใช่ทางเลือกของตลาดเสรีเสียทีเดียว แต่เป็นเกมที่ถูกล็อกผลไว้แล้วมากกว่า"],
   ["B","Now that I can wholeheartedly get behind. Loosening the rules so that corner shops, terraced houses and small apartment blocks can spring up gradually is a far cry from imposing a grand design. It's closer to letting the city grow the way the places we admire actually grew: incrementally, and a little untidily.","ข้อนี้แหละที่ผมสนับสนุนได้เต็มหัวใจ การผ่อนกฎให้ร้านหัวมุม บ้านแถว และอาคารอพาร์ตเมนต์เล็ก ๆ ค่อย ๆ ผุดขึ้นมานั้นต่างราวฟ้ากับเหวจากการยัดเยียดแผนการใหญ่โต มันใกล้เคียงกับการปล่อยให้เมืองเติบโตแบบเดียวกับที่สถานที่ซึ่งเราชื่นชมเติบโตมาจริง ๆ คือทีละน้อย และไม่ค่อยเป็นระเบียบนัก"],
   ["A","So perhaps we've stumbled onto something like common ground: less grand vision, more permission. But what about the pandemic's legacy, with offices standing half empty in so many city centres?","ถ้าอย่างนั้นเราอาจบังเอิญเจอจุดร่วมบางอย่างแล้ว คือลดวิสัยทัศน์ยิ่งใหญ่ลง เพิ่มการอนุญาตให้มากขึ้น แต่แล้วมรดกจากโรคระบาดล่ะคะ ที่ออฟฟิศในใจกลางเมืองหลายแห่งว่างไปครึ่งหนึ่ง"],
   ["B","I suspect the obituaries for the city centre were premature. Cities have weathered plagues, fires and the collapse of entire industries, and they've done so by reinventing themselves. Empty offices may well become homes, and a business district that people actually live in could turn out to be livelier than the one we've lost. The one thing a city cannot survive is being preserved in aspic.","ผมสงสัยว่าการประกาศข่าวมรณกรรมของใจกลางเมืองคงเร็วเกินไป เมืองต่าง ๆ ผ่านโรคระบาด ไฟไหม้ และการล่มสลายของอุตสาหกรรมทั้งภาคมาแล้ว และรอดมาได้ด้วยการปรับโฉมตัวเองใหม่ ออฟฟิศที่ว่างอาจกลายเป็นบ้าน และย่านธุรกิจที่มีคนอาศัยอยู่จริงอาจกลายเป็นย่านที่มีชีวิตชีวากว่าแบบที่เราสูญเสียไปก็ได้ สิ่งเดียวที่เมืองไม่มีทางรอดได้คือการถูกแช่แข็งไว้ไม่ให้เปลี่ยนแปลง"],
   ["A","A fitting note to end on. Julian, thank you. It's been a pleasure to disagree with you, if only up to a point.","เป็นข้อคิดปิดท้ายที่เหมาะสมมากค่ะ ขอบคุณค่ะจูเลียน ดีใจที่ได้เห็นต่างกับคุณ แม้จะแค่ในระดับหนึ่งก็ตาม"]
  ],
  qs:[
   {q:"Which best describes how the discussion develops?",o:["They begin close together and end sharply divided","They start from different emphases and find partial agreement on gradual reform","Julian abandons his scepticism entirely and adopts Helen's view"],a:1,why:"เฮเลนสรุปว่า “we've stumbled onto something like common ground: less grand vision, more permission” และปิดท้ายว่า “a pleasure to disagree with you, if only up to a point” แสดงว่าเห็นพ้องเพียงบางส่วน ไม่ได้เห็นตรงกันทั้งหมด"},
   {q:"According to Julian, who most often blocks new housing?",o:["Existing homeowners who object to development near them","Developers who only want to build luxury flats","Planners who lack the necessary funding"],a:0,why:"จูเลียนพูดว่า “It's rarely developers. It's existing homeowners who, perfectly understandably, don't want a six-storey building overshadowing their garden.”"},
   {q:"What is Julian's attitude towards assuming everyone secretly wants to live in a city flat?",o:["He agrees that most suburban families would prefer it","He thinks the evidence clearly supports it","He finds it condescending and politically self-defeating"],a:2,why:"จูเลียนบอกว่าการมองแบบนั้น “isn't merely patronising, it's politically suicidal” เพราะหลายครอบครัวย้ายไปชานเมือง “with their eyes wide open”"},
   {q:"What does Julian mean when he says a city cannot survive being preserved in aspic?",o:["Historic buildings must be kept exactly as they are","A city declines if it is prevented from changing and adapting","City centres are becoming too expensive to maintain"],a:1,why:"ก่อนหน้านั้นจูเลียนบอกว่าเมืองรอดมาได้ “by reinventing themselves” และออฟฟิศว่างอาจกลายเป็นบ้าน การถูก “preserved in aspic” จึงหมายถึงถูกแช่แข็งไม่ให้เปลี่ยนแปลง ซึ่งเป็นสิ่งเดียวที่เมืองรอดไม่ได้"}
  ]}
);
STORIES.push(
 {id:"a1d",lv:"A1",title:"A Weekend at Grandma's",th:"สุดสัปดาห์ที่บ้านยาย",
  paras:["Every Saturday, Mint and her brother Ton visit their grandma. Grandma lives in a small village near a river. The trip takes two hours by car.","Grandma's house is old. There is a big mango tree in the garden. In the morning, Mint helps Grandma water the plants. Ton feeds the chickens and collects the eggs.","In the afternoon, Grandma cooks green curry. It is spicy, but the children love it. In the evening, they sit outside and look at the stars. On Sunday, they go home. Mint always gives Grandma a big hug and says, \"See you next week!\""],
  gloss:[["village","หมู่บ้าน"],["river","แม่น้ำ"],["trip","การเดินทาง"],["garden","สวน"],["chickens","ไก่"],["collects","เก็บ รวบรวม"],["spicy","เผ็ด"],["hug","การกอด"]],
  qs:[{q:"How do the children go to Grandma's house?",o:["by train","by car","by boat"],a:1},{q:"What does Ton do in the morning?",o:["He waters the plants.","He cooks curry.","He feeds the chickens."],a:2},{q:"What do they do in the evening?",o:["They look at the stars.","They watch TV.","They swim in the river."],a:0}]},
 {id:"a2d",lv:"A2",title:"My First Day at the Gym",th:"วันแรกที่ยิม",
  paras:["Last month, Pim decided to join a gym near her office. She works at a desk all day, and her back often hurt. On Monday evening, she walked to the gym after work. She felt nervous because she didn't know anyone there.","At the front desk, a trainer called Jay showed her around. He explained how to use the running machines and the weights. \"Start slowly,\" he said. \"Don't try to do everything on the first day.\" Pim ran for fifteen minutes and then lifted some light weights. At the end, her legs were shaking.","The next morning, her whole body hurt, and she could hardly climb the stairs. But she went back on Wednesday and again on Friday. Now she goes three times a week, and her back feels much better."],
  gloss:[["join","สมัครเป็นสมาชิก"],["nervous","ประหม่า กังวล"],["trainer","ครูฝึก เทรนเนอร์"],["explained","อธิบาย"],["weights","ลูกน้ำหนัก"],["lifted","ยก"],["shaking","สั่น"],["hardly","แทบจะไม่"]],
  qs:[{q:"Why did Pim join the gym?",o:["Her back often hurt.","Her friend worked there.","She wanted to be a trainer."],a:0},{q:"What did Jay tell her?",o:["to run for an hour","to start slowly","to come every day"],a:1},{q:"How often does Pim go to the gym now?",o:["once a week","every day","three times a week"],a:2}]},
 {id:"b1d",lv:"B1",title:"Electric Motorbikes Take Off",th:"มอเตอร์ไซค์ไฟฟ้ากำลังมาแรง",
  paras:["In cities across Southeast Asia, the motorbike is the most common way to get around. In Bangkok, Hanoi and Jakarta, millions of people ride one to work, school and the market every day. Now a quiet change is happening on these busy roads: more and more riders are switching from petrol motorbikes to electric ones.","There are several reasons for this. Electric motorbikes are cheaper to run, because charging a battery costs much less than filling a tank with petrol. They also need less maintenance and make almost no noise. Some governments offer tax discounts to encourage people to buy them, hoping to reduce air pollution in crowded cities. In Taiwan, riders can even swap an empty battery for a full one at a machine in less than a minute.","However, not everyone is convinced. Many riders worry that the battery will run out on a long journey, and there are still not enough charging stations outside big cities. Electric models can also be more expensive to buy. Experts believe these problems will become smaller as technology improves, but for now the sound of petrol engines is still heard on most streets."],
  gloss:[["switching","เปลี่ยน สลับ"],["petrol","น้ำมันเบนซิน"],["charging","การชาร์จไฟ"],["maintenance","การบำรุงรักษา"],["encourage","ส่งเสริม กระตุ้น"],["pollution","มลพิษ"],["swap","แลก สลับ"],["convinced","เชื่อมั่น ถูกโน้มน้าว"]],
  qs:[{q:"What can riders in Taiwan do?",o:["buy motorbikes without tax","swap batteries quickly at a machine","charge their batteries for free"],a:1},{q:"Why do some governments offer tax discounts?",o:["to reduce air pollution","to sell more petrol","to build more roads"],a:0},{q:"What is one worry that riders have?",o:["Electric motorbikes are too noisy.","Electric motorbikes are too slow.","The battery may run out on a long journey."],a:2}]},
 {id:"b2d",lv:"B2",title:"Can You Trust Online Reviews?",th:"เชื่อรีวิวออนไลน์ได้แค่ไหน",
  paras:["Before choosing a restaurant, a hotel or even a dentist, most of us now check what strangers have written about it online. Research suggests that the majority of consumers read reviews before making a purchase, and many trust them almost as much as recommendations from friends. A single extra star on a popular website can noticeably increase a small business's income.","Yet reviews are not as reliable as they seem. People who are extremely happy or extremely angry are far more likely to write something than those who had an ordinary experience, so ratings tend to cluster at the top and bottom. Some businesses offer discounts in exchange for positive comments, while others have been caught paying for fake reviews. Psychologists also point to herd behaviour: once a product has many five-star ratings, later customers are influenced by them and rate it more generously.","So how should we use them? Experts advise reading the most detailed reviews rather than looking only at the average score, and paying attention to how the owner responds to complaints. A calm, helpful reply to a negative review can reveal more about a business than a hundred enthusiastic ones."],
  gloss:[["consumers","ผู้บริโภค"],["purchase","การซื้อ"],["reliable","น่าเชื่อถือ"],["ordinary","ธรรมดา"],["fake","ปลอม"],["influenced","ได้รับอิทธิพล"],["generously","อย่างใจกว้าง"],["complaints","คำร้องเรียน"]],
  qs:[{q:"Why do ratings tend to cluster at the top and bottom?",o:["Websites delete average reviews.","People with extreme experiences are more likely to write reviews.","Businesses only ask angry customers to write."],a:1},{q:"What does herd behaviour mean in this article?",o:["Later customers are influenced by earlier high ratings.","Owners reply to every review.","People prefer to travel in large groups."],a:0},{q:"What do experts advise?",o:["Trust only the average score.","Ignore all negative reviews.","Read detailed reviews and see how owners respond to complaints."],a:2}]},
 {id:"c1c",lv:"C1",title:"The Loneliness Epidemic",th:"โรคระบาดแห่งความเหงา",
  paras:["We are more connected than at any point in history. With a few taps on a screen, we can message a colleague on another continent or watch a friend's holiday unfold in real time. Paradoxically, however, surveys in many countries suggest that loneliness is on the rise, prompting some public health officials to describe it as an epidemic. The World Health Organization has even identified social isolation as a pressing global health concern.","The consequences are not merely emotional. Researchers have linked chronic loneliness to higher rates of heart disease, depression and dementia, and some estimate that its effect on life expectancy is comparable to that of smoking. Crucially, loneliness is not the same as being alone. Many people live by themselves and feel perfectly content, while others feel isolated despite being surrounded by family and colleagues. What matters is not the number of relationships we have, but whether they feel meaningful. Several trends appear to be fuelling the problem: people are marrying later, living in smaller households and moving away from the communities they grew up in, while remote work has removed many of the casual conversations that once filled the working day.","Tackling loneliness is complicated, partly because it carries a stigma that makes people reluctant to admit to it. Nevertheless, some governments have responded creatively. Both Britain and Japan have appointed ministers with responsibility for loneliness, and doctors in several countries now refer isolated patients to community groups, volunteering or art classes rather than simply prescribing medication, a practice known as social prescribing. Yet many experts argue that the most powerful remedies are also the simplest: a regular phone call, a conversation with a neighbour, or the willingness to reach out first."],
  gloss:[["paradoxically","อย่างย้อนแย้ง"],["epidemic","โรคระบาด"],["isolation","การแยกตัวโดดเดี่ยว"],["chronic","เรื้อรัง"],["comparable","เทียบเคียงได้"],["meaningful","มีความหมาย"],["stigma","ตราบาป ความอับอายทางสังคม"],["reluctant","ไม่เต็มใจ ลังเล"]],
  qs:[{q:"According to the article, what matters most about our relationships?",o:["how many we have","whether they feel meaningful","how often we see our family"],a:1},{q:"Which trend is mentioned as fuelling loneliness?",o:["remote work reducing casual conversations","more people marrying young","families living in larger households"],a:0},{q:"What is social prescribing?",o:["giving lonely patients stronger medication","training doctors to be friendlier","referring isolated patients to community activities"],a:2}]}
);

 {id:"rq",title:"Reported Questions",th:"เล่าคำถามของคนอื่น",
  g:{title:"Reported Questions: He asked me where I lived",
   intro:["เวลาเล่าว่าใครถามอะไร ประโยคคำถามจะ<mark>กลับเป็นลำดับประโยคบอกเล่า</mark> (ประธาน + กริยา) ไม่มี do/does/did และไม่มีเครื่องหมาย ?","คำถาม Yes/No ใช้ <mark>if หรือ whether</mark> เชื่อม ส่วนคำถามที่มี wh- ใช้คำ wh- นั้นเชื่อมเลย","ถ้ากริยาที่ใช้เล่าเป็นอดีต (asked, wanted to know) มักถอย tense หนึ่งขั้น เช่น live → lived, can → could, will → would คนไทยมักติดพูดว่า He asked me where do I live ซึ่งผิด"],
   head:["คำถามตรง","เล่าต่อ (reported)"],rows:[["\"Where do you live?\"","He asked me where I lived."],["\"Are you busy?\"","She asked if I was busy."],["\"Can you help me?\"","He asked me if I could help him."],["\"What time will you arrive?\"","They asked what time I would arrive."],["\"Did you see the email?\"","My boss asked whether I had seen the email."]],
   ex:[["The officer asked me where I was staying.","เจ้าหน้าที่ถามว่าฉันพักอยู่ที่ไหน"],["She wanted to know if I had any experience.","เธออยากรู้ว่าฉันมีประสบการณ์ไหม"],["My mum asked me why I was so late.","แม่ถามว่าทำไมฉันกลับดึกขนาดนี้"]],
   mist:[["He asked me where do I work.","He asked me where I worked.","reported question ใช้ลำดับประโยคบอกเล่า ไม่ใส่ do/does/did"],["She asked me that I was hungry.","She asked me if I was hungry.","คำถาม Yes/No ใช้ if หรือ whether ไม่ใช้ that"],["They asked what time was it.","They asked what time it was.","ประธาน (it) ต้องมาก่อนกริยา (was)"]]},
  quiz:[{t:"mc",q:"She asked me where ___.",o:["I lived","did I live","do I live"],a:0,w:"ใช้ลำดับประโยคบอกเล่า (I lived) และถอย tense"},{t:"mc",q:"He asked ___ I was free on Friday.",o:["that","if","what"],a:1,w:"คำถาม Yes/No ใช้ if หรือ whether"},{t:"mc",q:"\"Can you help me?\" → She asked me ___.",o:["if I could help her","can I help her","if could I help her"],a:0,w:"can → could และประธานมาก่อนกริยา"},{t:"mc",q:"The officer asked us what time ___.",o:["did we arrive","we had arrived","had we arrived"],a:1,w:"ประธาน we มาก่อนกริยา และ Past Simple ถอยเป็น Past Perfect"},{t:"mc",q:"\"Do you like spicy food?\" → He asked me ___ spicy food.",o:["do I like","if I liked","that I liked"],a:1,w:"คำถาม Yes/No ใช้ if + ลำดับบอกเล่า และ like → liked"}]},
 {id:"wish",title:"wish / if only",th:"อยากให้เป็นอย่างอื่น / เสียดาย",
  g:{title:"wish / if only",
   intro:["wish และ if only ใช้พูดถึงสิ่งที่<mark>ไม่เป็นจริง</mark> และเราอยากให้เป็นอีกแบบ (if only ให้ความรู้สึกแรงกว่า)","อยากให้ปัจจุบันเปลี่ยน ใช้ <mark>wish + Past Simple</mark> (I wish I had more time.) ส่วนเสียดายเรื่องที่ผ่านไปแล้ว ใช้ <mark>wish + had + V3</mark>","อยากให้คนอื่นเปลี่ยนพฤติกรรมที่น่ารำคาญ ใช้ wish + would คนไทยมักใช้ wish แบบ hope เช่น I wish you get better ซึ่งผิด ต้องใช้ I hope you get better"],
   head:["ความหมาย","รูปแบบ","ตัวอย่าง"],rows:[["อยากให้ตอนนี้เป็นอีกแบบ","wish + Past Simple","I wish I lived closer to work."],["อยากให้ตัวเองทำได้","wish + could","I wish I could speak Japanese."],["เสียดายเรื่องในอดีต","wish + had + V3","I wish I had studied harder."],["อยากให้คนอื่นเลิก/เริ่มทำ","wish + someone + would","I wish he would stop talking."],["หวังสิ่งที่เป็นไปได้","hope + Present/will","I hope you pass the exam."]],
   ex:[["I wish I had a bigger flat.","อยากมีห้องที่ใหญ่กว่านี้จัง (ตอนนี้ห้องเล็ก)"],["If only I hadn't sent that email!","ไม่น่าส่งอีเมลนั้นไปเลย"],["I wish it would stop raining.","อยากให้ฝนหยุดตกเสียที"]],
   mist:[["I wish I have more money.","I wish I had more money.","wish เรื่องปัจจุบันต้องใช้ Past Simple"],["I wish you have a nice trip.","I hope you have a nice trip.","อวยพรสิ่งที่เป็นไปได้ใช้ hope ไม่ใช้ wish"],["I wish I didn't eat so much last night.","I wish I hadn't eaten so much last night.","เสียดายเรื่องในอดีตใช้ had + V3"]]},
  quiz:[{t:"mc",q:"I wish I ___ more time to study. (ตอนนี้ไม่มีเวลา)",o:["have","had","will have"],a:1,w:"wish เรื่องปัจจุบันใช้ Past Simple"},{t:"mc",q:"I wish I ___ to the party last night. Everyone said it was great.",o:["went","had gone","would go"],a:1,w:"เสียดายเรื่องเมื่อคืน (อดีต) ใช้ had + V3"},{t:"mc",q:"I wish my neighbour ___ playing loud music. It's so annoying!",o:["stops","would stop","has stopped"],a:1,w:"อยากให้คนอื่นเปลี่ยนพฤติกรรมที่น่ารำคาญใช้ would"},{t:"mc",q:"If only I ___ taller! Then I could reach the top shelf.",o:["am","were","will be"],a:1,w:"if only เรื่องปัจจุบันใช้ Past Simple (were ใช้ได้กับทุกประธาน)"},{t:"mc",q:"I wish I ___ swim. (ตอนนี้ว่ายน้ำไม่เป็น)",o:["can","could","will"],a:1,w:"can → could หลัง wish"}]},
 {id:"futc",title:"Future Continuous & Future Perfect",th:"กำลังทำในอนาคต / จะทำเสร็จแล้ว",
  g:{title:"Future Continuous & Future Perfect",
   intro:["Future Continuous (<mark>will be + V-ing</mark>) ใช้บอกว่า ณ เวลาหนึ่งในอนาคต เรา<mark>กำลังทำ</mark>อะไรอยู่ เช่น This time tomorrow I'll be flying to Tokyo.","Future Perfect (<mark>will have + V3</mark>) ใช้บอกว่าก่อนถึงเวลาหนึ่งในอนาคต สิ่งนั้น<mark>จะเสร็จแล้ว</mark> มักมาคู่กับ by (by Friday, by the time…)","Will you be + V-ing…? ยังใช้ถามแผนของคนอื่นอย่างสุภาพได้ด้วย คนไทยมักใช้ will + V1 อย่างเดียวทุกกรณี จึงบอกไม่ได้ว่ากำลังทำหรือทำเสร็จแล้ว"],
   head:["Tense","รูปแบบ","ตัวอย่าง"],rows:[["Future Continuous","will be + V-ing","At 9 p.m. I'll be watching the match."],["Future Perfect","will have + V3","By June, I'll have finished my degree."],["ถามแผนอย่างสุภาพ","Will you be + V-ing?","Will you be using the printer this afternoon?"],["by the time + Present","… will have + V3","By the time you get here, we'll have eaten."]],

   mist:[["By Friday I will finish the report.","By Friday I will have finished the report.","by + เวลาในอนาคต เน้นว่าเสร็จแล้ว ใช้ will have + V3"],["By the time you will arrive, we'll have left.","By the time you arrive, we'll have left.","หลัง by the time / when ใช้ Present Simple แทน will"],["This time next week I will lie on the beach.","This time next week I will be lying on the beach.","กำลังทำอยู่ ณ เวลาหนึ่งในอนาคตใช้ will be + V-ing"]]},
  quiz:[{t:"mc",q:"This time tomorrow, I ___ on a beach in Phuket.",o:["will lie","will be lying","will have lain"],a:1,w:"กำลังทำอยู่ ณ เวลาหนึ่งในอนาคต ใช้ will be + V-ing"},{t:"mc",q:"By the end of this year, I ___ here for ten years.",o:["will work","will be working","will have worked"],a:2,w:"by + ช่วงเวลาครบในอนาคต ใช้ will have + V3"},{t:"mc",q:"Please don't call me at 8. I ___ dinner with my family then.",o:["will be having","will have had","had"],a:0,w:"ตอนสองทุ่มกำลังกินข้าวอยู่ จึงไม่อยากให้โทรมา"},{t:"mc",q:"By the time you arrive, the film ___.",o:["will already start","will have already started","already starts"],a:1,w:"หนังเริ่มไปแล้วก่อนคุณมาถึง ใช้ will have + V3"},{t:"mc",q:"___ you be using the car tonight? I'd like to borrow it.",o:["Will","Have","Are"],a:0,w:"Will you be + V-ing? ใช้ถามแผนอย่างสุภาพ"}]},
 {id:"caus",title:"Causative: have / get something done",th:"ให้คนอื่นทำให้",
  g:{title:"Causative: have / get something done",
   intro:["ภาษาไทยพูดว่า ฉันไปตัดผมมา แม้ช่างจะเป็นคนตัด แต่ภาษาอังกฤษถ้าพูดว่า I cut my hair แปลว่า<mark>ตัดเอง</mark>","ถ้าจ้างหรือให้คนอื่นทำให้ ใช้ <mark>have / get + สิ่งของ + V3</mark> เช่น I had my hair cut. (get เป็นภาษาพูดมากกว่า)","ใช้กับเรื่องไม่ดีที่เกิดกับเราก็ได้ เช่น She had her bag stolen. (กระเป๋าถูกขโมย)"],
   head:["รูปแบบ","ตัวอย่าง","ความหมาย"],rows:[["have + object + V3","I had my car washed.","จ้างคนล้างรถ"],["get + object + V3","We're getting the roof repaired.","ให้ช่างซ่อมหลังคา"],["have + object + V3 (เรื่องไม่ดี)","He had his wallet stolen.","กระเป๋าสตางค์ถูกขโมย"],["need to have/get + object + V3","I need to get my eyes tested.","ต้องไปตรวจสายตา"]],
   ex:[["I'm going to have my hair cut on Saturday.","วันเสาร์จะไปตัดผม"],["Where did you get your suit made?","ตัดสูทที่ไหนมา"],["We had a new air conditioner installed last week.","อาทิตย์ที่แล้วเราให้ช่างมาติดแอร์ใหม่"]],
   mist:[["I cut my hair yesterday. (ไปร้านตัดผม)","I had my hair cut yesterday.","I cut my hair แปลว่าตัดเอง"],["I had my car repair.","I had my car repaired.","หลัง object ต้องเป็น V3"],["I had repaired my phone. (ให้ร้านซ่อม)","I had my phone repaired.","object ต้องอยู่ระหว่าง had กับ V3 ไม่งั้นกลายเป็น Past Perfect"]]},
  quiz:[{t:"mc",q:"I ___ my hair cut yesterday.",o:["had","made","did"],a:0,w:"have + object + V3 = ให้คนอื่นทำให้"},{t:"mc",q:"We're getting the kitchen ___ next week.",o:["paint","painted","painting"],a:1,w:"get + object + V3"},{t:"mc",q:"Where do you usually ___ your car serviced?",o:["get","make","let"],a:0,w:"get + object + V3 ใช้ได้เหมือน have"},{t:"mc",q:"She had her phone ___ on the train.",o:["steal","stole","stolen"],a:2,w:"เรื่องไม่ดีที่เกิดกับเรา ใช้ have + object + V3"},{t:"mc",q:"Which sentence means a mechanic fixed the car?",o:["I fixed my car.","I had my car fixed.","I had fixed my car."],a:1,w:"had + my car + fixed = ให้ช่างซ่อม ส่วน I had fixed คือซ่อมเองแล้ว (Past Perfect)"}]},
 {id:"prep",title:"Prepositions after adjectives & verbs",th:"บุพบทที่มากับคำคุณศัพท์และกริยา",
  g:{title:"Dependent Prepositions: interested in, good at, depend on",
   intro:["คำคุณศัพท์และกริยาหลายคำ<mark>ต้องมีบุพบทตัวเดิมตามมาเสมอ</mark> และมักไม่ตรงกับภาษาไทย จึงต้องจำเป็นคู่","คนไทยมักแปลตรงตัว เช่น แต่งงานกับ → married with (ผิด) ที่ถูกคือ <mark>married to</mark> หรือ ขึ้นอยู่กับ → depend of (ผิด) ที่ถูกคือ <mark>depend on</mark>","ถ้าหลังบุพบทเป็นกริยา ต้องเติม -ing เช่น interested in learning, good at cooking"],
   head:["คำ + บุพบท","ตัวอย่าง"],rows:[["interested in","I'm interested in photography."],["good / bad at","She's good at solving problems."],["afraid of / proud of","He's afraid of heights."],["responsible for","Who is responsible for marketing?"],["married to / similar to","She's married to a doctor."],["depend on / rely on","It depends on the weather."],["listen to / belong to","This bag belongs to Nok."],["apologise for / pay for","I apologise for the delay."]],
   ex:[["I'm not very good at remembering names.","ฉันไม่ค่อยเก่งเรื่องจำชื่อคน"],["Our plans depend on the weather.","แผนของเราขึ้นอยู่กับสภาพอากาศ"],["Who is responsible for this project?","ใครรับผิดชอบโปรเจกต์นี้"]],
   mist:[["She is married with an engineer.","She is married to an engineer.","แต่งงานกับ ใช้ married to"],["It depends of the price.","It depends on the price.","depend ใช้คู่กับ on เสมอ"],["I'm interested in learn Chinese.","I'm interested in learning Chinese.","หลังบุพบท กริยาต้องเติม -ing"]]},
  quiz:[{t:"mc",q:"She's very good ___ maths.",o:["in","at","on"],a:1,w:"good at = เก่งเรื่อง…"},{t:"mc",q:"Are you interested ___ joining our team?",o:["in","on","for"],a:0,w:"interested in + V-ing"},{t:"mc",q:"The price depends ___ the size.",o:["of","on","from"],a:1,w:"depend on = ขึ้นอยู่กับ"},{t:"mc",q:"Who is responsible ___ this project?",o:["of","for","to"],a:1,w:"responsible for = รับผิดชอบ"},{t:"mc",q:"My sister is married ___ a Japanese man.",o:["with","to","by"],a:1,w:"married to ไม่ใช่ married with"}]},
 {id:"comp2",title:"Advanced Comparisons",th:"การเปรียบเทียบขั้นสูง",
  g:{title:"Advanced Comparisons: the more…, as…as, twice as…",
   intro:["<mark>the + comparative …, the + comparative …</mark> ใช้บอกว่าสิ่งหนึ่งเปลี่ยน อีกสิ่งก็เปลี่ยนตาม เช่น The more you read, the better your English gets. (ยิ่ง…ยิ่ง…)","<mark>as + adj + as</mark> ใช้บอกว่าเท่ากัน ส่วน not as…as แปลว่าไม่…เท่า ถ้าจะบอกว่ากี่เท่า ใช้ twice / three times + as…as","ถ้าจะเน้นว่าต่างกันมาก ใช้ <mark>much / far / a lot</mark> + comparative คนไทยมักใช้ very bigger ซึ่งผิด เพราะ very ใช้กับคำคุณศัพท์ธรรมดาเท่านั้น"],
   head:["รูปแบบ","ตัวอย่าง"],rows:[["the + comp., the + comp.","The sooner we leave, the earlier we'll arrive."],["as + adj + as","Nok is as tall as her brother."],["not as + adj + as","This hotel isn't as clean as the last one."],["twice / three times as … as","The new flat is twice as big as the old one."],["much / far / a lot + comp.","Trains are much faster than buses."],["comp. + and + comp.","It's getting hotter and hotter."]],
   ex:[["The more I practise, the more confident I feel.","ยิ่งฝึกมาก ยิ่งมั่นใจมากขึ้น"],["Rent in Bangkok is twice as expensive as in my hometown.","ค่าเช่าในกรุงเทพฯ แพงเป็นสองเท่าของบ้านเกิดฉัน"],["This laptop is far lighter than my old one.","แล็ปท็อปเครื่องนี้เบากว่าเครื่องเก่ามาก"]],
   mist:[["More you study, more you learn.","The more you study, the more you learn.","โครงสร้าง ยิ่ง…ยิ่ง… ต้องมี the ทั้งสองส่วน"],["It's very cheaper here.","It's much cheaper here.","เน้น comparative ใช้ much/far/a lot ไม่ใช้ very"],["She is as tall than me.","She is as tall as me.","as…as ต้องใช้ as ทั้งสองตัว ไม่ใช้ than"]]},
  quiz:[{t:"mc",q:"The more you practise, ___ you become.",o:["the more confident","more confident","the most confident"],a:0,w:"ยิ่ง…ยิ่ง… ใช้ the + comparative ทั้งสองส่วน"},{t:"mc",q:"This laptop is ___ that one. (ราคาเป็นสองเท่า)",o:["twice as expensive as","twice more expensive as","as twice expensive as"],a:0,w:"twice + as + adj + as"},{t:"mc",q:"Bangkok is ___ bigger than Chiang Mai.",o:["very","much","more"],a:1,w:"เน้น comparative ใช้ much/far/a lot"},{t:"mc",q:"My English isn't as good ___ yours.",o:["than","as","like"],a:1,w:"not as…as ใช้ as ทั้งสองตัว"},{t:"mc",q:"Prices are getting ___.",o:["higher and higher","more and more high","high and higher"],a:0,w:"comparative + and + comparative = ขึ้นเรื่อย ๆ"}]}
);

let YTS=null, ytPlayer=null, ytApi=null, ytTimer=null, ytTok=0;
function ytList(){if(!S.yt||!Array.isArray(S.yt.list)) S.yt={list:[]}; return S.yt.list}
function ytParse(s){
  s=String(s||"").trim();
  const m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/)||s.match(/^([A-Za-z0-9_-]{11})$/);
  return m?m[1]:null;
}
function ytCfg(){const d={mode:"auto",chunk:5,speed:1,reps:1,gap:1.2,mic:true}; if(!S.settings.yt||typeof S.settings.yt!=="object") S.settings.yt={}; return Object.assign(d,S.settings.yt)}
function ytRec(id){return ytList().find(x=>x.id===id)}

  h+='<form class="card yt-add" data-form="ytadd" style="margin-top:16px"><label for="yt-url"><b>ลิงก์คลิป YouTube</b></label><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="yt-url" class="dict-in" style="margin-top:0" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://youtu.be/..."><button class="btn btn-primary" type="submit">เปิด</button></div><p class="muted" style="font-size:13.5px;margin-top:6px">ในแอป YouTube กด แชร์ → คัดลอกลิงก์ แล้วมาวางที่นี่</p></form>';

  return h+ytSuggestHTML();

function ytKeep(){return route.name==="practice"&&YTS&&route.id==="yt."+YTS.id&&ytPlayer&&!!document.querySelector('#yt-slot[data-vid="'+YTS.id+'"]')}
function ytLoadApi(){
  if(ytApi) return ytApi;
  ytApi=new Promise((res,rej)=>{
    if(window.YT&&window.YT.Player) return res(window.YT);
    const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{if(prev) try{prev()}catch(e){} res(window.YT)};
    const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; s.onerror=()=>{ytApi=null; rej(new Error("load"))}; document.head.appendChild(s);
  });
  return ytApi;
}
async function ytMount(){
  const id=YTS&&YTS.id; if(!id||!$("#yt-player")) return;

function ytNextEnd(from){

function ytStart(from){

  const tok=++ytTok; YTS.running=true; YTS.rep=0; YTS.segStart=from!=null?from:ytNow(); YTS.segEnd=ytNextEnd(YTS.segStart);

function ytPlaySeg(tok){
  if(tok!==ytTok||!YTS) return;
  YTS.phase="play"; ytSetStatus("ฟังให้ดี… ("+mmss(YTS.segStart)+"–"+mmss(YTS.segEnd)+")"+(ytCfg().reps>1?" รอบ "+(YTS.rep+1)+"/"+ytCfg().reps:""));
  try{ytPlayer.seekTo(YTS.segStart,true); ytPlayer.setPlaybackRate(ytCfg().speed); ytPlayer.playVideo()}catch(e){}
  clearInterval(ytTimer);

    let st=-1; try{st=ytPlayer.getPlayerState()}catch(e){}

  },80);
}
async function ytGap(tok){
  try{ytPlayer.pauseVideo()}catch(e){}
  if(tok!==ytTok||!YTS) return;
  const c=ytCfg(), len=Math.max(1,YTS.segEnd-YTS.segStart), gap=Math.round(len/c.speed*1000*c.gap+700);

    else await new Promise(r=>setTimeout(r,gap));
  } else {ytSetStatus("ถึงตาคุณ พูดตามเลย",gap); await new Promise(r=>setTimeout(r,gap))}
  if(tok!==ytTok||!YTS||!YTS.running) return;
  if(route.name!=="practice"||route.id!=="yt."+YTS.id){ytStop(); return}
  YTS.phase="play"; YTS.rep++;

  if(YTS.rep>=c.reps){
    YTS.rep=0; const dur=(()=>{try{return ytPlayer.getDuration()||0}catch(e){return 0}})();
    if(dur&&YTS.segEnd>=dur-0.3){YTS.running=false; YTS.phase="idle"; ytSetStatus("จบคลิปแล้ว เก่งมาก ลองฝึกซ้ำด้วยความเร็วที่เร็วขึ้น"); return}
    YTS.segStart=YTS.segEnd; YTS.segEnd=ytNextEnd(YTS.segStart);
  }
  ytPlaySeg(tok);
}
function ytStop(){ytTok++; clearInterval(ytTimer); if(NB&&NB.stopListening) NB.stopListening().catch(()=>{}); try{ytPlayer&&ytPlayer.pauseVideo()}catch(e){} if(YTS){YTS.running=false; YTS.phase="idle"} ytSetStatus("หยุดแล้ว กด เริ่มฝึก เพื่อฝึกต่อจากตรงนี้")}

  ytseek:t=>{if(!YTS||!YTS.ready) return; ytStop(); try{ytPlayer.seekTo(+t.dataset.t,true)}catch(e){}},
